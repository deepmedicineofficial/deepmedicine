          <li>Strep. pyogenes (GAS)</li>

        <ul class="list-disc ml-4 mt-1 text-xs space-y-0.5">

    <div class="grid md:grid-cols-2 gap-4 text-sm text-slate-300">
      <div>
        <p class="font-semibold text-white mb-1">Gram-Positive Algorithms:</p>
        <ul class="list-disc ml-4 space-y-0.5">
          <li><strong>Catalase:</strong> Staphylococci (+) vs Streptococci (-)</li>
          <li><strong>Coagulase:</strong> S. aureus (+) vs CoNS (-)</li>

          <li><strong>Bacitracin:</strong> GAS (sensitive) vs others</li>
          <li><strong>CAMP test:</strong> GBS (+) — arrowhead hemolysis</li>
          <li><strong>Bile esculin:</strong> Enterococcus / Group D Strep (+)</li>
          <li><strong>6.5% NaCl growth:</strong> Enterococcus (+)</li>
        </ul>
      </div>
      <div>
        <p class="font-semibold text-white mb-1">Gram-Negative Algorithms:</p>
        <ul class="list-disc ml-4 space-y-0.5">
          <li><strong>Oxidase:</strong> Pseudomonas (+), Enterobacteriaceae (-)</li>
          <li><strong>IMViC:</strong> E. coli (++--), Klebsiella (--++), Enterobacter (-+-+)</li>
          <li><strong>Triple Sugar Iron (TSI):</strong> Fermentation patterns</li>
          <li><strong>Urease:</strong> Proteus, Klebsiella, H. pylori (+)</li>
          <li><strong>Citrate:</strong> Klebsiella (+), E. coli (-)</li>
          <li><strong>Motility:</strong> E. coli (+), Klebsiella (-)</li>
          <li><strong>H₂S production:</strong> Salmonella (+), Shigella (-)</li>
        </ul>
      </div>
    </div>
  </div>
</div>

sensitivity: `
<div class="fade-in space-y-6">
  <div class="bg-slate-900 border border-slate-700 rounded-xl p-5">
    <h2 class="text-lg font-bold text-sky-400 mb-2 flex items-center gap-2"><i data-lucide="target" class="w-5 h-5"></i> Antimicrobial Susceptibility Testing (AST)</h2>
    <p class="text-slate-300 text-sm">AST determines the in-vitro susceptibility of isolates to guide targeted antimicrobial therapy. Standardized by CLSI (USA) and EUCAST (Europe).</p>
  </div>

  <!-- Methods -->
  <div class="bg-slate-900/70 border border-slate-700 rounded-xl p-5 card-hover">
    <h3 class="font-bold text-emerald-400 text-base mb-3">📐 AST Methods</h3>
    <div class="grid md:grid-cols-2 gap-4 text-sm text-slate-300">
      <div>
        <p class="font-semibold text-white mb-2">1. Disk Diffusion (Kirby-Bauer):</p>
        <ul class="list-disc ml-4 space-y-0.5">
          <li>Mueller-Hinton Agar (MHA); depth 4mm</li>
          <li>Inoculum: 0.5 McFarland standard (~1.5×10⁸ CFU/mL)</li>
          <li>Lawn culture → Apply antibiotic disks</li>
          <li>Incubate 35±2°C, 16-18 hrs (20-24 hrs for MRSA screen)</li>
          <li>Measure zone of inhibition (mm) from edge to edge</li>
          <li>Compare with CLSI/EUCAST breakpoints → S, I, R</li>
          <li>MHA + 5% sheep blood: Streptococci, Haemophilus (HTM)</li>
        </ul>
      </div>
      <div>
        <p class="font-semibold text-white mb-2">2. Minimum Inhibitory Concentration (MIC):</p>
        <ul class="list-disc ml-4 space-y-0.5">
          <li><strong>Broth microdilution:</strong> Gold standard; serial 2-fold dilutions</li>
          <li><strong>Agar dilution:</strong> Reference method for anaerobes</li>
          <li><strong>E-test (Epsilometer):</strong> Gradient strip on MHA; MIC where ellipse intersects</li>
          <li><strong>Automated:</strong> VITEK 2, Phoenix, MicroScan</li>
          <li>MIC = lowest concentration inhibiting visible growth</li>
          <li>Reported in µg/mL (or mg/L)</li>
        </ul>
        <p class="font-semibold text-white mt-2 mb-1">3. Additional Methods:</p>
        <ul class="list-disc ml-4 space-y-0.5">
          <li><strong>MBC:</strong> Minimum Bactericidal Concentration (subculture from clear wells)</li>
          <li><strong>Time-kill curves:</strong> Bactericidal vs bacteriostatic kinetics</li>
          <li><strong>Synergy testing:</strong> Checkerboard, time-kill for combinations</li>
        </ul>
      </div>
    </div>
  </div>

  <!-- Interpretation -->
  <div class="bg-slate-900/70 border border-slate-700 rounded-xl p-5 card-hover">
    <h3 class="font-bold text-yellow-400 text-base mb-3">📊 Interpreting Sensitivity Reports</h3>
    <div class="grid md:grid-cols-3 gap-4 text-sm">
      <div class="p-3 bg-slate-800 rounded-lg text-center">
        <div class="sensitivity-s rounded px-3 py-2 mb-2 font-bold text-lg">S</div>
        <p class="font-semibold text-green-400">Susceptible</p>
        <p class="text-xs text-slate-300 mt-1">High likelihood of therapeutic success using standard dosing regimen. MIC ≤ susceptible breakpoint.</p>
      </div>
      <div class="p-3 bg-slate-800 rounded-lg text-center">
        <div class="sensitivity-i rounded px-3 py-2 mb-2 font-bold text-lg">I</div>
        <p class="font-semibold text-yellow-400">Intermediate / Susceptible, Increased Exposure (EUCAST)</p>
        <p class="text-xs text-slate-300 mt-1">Therapeutic effect uncertain. May respond to increased dosing/concentrated sites (urine). EUCAST redefined as "SIE" — susceptible with increased exposure.</p>
      </div>
      <div class="p-3 bg-slate-800 rounded-lg text-center">
        <div class="sensitivity-r rounded px-3 py-2 mb-2 font-bold text-lg">R</div>
        <p class="font-semibold text-red-400">Resistant</p>
        <p class="text-xs text-slate-300 mt-1">High likelihood of therapeutic failure regardless of dose. MIC > resistant breakpoint. Do not use clinically.</p>
      </div>
    </div>
    <div class="mt-4 p-3 bg-slate-800 rounded-lg text-xs text-slate-300">
      <strong class="text-sky-400">CLSI vs EUCAST:</strong> CLSI uses S/I/R with zone diameter tables. EUCAST uses S/I(SIE)/R with lower breakpoints generally. EUCAST "I" means treatable at higher dose or concentrated body site — a key clinical distinction. Always check which standard your lab uses.
    </div>
  </div>

  <!-- Sample Report -->
  <div class="bg-slate-900/70 border border-slate-700 rounded-xl p-5 card-hover">
    <h3 class="font-bold text-cyan-400 text-base mb-3">📋 Sample Sensitivity Report</h3>
    <div class="p-3 bg-slate-800 rounded-lg mb-3">
      <p class="text-xs text-slate-400 mb-1">Specimen: Blood Culture | Organism: <strong class="text-white">Escherichia coli</strong> (ESBL-producing)</p>
      <p class="text-xs text-slate-400">Method: VITEK 2 + E-test confirmation | Standard: CLSI M100 (2024)</p>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-xs zone-table">
        <thead class="bg-slate-800">
          <tr>
            <th class="text-left text-slate-300">Antibiotic</th>
            <th>MIC (µg/mL)</th>
            <th>Interpretation</th>
            <th class="text-left text-slate-300">Clinical Comment</th>
          </tr>
        </thead>
        <tbody>
          <tr><td class="text-left font-medium">Ampicillin</td><td>≥32</td><td><span class="sensitivity-r px-2 py-0.5 rounded text-xs font-bold">R</span></td><td class="text-left text-slate-400">Intrinsic in ESBL</td></tr>
          <tr><td class="text-left font-medium">Amoxicillin-Clavulanate</td><td>16</td><td><span class="sensitivity-i px-2 py-0.5 rounded text-xs font-bold">I</span></td><td class="text-left text-slate-400">Not reliable for ESBL</td></tr>
          <tr><td class="text-left font-medium">Piperacillin-Tazobactam</td><td>8</td><td><span class="sensitivity-s px-2 py-0.5 rounded text-xs font-bold">S</span></td><td class="text-left text-slate-400">Use with caution in severe sepsis (inoculum effect)</td></tr>
          <tr><td class="text-left font-medium">Ceftriaxone</td><td>≥64</td><td><span class="sensitivity-r px-2 py-0.5 rounded text-xs font-bold">R</span></td><td class="text-left text-slate-400">ESBL hydrolyzes 3rd gen cephalosporins</td></tr>
          <tr><td class="text-left font-medium">Cefepime</td><td>16</td><td><span class="sensitivity-r px-2 py-0.5 rounded text-xs font-bold">R</span></td><td class="text-left text-slate-400">Report R for ESBL (CLSI)</td></tr>
          <tr><td class="text-left font-medium">Meropenem</td><td>≤0.25</td><td><span class="sensitivity-s px-2 py-0.5 rounded text-xs font-bold">S</span></td><td class="text-left text-slate-400 text-green-300">Drug of choice for ESBL BSI</td></tr>
          <tr><td class="text-left font-medium">Ertapenem</td><td>≤0.5</td><td><span class="sensitivity-s px-2 py-0.5 rounded text-xs font-bold">S</span></td><td class="text-left text-slate-400">Preferred carbapenem for step-down (no Pseudomonas cover)</td></tr>
          <tr><td class="text-left font-medium">Gentamicin</td><td>≤1</td><td><span class="sensitivity-s px-2 py-0.5 rounded text-xs font-bold">S</span></td><td class="text-left text-slate-400">UTI only; not for BSI monotherapy</td></tr>
          <tr><td class="text-left font-medium">Ciprofloxacin</td><td>≥4</td><td><span class="sensitivity-r px-2 py-0.5 rounded text-xs font-bold">R</span></td><td class="text-left text-slate-400">Common co-resistance with ESBL</td></tr>
          <tr><td class="text-left font-medium">TMP-SMX</td><td>≥320</td><td><span class="sensitivity-r px-2 py-0.5 rounded text-xs font-bold">R</span></td><td class="text-left text-slate-400">High co-resistance rate</td></tr>
          <tr><td class="text-left font-medium">Nitrofurantoin</td><td>32</td><td><span class="sensitivity-s px-2 py-0.5 rounded text-xs font-bold">S</span></td><td class="text-left text-slate-400">Uncomplicated UTI only (no tissue penetration)</td></tr>
          <tr><td class="text-left font-medium">Colistin</td><td>≤0.5</td><td><span class="sensitivity-s px-2 py-0.5 rounded text-xs font-bold">S</span></td><td class="text-left text-slate-400">Last resort; nephrotoxic</td></tr>
        </tbody>
      </table>
    </div>
    <div class="mt-3 p-2 bg-yellow-900/20 border border-yellow-700/30 rounded text-xs text-yellow-200">
      <strong>⚠️ Lab Comment:</strong> ESBL confirmed by combination disk test (ceftazidime ± clavulanate ≥5mm difference). Recommend carbapenem for serious infections. Piperacillin-tazobactam may be considered for non-severe, non-high-inoculum infections per MERINO trial data.
    </div>
  </div>

  <!-- Special Tests -->
  <div class="bg-slate-900/70 border border-slate-700 rounded-xl p-5 card-hover">
    <h3 class="font-bold text-purple-400 text-base mb-3">🔬 Special Susceptibility Tests</h3>
    <div class="grid md:grid-cols-2 gap-4 text-sm text-slate-300">
      <div>
        <ul class="space-y-1.5">
          <li><strong class="text-purple-300">MRSA Screen:</strong> Cefoxitin disk (≤21mm = MRSA) or Oxacillin MIC ≥4; confirm mecA/mecC PCR</li>
          <li><strong class="text-purple-300">D-test (Inducible Clindamycin Resistance):</strong> Erythromycin R + Clindamycin S → Place disks 15-26mm apart. Flattened zone (D-shape) = positive = report Clindamycin R</li>
          <li><strong class="text-purple-300">ESBL Detection:</strong> Combined disk method (CTX/CAZ ± clavulanate ≥5mm); Double-disk synergy; Chromogenic media (ChromID ESBL)</li>
          <li><strong class="text-purple-300">Carbapenemase Detection:</strong> Modified Carbapenem Inactivation Method (mCIM); EDTA-CIM (for MBL); CarbaNP test; Immunochromatographic (NG-Test CARBA 5)</li>
        </ul>
      </div>
      <div>
        <ul class="space-y-1.5">
          <li><strong class="text-purple-300">VRE Detection:</strong> Vancomycin screen agar (6 µg/mL BHI); MIC determination; vanA/vanB genotyping</li>
          <li><strong class="text-purple-300">High-Level Aminoglycoside Resistance (HLAR):</strong> Gentamicin 120µg & Streptomycin 300µg disks for Enterococcus endocarditis synergy prediction</li>
          <li><strong class="text-purple-300">Colistin MIC:</strong> Broth microdilution ONLY (disk diffusion unreliable); mcr gene PCR</li>
          <li><strong class="text-purple-300">Hetero-resistance (hVISA):</strong> Population analysis profile; Macromethod E-test; Glycopeptide resistance screening agar</li>
        </ul>
      </div>
    </div>
  </div>
</div>

antibiogram: `
<div class="fade-in space-y-6">
  <div class="bg-slate-900 border border-slate-700 rounded-xl p-5">
    <h2 class="text-lg font-bold text-sky-400 mb-2 flex items-center gap-2"><i data-lucide="bar-chart-3" class="w-5 h-5"></i> Antibiograms (Cumulative Susceptibility Reports)</h2>
    <p class="text-slate-300 text-sm">An antibiogram summarizes local susceptibility patterns of common isolates to guide empiric therapy. Updated annually per CLSI M39 guidelines. Essential for antimicrobial stewardship.</p>
  </div>

  <!-- What is antibiogram -->
  <div class="bg-slate-900/70 border border-slate-700 rounded-xl p-5 card-hover">
    <h3 class="font-bold text-emerald-400 text-base mb-3">📈 Components of a Hospital Antibiogram</h3>
    <div class="grid md:grid-cols-2 gap-4 text-sm text-slate-300">
      <div>
        <p class="font-semibold text-white mb-1">Construction Rules (CLSI M39-A4):</p>
        <ul class="list-disc ml-4 space-y-0.5">
          <li>Include only first isolate per patient per species per analysis period</li>
          <li>Minimum 30 isolates per species for statistical validity</li>
          <li>Report %Susceptible (%S) for each drug-bug combination</li>
          <li>Annual update recommended</li>
          <li>Separate by ward/unit (ICU vs non-ICU) if possible</li>
          <li>Separate by specimen type when clinically meaningful</li>
        </ul>
      </div>
      <div>
        <p class="font-semibold text-white mb-1">Clinical Applications:</p>
        <ul class="list-disc ml-4 space-y-0.5">
          <li><strong>Empiric therapy:</strong> Choose antibiotic with ≥80-90% susceptibility</li>
          <li><strong>Stewardship:</strong> Track resistance trends over time</li>
          <li><strong>Formulary decisions:</strong> Add/remove agents based on local data</li>
          <li><strong>Infection prevention:</strong> Detect emerging resistance early</li>
          <li><strong>Benchmarking:</strong> Compare with national/regional data</li>
          <li><strong>Education:</strong> Guide prescribing behavior</li>
        </ul>
      </div>
    </div>
  </div>

resistance: `
<div class="fade-in space-y-6">
  <div class="bg-slate-900 border border-slate-700 rounded-xl p-5">
    <h2 class="text-lg font-bold text-sky-400 mb-2 flex items-center gap-2"><i data-lucide="shield-alert" class="w-5 h-5"></i> Antimicrobial Resistance (AMR)</h2>
    <p class="text-slate-300 text-sm">Understanding resistance mechanisms is critical for ICU/ED physicians managing multidrug-resistant organisms (MDROs). WHO declares AMR a top 10 global health threat.</p>
  </div>

  <!-- MDR Definitions -->
  <div class="bg-slate-900/70 border border-slate-700 rounded-xl p-5 card-hover">
    <h3 class="font-bold text-red-400 text-base mb-3">🚨 Resistance Definitions (Magiorakos et al. 2012)</h3>
    <div class="grid md:grid-cols-3 gap-4 text-sm">
      <div class="p-3 bg-red-950/30 border border-red-800/30 rounded-lg">
        <p class="font-bold text-red-400 mb-1">MDR (Multi-Drug Resistant)</p>
        <p class="text-xs text-slate-300">Non-susceptible to ≥1 agent in ≥3 antimicrobial categories</p>
        <p class="text-xs text-slate-400 mt-1">Example: ESBL E. coli resistant to penicillins + cephalosporins + fluoroquinolones</p>
      </div>
      <div class="p-3 bg-orange-950/30 border border-orange-800/30 rounded-lg">
        <p class="font-bold text-orange-400 mb-1">XDR (Extensively Drug Resistant)</p>
        <p class="text-xs text-slate-300">Non-susceptible to ≥1 agent in all BUT ≤2 categories</p>
        <p class="text-xs text-slate-400 mt-1">Example: A. baumannii susceptible only to colistin + tigecycline</p>
      </div>
      <div class="p-3 bg-purple-950/30 border border-purple-800/30 rounded-lg">
        <p class="font-bold text-purple-400 mb-1">PDR (Pan-Drug Resistant)</p>
        <p class="text-xs text-slate-300">Non-susceptible to ALL agents in ALL categories</p>
        <p class="text-xs text-slate-400 mt-1">Extremely rare but reported in A. baumannii, K. pneumoniae</p>
      </div>
    </div>
  </div>

  <!-- Mechanisms -->
  <div class="bg-slate-900/70 border border-slate-700 rounded-xl p-5 card-hover">
    <h3 class="font-bold text-amber-400 text-base mb-3">⚙️ Resistance Mechanisms</h3>
    <div class="grid md:grid-cols-2 gap-4 text-sm text-slate-300">
      <div>
        <p class="font-semibold text-white mb-1">1. Enzymatic Inactivation:</p>
        <ul class="list-disc ml-4 space-y-0.5">
          <li><strong>β-Lactamases:</strong> Ambler Classification (A, B, C, D)</li>
          <li>Class A: TEM, SHV, CTX-M (ESBLs); KPC (carbapenemase)</li>
          <li>Class B: Metallo-β-lactamases (NDM, VIM, IMP) — Zn²⁺ dependent; NOT inhibited by clavulanate; inhibited by EDTA</li>
          <li>Class C: AmpC (chromosomal in ESCAPPM organisms; plasmid-mediated CMY, DHA)</li>
          <li>Class D: OXA-type (OXA-48 carbapenemase; OXA-23/24/51 in Acinetobacter)</li>
          <li><strong>Aminoglycoside-modifying enzymes:</strong> AAC, ANT, APH</li>
        </ul>
      </div>
      <div>
        <p class="font-semibold text-white mb-1">2. Target Modification:</p>
        <ul class="list-disc ml-4 space-y-0.5">
          <li><strong>PBP alteration:</strong> mecA → PBP2a (MRSA); mosaic PBP (penicillin-R pneumococcus)</li>
          <li><strong>Ribosomal methylation:</strong> erm genes (MLSB resistance — macrolides, lincosamides, streptogramin B)</li>
          <li><strong>DNA gyrase/topoisomerase mutations:</strong> Fluoroquinolone resistance (stepwise)</li>
          <li><strong>vanA/vanB:</strong> D-Ala-D-Lac substitution (VRE)</li>
        </ul>
        <p class="font-semibold text-white mt-2 mb-1">3. Reduced Permeability & Efflux:</p>
        <ul class="list-disc ml-4 space-y-0.5">
          <li><strong>Porin loss:</strong> OprD loss → carbapenem resistance in Pseudomonas</li>
          <li><strong>Efflux pumps:</strong> MexAB-OprM (Pseudomonas); AcrAB-TolC (Enterobacteriaceae)</li>
          <li>Often combine with enzyme production for high-level resistance</li>
        </ul>
      </div>
    </div>
  </div>

  <!-- ESCAPE Pathogens -->
  <div class="bg-slate-900/70 border border-slate-700 rounded-xl p-5 card-hover">
    <h3 class="font-bold text-violet-400 text-base mb-3">☠️ WHO Critical Priority Pathogens & ESKAPE</h3>
    <div class="text-sm text-slate-300">
      <p class="mb-2 font-semibold text-white">ESKAPE Organisms (leading cause of nosocomial MDR infections):</p>
      <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-3">
        <div class="p-2 bg-slate-800 rounded"><strong class="text-red-300">E</strong> — Enterococcus faecium (VRE)</div>
        <div class="p-2 bg-slate-800 rounded"><strong class="text-red-300">S</strong> — Staphylococcus aureus (MRSA/VISA/VRSA)</div>
        <div class="p-2 bg-slate-800 rounded"><strong class="text-red-300">K</strong> — Klebsiella pneumoniae (ESBL/CRE)</div>
        <div class="p-2 bg-slate-800 rounded"><strong class="text-red-300">A</strong> — Acinetobacter baumannii (CRAB)</div>
        <div class="p-2 bg-slate-800 rounded"><strong class="text-red-300">P</strong> — Pseudomonas aeruginosa (CR-PA)</div>
        <div class="p-2 bg-slate-800 rounded"><strong class="text-red-300">E</strong> — Enterobacter spp. (AmpC/CRE)</div>
      </div>
    </div>
  </div>

  <!-- Treatment Options -->
  <div class="bg-slate-900/70 border border-slate-700 rounded-xl p-5 card-hover">
    <h3 class="font-bold text-green-400 text-base mb-3">💊 Therapeutic Options for MDR Organisms</h3>
    <div class="grid md:grid-cols-2 gap-4 text-sm text-slate-300">
      <div>
        <p class="font-semibold text-white mb-1">CRE (Carbapenem-Resistant Enterobacteriaceae):</p>
        <ul class="list-disc ml-4 space-y-0.5">

          <li><strong>Meropenem-Vaborbactam:</strong> KPC-producing organisms</li>

          <li><strong>Colistin:</strong> Last resort; combination therapy; TDM essential</li>
          <li><strong>Tigecycline (high-dose):</strong> Non-UTI, non-BSI infections</li>
        </ul>
      </div>
      <div>
        <p class="font-semibold text-white mb-1">MRSA:</p>
        <ul class="list-disc ml-4 space-y-0.5">
          <li><strong>Vancomycin:</strong> Standard; AUC/MIC guided dosing (target AUC 400-600)</li>
          <li><strong>Daptomycin:</strong> BSI, endocarditis (NOT pneumonia — inactivated by surfactant)</li>
          <li><strong>Linezolid:</strong> Pneumonia, skin; myelosuppression risk &gt;14 days</li>
          <li><strong>Ceftaroline:</strong> Anti-MRSA cephalosporin (5th gen); pneumonia + BSI</li>
          <li><strong>TMP-SMX, Doxycycline:</strong> Non-severe SSTI</li>
        </ul>
        <p class="font-semibold text-white mt-2 mb-1">VRE:</p>
        <ul class="list-disc ml-4 space-y-0.5">
          <li>Linezolid or Daptomycin (high-dose 8-12 mg/kg for BSI)</li>
          <li>Quinupristin-Dalfopristin (E. faecium only, not E. faecalis)</li>
        </ul>
      </div>
    </div>
  </div>

  <!-- Stewardship -->
  <div class="bg-slate-900/70 border border-slate-700 rounded-xl p-5 card-hover">
    <h3 class="font-bold text-sky-400 text-base mb-3">🏥 Antimicrobial Stewardship & Infection Control</h3>
    <div class="grid md:grid-cols-2 gap-4 text-sm text-slate-300">
      <div>
        <p class="font-semibold text-white mb-1">Core Stewardship Strategies:</p>
        <ul class="list-disc ml-4 space-y-0.5">
          <li>Prospective audit with feedback (ID pharmacist + physician)</li>
          <li>Formulary restriction & pre-authorization</li>
          <li>IV-to-oral conversion protocols</li>
          <li>Dose optimization (PK/PD: prolonged infusions for β-lactams)</li>
          <li>De-escalation within 48-72 hrs based on cultures</li>
          <li>Duration guidelines (e.g., 7 days for HAP/VAP per IDSA)</li>
          <li>Procalcitonin-guided cessation</li>
        </ul>
      </div>
      <div>
        <p class="font-semibold text-white mb-1">Infection Prevention & Control:</p>
        <ul class="list-disc ml-4 space-y-0.5">
          <li>Contact precautions for MDRO patients</li>
          <li>Active surveillance cultures (rectal swab for CRE/VRE; nasal for MRSA)</li>
          <li>Hand hygiene compliance monitoring (WHO 5 moments)</li>
          <li>Environmental cleaning (UV-C, hydrogen peroxide vapor)</li>
          <li>Antibiotic cycling/rotation (controversial but used)</li>
          <li>Rapid diagnostics integration for early isolation</li>
          <li>MDRO bundle: Decolonization + isolation + terminal cleaning + audit</li>
        </ul>
      </div>
    </div>
  </div>
</div>
`
};

function showTab(tabName) {
  document.getElementById('mainContent').innerHTML = tabData[tabName];
  document.querySelectorAll('#tabNav button').forEach(btn => {
    btn.classList.remove('tab-active');
    btn.classList.add('text-slate-400', 'hover:text-white');
  });
  const activeBtn = document.querySelector(`[data-tab="${tabName}"]`);
  activeBtn.classList.add('tab-active');
  activeBtn.classList.remove('text-slate-400', 'hover:text-white');
  lucide.createIcons();
}
