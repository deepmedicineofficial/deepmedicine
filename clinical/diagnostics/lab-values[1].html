// ============== APP LOGIC ==============
let activeCategory = "All";
let searchQuery = "";

const defaultConfig = {
  app_title: "Laboratory Value Interpreter",
  subtitle: "Clinical Reference Guide",
  background_color: "#0f172a",
  surface_color: "#1e293b",
  text_color: "#f1f5f9",
  accent_color: "#22d3ee",
  muted_color: "#94a3b8",
  font_family: "DM Sans",
  font_size: 14
};

function getCategories() {
  return ["All", ...labData.map(c => c.category)];
}

function renderTabs() {
  const bar = document.getElementById("tabBar");
  bar.innerHTML = "";
  const cfg = window.elementSdk?.config || defaultConfig;
  getCategories().forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "tab-btn whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-medium flex-shrink-0";
    const isActive = activeCategory === cat;
    btn.style.background = isActive ? cfg.accent_color || defaultConfig.accent_color : "rgba(255,255,255,0.05)";
    btn.style.color = isActive ? cfg.background_color || defaultConfig.background_color : cfg.muted_color || defaultConfig.muted_color;
    btn.textContent = cat === "All" ? "📋 All" : cat;
    btn.onclick = () => { activeCategory = cat; renderTabs(); renderContent(); };
    bar.appendChild(btn);
  });
}

function renderContent() {
  const container = document.getElementById("content");
  const noResults = document.getElementById("noResults");
  const cfg = window.elementSdk?.config || defaultConfig;
  const q = searchQuery.toLowerCase().trim();
  let html = "";
  let count = 0;

  labData.forEach(cat => {
    if (activeCategory !== "All" && activeCategory !== cat.category) return;
    const filteredTests = cat.tests.filter(t =>
      !q || t.name.toLowerCase().includes(q) || cat.category.toLowerCase().includes(q) ||
      t.pearls.toLowerCase().includes(q)
    );
    if (filteredTests.length === 0) return;
    count += filteredTests.length;

    html += `<div class="mb-4 fade-in">
      <div class="flex items-center gap-2 mb-2 px-1">
        <i data-lucide="${cat.catIcon}" style="width:16px;height:16px;color:${cfg.accent_color || defaultConfig.accent_color};"></i>
        <h2 class="font-heading text-sm font-bold" style="color:${cfg.accent_color || defaultConfig.accent_color};">${cat.category}</h2>
        <span class="text-xs px-2 py-0.5 rounded-full" style="background:rgba(255,255,255,0.05);color:${cfg.muted_color || defaultConfig.muted_color};">${filteredTests.length} test${filteredTests.length>1?'s':''}</span>
      </div>`;

    filteredTests.forEach(test => {
      html += buildTestCard(test, cfg);
    });

    html += `</div>`;
  });

  container.innerHTML = html;
  noResults.classList.toggle("hidden", count > 0);
  lucide.createIcons();
}

function buildTestCard(t, cfg) {
  const bg = cfg.surface_color || defaultConfig.surface_color;
  const txt = cfg.text_color || defaultConfig.text_color;
  const acc = cfg.accent_color || defaultConfig.accent_color;
  const mut = cfg.muted_color || defaultConfig.muted_color;

  return `<details class="card-hover rounded-xl mb-2 overflow-hidden" style="background:${bg};border:1px solid rgba(255,255,255,0.06);">
    <summary class="cursor-pointer p-3 sm:p-4 flex items-center justify-between gap-2">
      <div class="flex-1 min-w-0">
        <h3 class="font-semibold text-sm sm:text-base truncate" style="color:${txt};">${t.name}</h3>
        <div class="flex flex-wrap gap-x-3 gap-y-1 mt-1 text-xs" style="color:${mut};">
          <span>♂ ${t.male}</span><span>♀ ${t.female}</span><span>🧒 ${t.child}</span>
          <span style="color:${acc};">${t.unit}</span>
        </div>
      </div>
      <i data-lucide="chevron-down" class="chevron-icon flex-shrink-0" style="width:18px;height:18px;color:${mut};"></i>
    </summary>
    <div class="px-3 sm:px-4 pb-4 space-y-3">
      ${t.critical_low || t.critical_high ? `<div class="flex flex-wrap gap-2 text-xs">
        ${t.critical_low ? `<span class="px-2 py-1 rounded-md" style="background:rgba(239,68,68,0.15);color:#fca5a5;">⚠ Critical Low: ${t.critical_low}</span>` : ''}
        ${t.critical_high ? `<span class="px-2 py-1 rounded-md" style="background:rgba(239,68,68,0.15);color:#fca5a5;">⚠ Critical High: ${t.critical_high}</span>` : ''}
      </div>` : ''}
      <div class="grid sm:grid-cols-2 gap-3">
        <div class="rounded-lg p-3" style="background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.15);">
          <div class="flex items-center gap-1.5 mb-2"><i data-lucide="arrow-up" style="width:14px;height:14px;color:#f87171;"></i><span class="text-xs font-bold" style="color:#f87171;">ELEVATED — Causes</span></div>
          <ul class="space-y-1.5">${t.high.map(h => `<li class="text-xs leading-relaxed" style="color:${mut};"><span style="color:#fca5a5;">•</span> ${h}</li>`).join('')}</ul>
        </div>
        <div class="rounded-lg p-3" style="background:rgba(59,130,246,0.08);border:1px solid rgba(59,130,246,0.15);">
          <div class="flex items-center gap-1.5 mb-2"><i data-lucide="arrow-down" style="width:14px;height:14px;color:#60a5fa;"></i><span class="text-xs font-bold" style="color:#60a5fa;">LOW — Causes</span></div>
          <ul class="space-y-1.5">${t.low.map(l => `<li class="text-xs leading-relaxed" style="color:${mut};"><span style="color:#93c5fd;">•</span> ${l}</li>`).join('')}</ul>
        </div>
      </div>
      <div class="rounded-lg p-3" style="background:rgba(34,211,238,0.06);border:1px solid rgba(34,211,238,0.12);">
        <div class="flex items-center gap-1.5 mb-1.5"><i data-lucide="lightbulb" style="width:14px;height:14px;color:${acc};"></i><span class="text-xs font-bold" style="color:${acc};">Clinical Pearls</span></div>
        <p class="text-xs leading-relaxed" style="color:${mut};">${t.pearls}</p>
      </div>
    </div>
  </details>`;
}

function applyConfig(cfg) {
  const app = document.getElementById("app");
  app.style.background = cfg.background_color || defaultConfig.background_color;
  app.style.fontFamily = `${cfg.font_family || defaultConfig.font_family}, DM Sans, system-ui, sans-serif`;

  const title = document.getElementById("appTitle");
  const sub = document.getElementById("appSubtitle");
  if (title) {
    title.textContent = cfg.app_title || defaultConfig.app_title;
    title.style.color = cfg.text_color || defaultConfig.text_color;
    title.style.fontFamily = `${cfg.font_family || defaultConfig.font_family}, Fraunces, Georgia, serif`;
    title.style.fontSize = `${(cfg.font_size || defaultConfig.font_size) * 1.7}px`;
  }
  if (sub) {
    sub.textContent = cfg.subtitle || defaultConfig.subtitle;
    sub.style.color = cfg.muted_color || defaultConfig.muted_color;
    sub.style.fontSize = `${(cfg.font_size || defaultConfig.font_size) * 0.85}px`;
  }

  const header = document.querySelector("header");
  if (header) header.style.background = `linear-gradient(135deg,${cfg.background_color || defaultConfig.background_color} 0%,${cfg.surface_color || defaultConfig.surface_color} 100%)`;

  renderTabs();
  renderContent();
}

// Search
document.getElementById("searchInput").addEventListener("input", (e) => {
  searchQuery = e.target.value;
  renderContent();
});

// Initial render
renderTabs();
renderContent();
</script>
</body>
</html>
