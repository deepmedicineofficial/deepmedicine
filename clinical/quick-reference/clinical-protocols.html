// ===== STATE =====
let currentTab = 'emergencies';
let searchTerm = '';
let openAccordions = new Set();

// ===== RENDER =====
function renderContent() {
  const content = document.getElementById('content');
  content.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'fade-in';

  if (currentTab === 'emergencies') div.innerHTML = renderProtocolList(DATA.emergencies);
  else if (currentTab === 'protocols') div.innerHTML = renderProtocolList(DATA.protocols);
  else if (currentTab === 'drugs') div.innerHTML = renderDrugTables();
  else if (currentTab === 'ventilator') div.innerHTML = renderVentilator();
  else if (currentTab === 'calculators') div.innerHTML = renderCalculators();

  content.appendChild(div);
  lucide.createIcons();
  bindAccordions();
  if (currentTab === 'calculators') bindCalculators();
}

function filterBySearch(items) {
  if (!searchTerm) return items;
  const q = searchTerm.toLowerCase();
  return items.filter(item => {
    const searchable = [item.title, item.summary, ...(item.tags || [])].join(' ').toLowerCase();
    return searchable.includes(q);
  });
}

function renderProtocolList(items) {
  const filtered = filterBySearch(items);
  if (!filtered.length) return `<div class="text-center py-12" style="color:#6b7a8d;"><i data-lucide="search-x" style="width:48px;height:48px;margin:0 auto 12px;display:block;"></i><p class="text-lg">No protocols found for "${searchTerm}"</p></div>`;

  return filtered.map(p => `
    <div class="protocol-card mb-4 rounded-xl overflow-hidden severity-${p.severity}" style="background:#111827;border:1px solid #1e2a3a;">
      <button class="accordion-trigger w-full text-left p-4 sm:p-5 flex items-start gap-3" data-id="${p.id}">
        <div class="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0 mt-0.5" style="background:${p.severity==='critical'?'#2a1215':p.severity==='urgent'?'#2a1a10':'#0d1526'};">
          <i data-lucide="${p.icon}" style="width:18px;height:18px;color:${p.severity==='critical'?'#dc322f':p.severity==='urgent'?'#cb4b16':'#268bd2'};"></i>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <h3 class="font-bold text-base sm:text-lg" style="color:#f0f2f5;">${p.title}</h3>
            <span class="text-xs px-2 py-0.5 rounded-full font-medium" style="background:${p.severity==='critical'?'#2a1215':p.severity==='urgent'?'#2a1a10':'#0d1526'};color:${p.severity==='critical'?'#dc322f':p.severity==='urgent'?'#cb4b16':'#268bd2'};">${p.severity.toUpperCase()}</span>
          </div>
          <p class="text-sm mt-1" style="color:#6b7a8d;">${p.summary}</p>
        </div>
        <i data-lucide="chevron-down" class="accordion-chevron flex-shrink-0 mt-1 transition-transform duration-300" style="width:20px;height:20px;color:#6b7a8d;${openAccordions.has(p.id)?'transform:rotate(180deg)':''}"></i>
      </button>
      <div class="accordion-body ${openAccordions.has(p.id)?'open':''}" data-body="${p.id}">
        <div class="px-4 sm:px-5 pb-5 pt-0">
          <div class="space-y-4">
            ${p.steps.map((s,i) => `
              <div class="relative step-line pl-10">
                <div class="absolute left-0 top-0 w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold" style="background:${p.severity==='critical'?'#2a1215':p.severity==='urgent'?'#2a1a10':'#0d1526'};color:${p.severity==='critical'?'#dc322f':p.severity==='urgent'?'#cb4b16':'#268bd2'};">${i+1}</div>

}

function renderDrugTables() {
  const q = searchTerm.toLowerCase();
  return DATA.drugs.map(cat => {
    const items = q ? cat.items.filter(d => [d.name,d.dose,d.notes,d.route,cat.category].join(' ').toLowerCase().includes(q)) : cat.items;
    if (!items.length) return '';
    return `
      <div class="mb-6">
        <h2 class="text-lg font-bold mb-3 flex items-center gap-2" style="color:#f0f2f5;">
          <span class="w-1.5 h-6 rounded-full inline-block" style="background:#dc322f;"></span>${cat.category}
        </h2>
        <div class="overflow-x-auto rounded-xl" style="border:1px solid #1e2a3a;">
          <table class="w-full text-sm" style="border-collapse:collapse;">
            <thead><tr style="background:#0d1526;">
              <th class="text-left p-3 font-semibold" style="color:#dc322f;min-width:130px;">Drug</th>
              <th class="text-left p-3 font-semibold" style="color:#dc322f;min-width:160px;">Dose</th>
              <th class="text-left p-3 font-semibold" style="color:#dc322f;">Route</th>
              <th class="text-left p-3 font-semibold" style="color:#dc322f;min-width:250px;">Key Notes</th>
            </tr></thead>
            <tbody>
              ${items.map((d,i) => `<tr style="background:${i%2===0?'#111827':'#0f1520'};border-bottom:1px solid #1e2a3a;">
                <td class="p-3 font-semibold" style="color:#f0f2f5;">${d.name}</td>
                <td class="p-3"><span class="font-mono text-xs" style="color:#cb4b16;">${d.dose}</span></td>

}

function bindAccordions() {
  document.querySelectorAll('.accordion-trigger').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      if (openAccordions.has(id)) openAccordions.delete(id);
      else openAccordions.add(id);
      const body = document.querySelector(`[data-body="${id}"]`);
      const chevron = btn.querySelector('.accordion-chevron');
      if (body) body.classList.toggle('open');
      if (chevron) chevron.style.transform = openAccordions.has(id) ? 'rotate(180deg)' : '';
    });
  });
}

function bindCalculators() {
  document.getElementById('calc-ibw-btn')?.addEventListener('click', () => {
    const sex = document.getElementById('calc-sex').value;
    const cm = parseFloat(document.getElementById('calc-height').value);
    const inches = cm / 2.54;
    const ibw = sex === 'male' ? 50 + 2.3*(inches-60) : 45.5 + 2.3*(inches-60);
    const tv6 = (ibw*6).toFixed(0), tv8 = (ibw*8).toFixed(0);
    const res = document.getElementById('calc-ibw-result');
    res.classList.remove('hidden');
    res.innerHTML = `<b style="color:#f0f2f5;">IBW:</b> <span style="color:#dc322f;">${ibw.toFixed(1)} kg</span><br><b style="color:#f0f2f5;">TV (6 mL/kg):</b> ${tv6} mL &nbsp; <b style="color:#f0f2f5;">TV (8 mL/kg):</b> ${tv8} mL`;
  });
  document.getElementById('calc-map-btn')?.addEventListener('click', () => {
    const sbp = parseFloat(document.getElementById('calc-sbp').value);
    const dbp = parseFloat(document.getElementById('calc-dbp').value);
    const map = (dbp + (sbp-dbp)/3).toFixed(1);
    const res = document.getElementById('calc-map-result');
    res.classList.remove('hidden');
    res.innerHTML = `<b style="color:#f0f2f5;">MAP:</b> <span style="color:${map<65?'#dc322f':'#2aa198'};">${map} mmHg</span> ${map<65?'⚠️ Below target (65 mmHg)':'✓ Adequate'}`;
  });
  document.getElementById('calc-crcl-btn')?.addEventListener('click', () => {
    const age = parseFloat(document.getElementById('crcl-age').value);
    const wt = parseFloat(document.getElementById('crcl-weight').value);
    const cr = parseFloat(document.getElementById('crcl-cr').value);
    const sex = document.getElementById('crcl-sex').value;
    let crcl = ((140-age)*wt)/(72*cr);
    if (sex==='female') crcl *= 0.85;
    const res = document.getElementById('calc-crcl-result');
    res.classList.remove('hidden');
    res.innerHTML = `<b style="color:#f0f2f5;">CrCl:</b> <span style="color:#dc322f;">${crcl.toFixed(1)} mL/min</span><br><span style="color:#6b7a8d;">Dose adjust: ${crcl<30?'Severe impairment — major adjustments needed':crcl<60?'Moderate impairment — dose adjustments required':'Mild or no impairment'}</span>`;
  });
  document.getElementById('calc-na-btn')?.addEventListener('click', () => {
    const na = parseFloat(document.getElementById('na-measured').value);
    const glu = parseFloat(document.getElementById('na-glucose').value);
    const corrected = na + 1.6*((glu-100)/100);
    const res = document.getElementById('calc-na-result');
    res.classList.remove('hidden');
    res.innerHTML = `<b style="color:#f0f2f5;">Corrected Na⁺:</b> <span style="color:#dc322f;">${corrected.toFixed(1)} mEq/L</span><br><span style="color:#6b7a8d;">Katz correction: Na + 1.6 × [(Glucose − 100) / 100]</span>`;
  });
}

// ===== TABS =====
document.getElementById('tabBar').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  currentTab = btn.dataset.tab;
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.remove('active');
    b.style.color = '#6b7a8d';
    b.style.borderColor = 'transparent';
  });
  btn.classList.add('active');
  btn.style.color = '#dc322f';
  btn.style.borderColor = '#dc322f';
  openAccordions.clear();
  renderContent();
});

document.getElementById('searchInput').addEventListener('input', (e) => {
  clearTimeout(searchTimeout);

});

function applyConfig(config) {
  const bg = config.background_color || defaultConfig.background_color;
  const surface = config.surface_color || defaultConfig.surface_color;
  const text = config.text_color || defaultConfig.text_color;
  const primary = config.primary_action_color || defaultConfig.primary_action_color;
  const secondary = config.secondary_action_color || defaultConfig.secondary_action_color;
  const font = config.font_family || defaultConfig.font_family;
  const fontSize = config.font_size || defaultConfig.font_size;

  const app = document.getElementById('app');
  app.style.background = bg;
  app.style.color = text;
  app.style.fontFamily = `${font}, IBM Plex Sans, sans-serif`;
  app.style.fontSize = `${fontSize}px`;

  document.getElementById('mainTitle').textContent = config.app_title || defaultConfig.app_title;

  document.getElementById('mainSubtitle').style.fontSize = `${fontSize * 0.85}px`;
}

</script>
