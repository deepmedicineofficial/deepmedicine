// ===== RENDER FUNCTIONS =====
function renderTabs() {
  const container = document.getElementById('category-tabs');
  container.innerHTML = '';
  ANTIBIOTICS_DATA.forEach((cat, i) => {
    const btn = document.createElement('button');
    btn.className = `flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs font-semibold whitespace-nowrap transition-all ${i === activeCategory ? 'tab-active' : 'opacity-60 hover:opacity-90'}`;
    btn.style.cssText = i === activeCategory ? `background:${cat.color}22;color:${cat.color};--accent:${cat.color}` : `color:#94a3b8;--accent:${cat.color}`;
    btn.innerHTML = `<i data-lucide="${cat.icon}" style="width:14px;height:14px;"></i><span>${cat.name || cat.category}</span>`;
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-selected', i === activeCategory);
    btn.onclick = () => { activeCategory = i; expandedCards.clear(); renderAll(); };
    container.appendChild(btn);
  });
  lucide.createIcons();
}

function highlightText(text, query) {
  if (!query) return text;
  const re = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  return text.replace(re, '<span class="search-highlight">$1</span>');
}

function renderContent() {
  const container = document.getElementById('content-area');
  container.innerHTML = '';
  const cat = ANTIBIOTICS_DATA[activeCategory];
  const q = searchQuery.toLowerCase();

  // Category Header
  const header = document.createElement('div');
  header.className = 'mb-6 animate-fade-up';
  header.innerHTML = `
    <div class="flex items-center gap-3 mb-2">
      <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:${cat.color}22;">
        <i data-lucide="${cat.icon}" style="width:20px;height:20px;color:${cat.color};"></i>
      </div>
      <h2 class="font-heading text-xl md:text-2xl font-bold" style="color:#f8fafc;">${cat.category}</h2>
    </div>
    <p class="text-sm leading-relaxed max-w-3xl" style="color:#94a3b8;">${cat.description}</p>
  `;
  container.appendChild(header);

  // Classes
  cat.classes.forEach((cls, ci) => {
    const filteredDrugs = q ? cls.drugs.filter(d =>
      d.name.toLowerCase().includes(q) || d.type.toLowerCase().includes(q) ||
      d.indication.toLowerCase().includes(q) || d.dose.toLowerCase().includes(q) ||
      cls.moa.toLowerCase().includes(q) || cls.name.toLowerCase().includes(q)
    ) : cls.drugs;

    if (q && filteredDrugs.length === 0) return;

    const section = document.createElement('div');
    section.className = `mb-6 animate-fade-up stagger-${ci + 1}`;
    const cardId = `${activeCategory}-${ci}`;
    const isExpanded = expandedCards.has(cardId);

    section.innerHTML = `
      <div class="rounded-2xl border overflow-hidden" style="background:${defaultConfig.surface_color};border-color:#334155;">
        <!-- Class Header -->
        <button class="w-full px-5 py-4 flex items-center justify-between text-left hover:bg-white/[0.02] transition-colors class-toggle" data-card="${cardId}" aria-expanded="${isExpanded}">
          <div class="flex-1 min-w-0">
            <h3 class="font-heading text-lg font-bold" style="color:${cat.color};">${highlightText(cls.name, searchQuery)}</h3>
            <p class="text-xs mt-1 truncate" style="color:#64748b;">${cls.spectrum}</p>
          </div>
          <div class="ml-3 flex items-center gap-2">
            <span class="badge" style="background:${cat.color}22;color:${cat.color};">${filteredDrugs.length} drug${filteredDrugs.length !== 1 ? 's' : ''}</span>
            <i data-lucide="chevron-down" class="transition-transform ${isExpanded ? 'rotate-180' : ''}" style="width:18px;height:18px;color:#64748b;"></i>
          </div>
        </button>

        <!-- Expanded Content -->
        <div class="expand-content ${isExpanded ? 'open' : ''}">
          <div class="px-5 pb-3 border-t" style="border-color:#334155;">
            <!-- MOA & Resistance -->
            <div class="grid md:grid-cols-2 gap-3 py-3">
              <div class="p-3 rounded-xl" style="background:#0f172a;">
                <div class="flex items-center gap-1.5 mb-1">
                  <i data-lucide="crosshair" style="width:12px;height:12px;color:${cat.color};"></i>
                  <span class="text-xs font-bold uppercase tracking-wider" style="color:${cat.color};">Mechanism of Action</span>
                </div>
                <p class="text-xs leading-relaxed" style="color:#cbd5e1;">${highlightText(cls.moa, searchQuery)}</p>
              </div>
              <div class="p-3 rounded-xl" style="background:#0f172a;">
                <div class="flex items-center gap-1.5 mb-1">
                  <i data-lucide="shield-alert" style="width:12px;height:12px;color:#f59e0b;"></i>
                  <span class="text-xs font-bold uppercase tracking-wider" style="color:#f59e0b;">Resistance</span>
                </div>
                <p class="text-xs leading-relaxed" style="color:#cbd5e1;">${cls.resistance}</p>
              </div>
            </div>

            <!-- Drugs Table -->
            <div class="space-y-2 pb-3">
              ${filteredDrugs.map(d => `
                <div class="drug-card rounded-xl p-4 cursor-pointer hover:ring-1 transition-all" style="background:#0f172a;--tw-ring-color:${cat.color}40;" data-drug='${JSON.stringify(d).replace(/'/g, "&#39;")}' data-class='${JSON.stringify({name:cls.name,moa:cls.moa,spectrum:cls.spectrum,resistance:cls.resistance}).replace(/'/g, "&#39;")}' data-color="${cat.color}">
                  <div class="flex items-start justify-between gap-3 flex-wrap">
                    <div class="flex-1 min-w-0">
                      <div class="flex items-center gap-2 flex-wrap">
                        <h4 class="font-bold text-sm" style="color:#f8fafc;">${highlightText(d.name, searchQuery)}</h4>
                        <span class="badge" style="background:${cat.color}15;color:${cat.color};">${highlightText(d.type, searchQuery)}</span>
                      </div>
                      <p class="text-xs mt-1.5" style="color:#94a3b8;"><strong style="color:#cbd5e1;">Dose:</strong> ${highlightText(d.dose, searchQuery)}</p>
                      <p class="text-xs mt-1 line-clamp-2" style="color:#64748b;">${highlightText(d.indication, searchQuery)}</p>
                    </div>
                    <i data-lucide="chevron-right" style="width:16px;height:16px;color:#475569;flex-shrink:0;margin-top:2px;"></i>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      </div>
    `;
    container.appendChild(section);
  });

  // No results
  if (q && container.querySelectorAll('.drug-card').length === 0) {
    container.innerHTML += `<div class="text-center py-12"><i data-lucide="search-x" style="width:48px;height:48px;color:#334155;margin:0 auto;display:block;"></i><p class="mt-3 text-sm" style="color:#64748b;">No results found for "${searchQuery}"</p></div>`;
  }

  lucide.createIcons();
  bindCardEvents();
}

function bindCardEvents() {
  document.querySelectorAll('.class-toggle').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.card;
      if (expandedCards.has(id)) expandedCards.delete(id);
      else expandedCards.add(id);
      renderContent();
    };
  });

  document.querySelectorAll('.drug-card').forEach(card => {
    card.onclick = () => {
      const drug = JSON.parse(card.dataset.drug);
      const cls = JSON.parse(card.dataset.class);
      const color = card.dataset.color;
      showDrugModal(drug, cls, color);
    };
  });
}

function showDrugModal(drug, cls, color) {
  const modal = document.getElementById('drug-modal');
  const content = document.getElementById('modal-content');
  content.innerHTML = `
    <div class="flex items-start justify-between mb-6">
      <div>
        <span class="badge mb-2" style="background:${color}22;color:${color};">${drug.type}</span>
        <h2 class="font-heading text-2xl md:text-3xl font-bold" style="color:#f8fafc;">${drug.name}</h2>
        <p class="text-sm mt-1" style="color:#64748b;">Class: ${cls.name}</p>
      </div>
      <button id="close-modal-btn" class="p-2 rounded-lg hover:bg-white/10 transition-colors" aria-label="Close modal">
        <i data-lucide="x" style="width:20px;height:20px;color:#94a3b8;"></i>
      </button>
    </div>

    <div class="grid gap-4">
      <!-- Dosage -->
      <div class="p-4 rounded-xl border" style="background:#0f172a;border-color:${color}33;">
        <div class="flex items-center gap-2 mb-2">
          <i data-lucide="pill" style="width:16px;height:16px;color:${color};"></i>
          <h3 class="font-bold text-sm" style="color:${color};">Dosage</h3>
        </div>
        <p class="text-sm font-mono" style="color:#e2e8f0;">${drug.dose}</p>
      </div>

      <!-- MOA -->
      <div class="p-4 rounded-xl" style="background:#0f172a;">
        <div class="flex items-center gap-2 mb-2">
          <i data-lucide="crosshair" style="width:16px;height:16px;color:${color};"></i>
          <h3 class="font-bold text-sm" style="color:${color};">Mechanism of Action</h3>
        </div>
        <p class="text-sm leading-relaxed" style="color:#cbd5e1;">${cls.moa}</p>
      </div>

      <!-- Spectrum -->
      <div class="p-4 rounded-xl" style="background:#0f172a;">
        <div class="flex items-center gap-2 mb-2">
          <i data-lucide="radio" style="width:16px;height:16px;color:#14b8a6;"></i>
          <h3 class="font-bold text-sm" style="color:#14b8a6;">Spectrum of Activity</h3>
        </div>
        <p class="text-sm leading-relaxed" style="color:#cbd5e1;">${cls.spectrum}</p>
      </div>

      <!-- Indications -->
      <div class="p-4 rounded-xl" style="background:#0f172a;">
        <div class="flex items-center gap-2 mb-2">
          <i data-lucide="stethoscope" style="width:16px;height:16px;color:#3b82f6;"></i>
          <h3 class="font-bold text-sm" style="color:#3b82f6;">Clinical Indications</h3>
        </div>
        <div class="flex flex-wrap gap-2">
          ${drug.indication.split(', ').map(ind => `<span class="text-xs px-2.5 py-1 rounded-lg" style="background:#3b82f615;color:#93c5fd;">${ind}</span>`).join('')}
        </div>
      </div>

      <!-- Adverse Effects -->
      <div class="p-4 rounded-xl border" style="background:#0f172a;border-color:#ef444433;">
        <div class="flex items-center gap-2 mb-2">
          <i data-lucide="alert-triangle" style="width:16px;height:16px;color:#ef4444;"></i>
          <h3 class="font-bold text-sm" style="color:#ef4444;">Adverse Effects</h3>
        </div>
        <div class="flex flex-wrap gap-2">
          ${drug.adverse.split(', ').map(ae => `<span class="text-xs px-2.5 py-1 rounded-lg" style="background:#ef444415;color:#fca5a5;">${ae}</span>`).join('')}
        </div>
      </div>

      <!-- Resistance -->
      <div class="p-4 rounded-xl" style="background:#0f172a;">
        <div class="flex items-center gap-2 mb-2">
          <i data-lucide="shield-alert" style="width:16px;height:16px;color:#f59e0b;"></i>
          <h3 class="font-bold text-sm" style="color:#f59e0b;">Resistance Mechanisms</h3>
        </div>
        <p class="text-sm leading-relaxed" style="color:#cbd5e1;">${cls.resistance}</p>
      </div>

      <!-- Clinical Pearl -->
      ${drug.note ? `
      <div class="p-4 rounded-xl border" style="background:${color}08;border-color:${color}33;">
        <div class="flex items-center gap-2 mb-2">
          <i data-lucide="lightbulb" style="width:16px;height:16px;color:${color};"></i>
          <h3 class="font-bold text-sm" style="color:${color};">Clinical Pearl</h3>
        </div>
        <p class="text-sm leading-relaxed" style="color:#e2e8f0;">${drug.note}</p>
      </div>` : ''}
    </div>
  `;
  modal.classList.remove('hidden');
  lucide.createIcons();

  document.getElementById('close-modal-btn').onclick = () => modal.classList.add('hidden');
  document.getElementById('modal-backdrop').onclick = () => modal.classList.add('hidden');
}

function renderAll() {
  renderTabs();
  renderContent();
}

// ===== SEARCH =====
document.getElementById('search-input').addEventListener('input', (e) => {
  searchQuery = e.target.value.trim();
  if (searchQuery) {
    // Search across all categories, switch to first with results
    const q = searchQuery.toLowerCase();
    for (let i = 0; i < ANTIBIOTICS_DATA.length; i++) {
      const hasResults = ANTIBIOTICS_DATA[i].classes.some(cls =>
        cls.drugs.some(d =>
          d.name.toLowerCase().includes(q) || d.type.toLowerCase().includes(q) ||
          d.indication.toLowerCase().includes(q) || cls.moa.toLowerCase().includes(q) ||
          cls.name.toLowerCase().includes(q)
        )
      );
      if (hasResults) { activeCategory = i; break; }
    }
    expandedCards.clear();
    ANTIBIOTICS_DATA[activeCategory].classes.forEach((_, ci) => expandedCards.add(`${activeCategory}-${ci}`));
  }
  renderAll();
});

// Keyboard close modal
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') document.getElementById('drug-modal').classList.add('hidden');
});

// ===== ELEMENT SDK =====
function applyConfig(config) {
  const t = document.getElementById('app-title');
  const s = document.getElementById('app-subtitle');
  if (t) t.textContent = config.app_title || defaultConfig.app_title;
  if (s) s.textContent = config.subtitle || defaultConfig.subtitle;

  const app = document.getElementById('app');
  if (app) app.style.background = config.background_color || defaultConfig.background_color;

  const font = config.font_family || defaultConfig.font_family;
  document.body.style.fontFamily = `${font}, sans-serif`;

  const size = config.font_size || defaultConfig.font_size;
  document.body.style.fontSize = `${size}px`;
}

// Initial render
renderAll();
</script>
</body>
</html>
