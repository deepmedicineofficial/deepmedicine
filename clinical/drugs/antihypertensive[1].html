// ======== STATE ========
let currentFilter = 'all';
let searchTerm = '';
let expandedSections = new Set();
let allData = DRUG_DATA;

// ======== DEFAULT CONFIG ========
const defaultConfig = {
  main_title: "Antihypertensive Drugs",
  subtitle: "Complete Pharmacological Classification",
  background_color: "#f0f4f3",
  surface_color: "#ffffff",
  text_color: "#1a3a34",
  primary_color: "#0f4c5c",
  accent_color: "#7ee8c7",
  font_family: "DM Sans",
  font_size: 14
};

// ======== RENDER FUNCTIONS ========
function renderDrugClasses(data) {
  const container = document.getElementById('mainContent');
  // Track existing sections
  const existingIds = new Set([...container.children].map(el => el.dataset.classId));
  const newIds = new Set(data.map(d => d.id));

  // Remove sections no longer in filtered data
  existingIds.forEach(id => {
    if (!newIds.has(id)) {
      const el = container.querySelector(`[data-class-id="${id}"]`);
      if (el) el.remove();
    }
  });

  data.forEach((drugClass, i) => {
    let section = container.querySelector(`[data-class-id="${drugClass.id}"]`);
    if (!section) {
      section = document.createElement('div');
      section.dataset.classId = drugClass.id;
      section.className = 'class-section mb-6';
      section.style.animationDelay = `${i * 0.06}s`;
      container.appendChild(section);
    }
    section.innerHTML = renderClassHTML(drugClass);
  });

  // Re-attach event listeners
  attachExpandListeners();
  lucide.createIcons();
}

function renderClassHTML(dc) {
  const isExpanded = expandedSections.has(dc.id);
  return `
    <div class="drug-card rounded-2xl overflow-hidden shadow-sm" style="background:var(--surface);border-left-color:${dc.color};">
      <button class="expand-toggle w-full text-left px-5 py-4 flex items-center gap-4 cursor-pointer hover:bg-black/[0.02] transition-colors" data-id="${dc.id}" aria-expanded="${isExpanded}">
        <div class="flex-shrink-0 w-11 h-11 rounded-xl flex items-center justify-center" style="background:${dc.colorLight};">
          <i data-lucide="${dc.icon}" style="width:22px;height:22px;color:${dc.color};"></i>
        </div>
        <div class="flex-1 min-w-0">
          <h2 class="text-lg font-bold truncate" style="color:var(--text);">${dc.name}</h2>
          <p class="text-xs mt-0.5 line-clamp-1" style="color:var(--text);opacity:0.55;">${dc.moa.substring(0, 100)}…</p>
        </div>
        <div class="flex items-center gap-2">
          ${dc.tags.includes('first-line') ? '<span class="badge" style="background:#dcfce7;color:#166534;">1st Line</span>' : ''}
          ${dc.tags.includes('emergency') ? '<span class="badge" style="background:#fee2e2;color:#991b1b;">Emergency</span>' : ''}
          ${dc.tags.includes('pregnancy') ? '<span class="badge" style="background:#fef3c7;color:#92400e;">⚠ Pregnancy</span>' : ''}
          <i data-lucide="${isExpanded ? 'chevron-up' : 'chevron-down'}" style="width:20px;height:20px;color:var(--text);opacity:0.4;" class="flex-shrink-0"></i>
        </div>
      </button>
      <div class="expand-content ${isExpanded ? 'open' : ''} px-5 pb-4">
        <div class="mb-3 p-3 rounded-xl text-sm" style="background:${dc.colorLight};color:${dc.color};">
          <strong>Mechanism:</strong> ${dc.moa}
        </div>
        ${dc.subcategories.map(sub => renderSubcategory(sub, dc.color, dc.colorLight)).join('')}
      </div>
    </div>
  `;
}

function renderSubcategory(sub, color, colorLight) {
  return `
    <div class="mb-4 last:mb-0">
      <div class="flex flex-wrap items-center gap-2 mb-2">
        <h3 class="font-bold text-sm" style="color:var(--text);">${sub.name}</h3>
        ${sub.badge ? `<span class="badge text-white" style="background:${sub.badgeColor};">${sub.badge}</span>` : ''}
      </div>
      <p class="text-xs mb-3" style="color:var(--text);opacity:0.6;"><em>${sub.mechanism}</em></p>
      <div class="overflow-x-auto">
        <table class="w-full text-xs border-collapse">
          <thead>
            <tr style="background:${colorLight};">
              <th class="text-left p-2 rounded-tl-lg font-semibold" style="color:${color};">Drug</th>
              <th class="text-left p-2 font-semibold" style="color:${color};">Dose</th>
              <th class="text-left p-2 rounded-tr-lg font-semibold" style="color:${color};">Clinical Notes</th>
            </tr>
          </thead>
          <tbody>
            ${sub.drugs.map((d, i) => `
              <tr class="${i % 2 === 0 ? '' : 'bg-black/[0.02]'}">
                <td class="p-2 font-semibold whitespace-nowrap" style="color:var(--text);">${highlightSearch(d.name)}</td>
                <td class="p-2 whitespace-nowrap" style="color:var(--text);opacity:0.75;">${d.dose}</td>
                <td class="p-2" style="color:var(--text);opacity:0.7;">${highlightSearch(d.notes)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
      <div class="mt-2 grid sm:grid-cols-2 gap-2 text-xs">
        <div class="p-2 rounded-lg" style="background:#fef2f2;"><strong style="color:#991b1b;">Side Effects:</strong> <span style="color:#7f1d1d;">${sub.sideEffects}</span></div>
        <div class="p-2 rounded-lg" style="background:#fefce8;"><strong style="color:#92400e;">Contraindications:</strong> <span style="color:#78350f;">${sub.contraindications}</span></div>
      </div>
    </div>
  `;
}

function highlightSearch(text) {
  if (!searchTerm) return text;
  const regex = new RegExp(`(${searchTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  return text.replace(regex, '<mark style="background:#fef08a;padding:0 2px;border-radius:2px;">$1</mark>');
}

function filterData() {
  let filtered = DRUG_DATA;
  if (currentFilter === 'first-line') filtered = filtered.filter(d => d.tags.includes('first-line'));
  else if (currentFilter === 'emergency') filtered = filtered.filter(d => d.tags.includes('emergency'));
  else if (currentFilter === 'pregnancy') filtered = filtered.filter(d => d.tags.includes('pregnancy'));

  if (searchTerm) {
    const s = searchTerm.toLowerCase();
    filtered = filtered.filter(dc => {
      if (dc.name.toLowerCase().includes(s) || dc.moa.toLowerCase().includes(s)) return true;
      return dc.subcategories.some(sub =>
        sub.name.toLowerCase().includes(s) ||
        sub.drugs.some(d => d.name.toLowerCase().includes(s) || d.notes.toLowerCase().includes(s) || d.dose.toLowerCase().includes(s))
      );
    });
  }
  allData = filtered;
  renderDrugClasses(filtered);
}

function attachExpandListeners() {
  document.querySelectorAll('.expand-toggle').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.id;
      if (expandedSections.has(id)) expandedSections.delete(id);
      else expandedSections.add(id);
      filterData();
    };
  });
}

// ======== SEARCH & FILTER ========
document.getElementById('searchInput').addEventListener('input', (e) => {
  searchTerm = e.target.value.trim();
  if (searchTerm) {
    // Auto-expand all when searching
    DRUG_DATA.forEach(d => expandedSections.add(d.id));
  }
  filterData();
});

document.getElementById('filterTabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  currentFilter = btn.dataset.filter;
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.remove('active');
    b.style.background = '#e8efed';
    b.style.color = '#3a6b5e';
  });
  btn.classList.add('active');
  btn.style.background = 'var(--primary)';
  btn.style.color = '#fff';
  filterData();
});

// ======== ELEMENT SDK ========
function applyConfig(config) {
  const c = { ...defaultConfig, ...config };
  const root = document.getElementById('app');
  root.style.setProperty('--surface', c.surface_color);
  root.style.setProperty('--text', c.text_color);
  root.style.setProperty('--primary', c.primary_color);
  root.style.background = c.background_color;

  const header = document.getElementById('app-header');
  header.style.background = `linear-gradient(135deg,${c.primary_color} 0%,${adjustColor(c.primary_color, 20)} 50%,${c.primary_color} 100%)`;

  document.getElementById('mainTitle').textContent = c.main_title || defaultConfig.main_title;
  document.getElementById('subtitle').textContent = c.subtitle || defaultConfig.subtitle;

  const font = c.font_family || defaultConfig.font_family;
  const baseSize = c.font_size || defaultConfig.font_size;
  document.body.style.fontFamily = `'${font}', 'DM Sans', sans-serif`;
  document.body.style.fontSize = `${baseSize}px`;
  document.getElementById('mainTitle').style.fontSize = `${baseSize * 2.5}px`;
  document.getElementById('subtitle').style.fontSize = `${baseSize * 1.15}px`;
}

function adjustColor(hex, amount) {
  let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  r = Math.min(255, r + amount); g = Math.min(255, g + amount); b = Math.min(255, b + amount);
  return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
}

// Initial render
applyConfig(defaultConfig);
filterData();
lucide.createIcons();
</script>
