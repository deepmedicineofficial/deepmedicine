      "Vancomycin (MRSA SSTI) → TMP-SMX DS 2 tabs PO q12h or Doxycycline 100mg PO q12h",

      "Metronidazole IV → Metronidazole 500mg PO q8h (near 100% bioavailability)",
      "Fluconazole IV → Fluconazole PO same dose (>90% bioavailability)",
      "Linezolid IV → Linezolid 600mg PO q12h (~100% bioavailability)"
    ], search: "conversion iv po oral switch bioavailability" },
    { title: "Recommended Duration by Infection", items: [
      "VAP: 7 days (IDSA/ATS 2016)",
      "Community-acquired pneumonia: 5 days minimum (if clinically stable ≥48h)",
      "Complicated UTI / Pyelonephritis: 7–14 days (shorter with source control)",
      "Intra-abdominal (adequate source control): 4 days (STOP-IT trial)",
      "Uncomplicated bacteremia (gram-negative): 7 days (BALANCE trial supports this)",
      "S. aureus bacteremia: 4–6 weeks minimum (ALWAYS get TEE)",
      "C. difficile: 10 days (fidaxomicin or vancomycin PO)",
      "Skin/soft tissue (uncomplicated cellulitis): 5 days"
    ], search: "duration length days course how long treat" }
  ]
};

// ===== RENDER FUNCTIONS =====
let currentTab = 'empiric';
let searchQuery = '';

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.remove('tab-active');
    b.classList.add('opacity-60');
  });
  const active = document.querySelector(`[data-tab="${tab}"]`);
  if (active) { active.classList.add('tab-active'); active.classList.remove('opacity-60'); }
  renderContent();
}

function handleSearch(val) {
  searchQuery = val.toLowerCase().trim();
  renderContent();
}

function matchSearch(searchField) {
  if (!searchQuery) return true;
  return searchField.toLowerCase().includes(searchQuery);
}

function urgencyColor(u) {
  if (u === 'STAT') return 'background:#dc2626;color:#fff;';
  return 'background:#f59e0b;color:#000;';
}

function renderContent() {
  const area = document.getElementById('content-area');

  if (currentTab === 'empiric') {
    const items = DATA.empiric.filter(i => matchSearch(i.search + ' ' + i.title));
    area.innerHTML = items.length === 0 ? noResults() : items.map((item, idx) => `
      <details class="mb-4 slide-up" style="animation-delay:${idx * 60}ms; background:var(--surface); border-radius:12px; border:1px solid rgba(255,255,255,0.06);">
        <summary class="flex items-center justify-between p-4 cursor-pointer">
          <div class="flex items-center gap-3">
            <div style="background:var(--accent);width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <i data-lucide="${item.icon}" style="width:16px;height:16px;color:var(--bg);"></i>
            </div>
            <div>
              <h3 class="font-semibold text-sm md:text-base" style="color:var(--text);">${item.title}</h3>
              <span class="dose-pill mt-1" style="${urgencyColor(item.urgency)}">${item.urgency}</span>
            </div>
          </div>
          <i data-lucide="chevron-down" class="chevron-icon" style="width:18px;height:18px;opacity:0.4;flex-shrink:0;"></i>
        </summary>
        <div class="px-4 pb-4">
          <div class="mb-3">
            <h4 class="text-xs font-semibold uppercase tracking-wide mb-2" style="color:var(--accent);">Step-by-Step Management</h4>
            <ol class="space-y-1.5 ml-4">
              ${item.steps.map((s, i) => `<li class="text-sm opacity-85" style="list-style-type:decimal;padding-left:4px;"><span>${s}</span></li>`).join('')}
            </ol>
          </div>
          <div class="mb-3">
            <h4 class="text-xs font-semibold uppercase tracking-wide mb-2" style="color:var(--accent2);">Empiric Regimens</h4>
            ${item.regimens.map(r => `
              <div class="mb-2 p-2.5 rounded-lg" style="background:rgba(255,255,255,0.03);border-left:3px solid var(--accent2);">
                <div class="text-xs font-semibold mb-0.5" style="color:var(--accent2);">${r.name}</div>
                <div class="text-sm opacity-90">${r.drugs}</div>
              </div>
            `).join('')}
          </div>
          <div class="p-2.5 rounded-lg" style="background:rgba(56,189,248,0.08);border:1px solid rgba(56,189,248,0.15);">
            <div class="flex items-start gap-2">
              <i data-lucide="info" style="width:14px;height:14px;color:var(--accent);flex-shrink:0;margin-top:2px;"></i>
              <p class="text-xs opacity-80">${item.notes}</p>
            </div>
          </div>
        </div>
      </details>
    `).join('');
  }

  else if (currentTab === 'drugs') {
    const items = DATA.drugs.filter(i => matchSearch(i.search + ' ' + i.name));
    area.innerHTML = items.length === 0 ? noResults() : `<div class="grid gap-4 md:grid-cols-2">${items.map((d, idx) => `
      <div class="card-hover slide-up p-4 rounded-xl" style="animation-delay:${idx * 50}ms; background:var(--surface); border:1px solid rgba(255,255,255,0.06);">
        <div class="flex items-center gap-2 mb-2">
          <i data-lucide="pill" style="width:14px;height:14px;color:var(--accent);"></i>
          <h3 class="font-bold text-sm" style="color:var(--accent);">${d.name}</h3>
        </div>
        <div class="dose-pill mb-2" style="background:rgba(244,114,182,0.15);color:var(--accent2);">${d.class}</div>
        <div class="space-y-1.5 text-xs">
          <p><span class="font-semibold" style="color:var(--accent);">Spectrum:</span> <span class="opacity-80">${d.spectrum}</span></p>
          <p><span class="font-semibold" style="color:var(--accent);">Dose:</span> <span class="opacity-90">${d.dose}</span></p>
          <p><span class="font-semibold" style="color:var(--accent);">Infusion:</span> <span class="opacity-80">${d.infusion}</span></p>
          <p><span class="font-semibold" style="color:var(--accent2);">⚠ Monitor:</span> <span class="opacity-80">${d.monitor}</span></p>
        </div>
      </div>
    `).join('')}</div>`;
  }

  else if (currentTab === 'resistance') {
    const items = DATA.resistance.filter(i => matchSearch(i.search + ' ' + i.organism));
    area.innerHTML = items.length === 0 ? noResults() : items.map((r, idx) => `
      <div class="mb-4 slide-up rounded-xl overflow-hidden" style="animation-delay:${idx * 60}ms; background:var(--surface); border:1px solid rgba(255,255,255,0.06);">
        <div class="p-4" style="border-left:4px solid var(--accent2);">
          <div class="flex items-center gap-2 mb-2">
            <i data-lucide="bug" style="width:16px;height:16px;color:var(--accent2);"></i>
            <h3 class="font-bold text-sm md:text-base" style="color:var(--accent2);">${r.organism}</h3>
          </div>
          <div class="space-y-2 text-xs">
            <p><span class="font-semibold" style="color:var(--accent);">Mechanism:</span> <span class="opacity-80">${r.mechanism}</span></p>
            <p><span class="font-semibold" style="color:var(--accent);">Treatment:</span> <span class="opacity-90">${r.treatments}</span></p>
            <div class="p-2 rounded-lg mt-2" style="background:rgba(244,114,182,0.07);border:1px solid rgba(244,114,182,0.12);">
              <p class="opacity-80"><span class="font-semibold" style="color:var(--accent2);">Key Pearl:</span> ${r.notes}</p>
            </div>
          </div>
        </div>
      </div>
    `).join('');
  }

  else if (currentTab === 'renal') {
    const items = DATA.renal.filter(i => matchSearch(i.search + ' ' + i.drug));
    area.innerHTML = items.length === 0 ? noResults() : `
      <div class="overflow-x-auto rounded-xl" style="border:1px solid rgba(255,255,255,0.06);">
        <table class="w-full text-xs">
          <thead>
            <tr style="background:rgba(56,189,248,0.1);">
              <th class="p-3 text-left font-semibold" style="color:var(--accent);">Drug</th>
              <th class="p-3 text-left font-semibold" style="color:var(--accent);">Normal</th>
              <th class="p-3 text-left font-semibold" style="color:var(--accent);">Mild ↓</th>
              <th class="p-3 text-left font-semibold" style="color:var(--accent);">Moderate ↓</th>
              <th class="p-3 text-left font-semibold" style="color:var(--accent);">Severe / Anuric</th>
              <th class="p-3 text-left font-semibold" style="color:var(--accent2);">HD / CRRT</th>
            </tr>
          </thead>
          <tbody>
            ${items.map((r, idx) => `
              <tr class="slide-up" style="animation-delay:${idx * 40}ms; background:${idx % 2 === 0 ? 'var(--surface)' : 'rgba(255,255,255,0.02)'};">
                <td class="p-3 font-semibold" style="color:var(--accent);">${r.drug}</td>
                <td class="p-3 opacity-90">${r.normal}</td>
                <td class="p-3 opacity-80">${r.mild}</td>
                <td class="p-3 opacity-80">${r.moderate}</td>
                <td class="p-3 opacity-80">${r.severe}</td>
                <td class="p-3 opacity-80" style="color:var(--accent2);">${r.hd}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
      <p class="text-xs mt-3 opacity-40 text-center">CrCl in mL/min. Always verify with pharmacy. HD = Hemodialysis, CRRT = Continuous Renal Replacement Therapy.</p>
    `;
  }

  else if (currentTab === 'deesc') {
    const items = DATA.deescalation.filter(i => matchSearch(i.search + ' ' + i.title));
    area.innerHTML = items.length === 0 ? noResults() : items.map((d, idx) => `
      <div class="mb-4 slide-up p-4 rounded-xl" style="animation-delay:${idx * 60}ms; background:var(--surface); border:1px solid rgba(255,255,255,0.06);">
        <div class="flex items-center gap-2 mb-3">
          <i data-lucide="arrow-down-circle" style="width:16px;height:16px;color:var(--accent);"></i>
          <h3 class="font-bold text-sm md:text-base" style="color:var(--accent);">${d.title}</h3>
        </div>
        <ul class="space-y-2">
          ${d.items.map(item => `
            <li class="flex items-start gap-2 text-xs">
              <i data-lucide="check-circle" style="width:14px;height:14px;color:#22c55e;flex-shrink:0;margin-top:1px;"></i>
              <span class="opacity-85">${item}</span>
            </li>
          `).join('')}
        </ul>
      </div>
    `).join('');
  }

  lucide.createIcons();
}

function noResults() {
  return `<div class="text-center py-12 fade-in"><i data-lucide="search-x" style="width:40px;height:40px;margin:0 auto 12px;opacity:0.3;display:block;"></i><p class="opacity-40 text-sm">No results found. Try a different search term.</p></div>`;
}

// ===== ELEMENT SDK =====
const defaultConfig = {
  background_color: "#0f1729",
  surface_color: "#1a2540",
  text_color: "#e2e8f0",
  accent_color: "#38bdf8",
  accent2_color: "#f472b6",
  font_family: "DM Sans",
  font_size: 14,
  app_title: "Critical Care Antibiotics Guide",
  subtitle_text: "Evidence-Based Dosing & Management"
};

function applyConfig(config) {
  document.documentElement.style.setProperty('--bg', config.background_color || defaultConfig.background_color);
  document.documentElement.style.setProperty('--surface', config.surface_color || defaultConfig.surface_color);
  document.documentElement.style.setProperty('--text', config.text_color || defaultConfig.text_color);
  document.documentElement.style.setProperty('--accent', config.accent_color || defaultConfig.accent_color);
  document.documentElement.style.setProperty('--accent2', config.accent2_color || defaultConfig.accent2_color);

  document.body.style.color = config.text_color || defaultConfig.text_color;
  document.body.style.background = config.background_color || defaultConfig.background_color;

  const font = config.font_family || defaultConfig.font_family;
  const size = config.font_size || defaultConfig.font_size;
  document.body.style.fontFamily = `${font}, DM Sans, sans-serif`;
  document.body.style.fontSize = `${size}px`;

  const title = document.getElementById('main-title');
  const sub = document.getElementById('subtitle');
  if (title) {
    title.textContent = config.app_title || defaultConfig.app_title;
    title.style.color = config.accent_color || defaultConfig.accent_color;
    title.style.fontFamily = `Playfair Display, ${font}, serif`;
    title.style.fontSize = `${size * 2}px`;
  }
  if (sub) {
    sub.textContent = config.subtitle_text || defaultConfig.subtitle_text;
    sub.style.fontSize = `${size * 0.85}px`;
  }
}

// Initial render
applyConfig(defaultConfig);
renderContent();
lucide.createIcons();
</script>
</body>
</html>
