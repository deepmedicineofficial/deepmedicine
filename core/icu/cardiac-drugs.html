const CATEGORIES = [...new Set(DRUGS.map(d=>d.category))];
let activeCategory = "All";
let searchTerm = "";
let allData = DRUGS;

function getIcon(name){
  const m={heart:'❤️',shield:'🛡️',activity:'⚡',droplet:'💧',droplets:'💦',circle:'🔴',zap:'⚡',star:'⭐',"trending-down":'📉',target:'🎯'};
  return m[name]||'💊';
}

function renderCategories(){
  const nav=document.getElementById('categoryNav');
  nav.innerHTML='';
  const allBtn=document.createElement('button');
  allBtn.className=`category-btn whitespace-nowrap px-3 py-2 rounded-lg text-xs font-semibold transition-all ${activeCategory==='All'?'active text-[#1a1a2e] bg-white shadow-sm':'text-gray-500 hover:text-gray-800'}`;
  allBtn.textContent=`All (${DRUGS.length})`;
  allBtn.style.cssText='--accent:#e94560';
  allBtn.onclick=()=>{activeCategory='All';renderCategories();renderDrugs()};
  nav.appendChild(allBtn);
  CATEGORIES.forEach(c=>{
    const count=DRUGS.filter(d=>d.category===c).length;
    const btn=document.createElement('button');
    btn.className=`category-btn whitespace-nowrap px-3 py-2 rounded-lg text-xs font-semibold transition-all ${activeCategory===c?'active text-[#1a1a2e] bg-white shadow-sm':'text-gray-500 hover:text-gray-800'}`;
    btn.textContent=`${c} (${count})`;
    btn.style.cssText='--accent:#e94560';
    btn.onclick=()=>{activeCategory=c;renderCategories();renderDrugs()};
    nav.appendChild(btn);
  });
}

function renderDrugs(){
  const container=document.getElementById('drugContainer');
  container.innerHTML='';
  let filtered=activeCategory==='All'?[...DRUGS]:DRUGS.filter(d=>d.category===activeCategory);
  if(searchTerm){
    const s=searchTerm.toLowerCase();
    filtered=filtered.filter(d=>
      d.name.toLowerCase().includes(s)||d.class.toLowerCase().includes(s)||
      d.category.toLowerCase().includes(s)||d.mechanism.toLowerCase().includes(s)||
      d.indications.some(i=>i.toLowerCase().includes(s))
    );
  }
  if(!filtered.length){
    container.innerHTML=`<div class="text-center py-16 text-gray-400"><div class="text-4xl mb-3">🔍</div><p class="font-medium">No drugs found</p><p class="text-sm mt-1">Try adjusting your search or category filter</p></div>`;
    return;
  }
  filtered.forEach((drug,idx)=>{
    const card=document.createElement('div');
    card.className='drug-card fade-in rounded-2xl shadow-sm border mb-4 overflow-hidden';
    card.style.cssText=`background:#fff;border-color:#e8e5df;animation-delay:${idx*50}ms`;
    const id=`drug-${drug.name.replace(/[^a-z0-9]/gi,'')}`;
    card.innerHTML=`
      <button class="w-full text-left px-5 py-4 flex items-start gap-3 hover:bg-gray-50/50 transition" onclick="toggleDrug('${id}')">
        <span class="text-xl mt-0.5">${getIcon(drug.catIcon)}</span>
        <div class="flex-1 min-w-0">
          <div class="flex flex-wrap items-center gap-2">
            <h2 style="font-family:'Playfair Display',serif" class="font-bold text-lg text-gray-900">${drug.name}</h2>
            <span class="pill" style="background:#eef2ff;color:#4338ca">${drug.class}</span>
          </div>
          <p class="text-xs text-gray-400 mt-0.5">${drug.category}</p>
        </div>
        <i data-lucide="chevron-down" class="text-gray-400 transition-transform duration-300" style="width:20px;height:20px" id="${id}-chevron"></i>
      </button>
      <div class="expand-content" id="${id}">
        <div class="px-5 pb-5 border-t" style="border-color:#f0ede8">
          <!-- Mechanism -->
          <div class="mt-4">
            <h3 class="text-xs font-bold uppercase tracking-wider mb-2" style="color:#e94560">Mechanism of Action</h3>
            <p class="text-sm text-gray-700 leading-relaxed">${drug.mechanism}</p>
          </div>
          <!-- Indications -->
          <div class="mt-4">
            <h3 class="text-xs font-bold uppercase tracking-wider mb-2" style="color:#0f3460">Indications</h3>
            <div class="flex flex-wrap gap-1.5">${drug.indications.map(i=>`<span class="pill" style="background:#e8f5e9;color:#2e7d32">${i}</span>`).join('')}</div>
          </div>
          <!-- Contraindications -->
          <div class="mt-4">
            <h3 class="text-xs font-bold uppercase tracking-wider mb-2 text-red-600">Contraindications</h3>
            <div class="flex flex-wrap gap-1.5">${drug.contraindications.map(c=>`<span class="pill" style="background:#ffebee;color:#c62828">${c}</span>`).join('')}</div>
          </div>
          <!-- Dosages -->
          <div class="mt-4">
            <h3 class="text-xs font-bold uppercase tracking-wider mb-2" style="color:#6a1b9a">Dosage Protocols</h3>
            <div class="rounded-xl overflow-hidden border" style="border-color:#e8e5df">
              <div class="hidden md:grid grid-cols-4 gap-0 text-xs font-bold uppercase tracking-wider p-3" style="background:#f5f3ef;color:#666">
                <span>Route</span><span>Dose</span><span>Frequency</span><span>Notes</span>
              </div>
              ${drug.dosages.map(d=>`
                <div class="dosage-row p-3 border-t text-sm" style="border-color:#f0ede8">
                  <div class="md:grid md:grid-cols-4 md:gap-4 space-y-1 md:space-y-0">
                    <div><span class="md:hidden text-xs font-bold text-gray-400 block">ROUTE</span><span class="font-semibold text-gray-900">${d.route}</span></div>
                    <div><span class="md:hidden text-xs font-bold text-gray-400 block">DOSE</span><span style="color:#4338ca" class="font-mono font-bold">${d.dose}</span></div>
                    <div><span class="md:hidden text-xs font-bold text-gray-400 block">FREQUENCY</span><span class="text-gray-700">${d.freq}</span></div>
                    <div><span class="md:hidden text-xs font-bold text-gray-400 block">NOTES</span><span class="text-gray-500 text-xs leading-relaxed">${d.notes}</span></div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
          <!-- Monitoring -->
          <div class="mt-4">
            <h3 class="text-xs font-bold uppercase tracking-wider mb-2" style="color:#e65100">Monitoring Parameters</h3>
            <ul class="space-y-1">${drug.monitoring.map(m=>`<li class="text-sm text-gray-700 flex items-start gap-2"><span style="color:#e65100" class="mt-1">•</span>${m}</li>`).join('')}</ul>
          </div>
          <!-- Clinical Pearls -->
          <div class="mt-4 rounded-xl p-4" style="background:linear-gradient(135deg,#fff8e1,#fff3e0);border:1px solid #ffe0b2">
            <h3 class="text-xs font-bold uppercase tracking-wider mb-2" style="color:#e65100">💡 Clinical Pearls</h3>
            <p class="text-sm text-gray-800 leading-relaxed">${drug.pearls}</p>
          </div>
        </div>
      </div>
    `;
    container.appendChild(card);
  });
  lucide.createIcons();
}

window.toggleDrug=function(id){
  const el=document.getElementById(id);
  const chev=document.getElementById(id+'-chevron');
  el.classList.toggle('open');
  if(chev)chev.style.transform=el.classList.contains('open')?'rotate(180deg)':'';
};

document.getElementById('searchInput').addEventListener('input',e=>{
  searchTerm=e.target.value;
  renderDrugs();
});

renderCategories();
renderDrugs();
</script>
</body>
</html>
