function calculate() {
  const wt = parseFloat(document.getElementById('calcWeight').value);
  const type = document.getElementById('calcType').value;
  const output = document.getElementById('calcOutput');
  let html = '';

  if (type === 'maintenance') {
    const first10 = Math.min(wt, 10) * 4;
    const next10 = Math.min(Math.max(wt - 10, 0), 10) * 2;
    const rest = Math.max(wt - 20, 0) * 1;
    const total = first10 + next10 + rest;
    html = `
      <div class="space-y-3">
        <div class="rounded-lg p-3" style="background:rgba(96,165,250,0.1); border:1px solid rgba(96,165,250,0.2);">
          <p class="text-blue-300 font-semibold text-lg">${total} mL/h</p>
          <p class="text-slate-400 text-xs">= ${(total*24/1000).toFixed(1)} L/day</p>
        </div>
        <p class="text-slate-300 text-xs"><strong>4-2-1 Rule:</strong></p>
        <ul class="text-slate-400 text-xs space-y-1">
          <li>First 10 kg: ${first10} mL/h (10 × 4)</li>
          <li>Next 10 kg: ${next10} mL/h (${Math.min(Math.max(wt-10,0),10).toFixed(0)} × 2)</li>
          <li>Remaining: ${rest} mL/h (${Math.max(wt-20,0).toFixed(0)} × 1)</li>
        </ul>
        <p class="text-slate-500 text-[10px]">Use balanced crystalloid. Adjust for fever (+10%/°C), third-spacing, and ongoing losses.</p>
      </div>`;
  } else if (type === 'sepsis') {
    const bolus = wt * 30;
    html = `
      <div class="space-y-3">
        <div class="rounded-lg p-3" style="background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.2);">
          <p class="text-red-300 font-semibold text-lg">${bolus} mL</p>
          <p class="text-slate-400 text-xs">= ${(bolus/1000).toFixed(1)} L initial bolus</p>
        </div>
        <p class="text-slate-300 text-xs"><strong>30 mL/kg in first 1 hour</strong> (SSC 2021)</p>
        <ul class="text-slate-400 text-xs space-y-1">
          <li>Give as 500 mL aliquots of Ringer Lactate</li>
          <li>Reassess after EACH aliquot (vitals, UOP, echo)</li>
          <li>If MAP <65 after ${(bolus/1000).toFixed(1)}L → start norepinephrine</li>
          <li>Do NOT wait to complete all fluid before pressors</li>
        </ul>
      </div>`;
  } else if (type === 'burns') {
    const tbsa = parseFloat(document.getElementById('tbsa').value);
    const parkland = 4 * wt * tbsa;
    const first8 = parkland / 2;
    const next16 = parkland / 2;
    html = `
      <div class="space-y-3">
        <div class="rounded-lg p-3" style="background:rgba(249,115,22,0.1); border:1px solid rgba(249,115,22,0.2);">
          <p class="text-orange-300 font-semibold text-lg">${(parkland/1000).toFixed(1)} L total in 24h</p>
          <p class="text-slate-400 text-xs">Parkland: 4 × ${wt}kg × ${tbsa}% = ${parkland} mL</p>
        </div>
        <ul class="text-slate-400 text-xs space-y-1">
          <li><strong>First 8h:</strong> ${(first8/1000).toFixed(1)} L (${Math.round(first8/8)} mL/h) — from TIME OF BURN</li>
          <li><strong>Next 16h:</strong> ${(next16/1000).toFixed(1)} L (${Math.round(next16/16)} mL/h)</li>
          <li><strong>Fluid:</strong> Ringer Lactate ONLY for first 24h</li>
          <li><strong>Target UOP:</strong> 0.5–1 mL/kg/h (${(wt*0.5).toFixed(0)}–${wt} mL/h)</li>
        </ul>
        <p class="text-amber-400 text-[10px]">⚠️ Formula is a STARTING point. Titrate to UOP. If >6 mL/kg/%TBSA → fluid creep risk.</p>
      </div>`;
  } else if (type === 'freewater') {
    const currentNa = parseFloat(document.getElementById('currentNa').value);
    const targetNa = parseFloat(document.getElementById('targetNa').value);
    const sex = document.getElementById('sex').value;
    const tbwFactor = sex === 'male' ? 0.6 : 0.5;
    const tbw = wt * tbwFactor;
    const deficit = tbw * ((currentNa / targetNa) - 1);
    html = `
      <div class="space-y-3">
        <div class="rounded-lg p-3" style="background:rgba(6,182,212,0.1); border:1px solid rgba(6,182,212,0.2);">
          <p class="text-cyan-300 font-semibold text-lg">${deficit.toFixed(1)} L free water deficit</p>
          <p class="text-slate-400 text-xs">TBW: ${wt} × ${tbwFactor} = ${tbw} L</p>
        </div>
        <p class="text-slate-300 text-xs"><strong>Formula:</strong> TBW × [(Current Na / Target Na) − 1]</p>
        <ul class="text-slate-400 text-xs space-y-1">
          <li>Replace with D5W or oral free water</li>
          <li>Correct Na+ by max 10–12 mEq/24h</li>
          <li>Replace 50% of deficit in first 24h</li>
          <li>Remaining 50% over next 24–48h</li>
          <li>Monitor Na+ every 4–6 hours</li>
        </ul>
        <p class="text-red-400 text-[10px]">⚠️ Overly rapid correction → cerebral edema. Underly rapid → persistent hypernatremia.</p>
      </div>`;
  }
  output.innerHTML = html;
}

  if (s) s.textContent = config.subtitle || defaultConfig.subtitle;

  const bg = config.background_color || defaultConfig.background_color;
  const surface = config.surface_color || defaultConfig.surface_color;
  const text = config.text_color || defaultConfig.text_color;
  const primary = config.primary_action || defaultConfig.primary_action;
  const secondary = config.secondary_action || defaultConfig.secondary_action;
  const font = config.font_family || defaultConfig.font_family;

}
