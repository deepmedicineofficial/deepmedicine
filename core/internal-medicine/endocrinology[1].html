            classification: 'BMI 25-29.9: Overweight. 30-34.9: Class I. 35-39.9: Class II. ≥40: Class III. Waist circumference: >102cm M / >88cm F (metabolic risk). Consider ethnicity-specific cut-offs.',
            metabolic_syndrome: 'IDF criteria: Central obesity (waist ≥94cm M/≥80cm F [Europid]) + ≥2 of: TG ≥150, HDL <40 M/<50 F, BP ≥130/85, FPG ≥100 mg/dL or known T2DM',
            complications_list: 'T2DM, NAFLD/NASH, CVD (MI, stroke), OSA, GERD, OA (weight-bearing joints), cancer (breast, colon, endometrial, kidney, esophageal), infertility/PCOS, depression, venous thromboembolism'
          },
          investigations: {
            assessment: 'BMI, waist circumference, BP, Fasting glucose/HbA1c, Lipid profile, LFTs (NAFLD screening), TSH (exclude hypothyroidism), cortisol if Cushingoid, sleep study if symptomatic',
            staging: 'Edmonton Obesity Staging System (0-4) — assesses medical, mental, functional impact. Guides treatment intensity.',
            screening: 'Annual metabolic screening. Fatty liver index/FIB-4 for NAFLD. STOP-Bang for OSA. PHQ-9 for depression.'
          },
          diagnosis: 'BMI ≥30 (or ≥27.5 for Asian populations). Metabolic syndrome by IDF/ATP-III criteria. Identify complications and secondary causes.',
          treatment: {
            lifestyle: 'Foundation: 500-750 kcal/day deficit (aim 5-10% weight loss). Behavioral therapy (CBT). Exercise 150-300 min/week. Mediterranean/DASH diet. Sleep optimization. Multi-disciplinary team.',
            pharmacotherapy: 'Indicated if BMI ≥30 (or ≥27 with comorbidity) + failed lifestyle alone. GLP-1 RAs: Semaglutide 2.4mg weekly (STEP trials — 15-17% weight loss), Liraglutide 3.0mg daily (8%). Tirzepatide (GIP/GLP-1 dual — 20-22% weight loss, SURMOUNT). Orlistat (modest, GI side effects). Naltrexone/bupropion (5-8%). Phentermine (short-term).',
            surgery: 'Bariatric/metabolic surgery: BMI ≥40 or ≥35 with comorbidities (some guidelines now ≥30 with poorly controlled T2DM). Roux-en-Y gastric bypass (25-35% total weight loss), Sleeve gastrectomy (most common, 20-30%), Adjustable gastric band (less effective). T2DM remission 40-80%. Reduces mortality 30-40%.',
            metabolic_syndrome: 'Treat individual components: Statins (dyslipidemia), ACEi/ARB (hypertension), Metformin (pre-diabetes/DM). Address root cause (obesity/insulin resistance).'
          },
          complications: 'All-cause mortality increases with BMI >30. Greatest impact: T2DM (7-12x risk), cardiovascular disease, certain cancers. Obesity paradox in established HF/CKD.',
          prognosis: '5-10% weight loss significantly improves all metabolic parameters. Long-term weight maintenance challenging (metabolic adaptation, hormonal changes). Bariatric surgery provides most durable results. GLP-1 RAs represent paradigm shift. Obesity increasingly recognized as chronic disease requiring long-term treatment.'
        }
      ]
    };

    // ===== APP STATE =====
    let currentCategory = 'thyroid';
    let currentDisease = null;
    let allDiseases = endoData.diseases;

    // ===== DEFAULT CONFIG =====
    const defaultConfig = {
      main_title: 'Endocrinology Clinical Reference',
      subtitle: 'Comprehensive Disease Guide — MBBS/MD Level',
      background_color: '#0f1729',
      surface_color: '#1a2744',
      text_color: '#d1dce8',
      primary_color: '#e8c87a',
      secondary_color: '#8a9bc0',
      font_family: 'Source Sans 3',
      font_size: 15
    };

    // ===== RENDER FUNCTIONS =====
    function renderCategoryTabs() {
      const container = document.getElementById('category-tabs');
      container.innerHTML = endoData.categories.map(cat => `
        <button onclick="selectCategory('${cat.id}')" class="px-3 py-2 rounded-t transition-all ${currentCategory === cat.id ? 'tab-active' : 'opacity-60 hover:opacity-100'}" style="color: ${currentCategory === cat.id ? '#e8c87a' : '#8a9bc0'}; border-color: #e8c87a;">
          ${cat.name}
        </button>
      `).join('');
    }

    function renderSidebar() {
      const nav = document.getElementById('sidebar-nav');
      const diseases = allDiseases.filter(d => d.category === currentCategory);
      nav.innerHTML = diseases.map(d => `
        <a href="#" onclick="event.preventDefault(); selectDisease('${d.id}')" class="sidebar-link block py-2 px-2 rounded text-sm ${currentDisease && currentDisease.id === d.id ? 'active' : ''}" style="color: ${currentDisease && currentDisease.id === d.id ? '#e8c87a' : '#8a9bc0'}; background: ${currentDisease && currentDisease.id === d.id ? '#0f172966' : 'transparent'};">
          ${d.name}
        </a>
      `).join('');
    }

    function renderContent() {
      const area = document.getElementById('content-area');
      if (!currentDisease) {
        const diseases = allDiseases.filter(d => d.category === currentCategory);
        area.innerHTML = `
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 fade-in">
            ${diseases.map(d => `
              <div onclick="selectDisease('${d.id}')" class="disease-card p-5 rounded-lg cursor-pointer" style="background: #1a2744; border: 1px solid #2a3a5c;">
                <h3 class="font-heading text-lg mb-2 section-title" style="color: #e8c87a;">${d.name}</h3>
                <p class="text-sm muted-text line-clamp-3" style="color: #8a9bc0;">${d.definition}</p>
              </div>
            `).join('')}
          </div>
        `;
        return;
      }

      const d = currentDisease;
      area.innerHTML = `
        <div class="fade-in space-y-4">
          <button onclick="currentDisease=null; render();" class="flex items-center gap-2 text-sm mb-2 hover:underline" style="color: #8a9bc0;">
            <i data-lucide="arrow-left" style="width:16px;height:16px;"></i> Back to list
          </button>
          <div class="rounded-lg p-5 md:p-7" style="background: #1a2744; border: 1px solid #2a3a5c;">
            <h2 class="font-heading text-xl md:text-2xl mb-1 section-title" style="color: #e8c87a;">${d.name}</h2>
            <p class="body-text mb-4" style="color: #d1dce8;">${d.definition}</p>

            ${renderSection('Epidemiology', d.epidemiology)}
            ${renderEtiology(d.etiology)}
            ${renderSection('Pathophysiology', d.pathophysiology)}
            ${renderClinicalFeatures(d.clinical_features)}
            ${renderInvestigations(d.investigations)}
            ${renderSection('Diagnosis', d.diagnosis)}
            ${renderTreatment(d.treatment)}
            ${renderSection('Complications', d.complications)}
            ${renderSection('Prognosis', d.prognosis)}
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    function renderSection(title, content) {
      if (!content) return '';
      return `
        <details open class="content-section mb-3">
          <summary class="flex items-center gap-2 font-semibold text-sm uppercase tracking-wide mb-2 select-none" style="color: #e8c87a;">
            <i data-lucide="chevron-down" style="width:14px;height:14px;"></i> ${title}
          </summary>
          <p class="body-text text-sm leading-relaxed pl-5" style="color: #d1dce8;">${content}</p>
        </details>
      `;
    }

    function renderEtiology(etiology) {
      if (!etiology || !etiology.length) return '';
      return `
        <details open class="content-section mb-3">
          <summary class="flex items-center gap-2 font-semibold text-sm uppercase tracking-wide mb-2 select-none" style="color: #e8c87a;">
            <i data-lucide="chevron-down" style="width:14px;height:14px;"></i> Etiology
          </summary>
          <div class="pl-5 space-y-2">
            ${etiology.map(e => `
              <div class="rounded p-3" style="background: #0f172966;">
                <span class="font-semibold text-sm" style="color: #e8c87a;">${e.type}:</span>
                <span class="text-sm body-text" style="color: #d1dce8;"> ${e.causes}</span>
              </div>
            `).join('')}
          </div>
        </details>
      `;
    }

    function renderClinicalFeatures(features) {
      if (!features) return '';
      return `
        <details open class="content-section mb-3">
          <summary class="flex items-center gap-2 font-semibold text-sm uppercase tracking-wide mb-2 select-none" style="color: #e8c87a;">
            <i data-lucide="chevron-down" style="width:14px;height:14px;"></i> Clinical Features
          </summary>
          <div class="pl-5 space-y-2">
            ${Object.entries(features).map(([key, val]) => `
              <div class="rounded p-3" style="background: #0f172966;">
                <span class="font-semibold text-sm capitalize" style="color: #e8c87a;">${key.replace(/_/g, ' ')}:</span>
                <span class="text-sm body-text" style="color: #d1dce8;"> ${val}</span>
              </div>
            `).join('')}
          </div>
        </details>
      `;
    }

    function renderInvestigations(inv) {
      if (!inv) return '';
      return `
        <details open class="content-section mb-3">
          <summary class="flex items-center gap-2 font-semibold text-sm uppercase tracking-wide mb-2 select-none" style="color: #e8c87a;">
            <i data-lucide="chevron-down" style="width:14px;height:14px;"></i> Investigations
          </summary>
          <div class="pl-5 space-y-2">
            ${Object.entries(inv).map(([key, val]) => `
              <div class="rounded p-3" style="background: #0f172966;">
                <span class="font-semibold text-sm capitalize" style="color: #e8c87a;">${key.replace(/_/g, ' ')}:</span>
                <span class="text-sm body-text" style="color: #d1dce8;"> ${val}</span>
              </div>
            `).join('')}
          </div>
        </details>
      `;
    }

    function renderTreatment(tx) {
      if (!tx) return '';
      return `
        <details open class="content-section mb-3">
          <summary class="flex items-center gap-2 font-semibold text-sm uppercase tracking-wide mb-2 select-none" style="color: #e8c87a;">
            <i data-lucide="chevron-down" style="width:14px;height:14px;"></i> Treatment
          </summary>
          <div class="pl-5 space-y-2">
            ${Object.entries(tx).map(([key, val]) => `
              <div class="rounded p-3" style="background: #0f172966;">
                <span class="font-semibold text-sm capitalize" style="color: #e8c87a;">${key.replace(/_/g, ' ')}:</span>
                <span class="text-sm body-text" style="color: #d1dce8;"> ${val}</span>
              </div>
            `).join('')}
          </div>
        </details>
      `;
    }

    function render() {
      renderCategoryTabs();
      renderSidebar();
      renderContent();
      lucide.createIcons();
    }

    // ===== INTERACTIONS =====
    window.selectCategory = function(catId) {
      currentCategory = catId;
      currentDisease = null;
      render();
    };

    window.selectDisease = function(diseaseId) {
      currentDisease = allDiseases.find(d => d.id === diseaseId);
      render();
      document.getElementById('content-area').scrollIntoView({ behavior: 'smooth', block: 'start' });
    };

    // Search
    document.getElementById('search-input').addEventListener('input', function(e) {
      const q = e.target.value.toLowerCase();
      const nav = document.getElementById('sidebar-nav');
      const filtered = allDiseases.filter(d => d.name.toLowerCase().includes(q) || d.definition.toLowerCase().includes(q));
      if (q.length > 0) {
        nav.innerHTML = filtered.map(d => `
          <a href="#" onclick="event.preventDefault(); selectCategory('${d.category}'); selectDisease('${d.id}')" class="sidebar-link block py-2 px-2 rounded text-sm" style="color: #8a9bc0;">
            ${d.name} <span class="text-xs opacity-50">(${d.category})</span>
          </a>
        `).join('') || '<p class="text-xs px-2" style="color:#8a9bc0;">No results</p>';
      } else {
        renderSidebar();
      }
    });

    // Mobile menu
    document.getElementById('mobile-menu-btn').addEventListener('click', function() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('hidden');
      sidebar.classList.toggle('block');
    });

    // Init
    render();
  </script>
 </body>
</html>
