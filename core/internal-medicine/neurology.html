      definition: "Acute inflammation of the meninges due to bacterial infection, constituting a neurological emergency with high mortality and morbidity if untreated.",
      epidemiology: "Incidence: 2-5/100,000/year in developed countries (much higher in developing). Leading organisms vary by age: Neonates (GBS, E. coli, Listeria), Children (N. meningitidis, S. pneumoniae), Adults (S. pneumoniae > N. meningitidis), Elderly/Immunocompromised (S. pneumoniae, Listeria, Gram-negatives).",
      etiology: [
        "Streptococcus pneumoniae: Most common in adults; associated with pneumonia, sinusitis, otitis media, CSF leak, alcoholism, asplenia",
        "Neisseria meningitidis: Adolescents/young adults; epidemic potential; serogroups B, C, W, Y; petechial rash (meningococcemia)",
        "Listeria monocytogenes: Extremes of age, pregnancy, immunosuppressed; contaminated food (soft cheese, cold cuts)",
        "Group B Streptococcus (GBS) & E. coli: Neonates",
        "Haemophilus influenzae type b: Reduced with vaccination; still seen in unvaccinated",
        "Post-neurosurgical/shunt: Staphylococci (S. aureus, coagulase-negative), Gram-negatives"
      ],
      pathophysiology: "Nasopharyngeal colonization → bacteremia → crossing BBB (receptor-mediated transcytosis, paracellular, or within phagocytes) → subarachnoid space multiplication → inflammatory cascade (TLR activation, cytokines: TNF-α, IL-1β, IL-6) → BBB disruption, cerebral edema (vasogenic + cytotoxic + interstitial), raised ICP, vasculitis, thrombosis → neuronal injury. CSF has limited immune defense (low complement, low immunoglobulin).",
      clinical: [
        "Classic triad (present in only 44%): Fever + neck stiffness + altered mental status",
        "Headache (severe, generalized): Most common symptom (87%)",
        "Signs of meningeal irritation: Kernig's sign, Brudzinski's sign (poor sensitivity ~5%, but specific)",
        "Altered consciousness: Confusion → obtundation → coma",
        "Seizures: 20-30% (more common with pneumococcal)",
        "Petechial/purpuric rash: Highly suggestive of meningococcal disease (may indicate DIC)",
        "Cranial nerve palsies: III, VI, VII, VIII (hearing loss — pneumococcal)",
        "Focal neurological deficits: Suggest complications (abscess, infarction, venous thrombosis)",
        "Neonates: Nonspecific — irritability, poor feeding, bulging fontanelle, seizures, hypothermia/fever",
        "Waterhouse-Friderichsen syndrome: Meningococcal sepsis + adrenal hemorrhage + DIC + shock"
      ],
      diagnosis: [
        "LUMBAR PUNCTURE (urgent — do NOT delay antibiotics if LP will be delayed):",
        "  Opening pressure: Elevated (>20 cmH2O)",
        "  CSF: Turbid/purulent; WCC >1000/μL (neutrophilic predominance); Protein elevated (>1 g/L); Glucose LOW (<40% of serum or <2.2 mmol/L)",
        "  Gram stain: Positive in 60-90% of untreated cases",
        "  CSF culture: Gold standard (positive in 80-90% if pre-antibiotics not given)",
        "  CSF PCR: Meningococcal, pneumococcal PCR (useful if antibiotics already given)",
        "  CSF lactate >3.5 mmol/L: Supports bacterial etiology",
        "CT before LP ONLY if: Immunocompromised, CNS disease history, new-onset seizures, papilledema, focal neurological deficits, GCS <12",
        "Blood cultures: Positive in 50-80% (ALWAYS before antibiotics)",
        "Procalcitonin/CRP: Elevated; PCT >0.5 ng/mL favors bacterial over viral",
        "Complications imaging: MRI/CT with contrast if not improving (empyema, abscess, infarction, hydrocephalus)"
      ],
      management: [
        "EMPIRICAL ANTIBIOTICS IMMEDIATELY (within 1 hour of presentation — every hour of delay increases mortality):",
        "  Adults: Ceftriaxone 2g IV q12h + Vancomycin 15-20mg/kg q8-12h (±Ampicillin 2g q4h if >50y or immunosuppressed for Listeria coverage)",
        "  Neonates: Ampicillin + Cefotaxime (or Gentamicin)",
        "  Post-neurosurgical: Vancomycin + Ceftazidime/Meropenem",
        "Dexamethasone 0.15 mg/kg q6h × 4 days: Give BEFORE or WITH first antibiotic dose (reduces mortality and hearing loss in pneumococcal meningitis — PROVEN in adults); uncertain benefit for meningococcal",
        "Duration: S. pneumoniae 10-14 days; N. meningitidis 7 days; Listeria 21 days; GBS 14-21 days",
        "Supportive: ICU if severe; ICP management; seizure management; fluid resuscitation (avoid hyponatremia); monitor for SIADH",
        "Chemoprophylaxis (meningococcal): Close contacts — Ciprofloxacin 500mg single dose OR Rifampicin 600mg BD × 2 days OR Ceftriaxone 250mg IM single dose",
        "Vaccination: Pneumococcal (PCV13/PPSV23), Meningococcal (ACWY + B), Hib — prevention is key"
      ],
      prognosis: "Mortality: S. pneumoniae 20-30%, N. meningitidis 5-10%, Listeria 20-30%. Overall mortality with treatment: 15-25%. Neurological sequelae in 30-50% of survivors: Hearing loss (most common — 14%), cognitive impairment, seizures, focal deficits, hydrocephalus. Meningococcal sepsis mortality: 40% with DIC/shock."
    }
  ]
};

let activeCategory = Object.keys(diseases)[0];
let openAccordions = new Set();

const defaultConfig = {
  page_title: "Neurology",
  subtitle: "Comprehensive Disease Guide — Etiology, Pathophysiology, Clinical Features, Diagnosis & Management",
  primary_color: "#8b5cf6",
  surface_color: "#1e1e3a",
  text_color: "#e8e6f0",
  accent_color: "#06b6d4",
  secondary_color: "#2a2a4a",
  font_family: "Source Sans 3",
  font_size: 16
};

function renderNav() {
  const nav = document.getElementById('category-nav');
  nav.innerHTML = Object.keys(diseases).map(cat => `
    <button onclick="setCategory('${cat}')" class="category-btn px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap transition-all ${cat === activeCategory ? 'active' : ''}" style="background: ${cat === activeCategory ? window.elementSdk?.config?.primary_color || defaultConfig.primary_color : 'transparent'}; color: ${cat === activeCategory ? '#fff' : window.elementSdk?.config?.text_color || defaultConfig.text_color}; border: 1px solid ${cat === activeCategory ? 'transparent' : window.elementSdk?.config?.secondary_color || defaultConfig.secondary_color};">
      ${cat}
    </button>
  `).join('');
}

function setCategory(cat) {
  activeCategory = cat;
  openAccordions.clear();
  renderNav();
  renderDiseases();
}

function toggleAccordion(id) {
  const el = document.getElementById(`acc-${id}`);
  const icon = document.getElementById(`icon-${id}`);
  if (openAccordions.has(id)) {
    openAccordions.delete(id);
    el.classList.remove('open');
    icon.style.transform = 'rotate(0deg)';
  } else {
    openAccordions.add(id);
    el.classList.add('open');
    icon.style.transform = 'rotate(180deg)';
  }
}

function getSeverityColor(severity) {
  const colors = { 'Emergency': '#ef4444', 'Severe': '#f97316', 'Acute Emergency': '#ef4444', 'Fatal': '#dc2626', 'Chronic': '#06b6d4', 'Chronic/Episodic': '#06b6d4', 'Progressive': '#eab308', 'Variable': '#a78bfa' };
  return colors[severity] || '#6b7280';
}

function renderDiseases() {
  const config = window.elementSdk?.config || defaultConfig;
  const container = document.getElementById('disease-content');
  const categoryDiseases = diseases[activeCategory] || [];

  container.innerHTML = categoryDiseases.map((d, i) => `
    <div class="disease-card mb-6 rounded-2xl overflow-hidden fade-in" style="background: ${config.surface_color || defaultConfig.surface_color}; border: 1px solid ${config.secondary_color || defaultConfig.secondary_color}; animation-delay: ${i * 0.1}s;">
      <div class="p-5 md:p-7">
        <div class="flex flex-wrap items-center gap-3 mb-4">
          <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background: ${config.primary_color || defaultConfig.primary_color}20;">
            <i data-lucide="${d.icon}" style="width:20px;height:20px;color:${config.primary_color || defaultConfig.primary_color};"></i>
          </div>
          <h2 class="font-heading text-xl md:text-2xl font-700" style="color: ${config.text_color || defaultConfig.text_color};">${d.name}</h2>
          <span class="px-3 py-1 rounded-full text-xs font-bold uppercase" style="background: ${getSeverityColor(d.severity)}20; color: ${getSeverityColor(d.severity)}; border: 1px solid ${getSeverityColor(d.severity)}40;">${d.severity}</span>
        </div>
        <p class="font-body text-sm md:text-base leading-relaxed mb-5" style="color: ${config.text_color || defaultConfig.text_color}aa;">${d.definition}</p>

        ${renderSection(d, i, 'epidemiology', 'Epidemiology', config)}
        ${renderSection(d, i, 'etiology', 'Etiology & Risk Factors', config)}
        ${renderSection(d, i, 'pathophysiology', 'Pathophysiology', config)}
        ${renderSection(d, i, 'clinical', 'Clinical Features', config)}
        ${renderSection(d, i, 'diagnosis', 'Diagnosis & Investigations', config)}
        ${renderSection(d, i, 'management', 'Management', config)}
        ${d.prognosis ? renderSection(d, i, 'prognosis', 'Prognosis', config) : ''}
      </div>
    </div>
  `).join('');

  lucide.createIcons();
}

function renderSection(d, diseaseIdx, key, title, config) {
  const id = `${diseaseIdx}-${key}`;
  const content = d[key];
  if (!content) return '';
  const isOpen = openAccordions.has(id);

  let body;
  if (Array.isArray(content)) {
    body = `<ul class="space-y-2 font-body text-sm md:text-base">${content.map(item => `<li class="flex gap-2 leading-relaxed" style="color: ${config.text_color || defaultConfig.text_color}cc;"><span style="color: ${config.accent_color || defaultConfig.accent_color}; flex-shrink:0;">•</span><span>${item}</span></li>`).join('')}</ul>`;
  } else {
    body = `<p class="font-body text-sm md:text-base leading-relaxed" style="color: ${config.text_color || defaultConfig.text_color}cc;">${content}</p>`;
  }

  return `
    <div class="mb-2 rounded-xl overflow-hidden" style="border: 1px solid ${config.secondary_color || defaultConfig.secondary_color};">
      <button onclick="toggleAccordion('${id}')" class="w-full flex items-center justify-between px-4 py-3 text-left transition-colors hover:opacity-80" style="background: ${config.secondary_color || defaultConfig.secondary_color};">
        <span class="font-body font-600 text-sm md:text-base" style="color: ${config.text_color || defaultConfig.text_color};">${title}</span>
        <i data-lucide="chevron-down" id="icon-${id}" style="width:16px;height:16px;color:${config.primary_color || defaultConfig.primary_color};transition:transform 0.3s;${isOpen ? 'transform:rotate(180deg);' : ''}"></i>
      </button>
      <div id="acc-${id}" class="accordion-content ${isOpen ? 'open' : ''}">
        <div class="px-4 py-4">${body}</div>
      </div>
    </div>
  `;
}

renderNav();
renderDiseases();
</script>
</body>
</html>
