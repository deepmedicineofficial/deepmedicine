const CATEGORIES = ["All", ...new Set(DISEASES.map(d => d.cat))];
const URGENCY_COLORS = { emergency: "#ef4444", urgent: "#f59e0b", chronic: "#22c55e" };
const URGENCY_LABELS = { emergency: "Emergency", urgent: "Urgent", chronic: "Chronic" };

// ── State ──
let currentCategory = "All";
let currentSearch = "";
let currentDiseaseId = null;
let allData = [];

// ── Default Config ──
const defaultConfig = {
  background_color: "#0f1117",
  surface_color: "#1a1d2e",
  text_color: "#e2e4ed",
  primary_color: "#e05555",
  secondary_color: "#6c7293",
  font_family: "DM Sans",
  font_size: 15,
  app_title: "Cardiology Disease Reference",
  subtitle_text: "Evidence-Based Clinical Guide"
};

function applyColors(config) {
  const r = document.documentElement;
  r.style.setProperty('--clr-bg', config.background_color || defaultConfig.background_color);
  r.style.setProperty('--clr-surface', config.surface_color || defaultConfig.surface_color);
  r.style.setProperty('--clr-text', config.text_color || defaultConfig.text_color);
  r.style.setProperty('--clr-primary', config.primary_color || defaultConfig.primary_color);
  r.style.setProperty('--clr-secondary', config.secondary_color || defaultConfig.secondary_color);
  document.body.style.background = config.background_color || defaultConfig.background_color;
  document.body.style.color = config.text_color || defaultConfig.text_color;
}

function applyFonts(config) {
  const ff = config.font_family || defaultConfig.font_family;
  const fs = config.font_size || defaultConfig.font_size;
  document.body.style.fontFamily = `${ff}, DM Sans, sans-serif`;
  document.body.style.fontSize = `${fs}px`;
  document.querySelectorAll('.font-heading').forEach(el => {
    el.style.fontFamily = `${ff}, Literata, serif`;
  });
}

function applyText(config) {
  document.getElementById('app-title').textContent = config.app_title || defaultConfig.app_title;
  document.getElementById('app-subtitle').textContent = config.subtitle_text || defaultConfig.subtitle_text;
}

// ── Rendering ──
function renderTabs() {
  const container = document.getElementById('category-tabs');
  container.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const btn = document.createElement('button');
    btn.textContent = cat;
    btn.className = `px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap transition-colors ${currentCategory === cat ? 'tab-active' : 'tab-inactive'}`;
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-selected', currentCategory === cat);
    btn.onclick = () => { currentCategory = cat; currentDiseaseId = null; renderTabs(); renderContent(); };
    container.appendChild(btn);
  });
}

function getFiltered() {
  let list = DISEASES;
  if (currentCategory !== "All") list = list.filter(d => d.cat === currentCategory);
  if (currentSearch.trim()) {
    const q = currentSearch.toLowerCase();
    list = list.filter(d => d.name.toLowerCase().includes(q) || d.aka.toLowerCase().includes(q) || d.cat.toLowerCase().includes(q));
  }
  return list;
}

function renderContent() {
  const grid = document.getElementById('disease-grid');
  const detail = document.getElementById('disease-detail');
  if (currentDiseaseId) {
    grid.classList.add('hidden');
    detail.classList.remove('hidden');
    renderDetail(DISEASES.find(d => d.id === currentDiseaseId));
  } else {
    grid.classList.remove('hidden');
    detail.classList.add('hidden');
    renderGrid(getFiltered());
  }
}

function renderGrid(diseases) {
  const grid = document.getElementById('disease-grid');
  grid.innerHTML = '';
  if (!diseases.length) {
    grid.innerHTML = `<div class="col-span-full text-center py-16 opacity-50"><i data-lucide="search-x" class="mx-auto mb-3 w-10 h-10"></i><p>No diseases found</p></div>`;
    lucide.createIcons();
    return;
  }
  diseases.forEach((d, i) => {
    const card = document.createElement('div');
    card.className = 'disease-card rounded-xl p-5 fade-in';
    card.style.background = 'var(--clr-surface)';
    card.style.animationDelay = `${i * 50}ms`;
    card.style.animationFillMode = 'both';
    card.innerHTML = `
      <div class="flex items-start justify-between mb-3">
        <div class="w-10 h-10 rounded-lg flex items-center justify-center" style="background:${URGENCY_COLORS[d.urgency]}22;">
          <i data-lucide="${d.icon}" style="color:${URGENCY_COLORS[d.urgency]}; width:20px; height:20px;"></i>
        </div>
        <span class="text-xs font-semibold px-2.5 py-1 rounded-full" style="background:${URGENCY_COLORS[d.urgency]}22; color:${URGENCY_COLORS[d.urgency]}">${URGENCY_LABELS[d.urgency]}</span>
      </div>
      <h3 class="font-heading font-semibold text-base mb-1">${d.name}</h3>
      <p class="text-xs opacity-50 mb-3">${d.aka}</p>
      <p class="text-xs opacity-70 leading-relaxed line-clamp-2" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${d.clinical_features.substring(0, 120)}...</p>
      <div class="flex items-center gap-2 mt-4 pt-3" style="border-top:1px solid rgba(255,255,255,0.06)">
        <span class="text-xs px-2 py-0.5 rounded" style="background:var(--clr-bg)">${d.cat}</span>
        <span class="text-xs opacity-40 ml-auto">Tap to view →</span>
      </div>`;
    card.onclick = () => { currentDiseaseId = d.id; renderContent(); window.scrollTo(0, 0); };
    grid.appendChild(card);
  });
  lucide.createIcons();
}

function renderDetail(d) {
  const detail = document.getElementById('disease-detail');
  const sections = [
    { title: "Epidemiology", icon: "bar-chart-3", content: `<p>${d.epidemiology}</p>` },
    { title: "Pathophysiology", icon: "git-branch", content: `<p>${d.pathophysiology}</p>` },
    { title: "Risk Factors", icon: "alert-triangle", content: `<ul class="list-disc list-inside space-y-1">${d.risk_factors.map(r => `<li>${r}</li>`).join('')}</ul>` },
    { title: "Clinical Features", icon: "stethoscope", content: `<p>${d.clinical_features}</p>` },
    { title: "Diagnosis", icon: "clipboard-list", content: `<ul class="space-y-1.5">${d.diagnosis.map(x => `<li class="flex items-start gap-2"><span class="mt-1.5 w-1.5 h-1.5 rounded-full flex-shrink-0 pulse-dot" style="background:var(--clr-primary)"></span><span>${x}</span></li>`).join('')}</ul>` },
    { title: "Treatment", icon: "pill", content: `<p>${d.treatment}</p>` },
    { title: "Complications", icon: "alert-circle", content: `<ul class="list-disc list-inside space-y-1">${d.complications.map(c => `<li>${c}</li>`).join('')}</ul>` },
    { title: "Prognosis", icon: "trending-up", content: `<p>${d.prognosis}</p>` }
  ];

  detail.innerHTML = `
    <div class="fade-in">
      <button id="back-btn" class="flex items-center gap-2 mb-5 px-3 py-1.5 rounded-lg text-sm font-medium transition-colors hover:opacity-80" style="background:var(--clr-surface)">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> All Diseases
      </button>
      <div class="rounded-xl p-5 sm:p-7 mb-5" style="background:var(--clr-surface)">
        <div class="flex items-center gap-3 mb-1 flex-wrap">
          <div class="w-11 h-11 rounded-xl flex items-center justify-center" style="background:${URGENCY_COLORS[d.urgency]}22;">
            <i data-lucide="${d.icon}" style="color:${URGENCY_COLORS[d.urgency]}; width:22px; height:22px;"></i>
          </div>
          <div>
            <h2 class="font-heading text-xl sm:text-2xl font-bold">${d.name}</h2>
            <p class="text-xs opacity-50">${d.aka}</p>
          </div>
          <span class="text-xs font-semibold px-3 py-1 rounded-full ml-auto" style="background:${URGENCY_COLORS[d.urgency]}22; color:${URGENCY_COLORS[d.urgency]}">${URGENCY_LABELS[d.urgency]}</span>
        </div>
      </div>
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        ${sections.map(s => `
          <div class="rounded-xl p-5" style="background:var(--clr-surface)">
            <div class="flex items-center gap-2 mb-3">
              <i data-lucide="${s.icon}" class="w-4 h-4" style="color:var(--clr-primary)"></i>
              <h3 class="font-heading font-semibold text-sm" style="color:var(--clr-primary)">${s.title}</h3>
            </div>
            <div class="text-sm leading-relaxed opacity-85">${s.content}</div>
          </div>
        `).join('')}
      </div>
    </div>`;

  document.getElementById('back-btn').onclick = () => { currentDiseaseId = null; renderContent(); };
  lucide.createIcons();
}

// ── Search ──
document.getElementById('search-input').addEventListener('input', (e) => {
  currentSearch = e.target.value;
  currentDiseaseId = null;
  renderContent();
});

// ── Init ──
applyColors(defaultConfig);
applyFonts(defaultConfig);
renderTabs();
renderContent();
lucide.createIcons();
</script>
</body>
</html>
