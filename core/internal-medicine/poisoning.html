  <script>
const POISONS = [
  {
    id:"op",name:"Organophosphorus (OP) Poisoning",category:"pesticide",severity:"critical",
    icon:"☠️",
    mechanism:"Irreversible inhibition of acetylcholinesterase (AChE) → accumulation of ACh at muscarinic, nicotinic & CNS receptors. Aging of enzyme-OP complex occurs within 24–48h making it permanent.",
    toxicKinetics:"Absorption: dermal, inhalational, GI. Onset: 30min–2h (oral), minutes (inhalational). Lipophilic → large Vd. Hepatic metabolism (some require activation, e.g. parathion→paraoxon).",
    clinicalFeatures:{
      muscarinic:"<b>DUMBBBELS</b> — Diarrhea, Urination, Miosis, Bradycardia/Bronchospasm/Bronchorrhea, Emesis, Lacrimation, Salivation. <b>Killer B's</b>: Bronchospasm + Bronchorrhea → primary cause of death.",
      nicotinic:"Fasciculations, muscle weakness, tachycardia, hypertension, mydriasis (can mask miosis), respiratory muscle paralysis.",
      cns:"Anxiety, restlessness, seizures, coma, respiratory center depression.",
      complications:"Intermediate Syndrome (IMS): 24–96h post-exposure, proximal muscle weakness + neck flexor weakness + respiratory failure. OPIDN (Organophosphate-Induced Delayed Neuropathy): 2–4 weeks, distal sensorimotor neuropathy."
    },
    investigations:"Serum Cholinesterase (Pseudo/Butyryl-ChE): rapid, correlates with severity. RBC AChE (True ChE): more specific, slower to recover. ABG, ECG (QTc prolongation), Chest X-ray, Serum Lactate.",
    management:[
      {title:"Resuscitation (ABCDE)",detail:"Secure airway early — copious secretions. Suction aggressively. Intubate if GCS < 8, respiratory failure, or refractory bronchorrhea. Avoid succinylcholine (prolonged paralysis due to low ChE). Use rocuronium/vecuronium."},
      {title:"Decontamination",detail:"Remove all clothes, wash skin with soap & water (staff must wear PPE — double gloves, gown). Gastric lavage within 1h if oral ingestion (protected airway). Activated charcoal 1g/kg if within 1h & airway protected."},
      {title:"Atropine (CORNERSTONE)",detail:"<b>Test dose</b>: 1–3mg IV bolus (adult). <b>Target</b>: Dry secretions, HR > 80, clear chest. <b>Double the dose every 5 min</b> until atropinization. May need 10–100+ mg in severe cases. Then infusion: 10–20% of loading dose/hour. <b>DO NOT target pupil size or tachycardia as endpoints.</b> Monitor for atropine toxicity: hyperthermia, agitation, ileus."},
      {title:"Pralidoxime (2-PAM / Obidoxime)",detail:"<b>Adults</b>: 1–2g IV over 15–30 min, then 500mg/h infusion OR repeat bolus q6–8h. Start within 24h (before aging). Continue for 48–72h minimum. Acts as AChE reactivator — most effective at nicotinic junctions (reverses fasciculations, weakness). Controversial in some RCTs (EDDP trial) but still recommended by WHO."},
      {title:"Seizure Management",detail:"Benzodiazepines: Diazepam 5–10mg IV or Midazolam 5mg IM. Refractory: Phenobarbital. Avoid phenytoin (ineffective in OP seizures)."},
      {title:"ICU Monitoring",detail:"Continuous SpO2, ECG, ABG q6h. Monitor for IMS (Day 2–4): serial NIF (Negative Inspiratory Force), neck flexor power. Ventilatory support if needed. Watch for ARDS, aspiration pneumonia, pancreatitis. Monitor serum ChE levels serially for recovery."},
      {title:"Disposition",detail:"ICU admission for all moderate-severe cases. Observe mild cases for minimum 24h (delayed onset possible with fat-soluble OPs). Psychiatric evaluation if intentional."}
    ]
  },
  {
    id:"opc",name:"Organochlorine Poisoning (Endosulfan, Lindane)",category:"pesticide",severity:"high",
    icon:"🧪",
    mechanism:"GABA-A receptor antagonism → CNS excitation. Also inhibits Ca²⁺-Mg²⁺ ATPase. Highly lipophilic with prolonged tissue storage. Banned in many countries but still encountered.",
    toxicKinetics:"Absorption: GI, dermal, inhalational. Highly lipophilic → accumulates in adipose. Long half-life (days to months). Hepatic metabolism, biliary excretion.",
    clinicalFeatures:{
      early:"Nausea, vomiting, diarrhea, headache, dizziness, paresthesias, apprehension.",
      neurological:"Tremors, myoclonus, hyperreflexia, generalized tonic-clonic seizures (hallmark), status epilepticus.",
      severe:"Coma, respiratory failure, rhabdomyolysis → AKI, hepatotoxicity, ventricular arrhythmias.",
      complications:"Refractory status epilepticus, multi-organ dysfunction."
    },
    investigations:"No specific biomarker. Serum levels (specialized labs). CBC, RFT, LFT, CPK (rhabdomyolysis), ECG, ABG, serum electrolytes.",
    management:[
      {title:"Decontamination",detail:"Remove clothes, soap-water wash. Gastric lavage (protected airway) if < 1h. Activated charcoal 1g/kg. Cholestyramine 4g q6h may enhance elimination (interrupts enterohepatic circulation)."},
      {title:"Seizure Control (Priority)",detail:"Diazepam 10mg IV, repeat q5min. Midazolam 0.2mg/kg IM if no IV access. Refractory: Phenobarbital 15–20mg/kg IV load. Status epilepticus: Propofol or thiopentone infusion with intubation."},
      {title:"Supportive ICU Care",detail:"Aggressive IV hydration for rhabdomyolysis. Monitor CPK, urine myoglobin. Alkalinize urine if CPK > 5000. Avoid epinephrine (arrhythmia risk — sensitized myocardium). Lipid emulsion therapy (ILE) 20%: 1.5mL/kg bolus, then 0.25mL/kg/min — emerging evidence for lipophilic toxins."},
      {title:"No Specific Antidote",detail:"Management is entirely supportive. Monitor for delayed hepatotoxicity (days). Serial LFT monitoring for 1 week."}
    ]
  },
  {
    id:"apap",name:"Paracetamol (Acetaminophen) Overdose",category:"drugs",severity:"critical",
    icon:"💊",
    mechanism:"Therapeutic doses: 90% glucuronidation/sulfation, 5% CYP2E1 → NAPQI (toxic) → conjugated by glutathione (GSH). Overdose: GSH depleted → NAPQI binds hepatocyte proteins → centrilobular hepatic necrosis (Zone 3). Toxic dose: > 150mg/kg or > 7.5g in adults.",
    toxicKinetics:"Rapid GI absorption. Peak: 1–2h (IR), 4h+ (ER/co-formulations). T½: 2–4h (normal), > 4h suggests toxicity. Vd: 0.9 L/kg.",
    clinicalFeatures:{
      phase1:"0–24h: Asymptomatic or mild nausea, vomiting, malaise, diaphoresis. <b>Clinically deceptive — patient looks well!</b>",
      phase2:"24–72h: RUQ pain, hepatomegaly, rising AST/ALT (can exceed 10,000 IU/L), rising INR/PT, oliguria begins.",
      phase3:"72–96h: Peak hepatotoxicity. Fulminant hepatic failure: jaundice, coagulopathy, encephalopathy, hypoglycemia, lactic acidosis, AKI (25% — direct tubular toxicity + hepatorenal). Multi-organ failure → death.",
      phase4:"4d–2wk: Recovery phase if patient survives. Complete hepatic regeneration typical (liver has remarkable regenerative capacity)."
    },
    investigations:"<b>4-hour serum paracetamol level</b> — plot on Rumack-Matthew Nomogram. AST/ALT q12h, INR/PT, serum creatinine, blood glucose, lactate, phosphate, arterial pH, ammonia. King's College Criteria for transplant referral.",
    management:[
      {title:"Gastric Decontamination",detail:"Activated charcoal 1g/kg if < 2h post-ingestion (up to 4h for co-ingestants/ER formulations). Most effective within 1h. Do NOT delay NAC for charcoal."},
      {title:"N-Acetylcysteine (NAC) — ANTIDOTE",detail:"<b>Indications</b>: Level above treatment line on nomogram, unknown time of ingestion with detectable level, staggered overdose, any clinical/lab hepatotoxicity.<br><b>IV Protocol (Prescott/21h)</b>: 150mg/kg in 200mL D5W over 1h → 50mg/kg in 500mL D5W over 4h → 100mg/kg in 1000mL D5W over 16h. <b>Modified 2-bag protocol</b>: 200mg/kg over 4h → 100mg/kg over 16h (fewer anaphylactoid reactions).<br><b>Oral (Rumack 72h)</b>: 140mg/kg loading → 70mg/kg q4h × 17 doses.<br>NAC works best < 8h but gives benefit even at 24h+. Continue beyond 21h if INR > 2, ALT rising, or clinical deterioration."},
      {title:"Anaphylactoid Reaction to NAC",detail:"Occurs in ~10–20%: flushing, urticaria, bronchospasm. STOP infusion temporarily. Give antihistamines (chlorpheniramine/diphenhydramine). Restart at slower rate. True anaphylaxis rare — do NOT withhold NAC for anaphylactoid reactions."},
      {title:"Fulminant Hepatic Failure Management",detail:"ICU admission. Correct coagulopathy ONLY if actively bleeding (FFP/Cryo). Monitor glucose q1–2h (hepatic gluconeogenesis fails). Lactulose for encephalopathy. N-acetylcysteine infusion continues. ICP monitoring if Grade III–IV encephalopathy.<br><b>King's College Criteria (transplant referral)</b>: pH < 7.3 after resuscitation OR all three: INR > 6.5 + Creatinine > 3.4 + Grade III/IV encephalopathy."},
      {title:"Disposition",detail:"Discharge if: 4h level below treatment line, asymptomatic, normal ALT/INR at 24h. Psychiatric evaluation for intentional OD before discharge."}
    ]
  },
  {
    id:"benzo",name:"Benzodiazepine Overdose",category:"drugs",severity:"moderate",
    icon:"💉",
    mechanism:"Enhances GABA-A receptor activity → ↑ chloride conductance → CNS depression. Allosteric positive modulator — requires endogenous GABA (hence ceiling effect on respiratory depression when taken alone). Danger increases dramatically with co-ingestants (opioids, alcohol, barbiturates).",
    toxicKinetics:"Oral absorption variable. Some ultra-short acting (midazolam T½ 1.5–2.5h), some very long (diazepam T½ 20–100h including active metabolite desmethyldiazepam). High protein binding. Hepatic metabolism.",
    clinicalFeatures:{
      mild:"Drowsiness, slurred speech, ataxia, nystagmus.",
      moderate:"Confusion, hypotonia, hyporeflexia, hypothermia.",
      severe:"Coma, respiratory depression (especially with co-ingestants), aspiration, paradoxical agitation (elderly/children).",
      complications:"Aspiration pneumonia. Pure BZD overdose rarely fatal alone — always suspect co-ingestion if severe."
    },
    investigations:"Urine drug screen (qualitative — false negatives with newer BZDs like clonazepam). Blood glucose (rule out hypoglycemia), ABG, co-ingestant screen, ethanol level, paracetamol level.",
    management:[
      {title:"Supportive Care (Mainstay)",detail:"Airway protection — lateral position. Intubation if GCS < 8 or loss of protective reflexes. Monitor SpO2, give supplemental O2. IV fluids, temperature management."},
      {title:"Flumazenil (USE WITH EXTREME CAUTION)",detail:"<b>0.2mg IV over 30s, then 0.1mg/min to max 1mg</b>. CONTRAINDICATED if: chronic BZD use (precipitates withdrawal seizures), co-ingestion with TCA/pro-convulsant drugs, seizure history, ECG showing wide QRS. <b>Clinical pearl</b>: In the ED/ICU, we rarely use flumazenil for unknown overdoses. Reserve for iatrogenic oversedation (procedural sedation) where history is known."},
      {title:"Decontamination",detail:"Activated charcoal if < 1h and airway protected. Gastric lavage rarely indicated."},
      {title:"Observation",detail:"Monitor for 6–8h (short-acting) to 24h+ (long-acting). Watch for delayed respiratory depression with long-acting agents."}
    ]
  },
  {
    id:"opioid",name:"Opioid Overdose",category:"drugs",severity:"critical",
    icon:"⚕️",
    mechanism:"Mu-opioid receptor agonism → CNS depression, respiratory depression (↓ medullary response to CO2/hypoxia), miosis, decreased GI motility. Fentanyl analogues: extreme potency (100× morphine), rapid onset, lipophilic.",
    toxicKinetics:"Variable by agent. Morphine: peak 1h oral, minutes IV. Fentanyl: rapid onset, short duration but patch absorption prolonged. Methadone: T½ 15–60h, QTc prolongation.",
    clinicalFeatures:{
      classic_triad:"<b>Classic Triad</b>: Miosis (pinpoint pupils) + Respiratory depression + Altered consciousness. Note: Meperidine, tramadol & hypoxia may cause mydriasis.",
      respiratory:"Progressive: ↓ RR → shallow breathing → apnea. Hypoxic brain injury if prolonged.",
      cardiovascular:"Bradycardia, hypotension. Methadone: QTc prolongation → Torsades de Pointes.",
      other:"Non-cardiogenic pulmonary edema (especially heroin/naloxone administration), hypothermia, rhabdomyolysis (prolonged immobilization), compartment syndrome."
    },
    investigations:"Urine opiate screen (misses synthetics — fentanyl, methadone). ABG, ECG (QTc for methadone), CXR if pulmonary edema suspected, CPK, co-ingestant screen.",
    management:[
      {title:"Airway & Ventilation FIRST",detail:"Bag-valve-mask ventilation is the single most important intervention. Jaw thrust, suction. Naloxone is adjunct to ventilation, NOT a substitute."},
      {title:"Naloxone (ANTIDOTE)",detail:"<b>IV/IM/IN</b>: Start 0.04–0.4mg IV (titrate to respiratory effort, NOT full consciousness — avoids withdrawal). Repeat q2–3min up to 10mg. If no response after 10mg, reconsider diagnosis.<br><b>IM/SC</b>: 0.4–2mg if no IV access. <b>Intranasal</b>: 4mg per nostril.<br><b>Critical</b>: Naloxone T½ (30–90min) is shorter than most opioids → RENARCOTIZATION risk. Must observe 4–6h post last naloxone dose. For long-acting opioids (methadone, ER formulations): naloxone infusion 2/3 of effective bolus dose per hour."},
      {title:"Pulmonary Edema",detail:"Non-cardiogenic — occurs with heroin, naloxone administration. Supportive: CPAP/BiPAP or intubation + PEEP. Diuretics generally not effective (not cardiogenic). Usually resolves 24–48h."},
      {title:"Body Packers/Stuffers",detail:"Whole bowel irrigation with PEG (GoLYTELY) 1–2L/h until clear. CT abdomen to confirm packets. Surgical consultation if obstruction or packet rupture. Continuous naloxone infusion on standby. ICU monitoring."}
    ]
  },
  {
    id:"tca",name:"Tricyclic Antidepressant (TCA) Overdose",category:"drugs",severity:"critical",
    icon:"🔴",
    mechanism:"Multiple mechanisms: (1) Na⁺ channel blockade → wide QRS, arrhythmias. (2) Anticholinergic → tachycardia, mydriasis, urinary retention, ileus. (3) α1-blockade → hypotension. (4) GABA-A antagonism → seizures. (5) Serotonin/NE reuptake inhibition. The Na⁺ channel blockade is the lethal mechanism.",
    toxicKinetics:"Rapid absorption but anticholinergic effect delays gastric emptying (extended absorption window). High Vd (10–50 L/kg), high protein binding. Hepatic metabolism. Enterohepatic recirculation.",
    clinicalFeatures:{
      early:"Anticholinergic toxidrome: tachycardia, dry mouth, mydriasis, urinary retention, decreased bowel sounds, flushed skin, hyperthermia, agitation, delirium.",
      cardiac:"<b>QRS > 100ms</b>: Na⁺ channel blockade → risk of VT. <b>QRS > 160ms</b>: high risk of VT/VF. R wave > 3mm in aVR (sensitive marker). Brugada-like pattern. Sinus tachycardia (anticholinergic). Hypotension (α-blockade + myocardial depression).",
      neurological:"Seizures (often early, may be single or status). Coma. Myoclonus.",
      complications:"Rapid deterioration — seizure → wide QRS → VT/VF → death can occur within 1–2h of ingestion."
    },
    investigations:"ECG (MOST IMPORTANT — repeat q30min for first 6h): QRS width, R in aVR, QTc. Serum TCA levels NOT useful for management (poor correlation with toxicity). ABG, electrolytes, glucose, co-ingestant screen.",
    management:[
      {title:"Sodium Bicarbonate (CORNERSTONE)",detail:"<b>Indication</b>: QRS > 100ms, hypotension, arrhythmias.<br><b>Dose</b>: 1–2 mEq/kg IV bolus. Target serum pH 7.45–7.55. Repeat boluses q5min until QRS narrows. Then NaHCO3 infusion: 150mEq in 1L D5W at 150–250mL/h. Mechanism: ↑ pH → ↓ free TCA binding to Na channels + ↑ Na gradient overcomes channel blockade."},
      {title:"Seizure Management",detail:"Benzodiazepines FIRST: Diazepam 10mg IV or Midazolam 5mg IM. <b>AVOID phenytoin</b> (also Na⁺ channel blocker → worsens cardiac toxicity). Refractory: Propofol, phenobarbital."},
      {title:"Hypotension Management",detail:"IV fluid bolus (crystalloid). Norepinephrine (first-line vasopressor — α-agonist counteracts α-blockade). Avoid pure β-agonists. Consider 20% lipid emulsion (ILE) in refractory cases: 1.5mL/kg bolus → 0.25mL/kg/min infusion."},
      {title:"Arrhythmia Management",detail:"Wide-complex tachycardia: NaHCO3 bolus first. Lidocaine if refractory (different Na⁺ channel binding). <b>AVOID Class IA/IC antiarrhythmics</b> (procainamide, flecainide). <b>AVOID amiodarone</b> (QTc prolongation). Magnesium 2g IV for Torsades. Refractory VF: consider ILE."},
      {title:"Decontamination",detail:"Activated charcoal 1g/kg if < 2h (extended window due to anticholinergic gastroparesis). Multi-dose activated charcoal (MDAC) may help due to enterohepatic recirculation: 0.5g/kg q4h."},
      {title:"ICU Monitoring",detail:"Continuous cardiac monitoring minimum 24h. Serial ECG. If QRS remains normal for 24h + asymptomatic → can consider step-down. <b>Never clear a TCA OD based on drug levels.</b>"}
    ]
  },
  {
    id:"aluminium",name:"Aluminium/Zinc Phosphide (Celphos) Poisoning",category:"pesticide",severity:"critical",
    icon:"💀",
    mechanism:"Phosphide + gastric HCl/moisture → Phosphine gas (PH3). PH3 inhibits mitochondrial cytochrome C oxidase → cellular hypoxia → multi-organ failure. Also causes direct myocardial toxicity, free radical generation. <b>Lethal dose: 0.15–0.5g (single tablet of Celphos = 3g AlP)</b>.",
    toxicKinetics:"Rapid generation of PH3 in stomach. Systemic absorption within minutes. No significant protein binding. PH3 has characteristic 'decaying fish / garlic' odor.",
    clinicalFeatures:{
      immediate:"Nausea, vomiting (may be phosphorescent/garlic smell), retrosternal burning, epigastric pain.",
      cardiovascular:"<b>Refractory myocardial depression</b> — profound cardiogenic shock (hallmark). ECG: ST changes, conduction blocks, VT/VF. Pericarditis (late).",
      metabolic:"Severe metabolic acidosis (pH < 7.1), ↑ lactate, hypermagnesemia, hyperkalemia, hypocalcemia.",
      multiorgan:"ARDS, acute hepatic failure, AKI (ATN), DIC, adrenal insufficiency.",
      prognosis:"Mortality 60–90%. Death usually 12–24h from refractory shock. Ingestion of > 1.5g almost uniformly fatal."
    },
    investigations:"ABG (severe metabolic acidosis), ECG, troponin, echocardiography (global hypokinesia), LFT, RFT, serum Mg/Ca/K, lactate, silver nitrate test (gastric aspirate turns black with PH3).",
    management:[
      {title:"No Proven Antidote — Management is Aggressive Supportive",detail:"This is one of the most lethal poisonings encountered in South Asian emergency departments. The key is aggressive hemodynamic support."},
      {title:"Gastric Decontamination (UNIQUE)",detail:"<b>DO NOT use water-based lavage</b> (generates more PH3). Use KMnO4 (potassium permanganate) 1:10,000 solution or coconut oil/liquid paraffin to coat and reduce PH3 generation. Some centers use NaHCO3 lavage (7.5% — reduces acid contact → less PH3). Activated charcoal role uncertain but can be given."},
      {title:"Hemodynamic Resuscitation",detail:"IV crystalloids aggressively. Early vasopressors: Norepinephrine + Dobutamine (for myocardial depression). Consider high-dose insulin-euglycemia therapy (HIE): Regular insulin 1 U/kg/h + D25W to maintain glucose 150–250 mg/dL — improves myocardial contractility. IV Magnesium Sulfate 3–4g bolus → 1g/h infusion (membrane stabilizer, anti-arrhythmic). IV Calcium gluconate for hypocalcemia."},
      {title:"Metabolic Acidosis",detail:"NaHCO3 IV to maintain pH > 7.2. May require massive amounts (> 500 mEq). Refractory acidosis: consider hemodialysis for correction."},
      {title:"Experimental Therapies",detail:"<b>Intra-aortic balloon pump (IABP)</b> / VA-ECMO for refractory cardiogenic shock — case reports showing survival. <b>Coconut oil</b> (oral/NG): proposed to coat phosphide & reduce PH3 release. <b>N-acetylcysteine</b>: free radical scavenger. <b>IV methylene blue</b>: for refractory shock (case reports). <b>Trimetazidine</b>: cytoprotective. Evidence is limited but in a lethal poisoning with no antidote, these are considered."},
      {title:"Staff Safety",detail:"<b>PH3 gas is toxic to healthcare workers.</b> Treat in well-ventilated area. Emesis/gastric aspirate releases PH3. Staff should use N95 masks or work in negative-pressure rooms. Evacuate room if garlic odor detected."}
    ]
  },
  {
    id:"corrosive",name:"Corrosive Ingestion (Acid / Alkali)",category:"household",severity:"critical",
    icon:"🧴",

let currentData = POISONS;
let currentCategory = "all";
let currentSearch = "";

function getSeverityColor(s){
  return s==="critical"?"#ef4444":s==="high"?"#f97316":"#eab308";
}
function getSeverityBorder(s){
  return s==="critical"?"severity-critical":s==="high"?"severity-high":"severity-moderate";
}

function renderPoisons(data){
  const list = document.getElementById("poisonList");
  if(!data.length){
    list.innerHTML=`<div class="text-center py-16 fade-in"><p class="text-lg" style="color:#64748b">No results found. Try a different search term.</p></div>`;
    return;
  }
  list.innerHTML = data.map(p=>`
    <article class="rounded-xl card-glow fade-in ${getSeverityBorder(p.severity)}" style="background:#1a1d2e;border:1px solid rgba(255,255,255,.06)">
      <details>
        <summary class="p-4 md:p-5 flex items-start gap-3">
          <span class="text-2xl flex-shrink-0 mt-0.5">${p.icon}</span>
          <div class="flex-1 min-w-0">
            <div class="flex flex-wrap items-center gap-2 mb-1">
              <h2 class="font-bold text-base md:text-lg" style="color:#e2e8f0;font-family:'Playfair Display',serif">${p.name}</h2>
              <span class="px-2 py-0.5 rounded-full text-xs font-semibold uppercase" style="background:${getSeverityColor(p.severity)}22;color:${getSeverityColor(p.severity)}">${p.severity}</span>
              <span class="px-2 py-0.5 rounded-full text-xs" style="background:#6366f122;color:#818cf8">${p.category}</span>
            </div>
            <p class="text-xs md:text-sm line-clamp-2" style="color:#94a3b8">${p.mechanism.substring(0,120)}...</p>
          </div>
          <i data-lucide="chevron-down" class="chevron-icon flex-shrink-0 mt-1" style="width:20px;height:20px;color:#64748b"></i>
        </summary>
        <div class="px-4 pb-5 md:px-5 space-y-4" style="border-top:1px solid rgba(255,255,255,.04)">

          <!-- Mechanism -->
          <section class="pt-4">
            <h3 class="flex items-center gap-2 font-semibold text-sm mb-2" style="color:#818cf8"><i data-lucide="zap" style="width:14px;height:14px"></i> Mechanism of Toxicity</h3>
            <p class="text-sm leading-relaxed" style="color:#cbd5e1">${p.mechanism}</p>
          </section>

          <!-- Toxicokinetics -->
          ${p.toxicKinetics?`<section>
            <h3 class="flex items-center gap-2 font-semibold text-sm mb-2" style="color:#818cf8"><i data-lucide="activity" style="width:14px;height:14px"></i> Toxicokinetics</h3>
            <p class="text-sm leading-relaxed" style="color:#cbd5e1">${p.toxicKinetics}</p>
          </section>`:""}

          <!-- Clinical Features -->
          <section>
            <h3 class="flex items-center gap-2 font-semibold text-sm mb-2" style="color:#f97316"><i data-lucide="stethoscope" style="width:14px;height:14px"></i> Clinical Features</h3>
            <div class="grid gap-2">
              ${Object.entries(p.clinicalFeatures).map(([k,v])=>`
                <div class="rounded-lg p-3" style="background:#0f1117">
                  <span class="text-xs font-semibold uppercase tracking-wide" style="color:#f97316">${k.replace(/_/g," ")}</span>
                  <p class="text-sm mt-1 leading-relaxed" style="color:#cbd5e1">${v}</p>
                </div>
              `).join("")}
            </div>
          </section>

          <!-- Investigations -->
          <section>
            <h3 class="flex items-center gap-2 font-semibold text-sm mb-2" style="color:#22c55e"><i data-lucide="search" style="width:14px;height:14px"></i> Investigations</h3>
            <div class="rounded-lg p-3" style="background:#0f1117">
              <p class="text-sm leading-relaxed" style="color:#cbd5e1">${p.investigations}</p>
            </div>
          </section>

          <!-- Management -->
          <section>
            <h3 class="flex items-center gap-2 font-semibold text-sm mb-3" style="color:#6366f1"><i data-lucide="shield" style="width:14px;height:14px"></i> Management Protocol</h3>
            <div class="space-y-2">
              ${p.management.map((m,i)=>`
                <div class="rounded-lg p-3 md:p-4" style="background:#0f1117;border-left:3px solid #6366f1">
                  <div class="flex items-start gap-2">
                    <span class="flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold" style="background:#6366f1;color:#fff">${i+1}</span>
                    <div>
                      <h4 class="font-semibold text-sm" style="color:#e2e8f0">${m.title}</h4>
                      <p class="text-sm mt-1 leading-relaxed" style="color:#cbd5e1">${m.detail}</p>
                    </div>
                  </div>
                </div>
              `).join("")}
            </div>
          </section>

        </div>
      </details>
    </article>
  `).join("");
  lucide.createIcons();
}

function filterPoisons(query){
  currentSearch = query.toLowerCase();
  applyFilters();
}

function filterCategory(cat){
  currentCategory = cat;
  document.querySelectorAll(".cat-tab").forEach(t=>{
    if(t.dataset.cat===cat){
      t.style.background="#6366f1";t.style.color="#fff";t.classList.add("tab-active");
    } else {
      t.style.background="#1e2235";t.style.color="#94a3b8";t.classList.remove("tab-active");
    }
  });
  applyFilters();
}

function applyFilters(){
  let filtered = POISONS;
  if(currentCategory!=="all") filtered = filtered.filter(p=>p.category===currentCategory);
  if(currentSearch){
    filtered = filtered.filter(p=>{
      const searchable = [p.name,p.mechanism,p.category,p.investigations,
        ...Object.values(p.clinicalFeatures),
        ...p.management.map(m=>m.title+" "+m.detail)
      ].join(" ").toLowerCase();
      return searchable.includes(currentSearch);
    });
  }
  renderPoisons(filtered);
}

// Element SDK
const defaultConfig = {
  app_title: "☠️ Clinical Toxicology Reference",
  subtitle_text: "Evidence-Based Poisoning Management — ICU / Emergency Medicine",
  background_color: "#0f1117",
  surface_color: "#1a1d2e",
  text_color: "#e2e8f0",
  accent_color: "#6366f1",
  secondary_accent: "#f97316",
  font_family: "Playfair Display",
  font_size: 16
};

function applyConfig(config){
  const c = {...defaultConfig,...config};
  const t = document.getElementById("app-title");
  const s = document.getElementById("app-subtitle");
  if(t) t.textContent = c.app_title;
  if(s) s.textContent = c.subtitle_text;
  const app = document.getElementById("app");
  if(app) app.style.background = c.background_color;
  if(t){
    t.style.color = c.text_color;
    t.style.fontFamily = `${c.font_family}, Playfair Display, serif`;
    t.style.fontSize = `${c.font_size * 1.5}px`;
  }
  if(s){
    s.style.fontSize = `${c.font_size * 0.8}px`;
  }
}

// Initial render
renderPoisons(POISONS);
lucide.createIcons();
</script>
