          "<strong>Type 4:</strong> Treat hyperkalemia first. Low-K⁺ diet, loop diuretics (kaliuresis + mild volume contraction). Fludrocortisone 0.1-0.2 mg/day (if true aldosterone deficiency – watch for HTN/edema). Oral NaHCO₃ if acidosis severe. Newer K⁺ binders (patiromer, SZC) enable RAAS blocker continuation. Stop offending drugs if possible"
        ],
        prognosis: "Type 1: Good with treatment. Nephrocalcinosis may be irreversible but progression halted. Children catch up in growth. Stones preventable with citrate. Type 2: Depends on underlying cause. Myeloma-associated has poor prognosis. Drug-induced reversible on withdrawal. Fanconi from cystinosis requires specific treatment (cysteamine). Type 4: Usually mild, excellent prognosis with treatment. Main concern is hyperkalemia management and enabling cardio/renoprotective medications."
      }
    ]
  }
];

// Application State
let currentCategory = 0;
let allDiseaseItems = [];
let filteredItems = [];

// Build flat item list
diseases.forEach((cat, ci) => {
  cat.items.forEach((item, ii) => {
    allDiseaseItems.push({ ...item, categoryIndex: ci, itemIndex: ii, category: cat.category });
  });
});
filteredItems = [...allDiseaseItems];

// Render Navigation
function renderNav() {
  const navList = document.getElementById('navList');
  navList.innerHTML = diseases.map((cat, i) => `
    <li>
      <button onclick="selectCategory(${i})" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-all ${i === currentCategory ? 'bg-emerald-900/40 text-emerald-300 font-medium' : 'text-gray-400 hover:text-gray-200 hover:bg-gray-800'}">
        <i data-lucide="${cat.icon}" class="w-4 h-4 flex-shrink-0"></i>
        <span class="truncate">${cat.category}</span>
        <span class="ml-auto text-[10px] px-1.5 py-0.5 rounded bg-gray-800 text-gray-500">${cat.items.length}</span>
      </button>
    </li>
  `).join('');
  lucide.createIcons();
}

// Render Disease Content
function renderContent(items) {
  const container = document.getElementById('diseaseContent');
  if (items.length === 0) {
    container.innerHTML = `<div class="text-center py-16 text-gray-500"><i data-lucide="search-x" class="w-12 h-12 mx-auto mb-4 opacity-50"></i><p class="text-lg">No diseases match your search</p></div>`;
    lucide.createIcons();
    return;
  }

  container.innerHTML = items.map((item, idx) => `
    <div class="disease-card mb-4 bg-gray-900 border border-gray-800 rounded-xl overflow-hidden fade-in" style="animation-delay: ${idx * 80}ms">
      <button onclick="toggleAccordion(this)" class="w-full flex items-center justify-between p-5 md:p-6 text-left hover:bg-gray-800/50 transition-colors">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-emerald-900/50 flex items-center justify-center flex-shrink-0">
            <i data-lucide="stethoscope" class="w-4 h-4 text-emerald-400"></i>
          </div>
          <div>
            <h3 class="font-heading text-lg md:text-xl text-white">${item.name}</h3>
            <span class="text-xs text-gray-500">${item.category}</span>
          </div>
        </div>
        <i data-lucide="chevron-down" class="w-5 h-5 text-gray-500 transition-transform accordion-arrow flex-shrink-0"></i>
      </button>
      <div class="accordion-content">
        <div class="px-5 md:px-6 pb-6 space-y-5 border-t border-gray-800 pt-5">
          ${renderSection('Definition', item.definition)}
          ${renderListSection('Etiology & Causes', item.etiology)}
          ${renderSection('Pathophysiology', item.pathophysiology)}
          ${renderListSection('Clinical Features', item.clinical)}
          ${renderListSection('Investigations', item.investigations)}
          ${renderListSection('Treatment', item.treatment)}
          ${renderSection('Prognosis', item.prognosis)}
        </div>
      </div>
    </div>
  `).join('');
  lucide.createIcons();
}

function renderSection(title, content) {
  if (!content) return '';
  return `
    <div>
      <h4 class="text-sm font-semibold text-emerald-400 uppercase tracking-wider mb-2 flex items-center gap-2">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>${title}
      </h4>
      <p class="text-gray-300 text-sm leading-relaxed">${content}</p>
    </div>`;
}

function renderListSection(title, items) {
  if (!items || items.length === 0) return '';
  return `
    <div>
      <h4 class="text-sm font-semibold text-emerald-400 uppercase tracking-wider mb-2 flex items-center gap-2">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>${title}
      </h4>
      <ul class="space-y-1.5">
        ${items.map(i => `<li class="text-gray-300 text-sm leading-relaxed pl-4 relative before:content-[''] before:absolute before:left-0 before:top-[10px] before:w-1.5 before:h-1.5 before:rounded-full before:bg-gray-600">${i}</li>`).join('')}
      </ul>
    </div>`;
}

// Interactions
function selectCategory(index) {
  currentCategory = index;
  filteredItems = diseases[index].items.map((item, ii) => ({ ...item, categoryIndex: index, itemIndex: ii, category: diseases[index].category }));
  renderNav();
  renderContent(filteredItems);
  document.getElementById('searchInput').value = '';
  closeSidebar();
}

function filterDiseases(query) {
  const q = query.toLowerCase().trim();
  if (!q) {
    selectCategory(currentCategory);
    return;
  }
  filteredItems = allDiseaseItems.filter(item => {
    const searchable = [item.name, item.definition, item.pathophysiology, item.prognosis, ...(item.etiology || []), ...(item.clinical || []), ...(item.investigations || []), ...(item.treatment || [])].join(' ').toLowerCase();
    return searchable.includes(q);
  });
  renderContent(filteredItems);
}

function toggleAccordion(btn) {
  const content = btn.nextElementSibling;
  const arrow = btn.querySelector('.accordion-arrow');
  const isOpen = content.classList.contains('open');
  // Close all others
  document.querySelectorAll('.accordion-content.open').forEach(el => {
    el.classList.remove('open');
    el.previousElementSibling.querySelector('.accordion-arrow').style.transform = '';
  });
  if (!isOpen) {
    content.classList.add('open');
    arrow.style.transform = 'rotate(180deg)';
  }
}

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  sidebar.classList.toggle('sidebar-closed');
  sidebar.classList.toggle('sidebar-open');
  overlay.classList.toggle('hidden');
}

function closeSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  if (sidebar.classList.contains('sidebar-open')) {
    sidebar.classList.add('sidebar-closed');
    sidebar.classList.remove('sidebar-open');
    overlay.classList.add('hidden');
  }
}

// Element SDK
const defaultConfig = {
  main_title: 'Nephrology Diseases',
  subtitle: 'Evidence-Based Clinical Compendium for MBBS/MD Practice',
  background_color: '#030712',
  surface_color: '#111827',
  text_color: '#d1d5db',
  primary_action: '#059669',
  secondary_action: '#6b7280',
  font_family: 'Source Sans 3',
  font_size: 14
};

function applyConfig(config) {
  const bg = config.background_color || defaultConfig.background_color;
  const surface = config.surface_color || defaultConfig.surface_color;
  const text = config.text_color || defaultConfig.text_color;
  const primary = config.primary_action || defaultConfig.primary_action;
  const secondary = config.secondary_action || defaultConfig.secondary_action;
  const font = config.font_family || defaultConfig.font_family;
  const size = config.font_size || defaultConfig.font_size;

  const app = document.getElementById('app');
  app.style.backgroundColor = bg;
  app.style.color = text;
  app.style.fontFamily = `${font}, Source Sans 3, sans-serif`;
  app.style.fontSize = `${size}px`;

  document.getElementById('mainTitle').textContent = config.main_title || defaultConfig.main_title;
  document.getElementById('mainSubtitle').textContent = config.subtitle || defaultConfig.subtitle;

  document.querySelectorAll('.disease-card').forEach(el => {
    el.style.backgroundColor = surface;
    el.style.borderColor = secondary + '33';
  });

  document.getElementById('sidebar').style.backgroundColor = surface;
  document.querySelectorAll('.font-heading').forEach(el => {
    el.style.fontFamily = `Playfair Display, ${font}, serif`;
    if (el.id === 'mainTitle') el.style.fontSize = `${size * 2.5}px`;
  });
}

// Init
renderNav();
selectCategory(0);
</script>
</body>
</html>
