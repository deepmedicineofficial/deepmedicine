      { title: "Bishops Score for Cervical Assessment", mnemonic: "DISCO — Dilation, Integrity (Effacement), Station, Consistency, Os (Position)", expansion: ["Dilation: 0-closed, 1-(1-2cm), 2-(3-4cm), 3-(5+cm)","Effacement: 0-(0-30%), 1-(40-50%), 2-(60-70%), 3-(80+%)","Station: 0-(-3), 1-(-2), 2-(-1/0), 3-(+1/+2)","Consistency: 0-Firm, 1-Medium, 2-Soft","Position: 0-Posterior, 1-Mid, 2-Anterior","Score ≥ 8: Favorable for induction"], tip: "Bishop Score ≥ 8 = favorable cervix, induction likely successful.", yield: "high" },

let activeSubject = "All";
let searchQuery = "";
let allData = DATA;

function renderTabs() {
  const container = document.getElementById('tabs-container');
  const subjects = ["All", ...DATA.map(d => d.subject)];
  container.innerHTML = subjects.map(s => {
    const isActive = activeSubject === s;
    const subj = DATA.find(d => d.subject === s);
    const bgColor = isActive ? (subj ? subj.color : 'var(--primary)') : 'var(--surface)';
    const textColor = isActive ? '#fff' : 'var(--text)';
    return `<button class="tab-btn flex-shrink-0 px-4 py-2 rounded-lg text-sm font-bold whitespace-nowrap" style="background:${bgColor};color:${textColor};border:1px solid ${isActive ? 'transparent' : 'rgba(255,255,255,0.08)'};" onclick="setSubject('${s}')">${s === 'All' ? '📚 All' : s}</button>`;
  }).join('');
}

function setSubject(s) {
  activeSubject = s;
  renderTabs();
  renderContent();
}

function getFilteredData() {
  let data = activeSubject === "All" ? DATA : DATA.filter(d => d.subject === activeSubject);
  if (searchQuery.trim()) {
    const q = searchQuery.toLowerCase();
    data = data.map(subj => ({
      ...subj,
      mnemonics: subj.mnemonics.filter(m =>
        m.title.toLowerCase().includes(q) ||
        m.mnemonic.toLowerCase().includes(q) ||
        m.expansion.some(e => e.toLowerCase().includes(q))
      )
    })).filter(subj => subj.mnemonics.length > 0);
  }
  return data;
}

function renderContent() {
  const container = document.getElementById('content-area');
  const data = getFilteredData();

  if (data.length === 0) {
    container.innerHTML = `<div class="text-center py-20 fade-in"><div class="text-5xl mb-4">🔍</div><p class="text-lg font-semibold" style="color:rgba(226,232,240,0.5);">No mnemonics found. Try a different search or subject.</p></div>`;
    return;
  }

  let totalCount = data.reduce((a, b) => a + b.mnemonics.length, 0);

  container.innerHTML = `
    <p class="text-sm font-bold mb-6" style="color:rgba(226,232,240,0.4);">Showing ${totalCount} mnemonic${totalCount !== 1 ? 's' : ''}</p>
    ${data.map(subj => `
      <div class="mb-10 fade-in">
        <div class="flex items-center gap-3 mb-5">
          <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:${subj.color}20;">
            <i data-lucide="${subj.icon}" style="width:20px;height:20px;color:${subj.color};"></i>
          </div>
          <h2 class="font-heading text-2xl font-bold" style="color:#fff;">${subj.subject}</h2>
          <span class="ml-auto text-xs font-bold px-2.5 py-1 rounded-full" style="background:${subj.color}20;color:${subj.color};">${subj.mnemonics.length} items</span>
        </div>
        <div class="grid gap-4">
          ${subj.mnemonics.map((m, i) => renderCard(m, subj.color, i)).join('')}
        </div>
      </div>
    `).join('')}
  `;

  lucide.createIcons();
}

function renderCard(m, color, index) {
  const yieldBadge = m.yield === 'high'
    ? `<span class="text-xs font-bold px-2 py-0.5 rounded-full" style="background:rgba(16,185,129,0.15);color:#10b981;">⚡ HIGH YIELD</span>`
    : `<span class="text-xs font-bold px-2 py-0.5 rounded-full" style="background:rgba(251,191,36,0.15);color:#fbbf24;">📌 REVIEW</span>`;

  const letters = m.mnemonic.split(' ').map(word => {
    const first = word[0];
    return `<span class="mnemonic-letter" style="background:${color}20;color:${color};">${first}</span>`;
  }).join('');

  return `
    <details class="card-glow rounded-2xl overflow-hidden" style="background:var(--surface);border:1px solid rgba(255,255,255,0.06);animation-delay:${index * 60}ms;">
      <summary class="p-5 flex items-start gap-4">
        <div class="flex-1 min-w-0">
          <div class="flex flex-wrap items-center gap-2 mb-2">
            ${yieldBadge}
          </div>
          <h3 class="font-bold text-base sm:text-lg mb-2" style="color:#fff;">${m.title}</h3>
          <div class="flex flex-wrap gap-1.5 mb-2">${letters}</div>
          <p class="text-sm font-semibold" style="color:${color};">"${m.mnemonic}"</p>
        </div>
        <div class="chevron-icon flex-shrink-0 mt-1" style="color:rgba(226,232,240,0.4);">
          <i data-lucide="chevron-down" style="width:20px;height:20px;"></i>
        </div>
      </summary>
      <div class="px-5 pb-5 pt-0">
        <div class="rounded-xl p-4 mb-3" style="background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.04);">
          <p class="text-xs font-bold uppercase tracking-wider mb-3" style="color:${color};">Expansion</p>
          <ul class="space-y-1.5">
            ${m.expansion.map(e => `<li class="text-sm flex gap-2"><span style="color:${color};">›</span><span>${e}</span></li>`).join('')}
          </ul>
        </div>
        <div class="flex items-start gap-2 p-3 rounded-lg" style="background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.1);">
          <i data-lucide="lightbulb" style="width:16px;height:16px;color:#10b981;flex-shrink:0;margin-top:2px;"></i>
          <p class="text-sm" style="color:rgba(226,232,240,0.8);"><strong style="color:#10b981;">Clinical Tip:</strong> ${m.tip}</p>
        </div>
      </div>
    </details>
  `;
}

// Search handler
document.getElementById('search-input').addEventListener('input', (e) => {
  searchQuery = e.target.value;
  renderContent();
});

// Element SDK
const defaultConfig = {
  page_title: "Memory Aids For MBBS Students",
  subtitle: "Your Ultimate Mnemonic Companion — Organized by Subject, Built for Recall",
  background_color: "#0f172a",
  surface_color: "#1e293b",
  text_color: "#e2e8f0",
  primary_color: "#10b981",
  secondary_color: "#3b82f6",
  font_family: "DM Serif Display",
  font_size: 16
};

function applyConfig(config) {
  const root = document.documentElement;
  root.style.setProperty('--bg', config.background_color || defaultConfig.background_color);
  root.style.setProperty('--surface', config.surface_color || defaultConfig.surface_color);
  root.style.setProperty('--text', config.text_color || defaultConfig.text_color);
  root.style.setProperty('--primary', config.primary_color || defaultConfig.primary_color);
  root.style.setProperty('--secondary', config.secondary_color || defaultConfig.secondary_color);

  const appRoot = document.getElementById('app-root');
  appRoot.style.backgroundColor = config.background_color || defaultConfig.background_color;
  appRoot.style.color = config.text_color || defaultConfig.text_color;

  const title = document.getElementById('page-title');
  const sub = document.getElementById('subtitle');
  title.textContent = config.page_title || defaultConfig.page_title;
  sub.textContent = config.subtitle || defaultConfig.subtitle;

  const font = config.font_family || defaultConfig.font_family;
  title.style.fontFamily = `${font}, Georgia, serif`;

  const baseSize = config.font_size || defaultConfig.font_size;
  title.style.fontSize = `${baseSize * 2.8}px`;
  sub.style.fontSize = `${baseSize * 1.15}px`;
}

// Initial render
renderTabs();
renderContent();
lucide.createIcons();
</script>
</body>
</html>
