  muted_color: "#6b7280",
  font_family: "Outfit",
  font_size: 15
};

function applyConfig(config) {
  const bg = config.background_color || defaultConfig.background_color;
  const surface = config.surface_color || defaultConfig.surface_color;
  const text = config.text_color || defaultConfig.text_color;
  const accent = config.accent_color || defaultConfig.accent_color;
  const muted = config.muted_color || defaultConfig.muted_color;
  const font = config.font_family || defaultConfig.font_family;
  const fontSize = config.font_size || defaultConfig.font_size;

  document.documentElement.style.setProperty('--accent', accent);
  document.body.style.background = bg;
  document.body.style.color = text;
  document.body.style.fontFamily = `${font}, Outfit, sans-serif`;
  document.body.style.fontSize = `${fontSize}px`;

  const app = document.getElementById('app');
  app.style.background = bg;

  document.getElementById('app-title').textContent = config.app_title || defaultConfig.app_title;
  document.getElementById('app-subtitle').textContent = config.subtitle_text || defaultConfig.subtitle_text;

  const header = document.querySelector('header');
  header.style.background = `linear-gradient(135deg, ${surface} 0%, ${adjustColor(surface, 10)} 50%, ${bg} 100%)`;

  document.querySelectorAll('.mnemonic-card').forEach(card => {
    card.style.background = surface;
    card.style.borderColor = 'rgba(255,255,255,0.06)';
  });

  document.querySelectorAll('.search-box').forEach(el => {
    el.style.background = surface;
    el.style.borderColor = 'rgba(255,255,255,0.08)';
  });

  renderFilters();
  renderCards();
}

function adjustColor(hex, amount) {
  let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  r = Math.min(255, r + amount); g = Math.min(255, g + amount); b = Math.min(255, b + amount);
  return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
}

// ── Render ──
function renderFilters() {
  const bar = document.getElementById('filter-bar');
  const config = window.elementSdk?.config || defaultConfig;
  const accent = config.accent_color || defaultConfig.accent_color;
  const surface = config.surface_color || defaultConfig.surface_color;
  const text = config.text_color || defaultConfig.text_color;

  bar.innerHTML = '';
  ["All", ...categories].forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.textContent = cat;
    const isActive = activeCategory === cat;
    btn.style.background = isActive ? accent : surface;
    btn.style.color = isActive ? '#fff' : text;
    btn.style.borderColor = isActive ? accent : 'rgba(255,255,255,0.1)';
    btn.onclick = () => { activeCategory = cat; renderFilters(); renderCards(); };
    bar.appendChild(btn);
  });
}

function getFiltered() {
  return mnemonics.filter(m => {
    const catMatch = activeCategory === "All" || m.category === activeCategory;
    if (!searchTerm) return catMatch;
    const s = searchTerm.toLowerCase();
    const textMatch = m.title.toLowerCase().includes(s) || m.subtitle.toLowerCase().includes(s) || m.category.toLowerCase().includes(s) ||
      m.letters.some(l => l.word.toLowerCase().includes(s) || l.detail.toLowerCase().includes(s));
    return catMatch && textMatch;
  });
}

function renderCards() {
  const container = document.getElementById('card-container');
  const noResults = document.getElementById('no-results');
  const config = window.elementSdk?.config || defaultConfig;
  const surface = config.surface_color || defaultConfig.surface_color;
  const text = config.text_color || defaultConfig.text_color;
  const muted = config.muted_color || defaultConfig.muted_color;
  const filtered = getFiltered();

  container.innerHTML = '';
  noResults.style.display = filtered.length ? 'none' : 'block';

  filtered.forEach((m, i) => {
    const card = document.createElement('div');
    card.className = 'mnemonic-card anim-in';
    card.style.background = surface;
    card.style.border = '1px solid rgba(255,255,255,0.06)';
    card.style.animationDelay = `${i * 0.06}s`;
    card.onclick = () => openModal(m);

    const tagBg = m.color + '20';
    card.innerHTML = `
      <div style="padding:1.25rem;">
        <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:12px;">
          <span class="tag-pill" style="background:${tagBg};color:${m.color};">${m.category}</span>
          <i data-lucide="chevron-right" style="width:18px;height:18px;color:${muted};"></i>
        </div>
        <h2 class="heading-font" style="font-size:24px;color:${text};margin:0 0 4px;">${m.title}</h2>
        <p style="color:${muted};font-size:13px;margin:0 0 16px;line-height:1.4;">${m.subtitle}</p>
        <div style="display:flex;flex-wrap:wrap;gap:6px;">
          ${m.letters.map(l => `<div class="letter-badge" style="background:${m.color}20;color:${m.color};font-size:14px;width:32px;height:32px;">${l.l}</div>`).join('')}
        </div>
      </div>
    `;
    container.appendChild(card);
  });
  lucide.createIcons();
}

document.addEventListener("DOMContentLoaded", () => {
  applyConfig(defaultConfig);
});

function openModal(m) {
  const config = window.elementSdk?.config || defaultConfig;
  const surface = config.surface_color || defaultConfig.surface_color;
  const text = config.text_color || defaultConfig.text_color;
  const muted = config.muted_color || defaultConfig.muted_color;
  const bg = config.background_color || defaultConfig.background_color;

  const modal = document.getElementById('modal');
  const content = modal.querySelector('.modal-content');
  content.style.background = surface;

  content.innerHTML = `
    <div style="padding:1.5rem;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <div>
          <span class="tag-pill" style="background:${m.color}20;color:${m.color};margin-bottom:6px;display:inline-block;">${m.category}</span>
          <h2 class="heading-font" style="font-size:28px;color:${text};margin:6px 0 2px;">${m.title}</h2>
          <p style="color:${muted};font-size:14px;margin:0;">${m.subtitle}</p>
        </div>
        <button onclick="closeModal()" style="background:${bg};border:none;border-radius:10px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;">
          <i data-lucide="x" style="width:18px;height:18px;color:${muted};"></i>
        </button>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        ${m.letters.map(l => `
          <div style="background:${bg};border-radius:12px;padding:14px;border:1px solid rgba(255,255,255,0.04);">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
              <div class="letter-badge" style="background:${m.color};color:#fff;">${l.l}</div>
              <span style="font-weight:600;font-size:16px;color:${text};">${l.word}</span>
            </div>
            <p style="color:${muted};font-size:13px;line-height:1.6;margin:0;padding-left:46px;">${l.detail}</p>
          </div>
        `).join('')}
      </div>
    </div>
  `;
  modal.classList.add('active');
  document.body.style.overflow = 'hidden';
  lucide.createIcons();
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
  document.body.style.overflow = 'auto';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

document.getElementById('search-input').addEventListener('input', e => {
  searchTerm = e.target.value;
  renderCards();
});

renderFilters();
renderCards();
lucide.createIcons();
</script>
</body>
</html>
