  <script>
// ─── QUESTION BANK ───
const subjects = {
  cardiology: {
    icon: "heart-pulse",
    color: "#ef4444",
    questions: [
      {
        q: "A 55-year-old male presents with acute substernal chest pain radiating to the left arm, diaphoresis, and ST-elevation in leads II, III, and aVF. Which coronary artery is most likely occluded?",
        options: ["Left anterior descending (LAD)", "Right coronary artery (RCA)", "Left circumflex artery (LCx)", "Left main coronary artery"],
        correct: 1,
        explanation: "<b>Answer: Right Coronary Artery (RCA)</b><br><br>ST-elevation in leads II, III, and aVF indicates an <b>inferior myocardial infarction</b>. The inferior wall of the left ventricle is supplied predominantly by the RCA (~85% of people — right-dominant circulation).<br><br><b>Key anatomy:</b><br>• <b>LAD</b> → supplies anterior wall (V1–V4 changes)<br>• <b>RCA</b> → supplies inferior wall (II, III, aVF changes) and often the AV node<br>• <b>LCx</b> → supplies lateral wall (I, aVL, V5–V6 changes)<br>• <b>Left main</b> → massive ischemia with widespread ST changes and hemodynamic collapse<br><br><b>Clinical Pearl:</b> Always check right-sided leads (V4R) in inferior STEMI to rule out right ventricular infarction — avoid nitrates and aggressive diuresis in such cases."
      },
      {
        q: "Which of the following is the most common cause of heart failure with preserved ejection fraction (HFpEF)?",
        options: ["Dilated cardiomyopathy", "Hypertensive heart disease", "Valvular regurgitation", "Viral myocarditis"],
        correct: 1,
        explanation: "<b>Answer: Hypertensive Heart Disease</b><br><br>HFpEF (EF ≥ 50%) is characterized by <b>diastolic dysfunction</b> — the left ventricle is stiff and cannot relax properly, leading to elevated filling pressures.<br><br><b>Pathophysiology:</b> Chronic hypertension → concentric LV hypertrophy → impaired relaxation → elevated LA pressure → pulmonary congestion → symptoms of heart failure despite normal systolic function.<br><br><b>Risk factors:</b> Age, HTN, diabetes, obesity, female sex, AF<br><br><b>Differentiators:</b><br>• Dilated cardiomyopathy → HFrEF (reduced EF)<br>• Viral myocarditis → usually HFrEF with acute presentation<br>• Valvular regurgitation → volume overload, eventual systolic failure<br><br><b>Treatment:</b> No proven mortality benefit drug yet. Focus on controlling HTN, fluid management with diuretics, and managing comorbidities. SGLT2 inhibitors (empagliflozin) showed promise in EMPEROR-Preserved trial."
      },
      {
        q: "A patient on digoxin therapy develops nausea, visual disturbances (yellow-green halos), and a new arrhythmia. ECG shows atrial tachycardia with block. What is the most important initial step?",
        options: ["Administer IV calcium", "Check serum potassium level", "Immediate cardioversion", "Increase digoxin dose"],
        correct: 1,
        explanation: "<b>Answer: Check Serum Potassium Level</b><br><br>This presentation is classic <b>digoxin toxicity</b>. Hypokalemia is the single most important precipitant because digoxin and K+ compete for the same binding site on Na+/K+-ATPase.<br><br><b>Classic triad of digoxin toxicity:</b><br>1. GI symptoms (nausea, vomiting, anorexia)<br>2. Visual disturbances (xanthopsia — yellow-green halos, blurred vision)<br>3. Cardiac arrhythmias (PAT with block is pathognomonic; also bidirectional VT)<br><br><b>Why K+ first?</b><br>• Low K+ → increased digoxin binding → worsened toxicity<br>• Correcting hypokalemia may resolve the arrhythmia<br>• Even if digoxin levels are therapeutic, hypokalemia can precipitate toxicity<br><br><b>Management:</b><br>• Correct K+ and Mg2+ levels<br>• Stop digoxin<br>• For life-threatening arrhythmias → Digibind (digoxin-specific Fab antibodies)<br>• <b>AVOID</b> cardioversion (risk of refractory VF) and IV calcium"
      },
      {
        q: "Which murmur is classically described as a 'machinery' or continuous murmur best heard at the left infraclavicular area?",
        options: ["Aortic stenosis", "Mitral regurgitation", "Patent ductus arteriosus (PDA)", "Ventricular septal defect (VSD)"],
        correct: 2,
        explanation: "<b>Answer: Patent Ductus Arteriosus (PDA)</b><br><br>PDA produces a <b>continuous 'machinery' murmur</b> because the pressure gradient between aorta and pulmonary artery persists throughout both systole and diastole.<br><br><b>Key features:</b><br>• Best heard at left infraclavicular area (2nd left intercostal space)<br>• Continuous — crescendo in systole, decrescendo in diastole, enveloping S2<br>• Wide pulse pressure and bounding pulses due to aortic runoff<br><br><b>Associations:</b><br>• Prematurity (most common)<br>• Maternal rubella infection<br>• High-altitude births<br><br><b>Treatment:</b><br>• Premature infants: Indomethacin or Ibuprofen (inhibits prostaglandins that keep ductus open)<br>• Term infants/older: Surgical ligation or transcatheter closure<br>• <b>Prostaglandin E1 (alprostadil)</b> keeps PDA OPEN — used in ductus-dependent congenital heart lesions<br><br><b>Mnemonic:</b> PDA = Put Down (close) with indomethacin, Prop open with PGE1"
      },
      {
        q: "A 68-year-old woman with atrial fibrillation has a CHA₂DS₂-VASc score of 4. What is the most appropriate long-term antithrombotic therapy?",
        options: ["Aspirin alone", "Aspirin plus clopidogrel", "Direct oral anticoagulant (DOAC)", "No anticoagulation needed"],
        correct: 2,
        explanation: "<b>Answer: Direct Oral Anticoagulant (DOAC)</b><br><br>The CHA₂DS₂-VASc score guides stroke prevention in non-valvular AF. A score ≥2 in men or ≥3 in women is a strong indication for oral anticoagulation.<br><br><b>CHA₂DS₂-VASc breakdown:</b><br>• <b>C</b> – CHF (1 pt)<br>• <b>H</b> – Hypertension (1 pt)<br>• <b>A₂</b> – Age ≥75 (2 pts)<br>• <b>D</b> – Diabetes (1 pt)<br>• <b>S₂</b> – Prior Stroke/TIA (2 pts)<br>• <b>V</b> – Vascular disease (1 pt)<br>• <b>A</b> – Age 65–74 (1 pt)<br>• <b>Sc</b> – Sex category (female = 1 pt)<br><br><b>Why DOACs preferred over warfarin?</b><br>• No routine INR monitoring<br>• Fewer drug/food interactions<br>• Lower risk of intracranial hemorrhage<br>• Non-inferior or superior to warfarin in landmark trials (RE-LY, ROCKET-AF, ARISTOTLE, ENGAGE AF)<br><br><b>Options:</b> Apixaban, rivaroxaban, dabigatran, edoxaban<br><br><b>Note:</b> Aspirin alone is insufficient for stroke prevention in AF with elevated CHA₂DS₂-VASc scores."
      }
    ]
  },
  pulmonology: {
    icon: "wind",
    color: "#3b82f6",
    questions: [
      {
        q: "A 60-year-old smoker presents with progressive dyspnea. PFTs show FEV1/FVC ratio of 0.55 with minimal bronchodilator reversibility. What is the most likely diagnosis?",
        options: ["Asthma", "COPD", "Pulmonary fibrosis", "Sarcoidosis"],
        correct: 1,
        explanation: "<b>Answer: COPD</b><br><br>An FEV1/FVC ratio <0.70 post-bronchodilator confirms <b>airflow obstruction</b>. In a long-term smoker with minimal reversibility, COPD is the diagnosis.<br><br><b>Key distinctions:</b><br>• <b>Asthma</b> → reversible obstruction (≥12% and 200mL improvement with bronchodilator)<br>• <b>COPD</b> → fixed/minimally reversible obstruction<br>• <b>Pulmonary fibrosis</b> → restrictive pattern (reduced FVC with normal/high FEV1/FVC ratio)<br>• <b>Sarcoidosis</b> → can be restrictive or obstructive; usually younger, non-smoker<br><br><b>GOLD Classification (by FEV1 % predicted post-BD):</b><br>• GOLD 1 (Mild): ≥80%<br>• GOLD 2 (Moderate): 50–79%<br>• GOLD 3 (Severe): 30–49%<br>• GOLD 4 (Very severe): <30%<br><br><b>Management ladder:</b> Smoking cessation (ONLY intervention reducing mortality), LAMA/LABA inhalers, ICS if frequent exacerbations, pulmonary rehabilitation, O₂ therapy if PaO₂ ≤55mmHg."
      },
      {
        q: "Which of the following findings on chest X-ray is most characteristic of tension pneumothorax?",
        options: ["Bilateral hilar lymphadenopathy", "Kerley B lines", "Mediastinal shift to the contralateral side", "Reticulonodular pattern"],
        correct: 2,
        explanation: "<b>Answer: Mediastinal Shift to the Contralateral Side</b><br><br>Tension pneumothorax is a <b>clinical diagnosis</b> — don't delay treatment for imaging! When seen on CXR:<br><br><b>Classic CXR findings:</b><br>• Absent lung markings on affected side<br>• Mediastinal shift AWAY from the affected side<br>• Tracheal deviation away from affected side<br>• Flattened hemidiaphragm on affected side<br>• Widened intercostal spaces<br><br><b>Pathophysiology:</b> One-way valve mechanism → air enters pleural space during inspiration but cannot escape → progressive pressure buildup → compresses contralateral lung, great vessels, and heart → obstructive shock.<br><br><b>Clinical presentation:</b> Severe dyspnea, hypotension, JVD, absent breath sounds, tracheal deviation, tachycardia.<br><br><b>Emergency treatment:</b><br>• <b>Needle decompression</b>: 14–16G needle at 2nd intercostal space, midclavicular line (or 4th/5th ICS anterior axillary line)<br>• Followed by chest tube insertion (tube thoracostomy)"
      },
      {
        q: "A 30-year-old African American woman presents with bilateral hilar lymphadenopathy, erythema nodosum, and elevated ACE levels. What is the most likely diagnosis?",
        options: ["Lymphoma", "Sarcoidosis", "Tuberculosis", "Lung adenocarcinoma"],
        correct: 1,
        explanation: "<b>Answer: Sarcoidosis</b><br><br>This is a classic presentation: young African American female + bilateral hilar lymphadenopathy (BHL) + erythema nodosum + elevated ACE = <b>sarcoidosis</b> until proven otherwise.<br><br><b>Key features of sarcoidosis:</b><br>• Non-caseating granulomas (vs. TB which has caseating granulomas)<br>• Bilateral hilar lymphadenopathy (most common radiographic finding — 50–80%)<br>• Elevated serum ACE (produced by granulomas, but not specific)<br>• Hypercalcemia (granulomas produce 1,25-dihydroxyvitamin D)<br><br><b>Multisystem involvement:</b><br>• Lungs (90%): BHL, pulmonary infiltrates, fibrosis<br>• Skin: Erythema nodosum, lupus pernio<br>• Eyes: Anterior uveitis (screen all sarcoidosis patients!)<br>• Heart: AV block, cardiomyopathy<br>• CNS: Cranial nerve palsies (Bell's palsy), diabetes insipidus<br><br><b>Löfgren syndrome</b> (acute, good prognosis): BHL + erythema nodosum + polyarthralgia + fever<br><br><b>Diagnosis:</b> Biopsy showing non-caseating granulomas + exclusion of other causes<br><b>Treatment:</b> Observation for mild disease; systemic corticosteroids for symptomatic/progressive disease."
      },
      {
        q: "In a patient with massive pulmonary embolism causing hemodynamic instability (systolic BP < 90 mmHg), what is the first-line treatment?",
        options: ["Heparin infusion alone", "Inferior vena cava (IVC) filter", "Systemic thrombolysis (tPA)", "Oral rivaroxaban"],
        correct: 2,
        explanation: "<b>Answer: Systemic Thrombolysis (tPA)</b><br><br><b>Massive PE</b> = PE + hemodynamic instability (SBP <90 for >15 min, need for vasopressors, or cardiac arrest). This is a <b>life-threatening emergency</b>.<br><br><b>Treatment hierarchy for massive PE:</b><br>1. <b>Systemic thrombolysis</b> (alteplase/tPA) — first-line for massive PE<br>   • 100mg IV over 2 hours (or accelerated protocols)<br>   • Rapidly dissolves clot and restores hemodynamics<br>2. Surgical embolectomy — if thrombolysis contraindicated/failed<br>3. Catheter-directed therapy — alternative option<br><br><b>Why not heparin alone?</b> Heparin prevents clot propagation but does NOT dissolve existing clot. In massive PE with hemodynamic compromise, you need clot lysis NOW.<br><br><b>Contraindications to thrombolysis:</b> Active bleeding, recent surgery (<3 weeks), hemorrhagic stroke, intracranial neoplasm.<br><br><b>Wells Score for PE probability:</b> Clinical signs of DVT (3), PE most likely diagnosis (3), HR >100 (1.5), immobilization/surgery (1.5), prior DVT/PE (1.5), hemoptysis (1), malignancy (1)."
      },
      {
        q: "A patient on mechanical ventilation develops sudden high airway pressures with equal bilateral breath sounds. What is the most likely cause?",
        options: ["Right mainstem intubation", "Tension pneumothorax", "Mucus plugging or kinked ET tube", "Massive pleural effusion"],
        correct: 2,
        explanation: "<b>Answer: Mucus Plugging or Kinked ET Tube</b><br><br>The key clue is <b>high airway pressures + bilateral equal breath sounds</b>. This points to a proximal/mechanical obstruction rather than a unilateral lung problem.<br><br><b>Systematic approach to sudden high airway pressures (DOPES):</b><br>• <b>D</b>isplacement — tube displaced/dislodged<br>• <b>O</b>bstruction — mucus plug, kink, biting on tube (most common!)<br>• <b>P</b>neumothorax — but this causes ABSENT breath sounds on one side<br>• <b>E</b>quipment failure — ventilator malfunction<br>• <b>S</b>tacking — auto-PEEP/breath stacking<br><br><b>Why not the other choices?</b><br>• Tension pneumothorax → absent breath sounds on ONE side + tracheal deviation<br>• Right mainstem intubation → absent/decreased LEFT breath sounds<br>• Massive pleural effusion → decreased breath sounds on affected side + dullness<br><br><b>Immediate management:</b><br>1. Disconnect from vent, bag manually<br>2. Pass suction catheter to check for/clear obstruction<br>3. If still high pressures → check tube position, auscultate, get CXR"
      }
    ]
  },
  gastroenterology: {
    icon: "pill",
    color: "#f59e0b",
    questions: [
      {
        q: "A 45-year-old male with chronic alcoholism presents with hematemesis. Endoscopy reveals dilated submucosal veins at the gastroesophageal junction. What is the underlying pathophysiology?",
        options: ["Peptic ulcer disease", "Portal hypertension", "Mallory-Weiss tear", "Boerhaave syndrome"],
        correct: 1,
        explanation: "<b>Answer: Portal Hypertension</b><br><br>Dilated submucosal veins at the GEJ = <b>esophageal varices</b>, caused by portal hypertension secondary to hepatic cirrhosis (alcohol-related liver disease in this case).<br><br><b>Pathophysiology chain:</b><br>Chronic alcohol → cirrhosis → increased intrahepatic resistance → portal hypertension (portal pressure >10 mmHg) → portosystemic collaterals develop → esophageal varices (left gastric vein → esophageal veins).<br><br><b>Important portosystemic anastomoses:</b><br>• Esophageal varices (left gastric ↔ esophageal veins)<br>• Caput medusae (paraumbilical ↔ superficial epigastric veins)<br>• Hemorrhoids (superior ↔ middle/inferior rectal veins)<br>• Retroperitoneal (splenic/renal/gonadal veins)<br><br><b>Acute management of variceal bleed:</b><br>1. Resuscitation (restrictive transfusion, target Hb 7-8)<br>2. IV octreotide (splanchnic vasoconstriction)<br>3. IV antibiotics (ceftriaxone — reduces mortality!)<br>4. Urgent endoscopy with band ligation<br>5. Balloon tamponade (Sengstaken-Blakemore) if uncontrolled<br>6. TIPS if refractory<br><br><b>Prophylaxis:</b> Non-selective beta-blockers (propranolol/nadolol) or endoscopic band ligation."
      },
      {
        q: "A 35-year-old woman presents with recurrent episodes of right upper quadrant pain after fatty meals, with a positive Murphy's sign. Ultrasound shows gallstones with a thickened gallbladder wall. What is the most appropriate treatment?",
        options: ["Ursodeoxycholic acid", "ERCP with sphincterotomy", "Laparoscopic cholecystectomy", "Observation and low-fat diet"],
        correct: 2,
        explanation: "<b>Answer: Laparoscopic Cholecystectomy</b><br><br>This is <b>acute cholecystitis</b> — gallstones + RUQ pain + positive Murphy's sign + thickened GB wall. Laparoscopic cholecystectomy is the definitive treatment.<br><br><b>Diagnostic criteria (Tokyo Guidelines):</b><br>• Local signs: Murphy's sign, RUQ mass/pain/tenderness<br>• Systemic signs: Fever, elevated CRP, leukocytosis<br>• Imaging: Gallstones, GB wall thickening (>4mm), pericholecystic fluid<br><br><b>Why not the other options?</b><br>• Ursodeoxycholic acid — dissolves cholesterol stones but takes months, high recurrence, only for those unfit for surgery<br>• ERCP — for choledocholithiasis (CBD stones), not cholecystitis<br>• Observation — appropriate for asymptomatic gallstones, not acute cholecystitis<br><br><b>Timing:</b> Early cholecystectomy (within 72 hours) preferred over delayed (reduces total hospital stay, comparable complication rates).<br><br><b>Complications of gallstones:</b> Cholecystitis → choledocholithiasis → cholangitis → gallstone pancreatitis → gallstone ileus (rare)."
      },
      {
        q: "A patient with Crohn's disease develops perianal fistulas and oral aphthous ulcers. Which biologic agent is first-line for inducing and maintaining remission in moderate-to-severe Crohn's disease?",

ered edges, pigmented networks, regression areas suggest melanoma<br>   • Increases diagnostic accuracy to ~90%<br><br>2. <b>Excisional biopsy (gold standard):</b><br>   • Complete removal with 1-2mm margins<br>   • Allows histopathologic examination<br>   • Staging of primary tumor<br>   • Provides complete histologic information<br><br>3. <b>Alternative: Punch or shave biopsy</b><br>   • If lesion very large or problematic location<br>   • Less ideal (may not capture full thickness)\n   • Not recommended for suspected melanoma if possible<br><br><b>Histologic staging (Breslow thickness):</b><br>• <b>In situ:</b> Confined to epidermis — 99% 5-year survival<br>• <b>≤1.0mm:</b> Thin, Stage IA — ~95% survival<br>• <b>1.0-2.0mm:</b> Intermediate, Stage IB-IIA — 80-90% survival<br>• <b>2.0-4.0mm:</b> Thick, Stage IIB-IIC — 60-75% survival<br>• <b>>4.0mm:</b> Very thick, Stage III-IV — 40% survival, high recurrence<br><br><b>Management after diagnosis:</b><br><br>• <b>Stage I-II (localized):</b><br>  → Wide excision (margins based on thickness: 1cm for <2mm, 2cm for >2mm)<br>  → Sentinel lymph node biopsy for ≥1mm thickness<br>  → Follow-up surveillance (every 3 months initially)<br><br>• <b>Stage III (regional lymph node involvement):</b><br>  → Complete lymphadenectomy<br>  → Adjuvant immunotherapy (nivolumab, pembrolizumab)\br>  → Interferon-α or B-RAF inhibitors if specific mutations<br><br>• <b>Stage IV (metastatic):</b><br>  → Immunotherapy (anti-PD-1: pembrolizumab, nivolumab)<br>  → Targeted therapy if B-RAF V600E mutation (vemurafenib, dabrafenib)<br>  → Combination approaches increasingly effective<br>  → 5-year survival still ~20%<br><br><b>Prevention:</b><br>• UV protection: Sunscreen SPF ≥30, protective clothing<br>• Avoid tanning beds<br>• Self-examination monthly (skin self-awareness)<br>• Dermatology screening annually for high-risk individuals<br><br><b>Prognosis factors:</b><br>• Thickness (Breslow) — most important<br>• Ulceration (worse prognosis)<br>• Mitotic rate (more mitoses = worse)<br>• Lymphocyte infiltration (good prognostic sign)<br>• Mutation status (B-RAF, NRAS, KIT)\n<br><b>Why NOT reassurance?</b><br>• Multiple ABCDE criteria present<br>• Early diagnosis dramatically improves survival (>95% for thin melanomas)<br>• Delayed diagnosis → worse outcomes<br>• Biopsy is relatively simple, can be done in office"

// ─── APP STATE ───
let currentSubject = null;
let currentQuestions = [];
let currentIndex = 0;
let selectedAnswer = null;
let answered = false;
let sessionStats = { total: 0, correct: 0 };
let questionStates = [];

const defaultConfig = {
  app_title: "Medical MCQ Pro",
  subtitle_text: "MBBS & MD Exam Preparation",
  background_color: "#0c0f1a",
  surface_color: "#1a1d2e",
  text_color: "#f3f4f6",
  primary_color: "#7c3aed",
  accent_color: "#c084fc",
  font_family: "DM Sans",
  font_size: 16
};

function applyConfig(config) {
  const c = { ...defaultConfig, ...config };
  const app = document.getElementById('app');
  app.style.background = c.background_color;

  const t = document.getElementById('appTitle');
  const s = document.getElementById('appSubtitle');
  if (t) t.textContent = c.app_title;
  if (s) s.textContent = c.subtitle_text;

  document.querySelectorAll('[data-surface]').forEach(el => el.style.background = c.surface_color);

  const font = `${c.font_family}, DM Sans, sans-serif`;
  document.body.style.fontFamily = font;

  document.querySelectorAll('[data-text]').forEach(el => el.style.color = c.text_color);
}

// ─── SHUFFLE ───
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function shuffleQuestionsAndOptions() {
  currentQuestions = currentQuestions.map(q => {
    const correctOption = q.options[q.correct];
    const shuffled = shuffle(q.options);
    return { ...q, options: shuffled, correct: shuffled.indexOf(correctOption) };
  });
  currentQuestions = shuffle(currentQuestions);
  questionStates = currentQuestions.map(() => ({ selected: null, answered: false }));
  currentIndex = 0;
  renderQuestion();
}

// ─── RENDER ───
function renderSubjects() {
  const grid = document.getElementById('subjectGrid');
  grid.innerHTML = '';
  let total = 0;
  Object.entries(subjects).forEach(([key, sub]) => {
    total += sub.questions.length;
    const card = document.createElement('button');
    card.className = 'option-btn flex items-center gap-4 p-4 rounded-xl text-left w-full';
    card.style.cssText = `background:#1a1d2e; border:1px solid #252a3a;`;
    card.innerHTML = `
      <div class="w-11 h-11 rounded-lg flex items-center justify-center flex-shrink-0" style="background:${sub.color}20;">
        <i data-lucide="${sub.icon}" style="width:22px;height:22px;color:${sub.color};"></i>
      </div>
      <div class="flex-1 min-w-0">
        <div class="text-white font-semibold text-sm capitalize">${key}</div>
        <div class="text-gray-500 text-xs">${sub.questions.length} questions</div>
      </div>
      <i data-lucide="chevron-right" style="width:18px;height:18px;color:#4b5563;"></i>
    `;
    card.onclick = () => startQuiz(key);
    grid.appendChild(card);
  });
  document.getElementById('statTotal').textContent = total;
  lucide.createIcons();
}

function startQuiz(subjectKey) {
  currentSubject = subjectKey;
  const sub = subjects[subjectKey];
  currentQuestions = sub.questions.map(q => {
    const correctOpt = q.options[q.correct];
    const shuffled = shuffle(q.options);
    return { ...q, options: shuffled, correct: shuffled.indexOf(correctOpt) };
  });
  currentQuestions = shuffle(currentQuestions);
  questionStates = currentQuestions.map(() => ({ selected: null, answered: false }));
  currentIndex = 0;

  document.getElementById('homeScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  document.getElementById('quizScreen').style.display = 'flex';
  document.getElementById('quizSubjectLabel').textContent = subjectKey.charAt(0).toUpperCase() + subjectKey.slice(1);
  renderQuestion();
}

function renderQuestion() {
  const q = currentQuestions[currentIndex];
  const state = questionStates[currentIndex];

  document.getElementById('qNumber').textContent = `Question ${currentIndex + 1} of ${currentQuestions.length}`;
  document.getElementById('qText').textContent = q.q;
  document.getElementById('quizProgress').textContent = `${currentIndex + 1}/${currentQuestions.length}`;
  document.getElementById('progressBar').style.width = `${((currentIndex + 1) / currentQuestions.length) * 100}%`;

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';

  const letters = ['A', 'B', 'C', 'D'];
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn w-full flex items-center gap-3 p-4 rounded-xl text-left text-sm';
    let bg = '#1a1d2e'; let border = '#252a3a'; let textColor = '#e5e7eb';

    if (state.answered) {
      if (i === q.correct) { btn.classList.add('correct-answer'); bg = '#065f46'; border = '#059669'; textColor = '#fff'; }
      else if (i === state.selected && i !== q.correct) { btn.classList.add('wrong-answer'); bg = '#7f1d1d'; border = '#dc2626'; textColor = '#fff'; }
    } else if (state.selected === i) {
      bg = '#2d1f5e'; border = '#7c3aed'; textColor = '#fff';
    }

    btn.style.cssText = `background:${bg}; border:1px solid ${border}; color:${textColor};`;
    btn.innerHTML = `<span class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold flex-shrink-0" style="background:${state.answered && i === q.correct ? '#059669' : state.answered && i === state.selected ? '#dc2626' : '#252a3a'}; color:#fff;">${letters[i]}</span><span class="flex-1">${opt}</span>`;

    if (!state.answered) {
      btn.onclick = () => selectOption(i);
    }
    container.appendChild(btn);
  });

  const expBox = document.getElementById('explanationBox');
  if (state.answered) {
    expBox.classList.remove('hidden');
    document.getElementById('explanationText').innerHTML = q.explanation;
  } else {
    expBox.classList.add('hidden');
  }

  document.getElementById('prevBtn').style.opacity = currentIndex === 0 ? '0.4' : '1';
  document.getElementById('prevBtn').style.pointerEvents = currentIndex === 0 ? 'none' : 'auto';

  const nextBtn = document.getElementById('nextBtn');
  if (currentIndex === currentQuestions.length - 1 && state.answered) {
    nextBtn.innerHTML = 'Finish <i data-lucide="flag" style="width:16px;height:16px;"></i>';
  } else {
    nextBtn.innerHTML = 'Next <i data-lucide="chevron-right" style="width:16px;height:16px;"></i>';
  }

  document.getElementById('questionArea').classList.remove('fade-in');
  void document.getElementById('questionArea').offsetWidth;
  document.getElementById('questionArea').classList.add('fade-in');
  lucide.createIcons();
}

function selectOption(i) {
  const state = questionStates[currentIndex];
  if (state.answered) return;

  state.selected = i;
  state.answered = true;

  sessionStats.total++;
  if (i === currentQuestions[currentIndex].correct) sessionStats.correct++;

  document.getElementById('statTotal').textContent = sessionStats.total;
  document.getElementById('statCorrect').textContent = sessionStats.correct;
  document.getElementById('statAccuracy').textContent = sessionStats.total > 0 ? Math.round((sessionStats.correct / sessionStats.total) * 100) + '%' : '—';

  renderQuestion();
}

function goNext() {
  const state = questionStates[currentIndex];
  if (!state.answered) {
    // flash hint
    document.getElementById('optionsContainer').style.outline = '2px solid #7c3aed';
    setTimeout(() => document.getElementById('optionsContainer').style.outline = 'none', 600);
    return;
  }
  if (currentIndex < currentQuestions.length - 1) {
    currentIndex++;
    renderQuestion();
    document.getElementById('quizScreen').scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    showResults();
  }
}

function goPrev() {
  if (currentIndex > 0) {
    currentIndex--;
    renderQuestion();
    document.getElementById('quizScreen').scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function showResults() {
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.remove('hidden');
  document.getElementById('resultScreen').style.display = 'flex';

  const correct = questionStates.filter((s, i) => s.selected === currentQuestions[i].correct).length;
  const wrong = currentQuestions.length - correct;
  const pct = Math.round((correct / currentQuestions.length) * 100);

  document.getElementById('resultSubject').textContent = currentSubject.charAt(0).toUpperCase() + currentSubject.slice(1);
  document.getElementById('resCorrect').textContent = correct;
  document.getElementById('resWrong').textContent = wrong;
  document.getElementById('resPercent').textContent = pct + '%';
  lucide.createIcons();
}

function goHome() {
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('quizScreen').style.display = '';
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('resultScreen').style.display = '';
  document.getElementById('homeScreen').classList.remove('hidden');
  renderSubjects();
}

// ─── EVENTS ───
document.getElementById('backBtn').onclick = goHome;
document.getElementById('prevBtn').onclick = goPrev;
document.getElementById('nextBtn').onclick = goNext;
document.getElementById('shuffleBtn').onclick = shuffleQuestionsAndOptions;
document.getElementById('retryBtn').onclick = () => { goHome(); startQuiz(currentSubject); };
document.getElementById('homeBtn').onclick = goHome;

// ─── INIT ───
renderSubjects();

</script>
</body>
</html>
