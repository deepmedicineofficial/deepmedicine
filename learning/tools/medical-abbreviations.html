  { abbr: "Drowning", full: "Drowning / Near-Drowning", desc: "Respiratory impairment from immersion in fluid. Can cause aspiration, hypoxia, hypothermia. Resuscitate immediately regardless of submersion time.", cat: "emergency", usage: "Near-drowning victim — prolonged CPR, 90 minutes before pronouncement" },
  { abbr: "Trauma", full: "Trauma / Injury", desc: "Bodily injury from external force. Blunt (MVA, fall) or penetrating (GSW, stab wound). Managed per ATLS protocol (primary, secondary survey).", cat: "emergency", usage: "Blunt trauma from MVA — ATLS protocol activated" },
  { abbr: "ATLS", full: "Advanced Trauma Life Support", desc: "Systematic approach to trauma: Primary survey (airway, breathing, circulation, disability, exposure), resuscitation, secondary survey.", cat: "emergency", usage: "ATLS activation for multi-system trauma" },
  { abbr: "Pneumothorax", full: "Pneumothorax (Collapsed Lung)", desc: "Air in pleural space causing lung collapse. Spontaneous (primary/secondary) or traumatic. Presents with dyspnea, chest pain, decreased breath sounds.", cat: "emergency", usage: "Tension pneumothorax — needle decompression 2nd ICS, then chest tube" },
  { abbr: "Hemothorax", full: "Hemothorax (Blood in Pleural Space)", desc: "Bleeding into pleural cavity from trauma, anticoagulation, malignancy. Presents with dyspnea, hypotension. Requires chest tube drainage.", cat: "emergency", usage: "Hemothorax post-trauma — chest tube drains 1500 mL blood → VATS" },
  { abbr: "Tamponade", full: "Cardiac Tamponade", desc: "Pericardial fluid compressing heart chambers impeding filling. Beck's triad: JVD, hypotension, muffled heart sounds. Requires urgent pericardiocentesis.", cat: "emergency", usage: "Cardiac tamponade post-trauma — ultrasound-guided pericardiocentesis performed" },
  { abbr: "Rhabdo", full: "Rhabdomyolysis", desc: "Muscle breakdown releasing myoglobin into bloodstream. Causes: crush injury, prolonged immobility, statins, exertion. Presents with dark urine, hyperkalemia, AKI.", cat: "emergency", usage: "Rhabdomyolysis from crush injury — aggressive IV fluids, urine alkalinization" },
  { abbr: "DIC", full: "Disseminated Intravascular Coagulation", desc: "Pathologic activation of coagulation cascade causing microthrombi + consumption coagulopathy. Causes: sepsis, trauma, malignancy.", cat: "emergency", usage: "DIC from sepsis — PT/aPTT prolonged, fibrinogen low, D-dimer elevated" },
  { abbr: "MAS", full: "Meconium Aspiration Syndrome", desc: "Aspiration of meconium in utero/at delivery causing airway obstruction, hypoxia. Neonatal emergency requiring immediate airway clearance.", cat: "emergency", usage: "MAS in newborn — mechanical ventilation, high-frequency oscillatory ventilation" },
  { abbr: "Eclampsia", full: "Eclampsia", desc: "Seizures in pregnancy/postpartum from preeclampsia. Life-threatening maternal/fetal emergency. Managed with magnesium sulfate, antihypertensives.", cat: "emergency", usage: "Eclamptic seizure at 35 weeks — magnesium sulfate, urgent delivery" },
  { abbr: "Foreign Body", full: "Foreign Body Ingestion/Aspiration", desc: "Accidental/intentional swallowing/inhalation of non-food object. Airway FB life-threatening; GI FB often passes. Endoscopy for removal.", cat: "emergency", usage: "Aspiration of coin — bronchoscopy for airway FB removal" },
  { abbr: "Status Asthmaticus", full: "Status Asthmaticus (Severe Asthma Exacerbation)", desc: "Life-threatening asthma attack unresponsive to standard therapy. Requires ICU, IV steroids, continuous nebulizers, mechanical ventilation if needed.", cat: "emergency", usage: "Status asthmaticus — intubation, high-dose steroids, continuous albuterol" },

  // Surgery (30 entries)
  { abbr: "GA", full: "General Anesthesia", desc: "Drug-induced reversible state of unconsciousness, analgesia, amnesia, and muscle relaxation. Triad: hypnotic + opioid + muscle relaxant.", cat: "surgery", usage: "Procedure under GA — ASA Grade II" },
  { abbr: "LA", full: "Local Anesthesia", desc: "Reversible blockade of nerve conduction in a specific area. Agents: Lidocaine (rapid onset, 1–2 hr), Bupivacaine (slow onset, 4–8 hr).", cat: "surgery", usage: "Excision biopsy under LA — 2% Lidocaine with Adrenaline" },
  { abbr: "Regional", full: "Regional Anesthesia", desc: "Anesthesia of a large region via nerve block (epidural, spinal, peripheral nerve blocks). Used alone or combined with GA.", cat: "surgery", usage: "Lower limb surgery under spinal anesthesia — bupivacaine 0.5% 15mg" },
  { abbr: "Spinal", full: "Spinal Anesthesia", desc: "Single-shot injection of local anesthetic into subarachnoid space. Rapid onset, limited duration (1–3 hours). Used for lower body surgery.", cat: "surgery", usage: "Cesarean section under spinal anesthesia — rapid onset" },
  { abbr: "Epidural", full: "Epidural Anesthesia", desc: "Continuous infusion or boluses of local anesthetic into epidural space. Longer duration than spinal, titratable. Used perioperatively, postoperative analgesia.", cat: "surgery", usage: "Labor analgesia via epidural — patient-controlled epidural analgesia (PCEA)" },
  { abbr: "ASA", full: "American Society of Anesthesiologists (Physical Status)", desc: "Classification of patient fitness for anesthesia: I (healthy) to VI (brain-dead organ donor). Predicts perioperative morbidity.", cat: "surgery", usage: "ASA Grade III — patient with severe systemic disease (CHF)" },
  { abbr: "I&D", full: "Incision and Drainage", desc: "Surgical procedure to open and drain an abscess. Involves incision over point of maximum fluctuance, breaking loculations, irrigation, and packing.", cat: "surgery", usage: "Perianal abscess — I&D under LA" },
  { abbr: "POD", full: "Post-Operative Day", desc: "Counting system after surgery: POD 0 = day of surgery, POD 1 = first day after. Used to track recovery milestones and expected events.", cat: "surgery", usage: "POD 2 post-appendectomy — tolerating oral feeds, afebrile" },
  { abbr: "OT", full: "Operation Theatre / Operating Room", desc: "Sterile surgical environment for operative procedures. Includes laminar airflow, anesthesia equipment, surgical instruments, and monitoring systems.", cat: "surgery", usage: "Patient shifted to OT for emergency laparotomy" },
  { abbr: "Extubation", full: "Extubation (Removal of Endotracheal Tube)", desc: "Removal of endotracheal tube at end of surgery/critical care after assessment of readiness (spontaneous breathing trial, airway reflexes intact).", cat: "surgery", usage: "Extubated on POD 0 after successful trial — breathing spontaneously" },
  { abbr: "Anesthesia Record", full: "Anesthesia Record", desc: "Documentation of intraoperative patient course: vital signs, medications, fluid balance, airway management, complications.", cat: "surgery", usage: "Anesthesia record: stable vitals, 2L crystalloid infused, emergence uneventful" },
  { abbr: "Hemostasis", full: "Hemostasis (Bleeding Control)", desc: "Surgical techniques to stop bleeding: electrocautery, ligation, vessel clips, hemostatic agents (gauze, thrombin, fibrin glue).", cat: "surgery", usage: "Hemostasis achieved with electrocautery and ligation of bleeding vessel" },
  { abbr: "Hemovac", full: "Hemovac / Surgical Drain", desc: "Closed suction drainage system placed in surgical wound to drain blood/fluid. Prevents hematoma/seroma formation.", cat: "surgery", usage: "Hemovac drain placed — outputs 120 mL serosanguinous fluid POD 1" },
  { abbr: "Drain", full: "Surgical Drain", desc: "Tube placed in surgical wound for passive or active drainage. Types: Penrose (passive), Jackson-Pratt (active), Blake (active). Removed when output minimal.", cat: "surgery", usage: "Jackson-Pratt drain — removed POD 4 when output <10 mL/24h" },
  { abbr: "Wound Closure", full: "Wound Closure Techniques", desc: "Primary (sutured), delayed primary, secondary. Suture materials: absorbable (catgut, Vicryl), non-absorbable (nylon, prolene).", cat: "surgery", usage: "Skin closed with subcuticular Monocryl sutures — cosmetic closure" },
  { abbr: "Dehiscence", full: "Wound Dehiscence", desc: "Separation of wound edges before complete healing. Risk factors: infection, obesity, poor nutrition, tension. Requires reclosure.", cat: "surgery", usage: "Wound dehiscence on POD 8 — explored, no infection, resuturing performed" },
  { abbr: "Evisceration", full: "Wound Evisceration", desc: "Protrusion of abdominal contents through dehiscent incision. Surgical emergency. Cover with sterile gauze, IV fluids, urgent reexploration.", cat: "surgery", usage: "Abdominal evisceration — bowel visible, emergent reclosure" },
  { abbr: "Infection", full: "Surgical Site Infection (SSI)", desc: "Infection of surgical wound. Superficial, deep, or organ/space. Presents >72 hours postop with fever, erythema, pus, pain.", cat: "surgery", usage: "SSI with purulent discharge — wound culture, broad-spectrum antibiotics" },
  { abbr: "Seroma", full: "Seroma", desc: "Asymptomatic fluid collection in surgical wound from serum leakage. Usually resorbs spontaneously. Drain if large/symptomatic.", cat: "surgery", usage: "Seroma post-lumpectomy — observation, needle aspiration if enlarging" },
  { abbr: "Hematoma", full: "Hematoma", desc: "Blood collection in surgical wound/tissue. Small hematomas resorb; large ones require drainage. Risk of infection.", cat: "surgery", usage: "Postoperative hematoma — ultrasound confirms, observation vs aspiration" },
  { abbr: "DVT Prophylaxis", full: "DVT Prophylaxis (Thromboembolism Prevention)", desc: "Pharmacologic (anticoagulants) and mechanical (sequential compression devices, early mobilization) measures to prevent postoperative DVT.", cat: "surgery", usage: "DVT prophylaxis post-op — enoxaparin SC + SCDs × 7 days" },
  { abbr: "ICD", full: "Infection Control Department", desc: "Hospital department managing infection prevention and surveillance. Monitors SSI rates, recommends antibiotic policies.", cat: "surgery", usage: "ICD notified of post-op SSI cluster — investigation initiated" },
  { abbr: "Antibiotic Stewardship", full: "Antibiotic Stewardship", desc: "Appropriate selection, dosing, and duration of antibiotics. Aims to reduce resistance while optimizing outcomes.", cat: "surgery", usage: "Prophylactic cephalosporin × 1 dose intraoperatively per stewardship guidelines" },
  { abbr: "Elective Surgery", full: "Elective Surgery", desc: "Planned procedure performed when patient is optimized medically. Non-urgent timing allows preoperative workup.", cat: "surgery", usage: "Elective cholecystectomy — preop workup completed, surgery scheduled" },
  { abbr: "Urgent Surgery", full: "Urgent Surgery", desc: "Surgery needed within hours due to acute condition not immediately life-threatening but requires prompt intervention.", cat: "surgery", usage: "Urgent appendectomy — patient deteriorating, surgery within 2 hours" },
  { abbr: "Emergency Surgery", full: "Emergency Surgery", desc: "Immediate surgical intervention required (minutes to hours) for life-threatening condition. Minimal preoperative time.", cat: "surgery", usage: "Emergency laparotomy for ruptured AAA — activated immediately" },
  { abbr: "Laparoscopy", full: "Laparoscopic Surgery", desc: "Minimally invasive surgery using small incisions and camera (laparoscope). Advantages: less pain, faster recovery, shorter hospital stay.", cat: "surgery", usage: "Laparoscopic cholecystectomy — 4 trocars, specimen removed via bag" },
  { abbr: "Laparotomy", full: "Laparotomy (Open Abdominal Surgery)", desc: "Surgical opening of abdominal cavity via vertical (midline) or horizontal (Pfannenstiel) incision. Provides wide exposure for intra-abdominal procedures.", cat: "surgery", usage: "Emergency laparotomy for perforated viscus — midline incision" },
  { abbr: "Thoracotomy", full: "Thoracotomy (Open Chest Surgery)", desc: "Surgical opening of thoracic cavity via intercostal or median sternotomy incision. Access to heart, lungs, esophagus.", cat: "surgery", usage: "Median sternotomy for CABG — 3 vessel disease" },

  // OB/GYN (30 entries)
  { abbr: "LSCS", full: "Lower Segment Cesarean Section", desc: "Surgical delivery via transverse incision on lower uterine segment. Indications: fetal distress, malpresentation, CPD, previous 2+ LSCS, placenta previa.", cat: "obs", usage: "Emergency LSCS for fetal bradycardia — live male, 3.2 kg" },
  { abbr: "LMP", full: "Last Menstrual Period", desc: "First day of last normal menstrual period. Used to calculate gestational age and expected date of delivery (EDD) using Naegele's rule (+7 days, −3 months, +1 year).", cat: "obs", usage: "LMP: 15/01/2024 → EDD: 22/10/2024" },
  { abbr: "EDD", full: "Expected Date of Delivery", desc: "Estimated due date calculated from LMP (Naegele's rule) or confirmed by first trimester USG (most accurate). Normal pregnancy = 40 weeks ± 2 weeks.", cat: "obs", usage: "EDD by USG: 28/10/2024 — concordant with LMP dates" },
  { abbr: "G/P", full: "Gravida / Para", desc: "Obstetric history notation. Gravida = total pregnancies. Para = deliveries >20 weeks (TPAL: Term, Preterm, Abortions, Living).", cat: "obs", usage: "G3P2L2 — third pregnancy, 2 prior term deliveries, 2 living children" },
  { abbr: "PPH", full: "Postpartum Hemorrhage", desc: "Blood loss >500 mL (vaginal) or >1000 mL (cesarean) after delivery. Primary (<24h): uterine atony (70%), trauma, retained tissue, coagulopathy (4 T's).", cat: "obs", usage: "Primary PPH — atonic uterus, Oxytocin infusion + uterine massage" },
  { abbr: "FHR", full: "Fetal Heart Rate", desc: "Normal FHR: 110–160 bpm. Monitored by Doppler or CTG. Abnormalities: bradycardia (<110), tachycardia (>160), decelerations (early, late, variable).", cat: "obs", usage: "CTG: FHR 155 bpm, good variability, 2 accelerations — reactive" },
  { abbr: "CTG", full: "Cardiotocography", desc: "Simultaneous recording of fetal heart rate and uterine contractions. Assesses fetal well-being: normal (reassuring), equivocal, pathological (worrisome).", cat: "obs", usage: "CTG tracings concerning — variable decelerations, reduced variability" },
  { abbr: "NST", full: "Non-Stress Test", desc: "Fetal monitoring assessing FHR reactivity to fetal movement. Reactive (two or more accelerations >15 bpm lasting ≥15 sec) = reassuring.", cat: "obs", usage: "NST at 38 weeks — reactive, normal fetal well-being" },
  { abbr: "Biophysical Profile", full: "Biophysical Profile (BPP)", desc: "Ultrasound assessment scoring: FHR, fetal breathing, gross body movement, fetal tone, amniotic fluid. Score 8–10 = normal.", cat: "obs", usage: "BPP score 6/8 — oligohydramnios, deliver soon" },
  { abbr: "Preeclampsia", full: "Preeclampsia", desc: "Pregnancy-induced HTN (≥140/90) + proteinuria/organ dysfunction after 20 weeks. Severe: BP ≥160/110, symptoms, labs abnormal. Risk of eclampsia.", cat: "obs", usage: "Severe preeclampsia at 34 weeks — IV labetalol, corticosteroids, delivery" },
  { abbr: "Eclampsia", full: "Eclampsia", desc: "Seizures in pregnancy/postpartum from preeclampsia. Life-threatening maternal/fetal emergency. Managed with magnesium sulfate, antihypertensives, delivery.", cat: "obs", usage: "Eclamptic seizure at 35 weeks — magnesium sulfate, urgent delivery" },
  { abbr: "HELLP Syndrome", full: "HELLP Syndrome (Hemolysis, Elevated Liver Enzymes, Low Platelets)", desc: "Severe variant of preeclampsia. Hemolysis (schistocytes), LFT elevation, thrombocytopenia (<100,000). Obstetric emergency.", cat: "obs", usage: "HELLP syndrome — platelets 45,000, AST 450, LDH 800 — urgent delivery" },
  { abbr: "GDM", full: "Gestational Diabetes Mellitus", desc: "Glucose intolerance first recognized in pregnancy. Screened at 24–28 weeks with 1-hour glucose challenge test. Diagnosed if fasting ≥126, 1-hour ≥180, 2-hour ≥155 mg/dL.", cat: "obs", usage: "GDM diagnosed — dietary modification, monitor glucose, metformin if needed" },
  { abbr: "Miscarriage", full: "Miscarriage (Spontaneous Abortion)", desc: "Spontaneous loss of pregnancy <20 weeks. Threatened (pain/bleeding, viable), incomplete (partial tissue passed), complete (all tissue passed).", cat: "obs", usage: "Threatened miscarriage — ultrasound confirms fetal cardiac activity" },
  { abbr: "Ectopic", full: "Ectopic Pregnancy", desc: "Implantation outside uterine cavity (tubal, ovarian, abdominal). Presents with lower abdominal pain, vaginal bleeding, elevated β-hCG. Rupture = emergency.", cat: "obs", usage: "Ruptured ectopic pregnancy — emergency LSCS, β-hCG 50,000" },
  { abbr: "Molar Pregnancy", full: "Molar Pregnancy (Hydatidiform Mole)", desc: "Abnormal pregnancy from chromosomal error. Complete mole (no fetal tissue), partial (with fetal tissue). Presents with vaginal bleeding, large uterus for dates.", cat: "obs", usage: "Molar pregnancy — suction evacuation, follow β-hCG to zero" },
  { abbr: "IUGR", full: "Intrauterine Growth Restriction", desc: "Fetus <10th percentile for gestational age. Causes: placental insufficiency, maternal HTN, infection. Monitoring: serial ultrasounds, NST, consider delivery if indicated.", cat: "obs", usage: "IUGR at 34 weeks — amniotic fluid index 6 cm, delivery at 37 weeks" },
  { abbr: "Oligohydramnios", full: "Oligohydramnios (Low Amniotic Fluid)", desc: "Amniotic fluid index <5 cm or single deepest pocket <2 cm. Risk of cord compression, fetal distress. Requires close monitoring.", cat: "obs", usage: "Oligohydramnios AFI 4 — consider delivery if at term" },
  { abbr: "Polyhydramnios", full: "Polyhydramnios (Excess Amniotic Fluid)", desc: "Amniotic fluid index >25 cm. Causes: fetal anomalies, DM, multiple gestation, fetal anemia. Risk of preterm labor, cord prolapse.", cat: "obs", usage: "Polyhydramnios in DM pregnancy — frequent NST monitoring" },
  { abbr: "Labor", full: "Labor", desc: "Series of involuntary uterine contractions (3 in 10 minutes, lasting >40 sec) causing cervical effacement/dilation. Three stages: latent, active, deceleration, delivery.", cat: "obs", usage: "Active labor — cervix 6 cm dilated, regular contractions 3–5 min apart" },
  { abbr: "Induced Labor", full: "Induction of Labor", desc: "Artificial initiation of labor via cervical ripening agents (misoprostol, dinoprostone) or IV oxytocin. Indications: postdates, maternal/fetal compromise.", cat: "obs", usage: "Induction at 41 weeks — cervical ripening with misoprostol" },
  { abbr: "Augmentation", full: "Augmentation of Labor", desc: "Enhancement of spontaneous labor with oxytocin or amniotomy for inadequate progress.", cat: "obs", usage: "Augmentation after 6 hours no cervical change — oxytocin started" },
  { abbr: "Episiotomy", full: "Episiotomy (Perineal Incision)", desc: "Surgical incision of perineum to enlarge vaginal opening during delivery. Mediolateral (most common) or median. Reduces severe perineal trauma.", cat: "obs", usage: "Mediolateral episiotomy performed — sutured in layers" },
  { abbr: "Vacuum Extraction", full: "Vacuum Extraction (Operative Vaginal Delivery)", desc: "Cup applied to fetal scalp with traction during contractions. Indicates: prolonged second stage, fetal distress. Risks: scalp lacerations, cephalohematoma.", cat: "obs", usage: "Vacuum extraction in second stage — successful delivery, cephalohematoma noted" },
  { abbr: "Forceps Delivery", full: "Forceps Delivery", desc: "Metallic instruments applied to fetal head for traction. Low/outlet (visible scalp) vs mid-cavity (higher station). Rare now due to CS availability.", cat: "obs", usage: "Low forceps delivery — successful, episiotomy extended" },
  { abbr: "Retained Placenta", full: "Retained Placenta", desc: "Failure to expel placenta within 30–60 minutes of delivery. Manual removal under GA required if bleeding uncontrolled. Risk of PPH, infection.", cat: "obs", usage: "Retained placenta — manual removal performed, oxytocin post-extraction" },
  { abbr: "Placenta Previa", full: "Placenta Previa", desc: "Placenta covers cervical os partially (partial) or completely (complete). Risk of antepartum/postpartum hemorrhage. Delivery by LSCS if complete.", cat: "obs", usage: "Complete placenta previa — LSCS at 39 weeks (elective)" },
  { abbr: "Placental Abruption", full: "Placental Abruption (Abruptio Placentae)", desc: "Premature placental separation from uterine wall. Presents with vaginal bleeding, abdominal pain, uterine tenderness. Risk of PPH, DIC, fetal death.", cat: "obs", usage: "Placental abruption at 32 weeks — emergency LSCS, 2.5 kg stillbirth" },
  { abbr: "β-hCG", full: "Beta Human Chorionic Gonadotropin", desc: "Hormone produced by trophoblast; doubles every 48–72 hours in early pregnancy. Used to diagnose, confirm dating, exclude miscarriage/ectopic.", cat: "obs", usage: "β-hCG 125,000 at 10 weeks — appropriately elevated" },
  { abbr: "RhoGAM", full: "Rh Immunoglobulin (RhIG)", desc: "Passive immunization given to Rh-negative mother to prevent sensitization from Rh-positive fetal cells. Dose: 300 μg IM after delivery or complications.", cat: "obs", usage: "RhIG 300 mcg IM given to Rh-negative mother after vaginal delivery of Rh-positive infant" },

  // Psychiatry (25 entries)
  { abbr: "MDD", full: "Major Depressive Disorder", desc: "≥5 of 9 SIGECAPS criteria for ≥2 weeks (must include depressed mood or anhedonia). Sleep, Interest, Guilt, Energy, Concentration, Appetite, Psychomotor, Suicidal ideation.", cat: "psych", usage: "MDD — moderate severity, started SSRI (Sertraline 50mg)" },
  { abbr: "GAD", full: "Generalized Anxiety Disorder", desc: "Excessive worry about multiple domains for ≥6 months with ≥3 somatic symptoms (restlessness, fatigue, concentration difficulty, irritability, muscle tension, sleep disturbance).", cat: "psych", usage: "GAD — CBT + SSRI (Escitalopram 10mg OD)" },
  { abbr: "OCD", full: "Obsessive-Compulsive Disorder", desc: "Recurrent intrusive thoughts (obsessions) and repetitive behaviors (compulsions) causing significant distress and functional impairment. Ego-dystonic.", cat: "psych", usage: "OCD — contamination obsessions with hand-washing compulsions — high-dose SSRI + ERP" },
  { abbr: "PTSD", full: "Post-Traumatic Stress Disorder", desc: "Develops after exposure to traumatic event. Symptoms: re-experiencing (flashbacks), avoidance, negative cognitions, hyperarousal. Duration >1 month.", cat: "psych", usage: "PTSD following MVA — trauma-focused CBT initiated" },
  { abbr: "MSE", full: "Mental State Examination", desc: "Systematic psychiatric assessment: Appearance, Behavior, Speech, Mood, Affect, Thought (form/content), Perception, Cognition, Insight, Judgment.", cat: "psych", usage: "MSE: Kempt, cooperative, normal speech, low mood, congruent affect, no delusions/hallucinations, intact cognition, good insight" },
  { abbr: "Psychosis", full: "Psychosis", desc: "Loss of reality testing with delusions, hallucinations, disorganized speech/behavior. Causes: schizophrenia, bipolar, depression with psychosis, medical/substance-induced.", cat: "psych", usage: "Psychosis with paranoid delusions — antipsychotic (risperidone 3mg daily)" },
  { abbr: "Schizophrenia", full: "Schizophrenia", desc: "Chronic psychotic disorder. Symptoms: positive (hallucinations, delusions), negative (blunted affect, alogia, avolition), cognitive. Requires antipsychotics.", cat: "psych", usage: "Schizophrenia diagnosed — olanzapine 10mg daily + psychosocial support" },
  { abbr: "Bipolar I", full: "Bipolar I Disorder", desc: "Manic episodes with depressive episodes. Mania: ≥7 days elevated mood, 3+ criteria (decreased need for sleep, flight of ideas, distractibility, grandiosity, risky behavior, goal-directed activity, talkativeness).", cat: "psych", usage: "Bipolar I mania — lithium 900mg BD, antipsychotic adjunct" },
  { abbr: "Bipolar II", full: "Bipolar II Disorder", desc: "Hypomanic episodes (<7 days, less severe) with depressive episodes. No full manic episodes.", cat: "psych", usage: "Bipolar II depression — SSRI monotherapy contraindicated (risk of mood switching), lamotrigine preferred" },
  { abbr: "Mania", full: "Manic Episode", desc: "Distinct period of abnormally elevated, expansive, or irritable mood lasting ≥1 week with significant impairment. Grandiosity, decreased sleep need, flight of ideas, distractibility, risky behavior.", cat: "psych", usage: "Acute mania — hospitalization, IV valproate, antipsychotic" },
  { abbr: "Hypomania", full: "Hypomanic Episode", desc: "Elevated mood <7 days with milder impairment than mania. Increased productivity often noted (distinct from baseline).", cat: "psych", usage: "Hypomanic episode — valproate monotherapy sufficient" },
  { abbr: "Depression", full: "Depressive Episode", desc: "Sustained low mood with loss of pleasure, sleep disturbance, fatigue, guilt, concentration difficulty, psychomotor changes, suicidal thoughts.", cat: "psych", usage: "Moderate depression — SSRI + psychotherapy" },
  { abbr: "Dysthymia", full: "Persistent Depressive Disorder (Dysthymia)", desc: "Depressed mood most days for ≥2 years. Chronic, lower severity than MDD. Risk of superimposed MDD ('double depression').", cat: "psych", usage: "Dysthymia × 4 years — SSRI initiated" },
  { abbr: "Panic Disorder", full: "Panic Disorder", desc: "Recurrent unexpected panic attacks with ≥1 month of worry about future attacks or avoidance. Panic attack: sudden intense fear with physical symptoms.", cat: "psych", usage: "Panic disorder — SSRI (paroxetine) + CBT" },
  { abbr: "Anxiety Disorder", full: "Anxiety Disorder (General)", desc: "Excessive anxiety/worry causing functional impairment. Types: GAD, panic, social, specific phobia, agoraphobia.", cat: "psych", usage: "Generalized anxiety — benzodiazepine PRN, SSRI maintenance" },
  { abbr: "Social Anxiety", full: "Social Anxiety Disorder", desc: "Intense fear/anxiety in social situations with possible panic, embarrassment. Avoidance leads to functional impairment.", cat: "psych", usage: "Social phobia — SSRI + CBT/exposure therapy" },
  { abbr: "Agoraphobia", full: "Agoraphobia", desc: "Fear of situations (crowds, public transport, open spaces) with difficulty escaping or getting help. Often comorbid with panic disorder.", cat: "psych", usage: "Agoraphobia with panic — SSRI + behavioral therapy" },
  { abbr: "Insomnia", full: "Insomnia Disorder", desc: "Persistent difficulty initiating/maintaining sleep for ≥1 month. Causes impaired daytime functioning. Primary (idiopathic) vs secondary (medical, psychiatric, substance).", cat: "psych", usage: "Chronic insomnia — cognitive behavioral therapy for insomnia (CBT-I), trazodone PRN" },
  { abbr: "Sleep Apnea", full: "Obstructive Sleep Apnea (OSA)", desc: "Recurrent airway collapse during sleep causing arousals, hypoxia. Presents with snoring, daytime somnolence, witnessed apneas. CPAP treatment.", cat: "psych", usage: "OSA diagnosed on sleep study — CPAP initiated, improvement in daytime function" },
  { abbr: "ADHD", full: "Attention-Deficit/Hyperactivity Disorder", desc: "Childhood-onset neurodevelopmental disorder. Inattention, hyperactivity, impulsivity affecting functioning across contexts. Stimulant medication + behavioral interventions.", cat: "psych", usage: "ADHD in adult — methylphenidate initiated, improved focus" },
  { abbr: "Autism Spectrum", full: "Autism Spectrum Disorder (ASD)", desc: "Neurodevelopmental disorder with persistent social communication difficulties and restricted, repetitive behaviors. Spectrum from mild to severe impairment.", cat: "psych", usage: "ASD diagnosed in child — behavioral support, speech therapy" },
  { abbr: "Personality Disorder", full: "Personality Disorder", desc: "Pervasive maladaptive personality traits causing functional impairment. Clusters: A (odd), B (dramatic), C (anxious). Examples: ASPD, BPD, NPD.", cat: "psych", usage: "Borderline personality disorder — DBT (Dialectical Behavior Therapy)" },
  { abbr: "Substance Abuse", full: "Substance Use Disorder", desc: "Maladaptive substance use causing impairment. DSM-5: ≥2 of 11 criteria over 12 months. Mild, moderate, or severe.", cat: "psych", usage: "Alcohol use disorder moderate — counseling, naltrexone, AA meetings" },
  { abbr: "Withdrawal", full: "Withdrawal Syndrome", desc: "Physical symptoms after cessation of substance. Alcohol: tremor, seizures, delirium tremens. Opioid: dilated pupils, sweating, anxiety, pain. Management: supportive, medications.", cat: "psych", usage: "Alcohol withdrawal syndrome — benzodiazepine (lorazepam), thiamine, supportive care" },
];

let activeCategory = "all";
let allData = abbreviations;

// ─── Render ───
function renderTabs() {
  const c = document.getElementById("catTabs");
  c.innerHTML = categories.map(cat => `
    <button onclick="setCategory('${cat.id}')" id="tab-${cat.id}"
      class="cat-btn flex-shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium transition-all whitespace-nowrap
      ${activeCategory === cat.id ? 'bg-teal-700 text-white shadow-sm active' : 'bg-stone-100 text-stone-600 hover:bg-stone-200'}">
      <i data-lucide="${cat.icon}" style="width:13px;height:13px;"></i>
      ${cat.label}
    </button>
  `).join("");
  lucide.createIcons();
}

function renderCards(data) {
  const area = document.getElementById("contentArea");
  if (!data.length) {
    area.innerHTML = `<div class="text-center py-16"><div class="text-stone-300 text-5xl mb-4">🔍</div><p class="text-stone-400 text-sm">No abbreviations found</p></div>`;
    return;
  }
  // Group by category
  const grouped = {};
  data.forEach(item => {
    const cat = categories.find(c => c.id === item.cat);
    const label = cat ? cat.label : item.cat;
    if (!grouped[label]) grouped[label] = [];
    grouped[label].push(item);
  });

  let html = "";
  let delay = 0;
  for (const [section, items] of Object.entries(grouped)) {
    html += `<div class="mb-8"><h2 class="font-display text-lg font-bold text-stone-800 mb-3 flex items-center gap-2">
      <span class="w-1 h-5 bg-teal-600 rounded-full inline-block"></span>${section}
      <span class="text-xs font-normal text-stone-400 font-sans">(${items.length})</span>
    </h2><div class="grid grid-cols-1 md:grid-cols-2 gap-3">`;
    items.forEach(item => {
      html += `
      <div class="abbr-card bg-white rounded-xl border border-stone-200 p-4 fade-in shadow-sm hover:shadow-md" style="animation-delay:${delay}ms">
        <div class="flex items-start gap-3">
          <div class="flex-shrink-0 bg-teal-50 text-teal-700 font-bold text-sm px-2.5 py-1 rounded-lg border border-teal-100 font-mono">${item.abbr}</div>
          <div class="min-w-0 flex-1">
            <h3 class="font-semibold text-stone-800 text-sm leading-tight">${item.full}</h3>
            <p class="text-stone-500 text-xs mt-1.5 leading-relaxed">${item.desc}</p>
            <div class="mt-2 bg-stone-50 rounded-lg px-3 py-2 border border-stone-100">
              <span class="text-[10px] uppercase tracking-wider text-stone-400 font-semibold">Clinical Usage</span>
              <p class="text-stone-600 text-xs mt-0.5 italic">${item.usage}</p>
            </div>
          </div>
        </div>
      </div>`;
      delay = Math.min(delay + 30, 300);
    });
    html += `</div></div>`;
  }
  area.innerHTML = html;
  document.getElementById("resultCount").textContent = `Showing ${data.length} abbreviation${data.length !== 1 ? 's' : ''}`;
}

function setCategory(id) {
  activeCategory = id;
  renderTabs();
  filterAbbreviations();
}

function filterAbbreviations() {
  const q = document.getElementById("searchInput").value.toLowerCase().trim();
  document.getElementById("clearSearch").classList.toggle("hidden", !q);
  let filtered = allData;
  if (activeCategory !== "all") filtered = filtered.filter(a => a.cat === activeCategory);
  if (q) filtered = filtered.filter(a => a.abbr.toLowerCase().includes(q) || a.full.toLowerCase().includes(q) || a.desc.toLowerCase().includes(q));
  renderCards(filtered);
}

document.getElementById("searchInput").addEventListener("input", filterAbbreviations);

// ─── Element SDK ───
const defaultConfig = {
  page_title: "Medical Abbreviations",
  page_subtitle: "Comprehensive Reference Guide for Healthcare Professionals",
  background_color: "#fafaf9",
  surface_color: "#ffffff",
  text_color: "#1c1917",
  primary_action_color: "#0f766e",
  secondary_action_color: "#0d9488",
  font_family: "DM Sans",
  font_size: 14,
};

function applyConfig(config) {
  const t = config.page_title || defaultConfig.page_title;
  const s = config.page_subtitle || defaultConfig.page_subtitle;
  document.getElementById("pageTitle").textContent = t;
  document.getElementById("pageSubtitle").textContent = s;

  const bg = config.background_color || defaultConfig.background_color;
  const sf = config.surface_color || defaultConfig.surface_color;
  const tx = config.text_color || defaultConfig.text_color;
  const pa = config.primary_action_color || defaultConfig.primary_action_color;
  const sa = config.secondary_action_color || defaultConfig.secondary_action_color;
  const ff = config.font_family || defaultConfig.font_family;
  const fs = config.font_size || defaultConfig.font_size;

  document.getElementById("app").style.backgroundColor = bg;
  document.querySelectorAll(".abbr-card").forEach(el => { el.style.backgroundColor = sf; });
  document.querySelectorAll("h2, h3").forEach(el => { el.style.color = tx; });
  document.querySelectorAll(".cat-btn.active").forEach(el => { el.style.backgroundColor = pa; });
  document.querySelector("header").style.background = `linear-gradient(135deg, ${pa} 0%, ${sa} 100%)`;

  const stack = `${ff}, 'DM Sans', sans-serif`;
  document.body.style.fontFamily = stack;
  document.getElementById("pageTitle").style.fontFamily = `'Playfair Display', ${ff}, serif`;
  document.querySelectorAll("p, span, button").forEach(el => { el.style.fontSize = `${fs}px`; });
  document.querySelectorAll("h2").forEach(el => { el.style.fontSize = `${fs * 1.3}px`; });
  document.querySelectorAll("h3").forEach(el => { el.style.fontSize = `${fs}px`; });
  document.getElementById("pageTitle").style.fontSize = `${fs * 2.5}px`;
}

// Initial render
renderTabs();
renderCards(allData);
</script>
</body>
</html>
