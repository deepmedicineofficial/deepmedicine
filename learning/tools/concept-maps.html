        pathophysiology: ["Dopaminergic dysregulation: ↑D2 in mesolimbic pathway → Positive symptoms; ↓D1 in prefrontal cortex → Negative/Cognitive symptoms", "Glutamate (NMDA) hypofunction: Contributes to all symptom domains", "Structural: ↓Gray matter, Enlarged ventricles, ↓Hippocampal volume"],
        clinical: ["Positive symptoms: Hallucinations (auditory #1, 3rd person commentary), Delusions (persecutory #1), Disorganized speech (tangentiality, word salad), Disorganized/Catatonic behavior", "Negative symptoms (5 A's): Affective flattening, Alogia, Anhedonia, Avolition, Asociality", "Cognitive: ↓Working memory, ↓Executive function, ↓Attention", "DSM-5: ≥2 symptoms (one must be hallucinations, delusions, or disorganized speech) × ≥6 months with ≥1 month active"],
        diagnosis: ["Clinical diagnosis (DSM-5 criteria)", "Rule out: Substance-induced psychosis, Medical (Temporal lobe epilepsy, Brain tumor, Wilson, SLE, Anti-NMDAR encephalitis)", "Investigations: Drug screen, TFTs, MRI brain (rule out organic), Copper/Ceruloplasmin if young"],
        treatment: ["Second-generation antipsychotics (first-line): Risperidone, Olanzapine, Aripiprazole, Paliperidone", "First-generation: Haloperidol (acute psychosis, IM), Chlorpromazine", "Treatment-resistant (failed ≥2 antipsychotics): Clozapine (Gold standard - monitor ANC weekly×18wks for agranulocytosis)", "LAI (Long-acting injectables) for adherence: Paliperidone palmitate, Aripiprazole lauroxil", "Psychosocial: CBT for psychosis, Family intervention, Vocational rehabilitation, Social skills training", "Negative symptoms: Limited pharmacological options (Cariprazine, Clozapine partial benefit)"],
        complications: ["Metabolic syndrome (SGAs: Olanzapine, Clozapine → Weight gain, DM, Dyslipidemia)", "Tardive dyskinesia (FGAs > SGAs)", "Neuroleptic Malignant Syndrome: Rigidity + Hyperthermia + AMS + Autonomic instability → Stop antipsychotic, Dantrolene/Bromocriptine", "Clozapine: Agranulocytosis (1%), Myocarditis, Seizures", "Suicide (5-10% lifetime)", "Reduced life expectancy (15-20 years)"]
      }
    ]
  }
};

let currentCategory = 'cardiovascular';
let allData = [];

function renderNav() {
  const nav = document.getElementById('category-nav');
  nav.innerHTML = '';
  Object.entries(medicalData).forEach(([key, cat]) => {
    const btn = document.createElement('button');
    btn.className = `category-btn flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-all whitespace-nowrap ${key === currentCategory ? 'active text-white' : 'text-slate-400 hover:text-white'}`;
    btn.style.background = key === currentCategory ? cat.color + '22' : 'transparent';
    btn.style.border = key === currentCategory ? `1px solid ${cat.color}55` : '1px solid transparent';
    btn.innerHTML = `<i data-lucide="${cat.icon}" style="width:16px;height:16px;color:${cat.color};"></i><span>${cat.name}</span>`;
    btn.onclick = () => { currentCategory = key; renderAll(); };
    nav.appendChild(btn);
  });
}

function renderDiseases() {
  const cat = medicalData[currentCategory];
  document.getElementById('cat-title').textContent = cat.name + ' Diseases';
  document.getElementById('cat-desc').textContent = cat.desc;
  document.getElementById('category-header').className = 'mb-6 fade-in';

  const container = document.getElementById('disease-container');
  container.innerHTML = '';

  cat.diseases.forEach((disease, idx) => {
    const diseaseDiv = document.createElement('div');
    diseaseDiv.className = 'fade-in';
    diseaseDiv.style.animationDelay = `${idx * 0.1}s`;

    // Disease title
    const titleDiv = document.createElement('div');
    titleDiv.className = 'mb-4';
    titleDiv.innerHTML = `
      <div class="flex items-center gap-3 mb-3">
        <div class="badge" style="background:${cat.color}22;color:${cat.color};border:1px solid ${cat.color}44;">${cat.name}</div>
      </div>
      <h3 class="heading-font text-xl font-bold text-white">${disease.name}</h3>
    `;
    diseaseDiv.appendChild(titleDiv);

    // Tree diagram
    const treeContainer = document.createElement('div');
    treeContainer.className = 'tree-container';
    treeContainer.style.borderRadius = '8px';
    treeContainer.style.background = 'rgba(15,23,42,0.5)';
    treeContainer.style.border = '1px solid rgba(148,163,184,0.2)';

    const treeDiagram = document.createElement('div');
    treeDiagram.className = 'tree-diagram';

    // Column 1: Disease (Root)
    const col1 = document.createElement('div');
    col1.className = 'tree-column';
    const rootNode = document.createElement('div');
    rootNode.className = 'tree-node root fade-in';
    rootNode.style.borderColor = cat.color;
    rootNode.style.color = cat.color;
    rootNode.innerHTML = `
      <div style="font-size:0.7rem;opacity:0.7;">DISEASE</div>
      <div style="word-break:break-word;margin-top:4px;font-size:0.9rem;">${disease.name}</div>
    `;
    col1.appendChild(rootNode);
    treeDiagram.appendChild(col1);

    // Column 2: Etiology
    const col2 = document.createElement('div');
    col2.className = 'tree-column';
    const etiologyLabel = document.createElement('div');
    etiologyLabel.className = 'tree-label';
    etiologyLabel.style.color = '#fbbf24';
    etiologyLabel.textContent = 'Etiology';
    col2.appendChild(etiologyLabel);
    disease.etiology.slice(0, 3).forEach(item => {
      const node = document.createElement('div');
      node.className = 'tree-node section fade-in';
      node.style.borderColor = '#fbbf2433';
      node.style.color = '#fbbf24';
      node.textContent = item.substring(0, 40) + (item.length > 40 ? '...' : '');
      node.title = item;
      col2.appendChild(node);
    });
    treeDiagram.appendChild(col2);

    // Column 3: Pathophysiology
    const col3 = document.createElement('div');
    col3.className = 'tree-column';
    const pathLabel = document.createElement('div');
    pathLabel.className = 'tree-label';
    pathLabel.style.color = '#a78bfa';
    pathLabel.textContent = 'Pathophysiology';
    col3.appendChild(pathLabel);
    disease.pathophysiology.slice(0, 2).forEach(item => {
      const node = document.createElement('div');
      node.className = 'tree-node section fade-in';
      node.style.borderColor = '#a78bfa33';
      node.style.color = '#a78bfa';
      node.textContent = item.substring(0, 40) + (item.length > 40 ? '...' : '');
      node.title = item;
      col3.appendChild(node);
    });
    treeDiagram.appendChild(col3);

    // Column 4: Clinical Features
    const col4 = document.createElement('div');
    col4.className = 'tree-column';
    const clinLabel = document.createElement('div');
    clinLabel.className = 'tree-label';
    clinLabel.style.color = '#34d399';
    clinLabel.textContent = 'Clinical';
    col4.appendChild(clinLabel);
    disease.clinical.slice(0, 3).forEach(item => {
      const node = document.createElement('div');
      node.className = 'tree-node detail fade-in';
      node.style.borderColor = '#34d39933';
      node.style.color = '#34d399';
      node.textContent = item.substring(0, 35) + (item.length > 35 ? '...' : '');
      node.title = item;
      col4.appendChild(node);
    });
    treeDiagram.appendChild(col4);

    // Column 5: Diagnosis
    const col5 = document.createElement('div');
    col5.className = 'tree-column';
    const diagLabel = document.createElement('div');
    diagLabel.className = 'tree-label';
    diagLabel.style.color = '#60a5fa';
    diagLabel.textContent = 'Diagnosis';
    col5.appendChild(diagLabel);
    disease.diagnosis.slice(0, 3).forEach(item => {
      const node = document.createElement('div');
      node.className = 'tree-node detail fade-in';
      node.style.borderColor = '#60a5fa33';
      node.style.color = '#60a5fa';
      node.textContent = item.substring(0, 35) + (item.length > 35 ? '...' : '');
      node.title = item;
      col5.appendChild(node);
    });
    treeDiagram.appendChild(col5);

    // Column 6: Treatment
    const col6 = document.createElement('div');
    col6.className = 'tree-column';
    const treatLabel = document.createElement('div');
    treatLabel.className = 'tree-label';
    treatLabel.style.color = '#f472b6';
    treatLabel.textContent = 'Treatment';
    col6.appendChild(treatLabel);
    disease.treatment.slice(0, 3).forEach(item => {
      const node = document.createElement('div');
      node.className = 'tree-node detail fade-in';
      node.style.borderColor = '#f472b633';
      node.style.color = '#f472b6';
      node.textContent = item.substring(0, 35) + (item.length > 35 ? '...' : '');
      node.title = item;
      col6.appendChild(node);
    });
    treeDiagram.appendChild(col6);

    // Column 7: Complications
    const col7 = document.createElement('div');
    col7.className = 'tree-column';
    const compLabel = document.createElement('div');
    compLabel.className = 'tree-label';
    compLabel.style.color = '#fb923c';
    compLabel.textContent = 'Complications';
    col7.appendChild(compLabel);
    disease.complications.slice(0, 3).forEach(item => {
      const node = document.createElement('div');
      node.className = 'tree-node detail fade-in';
      node.style.borderColor = '#fb923c33';
      node.style.color = '#fb923c';
      node.textContent = item.substring(0, 35) + (item.length > 35 ? '...' : '');
      node.title = item;
      col7.appendChild(node);
    });
    treeDiagram.appendChild(col7);

    treeContainer.appendChild(treeDiagram);
    diseaseDiv.appendChild(treeContainer);

    // Full details button
    const detailsBtn = document.createElement('button');
    detailsBtn.className = 'mt-3 px-4 py-2 rounded-lg text-sm font-medium transition-all';
    detailsBtn.style.background = cat.color + '22';
    detailsBtn.style.color = cat.color;
    detailsBtn.style.border = `1px solid ${cat.color}55`;
    detailsBtn.textContent = '📋 View Full Clinical Details';
    detailsBtn.onclick = () => showFullDetails(disease, cat);
    diseaseDiv.appendChild(detailsBtn);

    container.appendChild(diseaseDiv);
  });

  lucide.createIcons();
}

function showFullDetails(disease, category) {
  const modal = document.createElement('div');
  modal.style.position = 'fixed';
  modal.style.top = '0';
  modal.style.left = '0';
  modal.style.right = '0';
  modal.style.bottom = '0';
  modal.style.background = 'rgba(0,0,0,0.7)';
  modal.style.display = 'flex';
  modal.style.alignItems = 'center';
  modal.style.justifyContent = 'center';
  modal.style.zIndex = '1000';
  modal.style.padding = '20px';
  modal.onclick = (e) => e.target === modal && modal.remove();

  const content = document.createElement('div');
  content.style.background = '#1e293b';
  content.style.borderRadius = '12px';
  content.style.maxWidth = '900px';
  content.style.maxHeight = '90vh';
  content.style.overflow = 'auto';
  content.style.padding = '30px';
  content.style.border = `2px solid ${category.color}`;

  const sections = [
    { label: 'Etiology', data: disease.etiology, color: '#fbbf24', icon: 'alert-circle' },
    { label: 'Pathophysiology', data: disease.pathophysiology, color: '#a78bfa', icon: 'git-branch' },
    { label: 'Clinical Features', data: disease.clinical, color: '#34d399', icon: 'stethoscope' },
    { label: 'Diagnosis', data: disease.diagnosis, color: '#60a5fa', icon: 'search' },
    { label: 'Treatment', data: disease.treatment, color: '#f472b6', icon: 'pill' },
    { label: 'Complications', data: disease.complications, color: '#fb923c', icon: 'alert-triangle' }
  ];

  let html = `
    <div class="flex justify-between items-start mb-6">
      <div>
        <h2 class="heading-font text-3xl font-bold text-white">${disease.name}</h2>
        <p class="text-slate-400 mt-1">${category.name} Specialty</p>
      </div>
      <button onclick="this.closest('div').parentElement.remove()" style="background:transparent;border:none;color:#fff;font-size:24px;cursor:pointer;padding:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center;">✕</button>
    </div>
  `;

  sections.forEach(s => {
    html += `
      <div style="margin-bottom:24px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
          <i data-lucide="${s.icon}" style="width:18px;height:18px;color:${s.color};"></i>
          <h3 style="color:${s.color};font-weight:bold;margin:0;font-size:1.1rem;text-transform:uppercase;letter-spacing:0.5px;">${s.label}</h3>
        </div>
        <div style="display:grid;grid-template-columns:1fr;gap:8px;margin-left:8px;">
          ${s.data.map(item => `
            <div style="background:rgba(${parseInt(s.color.slice(1,3),16)},${parseInt(s.color.slice(3,5),16)},${parseInt(s.color.slice(5,7),16)},0.1);border-left:3px solid ${s.color};padding:10px 12px;border-radius:4px;color:#e2e8f0;line-height:1.6;font-size:0.95rem;">
              ${item}
            </div>
          `).join('')}
        </div>
      </div>
    `;
  });

  content.innerHTML = html;
  modal.appendChild(content);
  document.body.appendChild(modal);
  lucide.createIcons();
}

function renderAll() {
  renderNav();
  renderDiseases();
  lucide.createIcons();
}

// Element SDK
const defaultConfig = {
  main_title: 'Medical Disease Concept Maps',
  subtitle: 'Clinically Accurate Reference',
  background_color: '#0f172a',
  surface_color: '#1e293b',
  text_color: '#e2e8f0',
  primary_color: '#fbbf24',
  secondary_color: '#64748b',
  font_family: 'Crimson Pro',
  font_size: 16
};

function applyConfig(config) {
  document.getElementById('main-title').textContent = config.main_title || defaultConfig.main_title;
  document.getElementById('subtitle').textContent = config.subtitle || defaultConfig.subtitle;

  const app = document.getElementById('app');
  app.style.background = `linear-gradient(135deg, ${config.background_color || defaultConfig.background_color} 0%, ${config.surface_color || defaultConfig.surface_color} 50%, ${config.background_color || defaultConfig.background_color} 100%)`;

  const font = config.font_family || defaultConfig.font_family;
  const size = config.font_size || defaultConfig.font_size;
  document.querySelectorAll('.heading-font').forEach(el => { el.style.fontFamily = `${font}, serif`; el.style.fontSize = `${size * 1.5}px`; });
  document.getElementById('main-title').style.fontSize = `${size * 1.5}px`;
}

renderAll();
</script>
