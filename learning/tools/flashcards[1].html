  <script>
// ===== FLASHCARD DATA =====
const topics = [
  { name: "Cardiology", icon: "heart", color: "#ef4444", cards: [
    { q: "What is the most common cause of myocardial infarction?", a: "Atherosclerotic plaque rupture in a coronary artery leading to thrombosis. The LAD (Left Anterior Descending) artery is the most commonly affected vessel, causing anterior wall MI. Risk factors include hypertension, diabetes, smoking, dyslipidemia, and family history." },
    { q: "Describe the ECG findings in acute STEMI.", a: "Hyperacute T waves (earliest sign) → ST-segment elevation ≥1mm in limb leads or ≥2mm in precordial leads → Pathological Q waves (>0.04s, >25% R wave height) → T wave inversion. Reciprocal ST depression is seen in opposite leads. The affected territory localizes the culprit artery." },
    { q: "What is the mechanism of action of ACE inhibitors in heart failure?", a: "ACE inhibitors block conversion of Angiotensin I to Angiotensin II, reducing afterload (vasodilation) and preload. They decrease aldosterone secretion (reducing sodium/water retention), prevent cardiac remodeling, reduce bradykinin degradation (additional vasodilation), and decrease mortality in HFrEF (CONSENSUS, SOLVD trials)." },
    { q: "Differentiate between systolic and diastolic heart failure.", a: "Systolic (HFrEF): EF <40%, dilated ventricle, impaired contraction. Causes: MI, dilated cardiomyopathy. Diastolic (HFpEF): EF ≥50%, thick/stiff ventricle, impaired relaxation. Causes: hypertension, hypertrophic cardiomyopathy, restrictive cardiomyopathy. Both present with dyspnea, edema, and elevated BNP." },
    { q: "What is the pathophysiology of atrial fibrillation?", a: "Multiple re-entrant wavelets or focal triggers (commonly from pulmonary veins) cause chaotic atrial depolarization at 350-600/min. The AV node filters impulses, producing irregularly irregular ventricular response. Atrial stasis → thrombus formation (especially in LAA) → stroke risk. CHA₂DS₂-VASc score guides anticoagulation." },
    { q: "Describe the murmur characteristics of mitral stenosis.", a: "Low-pitched rumbling mid-diastolic murmur best heard at apex with bell in left lateral decubitus position. Opening snap follows S2 (shorter S2-OS interval = more severe). Loud S1, presystolic accentuation in sinus rhythm. Causes: Rheumatic heart disease (most common), severe MAC. Normal MV area 4-6 cm²; severe stenosis <1 cm²." },
    { q: "What are the diagnostic criteria for infective endocarditis (Duke criteria)?", a: "MAJOR: 2 positive blood cultures with typical organism (Staph, Strep, HACEK); positive echocardiogram (vegetation, abscess, prosthetic dehiscence); new valvular regurgitation. MINOR: Predisposing condition, fever >38°C, vascular phenomena (Janeway lesions, emboli), immunologic (Osler nodes, Roth spots, RF+), suggestive micro. Definite = 2 major, or 1 major + 3 minor, or 5 minor." },
    { q: "Explain the management of acute pulmonary edema.", a: "Sit upright (reduce preload). Oxygen/NIV (CPAP/BiPAP). IV Furosemide 40-80mg (diuresis + venodilation). IV GTN infusion (preload/afterload reduction). Morphine 2-4mg (anxiolysis, venodilation – use cautiously). Treat underlying cause: ACS → PCI, arrhythmia → cardioversion, valve emergency → surgery. Monitor: SpO2, urine output, BP." },
    { q: "What is Brugada syndrome?", a: "Autosomal dominant channelopathy (SCN5A sodium channel mutation) causing sudden cardiac death. ECG: Coved ST elevation ≥2mm + negative T wave in V1-V3 (Type 1 pattern). More common in males, Southeast Asians. Triggers: fever, Na+ blockers, vagal tone. Risk of polymorphic VT/VF. Treatment: ICD implantation for high-risk patients. Avoid Class I antiarrhythmics." },
    { q: "Describe the stages of hypertension per ACC/AHA 2017 guidelines.", a: "Normal: <120/<80 mmHg. Elevated: 120-129/<80. Stage 1 HTN: 130-139 or 80-89. Stage 2 HTN: ≥140 or ≥90. Hypertensive Crisis: >180/>120. First-line drugs: ACEi/ARB, CCB, thiazide diuretic. Compelling indications modify choice (DM→ACEi/ARB, Black patients→CCB/thiazide, CKD→ACEi/ARB, HF→ACEi+BB+diuretic)." }
  ]},
  { name: "Pulmonology", icon: "wind", color: "#06b6d4", cards: [
    { q: "Differentiate between obstructive and restrictive lung disease on PFTs.", a: "Obstructive: FEV1/FVC <0.70 (reduced ratio), increased RV/TLC. Examples: COPD, asthma, bronchiectasis. Restrictive: FEV1/FVC normal or increased (≥0.70), reduced TLC (<80% predicted). Examples: ILD, obesity, neuromuscular disease, chest wall deformity. Mixed patterns show features of both." },
    { q: "What is the pathophysiology of ARDS?", a: "Diffuse alveolar damage → inflammatory cascade with neutrophil infiltration → damage to alveolar-capillary membrane → protein-rich pulmonary edema → surfactant dysfunction → atelectasis. Berlin Criteria: Acute onset (<1 week), bilateral opacities on CXR (not effusions/nodules), not fully explained by cardiac failure, PaO2/FiO2 ratio: Mild 200-300, Moderate 100-200, Severe <100 on PEEP ≥5." },
    { q: "Describe the management of acute severe asthma.", a: "Oxygen (target SpO2 94-98%). Nebulized salbutamol 5mg continuously or q20min. Ipratropium bromide 500mcg q20min×3 doses. IV hydrocortisone 100mg or oral prednisolone 40-50mg. If no response: IV magnesium sulfate 2g over 20min. Consider IV aminophylline, IV salbutamol. Intubation if: exhaustion, silent chest, declining consciousness, PaCO2 rising. ABG monitoring." },
    { q: "What are the causes and types of pleural effusion?", a: "Transudative (Light's criteria negative): CHF, cirrhosis, nephrotic syndrome, PE. Exudative (meets ≥1 Light's criterion: protein ratio >0.5, LDH ratio >0.6, LDH >2/3 upper normal): Infection (parapneumonic/empyema), malignancy, TB, PE, autoimmune (RA, SLE). Light's criteria: Pleural/serum protein >0.5, pleural/serum LDH >0.6, pleural LDH >2/3 upper limit serum normal." },
    { q: "Explain the staging of COPD per GOLD guidelines.", a: "Based on post-bronchodilator FEV1 (% predicted): GOLD 1 (Mild): ≥80%. GOLD 2 (Moderate): 50-79%. GOLD 3 (Severe): 30-49%. GOLD 4 (Very Severe): <30%. ABE assessment combines spirometry with exacerbation history and symptoms (CAT/mMRC). Group A: low symptoms, low exacerbations. Group B: high symptoms. Group E: ≥2 exacerbations or ≥1 hospitalization." },
    { q: "What is the workup for a solitary pulmonary nodule?", a: "Assess risk: Size (>8mm higher risk), morphology (spiculated > ground glass > solid > calcified), growth rate, patient factors (age, smoking). Low risk <8mm: CT surveillance (Fleischner criteria). Intermediate: PET-CT (SUV >2.5 suspicious). High risk/growing: CT-guided biopsy or surgical excision. Benign patterns: Popcorn (hamartoma), concentric/central/diffuse calcification." },
    { q: "Describe the mechanism and management of pulmonary embolism.", a: "Thrombus (usually from DVT in ileofemoral veins) embolizes to pulmonary arteries → V/Q mismatch, increased dead space, RV strain. Diagnosis: D-dimer (high NPV), CTPA (gold standard), Wells score risk stratification. Treatment: Massive (hemodynamic instability): systemic thrombolysis (alteplase) + heparin. Submassive/low risk: anticoagulation (LMWH→DOAC or UFH→warfarin) for ≥3 months." },
    { q: "What are the key features of idiopathic pulmonary fibrosis (IPF)?", a: "Progressive fibrosing ILD, typically in males >60 years. Usual Interstitial Pneumonia (UIP) pattern on HRCT: basal-predominant honeycombing, traction bronchiectasis, minimal ground glass. Restrictive PFTs with reduced DLCO. Velcro crackles, clubbing. Treatment: Pirfenidone or Nintedanib (slow decline, don't reverse). Median survival 3-5 years. Lung transplant for eligible patients." },
    { q: "Explain the diagnosis of tuberculosis.", a: "Active TB: Sputum AFB smear (Ziehl-Neelsen) × 3 samples, GeneXpert MTB/RIF (rapid, detects rifampicin resistance), culture on Löwenstein-Jensen media (gold standard, 4-8 weeks), CXR (upper lobe infiltrates, cavitation, miliary pattern). Latent TB: Mantoux/TST (≥5/10/15mm depending on risk), IGRA (QuantiFERON/T-SPOT). First-line treatment: RIPE (Rifampicin, Isoniazid, Pyrazinamide, Ethambutol) × 2 months, then RI × 4 months." },
    { q: "What is obstructive sleep apnea and how is it managed?", a: "Recurrent upper airway collapse during sleep → apneas (≥10s cessation) and hypopneas. AHI (Apnea-Hypopnea Index): Mild 5-15, Moderate 15-30, Severe >30 events/hour. Symptoms: Snoring, witnessed apneas, excessive daytime sleepiness (Epworth score), morning headaches. Diagnosis: Polysomnography. Treatment: Weight loss, CPAP (first-line for moderate-severe), mandibular advancement device (mild), surgery (uvulopalatopharyngoplasty) for selected cases." }
  ]},
  { name: "Gastroenterology", icon: "utensils", color: "#f59e0b", cards: [
    { q: "What are the causes of upper GI bleeding and initial management?", a: "Causes: Peptic ulcer disease (most common, 40%), variceal bleeding (portal HTN), Mallory-Weiss tear, erosive gastritis/esophagitis, malignancy, Dieulafoy lesion, AVM. Initial: ABC, 2 large-bore IV cannulae, fluid resuscitation, type & crossmatch, transfuse if Hb <7 (or <8 if IHD). PPI infusion (omeprazole 80mg bolus + 8mg/hr). Glasgow-Blatchford score for risk. Urgent endoscopy within 24h." },
    { q: "Describe the Child-Pugh classification for cirrhosis.", a: "5 parameters scored 1-3 each: Bilirubin (<2/2-3/>3 mg/dL), Albumin (>3.5/2.8-3.5/<2.8 g/dL), INR (<1.7/1.7-2.3/>2.3), Ascites (none/mild/moderate-severe), Encephalopathy (none/grade 1-2/grade 3-4). Class A: 5-6 (well-compensated, 100% 1-yr survival). Class B: 7-9 (significant compromise, 80%). Class C: 10-15 (decompensated, 45%). Guides prognosis and surgical risk." },
    { q: "What is the pathophysiology of acute pancreatitis?", a: "Premature activation of trypsinogen → trypsin within pancreatic acinar cells → autodigestion → local inflammation → SIRS → organ failure. Causes: Gallstones (40%), Alcohol (40%), then: hypertriglyceridemia, ERCP, drugs (azathioprine, valproate), trauma, scorpion sting. Diagnosis: 2 of 3: characteristic pain, lipase >3× ULN, imaging findings. Severity: Revised Atlanta (mild/moderate-severe/severe). Ranson's and APACHE II for prognosis." },
    { q: "Differentiate between Crohn's disease and Ulcerative Colitis.", a: "Crohn's: Any GI tract (mouth to anus), skip lesions, transmural inflammation, non-caseating granulomas, cobblestone mucosa, strictures/fistulae, terminal ileum common. UC: Colon only, continuous from rectum, mucosal/submucosal, crypt abscesses, pseudopolyps, lead-pipe colon. Both: diarrhea, abdominal pain, extraintestinal manifestations (arthritis, uveitis, erythema nodosum, PSC with UC, oxalate stones with Crohn's)." },
    { q: "Explain the management of hepatic encephalopathy.", a: "Precipitants: GI bleed, infection, constipation, electrolyte imbalance, sedatives, excess protein, dehydration. Pathophysiology: Ammonia crosses BBB → astrocyte swelling, altered neurotransmission. West Haven grades 1-4. Treatment: Lactulose (titrate to 2-3 soft stools/day, reduces ammonia absorption). Rifaximin 550mg BD (reduces ammonia-producing bacteria). Treat precipitant. Protein restriction NOT recommended long-term. Zinc supplementation may help." },
    { q: "What are the alarm features in dyspepsia requiring urgent investigation?", a: "ALARMS mnemonic: Anemia/Anorexia, Loss of weight (unintentional), Abdominal mass/lymphadenopathy, Recent onset progressive symptoms, Melena/hematemesis, Swallowing difficulty (dysphagia). Also: Age >55 with new dyspepsia, persistent vomiting, family history of upper GI cancer, previous gastric ulcer/surgery. These warrant urgent upper GI endoscopy (OGD) within 2 weeks to exclude malignancy." },
    { q: "Describe the diagnosis and management of celiac disease.", a: "Autoimmune reaction to gluten (gliadin) → villous atrophy in small intestine. Serology: Anti-tTG IgA (most sensitive/specific screening), anti-endomysial IgA, check total IgA (2-3% are IgA deficient → use IgG-based tests). Diagnosis: Duodenal biopsy showing villous atrophy, crypt hyperplasia, intraepithelial lymphocytes (Marsh classification). HLA-DQ2/DQ8 (high NPV). Treatment: Lifelong strict gluten-free diet. Monitor: tTG levels, DEXA scan." },
    { q: "What is spontaneous bacterial peritonitis (SBP)?", a: "Infection of ascitic fluid without surgical cause, occurs in cirrhotic patients with ascites. Organisms: E. coli (most common), Klebsiella, Streptococcus. Diagnosis: Ascitic fluid PMN count ≥250/mm³. Symptoms may be subtle: fever, abdominal pain, worsening encephalopathy. Treatment: IV Ceftriaxone or Cefotaxime × 5 days + IV Albumin (1.5g/kg day 1, 1g/kg day 3) to prevent hepatorenal syndrome. Prophylaxis: Norfloxacin 400mg daily." },
    { q: "Explain the Rome IV criteria for Irritable Bowel Syndrome.", a: "Recurrent abdominal pain ≥1 day/week in last 3 months, associated with ≥2 of: Related to defecation, change in stool frequency, change in stool form. Onset ≥6 months before diagnosis. Subtypes: IBS-C (constipation), IBS-D (diarrhea), IBS-M (mixed), IBS-U (unsubtyped). Diagnosis of exclusion. Management: Diet (low FODMAP), fiber, antispasmodics (hyoscine), loperamide (IBS-D), linaclotide (IBS-C), TCAs/SSRIs, CBT." },
    { q: "What are the complications of GERD and Barrett's esophagus?", a: "GERD complications: Erosive esophagitis (LA classification A-D), stricture, Barrett's esophagus, adenocarcinoma. Barrett's: Intestinal metaplasia replacing squamous epithelium (goblet cells on biopsy). Dysplasia surveillance: No dysplasia → OGD every 3-5 years, low-grade → every 6-12 months or RFA, high-grade → endoscopic mucosal resection (EMR) or radiofrequency ablation (RFA). Risk of adenocarcinoma: 0.5% per year in non-dysplastic Barrett's." }
  ]},
  { name: "Neurology", icon: "brain", color: "#a855f7", cards: [
    { q: "What is the NIH Stroke Scale and acute stroke management?", a: "NIHSS: 11-item scale (0-42) assessing consciousness, gaze, visual fields, facial palsy, motor arm/leg, ataxia, sensory, language, dysarthria, extinction. Acute ischemic stroke: CT head (exclude hemorrhage) → IV Alteplase (0.9mg/kg, max 90mg) within 4.5 hours of onset. Mechanical thrombectomy for large vessel occlusion within 24 hours (if eligible by perfusion imaging). BP target <185/110 pre-thrombolysis. Antiplatelet after 24h if no hemorrhage." },
    { q: "Differentiate between the types of headache.", a: "Migraine: Unilateral, pulsating, 4-72h, nausea/vomiting, photo/phonophobia, ±aura. Tension: Bilateral, pressing/tightening, 30min-7days, mild-moderate. Cluster: Unilateral orbital/temporal, severe, 15-180min, autonomic features (lacrimation, rhinorrhea, ptosis, miosis). Red flags (SNOOP): Systemic symptoms, Neurologic signs, Onset sudden (thunderclap), Older age onset, Pattern change." },
    { q: "Describe the clinical features of Parkinson's disease.", a: "Cardinal features (TRAP): Tremor (resting, pill-rolling, 4-6Hz, asymmetric onset), Rigidity (lead-pipe ± cogwheel), Akinesia/Bradykinesia (slowness of movement, reduced amplitude), Postural instability (late feature). Non-motor: REM sleep behavior disorder, anosmia, constipation, depression, cognitive decline. Pathology: Loss of dopaminergic neurons in substantia nigra pars compacta, Lewy bodies (α-synuclein). Treatment: Levodopa/Carbidopa (gold standard), dopamine agonists, MAO-B inhibitors." },
    { q: "What are the types of seizures per ILAE 2017 classification?", a: "Focal onset: Aware or impaired awareness; motor (automatisms, clonic, tonic) or non-motor (sensory, cognitive, emotional, autonomic); ± focal to bilateral tonic-clonic. Generalized onset: Motor (tonic-clonic, tonic, clonic, myoclonic, atonic) or non-motor (absence: typical, atypical). Unknown onset. First-line AEDs: Focal → Lamotrigine, Levetiracetam, Carbamazepine. Generalized → Valproate (not in women of childbearing age), Lamotrigine, Levetiracetam." },
    { q: "Explain the CSF findings in common CNS infections.", a: "Bacterial meningitis: ↑↑WCC (neutrophils >1000), ↑protein (>1g/L), ↓↓glucose (<40% serum), turbid. Viral meningitis: ↑WCC (lymphocytes 50-1000), mildly ↑protein, normal glucose, clear. TB meningitis: ↑WCC (lymphocytes 50-500), ↑↑protein, ↓glucose, fibrin web. Fungal (Crypto): ↑WCC (lymphocytes), ↑protein, ↓glucose, India ink positive. Normal CSF: 0-5 WCC, protein 0.15-0.45g/L, glucose 2.5-4.5mmol/L." },
    { q: "What is Guillain-Barré syndrome (GBS)?", a: "Acute inflammatory demyelinating polyradiculoneuropathy. Post-infectious (Campylobacter jejuni most common, also CMV, EBV, Zika). Ascending symmetrical weakness, areflexia, sensory symptoms. Cranial nerve involvement (facial diplegia). Autonomic dysfunction. CSF: Albuminocytological dissociation (↑protein, normal cells). NCS: Demyelinating pattern. Respiratory monitoring crucial (FVC <20mL/kg → intubate). Treatment: IVIG or plasmapheresis. No steroids. Recovery weeks-months." },
    { q: "Describe the diagnostic criteria for multiple sclerosis.", a: "McDonald Criteria 2017: Dissemination in Space (DIS): ≥1 T2 lesion in ≥2 of 4 MS-typical areas (periventricular, cortical/juxtacortical, infratentorial, spinal cord). Dissemination in Time (DIT): Simultaneous gadolinium-enhancing and non-enhancing lesions OR new T2/enhancing lesion on follow-up MRI OR CSF oligoclonal bands (replaces DIT). Types: Relapsing-remitting (85%), secondary progressive, primary progressive. Treatment: DMTs (interferons, glatiramer, natalizumab, ocrelizumab)." },
    { q: "What is status epilepticus and its management?", a: "Seizure lasting >5 minutes or ≥2 seizures without full recovery between. Emergency. Stage 1 (0-5min): ABC, oxygen, glucose check, IV access. Stage 2 (5-20min): IV Lorazepam 4mg (repeat once) or IM Midazolam 10mg if no IV. Stage 3 (20-40min): IV Levetiracetam 60mg/kg, Valproate 40mg/kg, or Phenytoin 20mg/kg (with cardiac monitoring). Refractory (>40min): RSI and general anesthesia (propofol/midazolam/thiopental infusion). Continuous EEG monitoring." },
    { q: "Explain the clinical features of myasthenia gravis.", a: "Autoimmune: Anti-AChR antibodies (85%) or anti-MuSK antibodies (5-8%) at neuromuscular junction. Fluctuating fatigable weakness, worse with activity, better with rest. Ocular (ptosis, diplopia) → generalized (bulbar: dysarthria, dysphagia; limb: proximal). Myasthenic crisis: Respiratory failure. Diagnosis: AChR antibodies, Tensilon test (edrophonium), repetitive nerve stimulation (decrement), single-fiber EMG. CT chest (thymoma 10-15%). Treatment: Pyridostigmine, steroids, azathioprine, thymectomy, IVIG/plasmapheresis for crisis." },
    { q: "What are the features and management of raised intracranial pressure?", a: "Symptoms: Headache (worse morning/bending/coughing), nausea/vomiting, visual changes (blurred vision, diplopia from CN VI palsy). Signs: Papilledema, Cushing's triad (hypertension, bradycardia, irregular respiration – late sign), altered consciousness, CN III palsy (ipsilateral fixed dilated pupil). Causes: Mass lesion, hydrocephalus, cerebral edema, venous sinus thrombosis. Management: Head elevation 30°, IV Mannitol 20% (1g/kg) or hypertonic saline 3%, dexamethasone (vasogenic edema/tumors), hyperventilation (target PaCO2 30-35mmHg as temporizing), surgical decompression/EVD." }
  ]},
  { name: "Nephrology", icon: "droplets", color: "#3b82f6", cards: [
    { q: "Describe the stages of Chronic Kidney Disease (CKD).", a: "Based on GFR (mL/min/1.73m²): Stage 1: ≥90 (normal GFR with kidney damage markers). Stage 2: 60-89 (mildly decreased). Stage 3a: 45-59. Stage 3b: 30-44. Stage 4: 15-29. Stage 5: <15 (kidney failure). Albuminuria categories: A1 <30, A2 30-300, A3 >300 mg/g. Management: BP control (ACEi/ARB), glycemic control, avoid nephrotoxins, manage complications (anemia-EPO, bone disease-phosphate binders/vitamin D, acidosis-bicarbonate). Dialysis/transplant planning at Stage 4-5." },
    { q: "What are the causes and management of hyperkalemia?", a: "Causes: Renal failure, ACEi/ARBs, K-sparing diuretics, acidosis, rhabdomyolysis, tumor lysis, Addison's, hemolysis (pseudohyperkalemia). ECG changes: Peaked T waves → wide QRS → sine wave → VF/asystole. Management: Cardiac protection: IV Calcium gluconate 10% 10mL (stabilizes myocardium). Shift K intracellularly: Insulin 10U + Glucose 50mL 50%, nebulized salbutamol 10-20mg. Remove K: Sodium polystyrene sulfonate, loop diuretics, dialysis (definitive)." },
    { q: "Differentiate between nephrotic and nephritic syndrome.", a: "Nephrotic: Proteinuria >3.5g/day, hypoalbuminemia, edema, hyperlipidemia, lipiduria. Causes: Minimal change (children), membranous (adults), FSGS, diabetic nephropathy, amyloidosis. Nephritic: Hematuria (RBC casts), mild-moderate proteinuria, hypertension, oliguria, elevated creatinine. Causes: Post-streptococcal GN, IgA nephropathy, RPGN (anti-GBM, ANCA vasculitis), lupus nephritis. Some conditions overlap (membranoproliferative GN)." },
    { q: "Explain the pathophysiology of Acute Kidney Injury (AKI).", a: "Pre-renal (60-70%): Reduced perfusion – dehydration, hemorrhage, sepsis, heart failure, NSAIDs/ACEi. FENa <1%, urine osm >500. Intrinsic (25-30%): ATN (ischemia, nephrotoxins – aminoglycosides, contrast), glomerulonephritis, interstitial nephritis. FENa >2%. Post-renal (5-10%): Obstruction – BPH, stones, tumor, retroperitoneal fibrosis. KDIGO staging: Stage 1 (Cr 1.5-1.9× or UO <0.5mL/kg/h ×6h), Stage 2 (2-2.9×), Stage 3 (≥3× or Cr ≥4 or RRT initiated)." },
    { q: "What is the approach to acid-base disorders?", a: "Step 1: pH (acidemia <7.35, alkalemia >7.45). Step 2: Primary disorder (CO2 or HCO3). Step 3: Compensation (Winter's formula for metabolic acidosis: expected PCO2 = 1.5×HCO3 + 8 ±2). Step 4: Anion gap = Na-(Cl+HCO3), normal 8-12. High AG acidosis (MUDPILES): Methanol, Uremia, DKA, Propylene glycol, INH/Iron, Lactic acidosis, Ethylene glycol, Salicylates. Non-AG: RTA, diarrhea, saline infusion. Delta-delta ratio for mixed disorders." },
    { q: "Describe the management of nephrolithiasis.", a: "Types: Calcium oxalate (80%, radiopaque), struvite (infection stones, staghorn), uric acid (radiolucent), cystine (hexagonal crystals). Acute: NSAIDs (ketorolac) > opioids, IV fluids, alpha-blockers (tamsulosin – MET for 5-10mm distal stones). Imaging: Non-contrast CT KUB (gold standard). Intervention: <5mm usually passes; 5-10mm trial of passage; >10mm or >2cm → ESWL, ureteroscopy, or PCNL. Prevention: Hydration (>2.5L/day), low sodium/protein diet, thiazides (calcium stones), allopurinol (uric acid), potassium citrate." },
    { q: "What are the indications for emergency dialysis?", a: "AEIOU mnemonic: Acidosis (severe metabolic, pH <7.1, refractory to bicarbonate). Electrolytes (hyperkalemia refractory to medical management). Intoxication (methanol, ethylene glycol, lithium, salicylates). Overload (fluid overload/pulmonary edema refractory to diuretics). Uremia (encephalopathy, pericarditis, bleeding). Additional: Refractory hyperphosphatemia, certain drug overdoses. Modalities: Intermittent hemodialysis (hemodynamically stable), CRRT (unstable patients in ICU)." },
    { q: "Explain IgA nephropathy (Berger's disease).", a: "Most common primary glomerulonephritis worldwide. Mesangial IgA deposition. Presentation: Synpharyngitic hematuria (gross hematuria within 1-2 days of URI – unlike post-strep which is 2-3 weeks later), persistent microscopic hematuria ± proteinuria. Diagnosis: Renal biopsy – mesangial IgA deposits on immunofluorescence, mesangial proliferation. Serum IgA elevated in 50%. Treatment: ACEi/ARB for proteinuria >0.5g/day. Immunosuppression (steroids) for persistent proteinuria >1g/day despite RAAS blockade. 20-40% progress to ESKD over 20 years." },
    { q: "What is renal tubular acidosis (RTA) and its types?", a: "Type 1 (Distal): Cannot secrete H+ in collecting duct. Urine pH >5.5, hypokalemia, nephrocalcinosis/stones. Causes: Sjögren's, SLE, amphotericin B. Type 2 (Proximal): Cannot reabsorb HCO3 in PCT. Urine pH variable, hypokalemia, Fanconi syndrome. Causes: Myeloma, carbonic anhydrase inhibitors. Type 4 (Hyperkalemic): Aldosterone deficiency/resistance. Urine pH <5.5, hyperkalemia. Causes: Diabetic nephropathy, ACEi/ARBs, Addison's. All have non-anion gap metabolic acidosis." },
    { q: "Describe the approach to hyponatremia.", a: "Serum Na <135 mEq/L. Step 1: Serum osmolality (hypo <275, iso 275-295, hyper >295). Step 2: Volume status. Hypovolemic: Dehydration, diuretics, Addison's → NS. Euvolemic: SIADH, hypothyroidism, cortisol deficiency → fluid restriction, vasopressin antagonists. Hypervolemic: CHF, cirrhosis, nephrotic → fluid/salt restriction, diuretics. Correction rate: Max 8-10 mEq/L in 24h to prevent osmotic demyelination syndrome (central pontine myelinolysis). Severe/symptomatic: 3% hypertonic saline." }
  ]},
  { name: "Endocrinology", icon: "activity", color: "#10b981", cards: [
    { q: "Describe the diagnosis and management of Diabetic Ketoacidosis.", a: "Diagnosis: Blood glucose >250 mg/dL (may be lower in euglycemic DKA), pH <7.3, HCO3 <18, ketonemia/ketonuria, anion gap >12. Precipitants: Infection (most common), non-compliance, new diagnosis, MI, drugs. Management: IV fluids (NS 1L/hr initially → 0.45% NS when Na normalizes), IV Insulin infusion (0.1U/kg/hr – don't bolus), Potassium replacement (if K <5.3 before insulin, if <3.3 hold insulin), monitor glucose hourly, switch to SC insulin when gap closes, eating, pH >7.3." },
    { q: "What is the approach to thyroid nodules?", a: "Found in 4-7% by palpation, 50% by ultrasound. Evaluation: TSH first. If low → thyroid scan (hot nodule rarely malignant). If normal/high → ultrasound (Bethesda/TI-RADS classification). FNA if: >1cm with suspicious US features, >1.5cm if intermediate, >2cm if low suspicion. Bethesda system: I-nondiagnostic (repeat), II-benign (follow), III-AUS (repeat/molecular), IV-follicular neoplasm (surgery), V-suspicious (surgery), VI-malignant (surgery). Risk factors: radiation history, family history, rapid growth, fixation." },
    { q: "Differentiate between Cushing's syndrome and Addison's disease.", a: "Cushing's (excess cortisol): Central obesity, moon facies, buffalo hump, purple striae, thin skin, easy bruising, HTN, DM, osteoporosis, proximal myopathy. Screening: 24h urinary cortisol, overnight dexamethasone suppression test, late-night salivary cortisol. Addison's (adrenal insufficiency): Fatigue, weight loss, hyperpigmentation (ACTH excess), hypotension, hyponatremia, hyperkalemia. Diagnosis: Short Synacthen test (cortisol fails to rise). Crisis: IV hydrocortisone 100mg stat + NS." },
    { q: "Explain the management of Type 2 Diabetes Mellitus.", a: "Lifestyle modification first. Metformin (first-line, unless contraindicated – eGFR <30). Second-line based on comorbidities: CVD/high risk → GLP-1 RA (semaglutide, liraglutide) or SGLT2i (empagliflozin, dapagliflozin). HF/CKD → SGLT2i. If HbA1c target not met: Add third agent, consider insulin. HbA1c target <7% (individualize). Monitor: HbA1c q3-6mo, annual eye/foot/renal screening, lipid profile, BP. SGLT2i also reduce CV events and CKD progression independently." },
    { q: "What are the causes of hypercalcemia and its management?", a: "90% caused by: Primary hyperparathyroidism (outpatient – elevated PTH, elevated Ca) and malignancy (inpatient – PTHrP, bone mets, myeloma). Other: Sarcoidosis/granulomas (↑1,25-vitD), thiazides, vitamin D toxicity, milk-alkali, thyrotoxicosis. Symptoms: 'Stones (renal), Bones (pain/osteoporosis), Groans (abdominal pain/constipation), Moans (psychiatric/confusion)'. Management: IV NS (200-300mL/hr), IV Zoledronic acid 4mg (for malignancy), calcitonin (rapid but temporary), steroids (granulomatous), parathyroidectomy (primary HPT)." },
    { q: "Describe pheochromocytoma diagnosis and management.", a: "Catecholamine-secreting tumor from adrenal medulla chromaffin cells (90%) or extra-adrenal paraganglia. Rule of 10s: 10% bilateral, 10% extra-adrenal, 10% malignant, 10% familial (MEN2, VHL, NF1, SDH mutations). Presentation: Paroxysmal HTN, headache, sweating, palpitations, pallor. Diagnosis: 24h urine metanephrines/catecholamines or plasma free metanephrines (most sensitive). Imaging: CT/MRI adrenals, MIBG scan. Pre-op: Alpha-blockade FIRST (phenoxybenzamine 10-14 days) THEN beta-blockade. Never beta-block first (unopposed alpha → crisis)." },
    { q: "What is the evaluation of a pituitary incidentaloma?", a: "Found in 10-20% of MRIs. Microadenoma <10mm, macroadenoma ≥10mm. Hormonal workup for ALL: Prolactin (prolactinoma), IGF-1 (acromegaly), 24h urinary cortisol or 1mg DST (Cushing's), TSH/free T4, LH/FSH/testosterone or estradiol, Na+ (diabetes insipidus). Macroadenoma: Add visual field testing (bitemporal hemianopia from optic chiasm compression). Treatment: Prolactinoma → dopamine agonist (cabergoline). Non-functional → surgery if visual compromise or growth. Microadenoma → surveillance MRI." },
    { q: "Explain the diagnosis of primary hyperaldosteronism.", a: "Most common cause of secondary hypertension (5-13% of HTN). Suspect if: Resistant HTN, hypokalemia (only in 30%), adrenal incidentaloma. Screening: Aldosterone/Renin Ratio (ARR) >30 with aldosterone >15ng/dL. Confirm: Oral sodium loading test, IV saline infusion test, or fludrocortisone suppression test. Subtype: CT adrenals + adrenal vein sampling (AVS – gold standard to lateralize). Causes: Aldosterone-producing adenoma (Conn's syndrome – surgery), bilateral hyperplasia (spironolactone/eplerenone)." },
    { q: "What is thyroid storm and how is it managed?", a: "Life-threatening thyrotoxicosis. Triggers: Surgery, infection, iodine load, DKA, trauma in uncontrolled hyperthyroidism. Features: Hyperthermia (>40°C), tachycardia/AF, altered mental status, GI symptoms (diarrhea, jaundice), heart failure. Burch-Wartofsky score >45 diagnostic. Management ORDER matters: 1) Beta-blocker (propranolol 60-80mg q4h – also blocks T4→T3). 2) Thionamide (PTU preferred – blocks T4→T3 peripherally). 3) Iodine (Lugol's/KI – 1 hour AFTER thionamide). 4) Corticosteroids (hydrocortisone 100mg q8h). 5) Cooling, supportive care, ICU." },
    { q: "Describe the management of osteoporosis.", a: "Diagnosis: DEXA scan T-score ≤-2.5 (osteoporosis), -1 to -2.5 (osteopenia). FRAX tool for 10-year fracture risk. Treatment indications: T-score ≤-2.5, hip/vertebral fracture, FRAX ≥20% major or ≥3% hip. First-line: Oral bisphosphonates (alendronate 70mg weekly or risedronate 35mg weekly) + Calcium 1000-1200mg/day + Vitamin D 800-1000IU/day. Second-line: Denosumab (RANKL inhibitor), IV zoledronic acid (annual), teriparatide (PTH analog – for severe). Drug holiday after 5 years oral / 3 years IV bisphosphonate. Monitor: DEXA q2 years." }
  ]},
  { name: "Hematology", icon: "droplet", color: "#e11d48", cards: [
    { q: "Classify anemia based on MCV.", a: "Microcytic (MCV <80): Iron deficiency (most common globally), thalassemia, anemia of chronic disease, sideroblastic, lead poisoning. Mnemonic: TAILS. Normocytic (80-100): Acute blood loss, anemia of chronic disease, CKD (↓EPO), mixed deficiency, bone marrow failure, hemolysis. Macrocytic (>100): Megaloblastic (B12/folate deficiency – hypersegmented neutrophils), non-megaloblastic (liver disease, alcohol, hypothyroidism, MDS, reticulocytosis, drugs – methotrexate, hydroxyurea)." },
    { q: "Describe the coagulation cascade and common tests.", a: "Intrinsic pathway: XII→XI→IX→VIII→X (measured by aPTT). Extrinsic pathway: Tissue factor→VII→X (measured by PT/INR). Common pathway: X→V→Prothrombin→Thrombin→Fibrinogen→Fibrin (cross-linked by XIII). Prolonged PT only: Factor VII deficiency, early warfarin, early liver disease. Prolonged aPTT only: VIII (Hemophilia A), IX (Hemophilia B), XI, XII deficiency, heparin, lupus anticoagulant. Both prolonged: DIC, severe liver disease, common pathway, supratherapeutic anticoagulation." },
    { q: "What is Disseminated Intravascular Coagulation (DIC)?", a: "Systemic activation of coagulation → widespread microvascular thrombosis → consumption of clotting factors and platelets → bleeding. Causes: Sepsis, trauma, obstetric (abruption, amniotic fluid embolism), malignancy (APL, adenocarcinoma), transfusion reaction. Labs: ↑PT/aPTT, ↓fibrinogen, ↑D-dimer, ↓platelets, schistocytes on smear. ISTH DIC score ≥5 diagnostic. Treatment: Treat underlying cause. Supportive: FFP (if bleeding + prolonged PT), cryoprecipitate (if fibrinogen <1g/L), platelets (if <50 and bleeding)." },
    { q: "Explain the approach to thrombocytopenia.", a: "Decreased production: Bone marrow failure (aplastic anemia, MDS, leukemia, chemo), B12/folate deficiency, alcohol. Increased destruction: Immune (ITP – anti-platelet antibodies), TTP (ADAMTS13 deficiency), HUS (Shiga toxin), DIC, HIT (heparin-induced), SLE. Sequestration: Splenomegaly (portal HTN, myeloproliferative). Dilutional: Massive transfusion. TTP pentad: Thrombocytopenia, MAHA, neurologic, renal, fever. Treatment ITP: Steroids first-line, IVIG, rituximab, splenectomy. TTP: Plasma exchange (emergency), caplacizumab." },
    { q: "Describe the WHO classification of acute leukemias.", a: "AML: ≥20% myeloblasts in marrow. Auer rods pathognomonic. Subtypes include APL (t(15;17) PML-RARA – treat with ATRA + arsenic trioxide, DIC common), AML with recurrent genetic abnormalities, MDS-related. ALL: ≥20% lymphoblasts. B-ALL (most common in children, good prognosis), T-ALL (mediastinal mass, adolescent males). Philadelphia chromosome t(9;22) BCR-ABL in 25% adult ALL (add TKI). Diagnosis: Flow cytometry (immunophenotyping), cytogenetics, molecular testing. AML markers: MPO+, CD13, CD33. ALL markers: TdT+, CD10, CD19 (B), CD3, CD7 (T)." },
    { q: "What is sickle cell disease and its complications?", a: "Autosomal recessive: HbS (Glu→Val at position 6 of β-globin). HbS polymerizes when deoxygenated → sickling → vaso-occlusion + hemolysis. Complications: Vaso-occlusive crisis (pain), acute chest syndrome (fever + new infiltrate + respiratory symptoms – leading cause of death), stroke (children – transcranial Doppler screening), splenic sequestration (children), aplastic crisis (Parvovirus B19), avascular necrosis, priapism, chronic organ damage. Management: Hydroxyurea (↑HbF), transfusion, pain management, penicillin prophylaxis, pneumococcal vaccine. Cure: Stem cell transplant, gene therapy." },
    { q: "Explain heparin-induced thrombocytopenia (HIT).", a: "Type II HIT: Immune-mediated (IgG antibodies against PF4-heparin complex) → platelet activation → thrombocytopenia + paradoxical thrombosis. 4T score: Thrombocytopenia (>50% fall, nadir ≥20), Timing (5-10 days after heparin, or <1 day if prior exposure), Thrombosis (new DVT/PE/arterial), No oTher cause. Labs: Anti-PF4/heparin antibodies (ELISA – sensitive), serotonin release assay (SRA – confirmatory). Management: Stop ALL heparin immediately. Start alternative anticoagulant: argatroban (hepatic metabolism) or fondaparinux. Do NOT give warfarin until platelets >150 (risk of warfarin skin necrosis/venous limb gangrene)." },
    { q: "Describe the approach to a patient with lymphadenopathy.", a: "History: Duration (<2 weeks often reactive, >6 weeks concerning), location, associated symptoms (B symptoms: fever, night sweats, >10% weight loss). Exam: Size (>1cm concerning, >2cm supraclavicular always biopsy), consistency (hard/fixed = malignancy), distribution (generalized vs localized). Causes: Infectious (viral – EBV/HIV/CMV, bacterial – TB/cat scratch), autoimmune (SLE, RA), malignant (lymphoma, leukemia, metastatic). Workup: CBC, LDH, ESR, peripheral smear, monospot, HIV, CT. Excisional biopsy (preferred over FNA for lymphoma – preserves architecture)." },
    { q: "What is multiple myeloma and its diagnostic criteria?", a: "Malignant plasma cell neoplasm. CRAB criteria: Calcium elevated (>11mg/dL), Renal insufficiency (Cr >2), Anemia (Hb <10), Bone lesions (lytic, punched-out on skeletal survey/low-dose CT). SLiM criteria (biomarkers defining myeloma without CRAB): S – Sixty percent marrow plasmacytosis, Li – Light chain ratio ≥100, M – MRI >1 focal lesion. Diagnosis requires: ≥10% clonal plasma cells in marrow + M protein (serum/urine electrophoresis, immunofixation) + end-organ damage. Treatment: VRd (Bortezomib, Lenalidomide, Dexamethasone) → autologous stem cell transplant if eligible." },
    { q: "Explain the mechanism and monitoring of warfarin.", a: "Vitamin K antagonist: Inhibits vitamin K epoxide reductase → ↓synthesis of factors II, VII, IX, X and proteins C & S. Onset: 3-5 days (bridge with heparin). Monitored by INR (target 2-3 for most indications, 2.5-3.5 for mechanical mitral valve). Drug interactions: CYP2C9 inhibitors ↑effect (amiodarone, fluconazole, metronidazole), CYP inducers ↓effect (rifampicin, carbamazepine, phenytoin). Food: Vitamin K-rich foods (leafy greens) ↓effect. Reversal: Minor bleeding → withhold + vitamin K 1-2mg PO. Major → IV vitamin K 5-10mg + 4-factor PCC (Beriplex) or FFP." }
  ]},
  { name: "Infectious Disease", icon: "bug", color: "#f97316", cards: [
    { q: "Describe the empiric antibiotic approach for sepsis.", a: "Surviving Sepsis Campaign: Blood cultures (≥2 sets) BEFORE antibiotics, but don't delay >45min. Start broad-spectrum within 1 hour. Community-acquired: Piperacillin-tazobactam or meropenem ± vancomycin (if MRSA risk). Urinary source: Piperacillin-tazobactam or ceftriaxone. Abdominal: Piperacillin-tazobactam or meropenem + metronidazole. Skin/soft tissue: Flucloxacillin + clindamycin (necrotizing fasciitis → meropenem + clindamycin + vancomycin). CNS: Ceftriaxone + vancomycin ± ampicillin. De-escalate based on cultures within 48-72h." },
    { q: "What are the opportunistic infections in HIV/AIDS by CD4 count?", a: "CD4 <500: Kaposi sarcoma, TB, bacterial pneumonia, herpes zoster. CD4 <200: Pneumocystis jirovecii pneumonia (PCP – prophylaxis: TMP-SMX when <200), oral/esophageal candidiasis. CD4 <100: Toxoplasmosis (ring-enhancing lesions – prophylaxis: TMP-SMX), Cryptococcal meningitis (India ink, CrAg). CD4 <50: CMV retinitis (flame hemorrhages), Mycobacterium avium complex (MAC – prophylaxis: azithromycin), progressive multifocal leukoencephalopathy (PML – JC virus). Start ART for all HIV+ regardless of CD4." },
    { q: "Explain the diagnosis and management of infective endocarditis.", a: "Modified Duke criteria. Organisms: Native valve – S. aureus (acute, IV drug users – tricuspid), Strep viridans (subacute), Enterococcus. Prosthetic early (<60d) – S. aureus, CoNS; late – Strep, Enterococcus. Diagnosis: 3 sets blood cultures, echocardiography (TTE first, TEE if prosthetic/negative TTE). Treatment: Native Strep viridans: Benzylpenicillin 4wk ± gentamicin 2wk. Staph (native): Flucloxacillin 4-6wk (MRSA→vancomycin). Prosthetic: Vancomycin + gentamicin + rifampicin ≥6wk. Surgery indications: Heart failure, uncontrolled infection, large vegetations >10mm with emboli." },
    { q: "What is Clostridium difficile infection and its management?", a: "Toxin-producing anaerobe, most common healthcare-associated infection. Risk factors: Antibiotics (clindamycin, fluoroquinolones, cephalosporins), age >65, PPI use, hospitalization. Diagnosis: Stool toxin (GDH screen → toxin EIA or NAAT confirmation). Severity: Non-severe (WCC <15, Cr <1.5) → oral vancomycin 125mg QDS × 10 days or fidaxomicin. Severe (WCC ≥15, Cr ≥1.5) → oral vancomycin 125mg QDS. Fulminant (hypotension, ileus, megacolon) → vancomycin 500mg QDS PO + PR + IV metronidazole, surgical consult. Recurrence: Fidaxomicin, bezlotoxumab, fecal microbiota transplant." },
    { q: "Describe the clinical features and treatment of malaria.", a: "Plasmodium species: P. falciparum (most severe, cerebral malaria, RBC sequestration), P. vivax/ovale (hypnozoites – relapses), P. malariae (nephrotic syndrome, quartan). Presentation: Cyclical fevers (tertian 48h for falciparum/vivax/ovale, quartan 72h for malariae), rigors, sweating, headache, hepatosplenomegaly. Diagnosis: Thick smear (detection), thin smear (speciation, parasitemia %), rapid diagnostic test (HRP2). Treatment: Uncomplicated falciparum → ACT (Artemether-Lumefantrine). Severe → IV Artesunate. P. vivax/ovale → Chloroquine + Primaquine 14 days (check G6PD first – hemolysis risk)." },
    { q: "What are the key features of meningitis by organism?", a: "Bacterial: N. meningitidis (petechial rash, DIC, Waterhouse-Friderichsen – adrenal hemorrhage), S. pneumoniae (most common adult, post-splenectomy), Group B Strep & E. coli (neonates), Listeria (neonates, elderly, immunocompromised – add ampicillin). Empiric: Ceftriaxone + vancomycin (± ampicillin if Listeria risk) + dexamethasone (before or with first dose antibiotics – reduces mortality in pneumococcal). Viral: Enterovirus (most common), HSV (temporal lobe – acyclovir). TB: Chronic course, basal meningitis, CN palsies, hydrocephalus. Fungal: Cryptococcus in HIV." },
    { q: "Explain antimicrobial resistance mechanisms.", a: "Beta-lactamase production: Hydrolyzes β-lactam ring (ESBL – extended spectrum – resistant to 3rd gen cephalosporins, treat with carbapenems; CRE – carbapenemase-producing – treat with ceftazidime-avibactam, meropenem-vaborbactam, colistin). MRSA: Altered PBP2a (mecA gene) – treat with vancomycin, daptomycin, linezolid. VRE: Modified D-Ala-D-Ala target – treat with linezolid, daptomycin. Efflux pumps: Tetracycline, fluoroquinolone resistance. Target modification: Macrolide resistance (erm gene), rifampicin resistance (rpoB mutation). Antibiotic stewardship is critical." },
    { q: "What is the approach to fever of unknown origin (FUO)?", a: "Classic definition: Fever >38.3°C on several occasions, duration >3 weeks, no diagnosis after 1 week of investigation. Categories: Infections (25% – TB, abscess, endocarditis, osteomyelitis), malignancy (20% – lymphoma, renal cell carcinoma, hepatocellular), autoimmune (20% – adult-onset Still's, SLE, vasculitis, temporal arteritis), miscellaneous (drug fever, DVT/PE, factitious). Workup: Detailed history/exam, CBC/ESR/CRP/LDH, blood cultures, CT chest/abdomen/pelvis, echocardiography, PET-CT (increasingly used), temporal artery biopsy if >50 years. 10-15% remain undiagnosed." },
    { q: "Describe the management of diabetic foot infections.", a: "Classification: Mild (superficial, <2cm cellulitis), Moderate (deeper, >2cm, abscess, osteomyelitis), Severe (systemic toxicity, sepsis). Microbiology: Mild – Staph/Strep. Moderate/severe – polymicrobial (Staph, Strep, Enterobacteriaceae, anaerobes, Pseudomonas if chronic). Diagnosis: Probe-to-bone test (PPV 89% for osteomyelitis), MRI (best for osteomyelitis), X-ray (late changes), ESR >70 suggests osteomyelitis. Treatment: Mild → oral amoxicillin-clavulanate. Moderate → IV piperacillin-tazobactam. Severe → same + vancomycin. Osteomyelitis: 6 weeks antibiotics ± surgical debridement. Multidisciplinary: Offloading, vascular assessment, wound care, glycemic control." },
    { q: "What are the stages of syphilis and its treatment?", a: "Primary (10-90 days): Painless chancre at inoculation site, painless lymphadenopathy. Secondary (6-8 weeks): Diffuse maculopapular rash (palms/soles), condylomata lata, mucous patches, constitutional symptoms. Latent: Early <1 year, Late >1 year (asymptomatic). Tertiary (years-decades): Gummas (granulomatous), cardiovascular (aortitis, aortic aneurysm), neurosyphilis (tabes dorsalis, Argyll Robertson pupil – accommodates but doesn't react, general paresis). Diagnosis: Dark-field microscopy, RPR/VDRL (non-treponemal – screening, monitoring), FTA-ABS/TPHA (treponemal – confirmatory). Treatment: Primary/secondary/early latent → Benzathine penicillin G 2.4MU IM single dose. Late latent/tertiary → 2.4MU IM weekly ×3 weeks. Neurosyphilis → IV benzylpenicillin 18-24MU daily ×14 days." }
  ]},
  { name: "Rheumatology", icon: "bone", color: "#ec4899", cards: [
    { q: "What are the ACR/EULAR 2010 criteria for Rheumatoid Arthritis?", a: "Score ≥6/10 for definite RA. Joint involvement: 1 large (0), 2-10 large (1), 1-3 small (2), 4-10 small (3), >10 with ≥1 small (5). Serology: Negative RF & CCP (0), low-positive (2), high-positive (3). Acute phase: Normal CRP & ESR (0), abnormal (1). Duration: <6 weeks (0), ≥6 weeks (1). Presentation: Symmetrical polyarthritis of small joints (MCP, PIP, wrists, MTP), morning stiffness >30min. Deformities: Swan neck, boutonniere, ulnar deviation, Z-thumb. Treatment: Methotrexate (anchor drug), add biologics (anti-TNF, rituximab, tocilizumab) if inadequate response. Treat-to-target: remission or low disease activity." },
    { q: "Describe the clinical features of Systemic Lupus Erythematosus.", a: "Young women (F:M 9:1). Malar (butterfly) rash, discoid rash, photosensitivity, oral ulcers, non-erosive arthritis, serositis (pleuritis/pericarditis), renal (lupus nephritis – class III/IV most serious), neurologic (seizures, psychosis), hematologic (cytopenias), immunologic (anti-dsDNA, anti-Smith, antiphospholipid), ANA positive (sensitive but not specific). SLICC/ACR criteria. Complement C3/C4 decreased in active disease. Anti-dsDNA correlates with disease activity and nephritis. Treatment: Hydroxychloroquine (all patients), NSAIDs, steroids, mycophenolate/cyclophosphamide (nephritis), belimumab." },
    { q: "Explain the crystal arthropathies: gout vs pseudogout.", a: "Gout: Monosodium urate crystals (needle-shaped, negatively birefringent – yellow parallel to compensator). First MTP (podagra), recurrent acute monoarthritis. Risk: Hyperuricemia, male, obesity, alcohol, diuretics, CKD. Acute: NSAIDs/colchicine/steroids. Chronic: Allopurinol/febuxostat (target urate <6mg/dL), start 2 weeks after flare with colchicine cover. Pseudogout (CPPD): Calcium pyrophosphate crystals (rhomboid, weakly positively birefringent – blue parallel). Knee most common. Chondrocalcinosis on X-ray. Associated: Hemochromatosis, hyperparathyroidism, hypothyroidism. Treatment: NSAIDs/colchicine/steroids, no prophylaxis equivalent." },
    { q: "What is ankylosing spondylitis and its management?", a: "Chronic inflammatory disease of axial skeleton. HLA-B27 positive (>90%). Young males, onset <45 years. Features: Inflammatory back pain (insidious onset, morning stiffness >30min, improves with exercise, worse at rest), reduced spinal mobility (Schober's test), sacroiliitis (bilateral on MRI/X-ray), enthesitis (Achilles, plantar fascia), anterior uveitis (25%), aortitis. Modified New York criteria. Imaging: MRI sacroiliac joints (bone marrow edema – early), X-ray (bamboo spine, squaring of vertebrae – late). Treatment: NSAIDs (first-line), physiotherapy (essential), TNF inhibitors (adalimumab, etanercept) or IL-17 inhibitors (secukinumab) if inadequate response. No role for methotrexate in axial disease." },
    { q: "Describe the features and management of giant cell arteritis.", a: "Large vessel vasculitis in >50 years (peak 70-80). Granulomatous inflammation of temporal artery branches. Features: New headache (temporal), scalp tenderness, jaw claudication (most specific symptom), visual disturbance (AION – anterior ischemic optic neuropathy → irreversible blindness if untreated), polymyalgia rheumatica overlap (40-60%). Labs: ↑↑ESR (often >50-100), ↑CRP. Diagnosis: Temporal artery biopsy (skip lesions – false negatives possible, biopsy both sides if high suspicion), US (halo sign). Treatment: HIGH-DOSE steroids immediately (DO NOT wait for biopsy): Prednisolone 40-60mg/day (no visual symptoms), IV methylprednisolone 500mg-1g ×3 days if visual symptoms. Tocilizumab as steroid-sparing agent." },
    { q: "What are the extra-articular manifestations of rheumatoid arthritis?", a: "Pulmonary: ILD (UIP/NSIP), pleural effusions (low glucose), pulmonary nodules (Caplan syndrome with pneumoconiosis), bronchiolitis obliterans. Cardiac: Pericarditis, accelerated atherosclerosis (increased CV mortality). Ocular: Scleritis, episcleritis, keratoconjunctivitis sicca (secondary Sjögren's). Hematologic: Anemia of chronic disease, Felty syndrome (RA + splenomegaly + neutropenia). Vasculitis: Digital infarcts, leg ulcers, neuropathy. Nodules: Subcutaneous (extensor surfaces), rheumatoid nodules (palisading granulomas). Cervical spine: C1-C2 subluxation (check flexion/extension films pre-anesthesia). Amyloidosis: AA type (long-standing uncontrolled disease)." },
    { q: "Explain the antiphospholipid syndrome.", a: "Autoimmune thrombophilia. Antibodies: Lupus anticoagulant (most thrombogenic, prolongs aPTT paradoxically), anticardiolipin IgG/IgM, anti-β2-glycoprotein I IgG/IgM. Clinical criteria (≥1): Vascular thrombosis (arterial or venous) OR pregnancy morbidity (≥3 early miscarriages, ≥1 late fetal loss, premature birth due to preeclampsia). Lab criteria (≥1): Positive on 2 occasions ≥12 weeks apart. Catastrophic APS: Multi-organ thrombosis over short period (rare, life-threatening). Treatment: Arterial/venous thrombosis → lifelong warfarin (INR 2-3, some recommend 3-4 for arterial). Obstetric → aspirin + LMWH. Primary prevention → low-dose aspirin." },
    { q: "Describe polymyositis and dermatomyositis.", a: "Inflammatory myopathies with symmetric proximal muscle weakness. Dermatomyositis unique features: Heliotrope rash (purple eyelids), Gottron's papules (erythematous over MCP/PIP/DIP), shawl sign, V sign, mechanic's hands, nail-fold capillary changes. Labs: ↑↑CK (10-50× normal), ↑aldolase, ↑LDH, ↑AST/ALT. Antibodies: Anti-Jo-1 (antisynthetase syndrome – ILD, arthritis, Raynaud's, mechanic's hands), anti-Mi-2 (dermatomyositis), anti-MDA5 (amyopathic DM with ILD). EMG: Myopathic pattern. MRI: Muscle edema. Biopsy: Gold standard (PM – endomysial CD8+ infiltrate; DM – perimysial CD4+/B cells, perifascicular atrophy). Malignancy screening essential in DM (ovarian, lung, GI). Treatment: High-dose steroids, steroid-sparing (methotrexate, azathioprine), IVIG." },
    { q: "What is systemic sclerosis (scleroderma)?", a: "Limited cutaneous (lcSSc): Skin thickening distal to elbows/knees + face. CREST: Calcinosis, Raynaud's, Esophageal dysmotility, Sclerodactyly, Telangiectasias. Anti-centromere antibody. Late pulmonary arterial hypertension. Diffuse cutaneous (dcSSc): Widespread skin thickening, rapid onset, early visceral involvement. Anti-Scl-70 (topoisomerase I) antibody. ILD (most common cause of death), scleroderma renal crisis (malignant HTN, MAHA – treat with ACEi NOT steroids), GI dysmotility, cardiac. Both: Raynaud's (earliest feature), nailfold capillaroscopy abnormalities. Treatment: Organ-specific (methotrexate for skin, cyclophosphamide/nintedanib for ILD, PDE5i/ERA for PAH, ACEi for renal crisis)." },
    { q: "Explain the approach to vasculitis.", a: "Chapel Hill classification by vessel size. Large: Giant cell arteritis (temporal), Takayasu (aortic arch, young Asian women – pulseless disease). Medium: Polyarteritis nodosa (Hep B associated, NO glomerulonephritis/lung involvement, microaneurysms on angiography), Kawasaki (children, coronary aneurysms). Small: ANCA-associated – GPA/Wegener's (c-ANCA/PR3: sinusitis, pulmonary nodules/hemorrhage, GN), MPA (p-ANCA/MPO: pulmonary-renal syndrome), EGPA/Churg-Strauss (p-ANCA, asthma, eosinophilia). Immune complex – IgA vasculitis/HSP (children, palpable purpura, abdominal pain, GN), cryoglobulinemic (Hep C). Treatment: Induction → cyclophosphamide/rituximab + steroids. Maintenance → azathioprine/rituximab." }
  ]},
  { name: "Dermatology", icon: "scan", color: "#8b5cf6", cards: [
    { q: "Describe the types of skin cancer and their features.", a: "Basal Cell Carcinoma (most common, 80%): Pearly, rolled border, telangiectasia, central ulceration (rodent ulcer). Sun-exposed areas. Locally invasive, rarely metastasizes. Types: Nodular, superficial, morphoeic (aggressive). Squamous Cell Carcinoma: Keratotic, crusted, may ulcerate. Can metastasize (2-5%). Risk: UV, immunosuppression, scars, chronic wounds. Melanoma: ABCDE (Asymmetry, Border irregular, Color variation, Diameter >6mm, Evolution). Types: Superficial spreading (most common), nodular (worst prognosis), lentigo maligna, acral lentiginous. Breslow thickness = most important prognostic factor." },
    { q: "What is the approach to eczema (atopic dermatitis)?", a: "Chronic relapsing inflammatory skin disease. Diagnostic criteria (Hanifin & Rajka): Pruritus + ≥3 of: typical morphology/distribution (flexural in adults, extensor/facial in children), chronic/relapsing course, personal/family history of atopy, xerosis. Management ladder: 1) Emollients (cornerstone – apply liberally, frequently). 2) Mild TCS (hydrocortisone for face/flexures). 3) Moderate/potent TCS (betamethasone for body) – use fingertip units. 4) Topical calcineurin inhibitors (tacrolimus/pimecrolimus – steroid-sparing, safe for face). 5) Phototherapy (UVB). 6) Systemic (dupilumab – IL-4/13 blocker, methotrexate, ciclosporin, azathioprine). Avoid triggers, treat infections (S. aureus colonization)." },
    { q: "Differentiate between psoriasis types and their management.", a: "Chronic plaque (90%): Well-demarcated, erythematous plaques with silvery scale, extensor surfaces, scalp, nails (pitting, onycholysis). Guttate: Small drop-like lesions, often post-streptococcal pharyngitis (children/young adults). Pustular: Sterile pustules (generalized von Zumbusch – medical emergency, or palmoplantar). Inverse: Flexural, minimal scale. Erythrodermic: >90% BSA, medical emergency. Auspitz sign (pinpoint bleeding on scale removal). Koebner phenomenon. Nail changes in 50%. Treatment: Mild → topical (vitamin D analogues + TCS). Moderate → phototherapy (narrowband UVB), methotrexate. Severe → biologics (anti-TNF, IL-17 inhibitors – secukinumab, IL-23 inhibitors – guselkumab)." },
    { q: "Explain the pathophysiology and management of urticaria.", a: "Mast cell degranulation → histamine release → vasodilation, increased permeability → wheals (raised, pruritic, evanescent <24h). Acute (<6 weeks): Allergic (food, drugs – especially penicillins, NSAIDs), infections, insect stings. Chronic (>6 weeks): Most idiopathic (CSU), autoimmune (anti-FcεRI or anti-IgE antibodies), physical (dermatographism, cold, pressure, solar). Angioedema: Deeper swelling (lips, eyes, larynx). Management: Non-sedating antihistamines (cetirizine, loratadine) – up-dose ×4 if needed. Second-line: Add H2 blocker or montelukast. Third-line: Omalizumab (anti-IgE). Avoid: Aspirin/NSAIDs (can exacerbate). Anaphylaxis with urticaria → IM adrenaline." },
    { q: "What are the dermatological emergencies?", a: "Stevens-Johnson Syndrome (<10% BSA) / Toxic Epidermal Necrolysis (>30% BSA): Drug-induced (allopurinol, carbamazepine, lamotrigine, sulfonamides, NSAIDs). Mucosal involvement, positive Nikolsky sign, skin pain. SCORTEN score for prognosis. Treat: Stop causative drug, burns unit care, ?IVIG/ciclosporin. Erythroderma: >90% BSA erythema + scaling. Causes: Psoriasis, eczema, drug reaction, CTCL. Risk: Thermoregulatory failure, high-output cardiac failure. Necrotizing fasciitis: Rapidly spreading deep soft tissue infection, pain out of proportion, crepitus, systemic toxicity. Surgical emergency → aggressive debridement + broad-spectrum antibiotics. Staphylococcal scalded skin syndrome: S. aureus exfoliative toxins (children), treat with flucloxacillin." },
    { q: "Describe common fungal skin infections.", a: "Dermatophytes (Tinea): T. corporis (body – annular, scaling, central clearing), T. pedis (athlete's foot – interdigital, moccasin), T. cruris (groin – spares scrotum vs Candida), T. capitis (children – scalp, alopecia, kerion), T. unguium (onychomycosis – nail thickening, dystrophy). Diagnosis: KOH prep (hyphae), fungal culture (Sabouraud's agar), Wood's lamp (Microsporum). Treatment: Topical antifungals (terbinafine, clotrimazole) for limited disease. Oral for extensive/nail/scalp: Terbinafine (dermatophytes), itraconazole, griseofulvin (T. capitis in children). Candidiasis: Satellite pustules, moist areas, KOH shows pseudohyphae → topical nystatin/clotrimazole, oral fluconazole if extensive. Pityriasis versicolor: Malassezia furfur, hypo/hyperpigmented macules – topical ketoconazole shampoo." },
    { q: "What are the autoimmune blistering diseases?", a: "Pemphigus vulgaris: Intraepidermal (suprabasal) flaccid blisters, positive Nikolsky sign, oral mucosal erosions (often first), anti-desmoglein 3 (±1) antibodies, IgG intercellular (fishnet) pattern on DIF. Treatment: Systemic steroids + rituximab (first-line) or azathioprine/mycophenolate. Bullous pemphigoid: Subepidermal tense blisters on erythematous base, elderly, oral involvement rare, anti-BP180/BP230 antibodies, linear IgG/C3 at BMZ on DIF. Treatment: Potent topical steroids (whole body) or systemic steroids + doxycycline/dapsone. Dermatitis herpetiformis: Intensely pruritic papulovesicles on extensor surfaces, associated with celiac disease (>90%), granular IgA at dermal papillae on DIF. Treatment: Dapsone (rapid response) + gluten-free diet." },
    { q: "Explain the approach to a new mole or changing lesion.", a: "ABCDE criteria: A – Asymmetry (one half doesn't match), B – Border irregular (notched, scalloped), C – Color variation (brown, black, red, white, blue), D – Diameter >6mm, E – Evolution (changing size, shape, color, new symptoms). Dermoscopy: Blue-white veil, atypical pigment network, irregular streaks, regression structures. Ugly duckling sign: Lesion that looks different from patient's other moles. Glasgow 7-point checklist: Major (2 points each): Change in size, irregular shape, irregular color. Minor (1 point): ≥7mm diameter, inflammation, oozing, change in sensation. Score ≥3 → excision biopsy. Never shave biopsy suspected melanoma – excisional biopsy with 2mm margin for diagnosis. Breslow thickness determines wide local excision margins and sentinel lymph node biopsy." },
    { q: "Describe the drug eruptions and their patterns.", a: "Morbilliform/exanthematous (most common, 40-75%): Symmetrical erythematous macules/papules, starts trunk → extremities, 7-14 days after drug start. Causes: Antibiotics (amoxicillin, sulfonamides), allopurinol, anticonvulsants. Fixed drug eruption: Same site each exposure, round violaceous plaque → post-inflammatory hyperpigmentation. Causes: NSAIDs, sulfonamides, tetracyclines. DRESS (Drug Reaction with Eosinophilia and Systemic Symptoms): 2-8 weeks onset, fever, facial edema, eosinophilia, hepatitis, lymphadenopathy. Causes: Allopurinol, carbamazepine, phenytoin, sulfonamides. AGEP: Acute generalized exanthematous pustulosis – rapid onset non-follicular sterile pustules. SJS/TEN: Already covered. Treatment for all: STOP causative drug, supportive care." },
    { q: "What is the approach to alopecia?", a: "Non-scarring (reversible): Androgenetic (M-pattern/F-diffuse thinning, miniaturization on biopsy – treat: minoxidil, finasteride/dutasteride, spironolactone in women), alopecia areata (autoimmune, well-circumscribed patches, exclamation-mark hairs – treat: topical/intralesional steroids, JAK inhibitors – baricitinib), telogen effluvium (diffuse shedding 2-3 months after trigger – postpartum, illness, surgery, crash diet – self-limiting), traction alopecia (hairstyle-related). Scarring (irreversible): Discoid lupus (follicular plugging, scarring, dyspigmentation), lichen planopilaris (perifollicular erythema/scale), frontal fibrosing alopecia (hairline recession, eyebrow loss), central centrifugal cicatricial alopecia. Diagnosis: Trichoscopy, pull test (>10% = active shedding), biopsy if scarring or unclear diagnosis." }
  ]},
  { name: "Emergency Med", icon: "siren", color: "#dc2626", cards: [
    { q: "Describe the ABCDE approach to the critically ill patient.", a: "A – Airway: Look/listen/feel for obstruction. Head tilt-chin lift, jaw thrust (if C-spine concern). Suction, airway adjuncts (OPA/NPA), definitive airway (ETT/surgical) if needed. B – Breathing: RR, SpO2, chest expansion, percussion, auscultation. Treat: Tension pneumothorax (needle decompression → chest drain), massive hemothorax. C – Circulation: HR, BP, cap refill, 2 large-bore IV, fluid resuscitation, stop hemorrhage, consider blood products. D – Disability: GCS, pupils (PEARL), glucose, lateralizing signs. E – Exposure: Full exposure, temperature, log roll. Reassess after each intervention." },
    { q: "What is the management of anaphylaxis?", a: "Life-threatening type I hypersensitivity. Triggers: Food (nuts, shellfish), drugs (penicillin, NSAIDs), insect stings, latex. Recognition: Rapid onset, airway compromise (stridor, tongue swelling), breathing (wheeze, tachypnea), circulation (hypotension, tachycardia), skin (urticaria, erythema, angioedema). Treatment: Remove trigger. IM Adrenaline 0.5mg (1:1000) anterolateral thigh – REPEAT every 5 min if no improvement. High-flow oxygen. IV fluid bolus (crystalloid 500mL-1L). Adjuncts: Nebulized salbutamol, IV hydrocortisone 200mg, IV chlorphenamine 10mg. Post: Observe ≥6-12h, prescribe adrenaline auto-injector, allergy referral, tryptase levels (timing: immediate, 1-2h, >24h)." },
    { q: "Explain the management of major trauma (ATLS principles).", a: "Primary survey (ABCDE): Treat life threats immediately. C-spine immobilization if mechanism suggests injury. A: Definitive airway if GCS ≤8. B: Tension pneumothorax (clinical diagnosis → decompress), open pneumothorax (3-sided dressing), flail chest, massive hemothorax. C: Control hemorrhage (direct pressure, tourniquet), IV access ×2, transfuse O-neg/type-specific, activate massive transfusion protocol (1:1:1 PRBC:FFP:platelets), TXA 1g within 3h. Pelvic binder if unstable pelvis. D: GCS, pupils. E: Expose, prevent hypothermia. Secondary survey: Head-to-toe examination, AMPLE history, imaging (eFAST, CT). Trauma triad of death: Hypothermia, acidosis, coagulopathy → damage control surgery." },
    { q: "What are the ECG findings and management of acute coronary syndromes?", a: "STEMI: ST elevation ≥1mm limb/≥2mm precordial in ≥2 contiguous leads. Management: Primary PCI (door-to-balloon <90min) or thrombolysis if PCI not available within 120min. DAPT: Aspirin 300mg + Ticagrelor 180mg (or Clopidogrel 600mg). Anticoagulation: UFH or enoxaparin. NSTEMI/UA: ST depression, T-wave inversion, or normal ECG. Troponin elevated (NSTEMI) or normal (UA). Risk stratify (GRACE score). Treatment: Aspirin + Ticagrelor, Fondaparinux/enoxaparin, early invasive strategy for high-risk. All ACS: GTN (if no RV infarct/PDE5i), morphine (cautious), beta-blocker, statin, ACEi. Secondary prevention: DAPT 12 months, statin, ACEi, beta-blocker, cardiac rehab." },
    { q: "Describe the management of severe sepsis and septic shock.", a: "Sepsis-3: Life-threatening organ dysfunction caused by dysregulated host response to infection. qSOFA ≥2 (RR ≥22, altered mentation, SBP ≤100) suggests sepsis. Septic shock: Sepsis + vasopressors needed to maintain MAP ≥65 + lactate >2mmol/L despite adequate fluids. Hour-1 Bundle: Measure lactate (re-measure if >2), blood cultures before antibiotics, broad-spectrum antibiotics within 1 hour, 30mL/kg crystalloid for hypotension/lactate ≥4, vasopressors (noradrenaline first-line) if MAP <65 during/after fluids. Ongoing: Source control (drain abscess, remove infected device), reassess fluid responsiveness, target lactate clearance. Steroids: IV Hydrocortisone 200mg/day if refractory shock." },
    { q: "What is the approach to the unconscious patient?", a: "Immediate: ABCDE approach, check glucose (treat hypoglycemia: IV dextrose 50%), GCS assessment, brief neurological exam. Don't Forget: DEFG – Don't Ever Forget Glucose. Causes (AEIOU-TIPS): Alcohol, Epilepsy, Insulin (hypo/hyperglycemia), Opiates/Overdose, Uremia, Trauma, Infection (meningitis/encephalitis), Psychiatric, Stroke/SAH/Space-occupying lesion. Examination: Pupils (pinpoint = opioids, unilateral dilated = CN3/herniation), eye movements (doll's eyes), posturing (decorticate/decerebrate), lateralizing signs. Investigations: Glucose, ABG, U&E, toxicology screen, CT head (urgent if focal signs, GCS ≤8, suspected trauma/SAH). Consider: Naloxone if opioid suspected, flumazenil cautiously for benzodiazepines." },
    { q: "Explain the management of status asthmaticus.", a: "Life-threatening asthma features: SpO2 <92%, silent chest, poor respiratory effort, cyanosis, hypotension, exhaustion, altered consciousness, PEF <33%, normal/rising PaCO2 (35-45 = exhaustion). Management: Sit upright, high-flow O2 (target 94-98%). Continuous nebulized salbutamol 5mg back-to-back. Ipratropium 500mcg nebulized q20min ×3. IV hydrocortisone 200mg. If no improvement: IV magnesium sulfate 2g over 20min (smooth muscle relaxation). IV salbutamol 250mcg slowly. IV aminophylline (loading 5mg/kg if not on theophylline). Prepare for intubation if deteriorating (ketamine for induction – bronchodilator). Avoid: Sedation (respiratory depression), aggressive fluids. ICU transfer for: Worsening despite treatment, PaCO2 rising, exhaustion." },
    { q: "What is the assessment and management of burns?", a: "Depth: Superficial (epidermis, erythema, painful – sunburn), Partial thickness superficial (dermis, blisters, wet, painful), Partial thickness deep (dermis, pale, reduced sensation), Full thickness (all layers, white/charred, painless). BSA: Wallace Rule of 9s (adult: head 9%, each arm 9%, anterior trunk 18%, posterior trunk 18%, each leg 18%, perineum 1%). Lund & Browder chart more accurate. Fluid resuscitation (>15% BSA adult): Parkland formula = 4mL × kg × %BSA, half in first 8h from injury time, half in next 16h (Hartmann's/RL). Escharotomy for circumferential full-thickness. Referral criteria: >10% BSA partial, full thickness, face/hands/perineum, inhalation injury, chemical/electrical. Carbon monoxide: 100% O2, check COHb." },
    { q: "Describe the approach to poisoning and overdose.", a: "General: ABCDE, decontamination if appropriate. Activated charcoal if <1h (most drugs), contraindicated in corrosives/hydrocarbons/reduced consciousness. Toxidromes: Anticholinergic (hot, dry, red, dilated pupils, tachycardia – TCAs, antihistamines), Cholinergic (SLUDGE – salivation, lacrimation, urination, defecation, GI cramps, emesis – organophosphates → atropine + pralidoxime), Sympathomimetic (agitation, tachycardia, hypertension, hyperthermia – cocaine, amphetamines → benzodiazepines), Opioid (pinpoint pupils, respiratory depression, drowsiness → naloxone). Specific antidotes: Paracetamol → N-acetylcysteine (Rumack-Matthew nomogram), Benzodiazepines → flumazenil (caution), Digoxin → Digibind, Beta-blockers → glucagon + atropine, Warfarin → vitamin K + PCC, Iron → desferrioxamine, Ethylene glycol/methanol → fomepizole + ethanol." },
    { q: "What is the management of acute upper GI hemorrhage in the ED?", a: "Initial: ABCDE, 2 large-bore IV cannulae (14-16G), bloods (FBC, U&E, LFTs, coag, crossmatch ≥4 units). Risk assessment: Glasgow-Blatchford Score (GBS) – if 0, consider outpatient OGD. Rockall score post-endoscopy. Resuscitation: Crystalloid initially, blood if hemodynamically unstable/Hb <7 (or <8 with IHD). Massive hemorrhage: Activate protocol, 1:1 PRBC:FFP, consider platelets, TXA 1g IV. PPI: IV Omeprazole 80mg bolus. Variceal suspected (known liver disease): IV Terlipressin 2mg (splanchnic vasoconstriction), IV antibiotics (ceftriaxone – reduces rebleeding/mortality), Sengstaken-Blakemore tube if uncontrolled (bridge to endoscopy). Endoscopy: Within 24h (urgent <12h if hemodynamically unstable). Interventions: Adrenaline injection + thermal/clips (ulcers), band ligation (varices), TIPSS if refractory variceal bleeding." }
  ]}
];

// ===== STATE =====
let currentTopic = null;
let currentIndex = 0;
let isFlipped = false;
let currentCards = [];

const defaultConfig = {
  app_title: "Medicine Flashcards Pro",
  background_color: "#0f172a",
  surface_color: "#1e293b",
  text_color: "#f1f5f9",
  primary_action_color: "#6366f1",
  secondary_action_color: "#475569",
  font_family: "DM Sans",
  font_size: 16
};

// ===== RENDER FUNCTIONS =====
function renderTopics() {
  const grid = document.getElementById('topicGrid');
  grid.innerHTML = '';
  topics.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = 'topic-btn flex flex-col items-center gap-2 p-4 rounded-xl text-center';
    btn.style.cssText = `background:rgba(30,41,59,0.8);border:1px solid rgba(99,102,241,0.15);`;
    btn.innerHTML = `<div class="w-10 h-10 rounded-lg flex items-center justify-center" style="background:${t.color}20;"><i data-lucide="${t.icon}" style="width:20px;height:20px;color:${t.color}"></i></div><span class="text-sm font-medium text-white">${t.name}</span><span class="text-xs text-slate-500">${t.cards.length} cards</span>`;
    btn.addEventListener('click', () => openTopic(i));
    grid.appendChild(btn);
  });
  lucide.createIcons();
}

function openTopic(index) {
  currentTopic = index;
  currentIndex = 0;
  isFlipped = false;
  currentCards = [...topics[index].cards];
  document.getElementById('topicView').classList.add('hidden');
  document.getElementById('cardView').classList.remove('hidden');
  document.getElementById('cardView').classList.add('fade-in');
  document.getElementById('progressArea').classList.remove('hidden');
  document.getElementById('progressArea').classList.add('flex');
  renderCard();
}

function goBack() {
  currentTopic = null;
  document.getElementById('cardView').classList.add('hidden');
  document.getElementById('topicView').classList.remove('hidden');
  document.getElementById('topicView').classList.add('fade-in');
  document.getElementById('progressArea').classList.add('hidden');
  document.getElementById('progressArea').classList.remove('flex');
}

function renderCard() {
  const t = topics[currentTopic];
  const card = currentCards[currentIndex];
  document.getElementById('topicTitle').textContent = t.name;
  document.getElementById('cardCounter').textContent = `Card ${currentIndex + 1} of ${currentCards.length}`;
  document.getElementById('progressText').textContent = `${currentIndex + 1}/${currentCards.length}`;
  document.getElementById('cardNum').textContent = `#${currentIndex + 1}`;
  document.getElementById('questionText').textContent = card.q;
  document.getElementById('answerText').textContent = card.a;
  document.getElementById('cardInner').classList.remove('flipped');
  isFlipped = false;

  // Dots
  const dots = document.getElementById('dots');
  dots.innerHTML = '';
  currentCards.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'w-2 h-2 rounded-full cursor-pointer transition-all';
    d.style.background = i === currentIndex ? '#6366f1' : '#334155';
    if (i === currentIndex) { d.style.transform = 'scale(1.3)'; }
    d.addEventListener('click', () => { currentIndex = i; renderCard(); });
    dots.appendChild(d);
  });

  // Nav button states
  document.getElementById('prevBtn').style.opacity = currentIndex === 0 ? '0.3' : '1';
  document.getElementById('nextBtn').style.opacity = currentIndex === currentCards.length - 1 ? '0.3' : '1';
}

function flipCard() {
  isFlipped = !isFlipped;
  document.getElementById('cardInner').classList.toggle('flipped', isFlipped);
}

function nextCard() {
  if (currentIndex < currentCards.length - 1) { currentIndex++; renderCard(); }
}
function prevCard() {
  if (currentIndex > 0) { currentIndex--; renderCard(); }
}
function shuffleCards() {
  for (let i = currentCards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [currentCards[i], currentCards[j]] = [currentCards[j], currentCards[i]];
  }
  currentIndex = 0;
  renderCard();
}

// ===== EVENTS =====
document.getElementById('cardContainer').addEventListener('click', flipCard);
document.getElementById('nextBtn').addEventListener('click', nextCard);
document.getElementById('prevBtn').addEventListener('click', prevCard);
document.getElementById('backBtn').addEventListener('click', goBack);
document.getElementById('shuffleBtn').addEventListener('click', shuffleCards);

// Keyboard nav
document.addEventListener('keydown', (e) => {
  if (!currentTopic && currentTopic !== 0) return;
  if (e.key === 'ArrowRight') nextCard();
  else if (e.key === 'ArrowLeft') prevCard();
  else if (e.key === ' ') { e.preventDefault(); flipCard(); }
});

// ===== ELEMENT SDK =====
function applyConfig(config) {
  const bg = config.background_color || defaultConfig.background_color;
  const surface = config.surface_color || defaultConfig.surface_color;
  const text = config.text_color || defaultConfig.text_color;
  const primary = config.primary_action_color || defaultConfig.primary_action_color;
  const secondary = config.secondary_action_color || defaultConfig.secondary_action_color;
  const font = config.font_family || defaultConfig.font_family;
  const size = config.font_size || defaultConfig.font_size;
  const title = config.app_title || defaultConfig.app_title;

  const app = document.getElementById('app');
  app.style.background = `linear-gradient(135deg, ${bg} 0%, ${surface} 50%, ${bg} 100%)`;
  app.style.fontFamily = `${font}, DM Sans, sans-serif`;
  app.style.fontSize = `${size}px`;

  document.getElementById('appTitle').textContent = title;
  document.getElementById('appTitle').style.color = text;
  document.getElementById('appTitle').style.fontFamily = `${font}, Playfair Display, serif`;
  document.getElementById('appTitle').style.fontSize = `${size * 1.25}px`;

  // Card front/back
  const front = document.querySelector('.card-front');
  const back = document.querySelector('.card-back');
  if (front) { front.style.background = `linear-gradient(145deg, ${surface}, ${secondary})`; front.style.borderColor = `${primary}33`; }
  if (back) { back.style.borderColor = `${primary}33`; }

  document.getElementById('questionText').style.color = text;
  document.getElementById('questionText').style.fontSize = `${size * 1.1}px`;
  document.getElementById('answerText').style.fontSize = `${size * 0.9}px`;

  const topicTitle = document.getElementById('topicTitle');
  if (topicTitle) { topicTitle.style.color = text; topicTitle.style.fontFamily = `${font}, Playfair Display, serif`; topicTitle.style.fontSize = `${size * 1.5}px`; }

  document.getElementById('nextBtn').style.background = `linear-gradient(135deg, ${primary}, ${primary}cc)`;
  document.getElementById('prevBtn').style.background = `${primary}33`;
  document.getElementById('prevBtn').style.borderColor = `${primary}4d`;
}

// Init
renderTopics();
lucide.createIcons();
</script>
</body>
</html>
