  <script>
// ── DATA ──
const TABS = {
  overview: {
    title: "What is Foley's Catheterization?",
    render: () => `
      <div class="fade-in space-y-6">
        <div class="rounded-xl p-6 border" style="background: var(--surface-color); border-color: rgba(255,255,255,0.06);">
          <h2 class="font-heading text-2xl mb-4" style="color: var(--primary-action);">Definition</h2>
          <p class="leading-relaxed opacity-90">A <strong>Foley catheter</strong> (indwelling urinary catheter) is a flexible tube passed through the urethra into the bladder to drain urine. It is retained in situ by an inflatable balloon at its tip. Named after <em>Dr. Frederic Foley</em> (1891–1966), a surgeon at Ancker Hospital, St. Paul, Minnesota, who designed the original balloon catheter in 1929.</p>
        </div>

        <div class="grid md:grid-cols-3 gap-4">
          ${[
            { icon: 'target', label: 'Primary Purpose', desc: 'Continuous bladder drainage in patients who cannot void voluntarily' },
            { icon: 'clock', label: 'Duration', desc: 'Short-term (< 30 days) or long-term (> 30 days) depending on indication' },
            { icon: 'shield', label: 'Key Principle', desc: 'Strict aseptic technique is mandatory to reduce CAUTI risk' }
          ].map(c => `
            <div class="rounded-xl p-5 border step-card" style="background: var(--surface-color); border-color: rgba(255,255,255,0.06);">
              <i data-lucide="${c.icon}" style="color: var(--primary-action); width:28px; height:28px;" class="mb-3"></i>
              <h3 class="font-semibold mb-1">${c.label}</h3>
              <p class="text-sm opacity-70">${c.desc}</p>
            </div>
          `).join('')}
        </div>

        <div class="rounded-xl p-6 border" style="background: var(--surface-color); border-color: rgba(255,255,255,0.06);">
          <h2 class="font-heading text-2xl mb-4" style="color: var(--primary-action);">Anatomy Refresher</h2>
          <div class="grid md:grid-cols-2 gap-6">
            <div>
              <h3 class="font-semibold mb-2" style="color: var(--primary-action);">♂ Male Urethra (~18–22 cm)</h3>
              <ul class="space-y-1 text-sm opacity-80">
                <li>• <strong>Prostatic</strong> (3–4 cm) — through prostate</li>
                <li>• <strong>Membranous</strong> (1–2 cm) — through urogenital diaphragm (narrowest & least distensible)</li>
                <li>• <strong>Bulbar/Spongy</strong> (15 cm) — through corpus spongiosum</li>
                <li>• <strong>Navicular fossa</strong> — within glans penis</li>
                <li>⚠️ Two curvatures: pre-prostatic & infra-pubic — penis must be held at 60–90° then lowered</li>
              </ul>
            </div>
            <div>
              <h3 class="font-semibold mb-2" style="color: var(--primary-action);">♀ Female Urethra (~3–5 cm)</h3>
              <ul class="space-y-1 text-sm opacity-80">
                <li>• Straight course, shorter length</li>
                <li>• Urethral meatus anterior to vaginal introitus</li>
                <li>• Higher CAUTI risk due to proximity to perineum</li>
                <li>• Landmark: meatus lies between clitoris (above) and vaginal opening (below)</li>
                <li>💡 If catheter enters vagina by mistake — leave it as a landmark, use a new catheter</li>
              </ul>
            </div>
          </div>
        </div>

        <div class="rounded-xl p-5 border" style="background: rgba(56,189,248,0.05); border-color: var(--primary-action); border-width:1px;">
          <div class="flex gap-3 items-start">
            <i data-lucide="info" style="color: var(--primary-action); width:20px; height:20px; flex-shrink:0; margin-top:2px;"></i>
            <div class="text-sm opacity-90">
              <strong>Clinical Pearl:</strong> CAUTI (Catheter-Associated Urinary Tract Infection) accounts for ~40% of all hospital-acquired infections. The single most effective prevention strategy is <strong>avoiding unnecessary catheterization</strong> and early removal.
            </div>
          </div>
        </div>
      </div>
    `
  },

  indications: {
    title: "Indications & Contraindications",
    render: () => `
      <div class="fade-in space-y-6">
        <div class="grid md:grid-cols-2 gap-6">
          <div class="rounded-xl p-6 border" style="background: var(--surface-color); border-color: rgba(255,255,255,0.06);">
            <h2 class="font-heading text-xl mb-4 flex items-center gap-2"><i data-lucide="check-circle" style="color:#22c55e; width:22px; height:22px;"></i> Indications</h2>
            <div class="space-y-4">
              ${[
                { cat: 'Acute Urinary Retention', items: ['BPH (most common in males)', 'Post-operative retention', 'Neurogenic bladder', 'Clot retention (use 3-way catheter)'] },
                { cat: 'Perioperative', items: ['Prolonged surgeries (> 3 hrs)', 'Pelvic / urological procedures', 'Epidural / spinal anesthesia', 'Need for I/O monitoring'] },
                { cat: 'Critical Care', items: ['Hemodynamic instability — strict I/O', 'Acute kidney injury monitoring', 'Stage III–IV pressure ulcers on sacrum/perineum', 'Patient on continuous bladder irrigation'] },
                { cat: 'Other', items: ['Chronic obstruction not amenable to surgery', 'Comfort care in terminal illness (patient preference)', 'Instillation of intravesical medications', 'Urodynamic studies (specialized catheters)'] }
              ].map(g => `
                <div>
                  <h3 class="text-sm font-semibold mb-1" style="color: var(--primary-action);">${g.cat}</h3>
                  <ul class="text-sm opacity-80 space-y-0.5">${g.items.map(i => `<li class="pl-3">• ${i}</li>`).join('')}</ul>
                </div>
              `).join('')}
            </div>
          </div>

          <div>
            <div class="rounded-xl p-6 border mb-4" style="background: var(--surface-color); border-color: rgba(255,255,255,0.06);">
              <h2 class="font-heading text-xl mb-4 flex items-center gap-2"><i data-lucide="x-circle" style="color:#ef4444; width:22px; height:22px;"></i> Contraindications</h2>
              <div class="space-y-3">
                ${[
                  { type: 'ABSOLUTE', color: '#ef4444', items: ['Known urethral injury / disruption', 'Blood at meatus (suspect urethral trauma)', 'High-riding / non-palpable prostate on DRE', 'Perineal hematoma / butterfly sign', 'Pelvic fracture with suspected urethral injury'] },
                  { type: 'RELATIVE', color: '#f59e0b', items: ['Recent urethral or bladder surgery', 'Known urethral stricture (use smaller catheter or consult urology)', 'Severe phimosis (may need dorsal slit first)', 'Active urethral infection / periurethral abscess', 'Allergy to latex (use silicone catheter)'] }
                ].map(g => `
                  <div>
                    <span class="pill mb-2" style="background: ${g.color}20; color: ${g.color}; border: 1px solid ${g.color};">${g.type}</span>
                    <ul class="text-sm opacity-80 space-y-0.5 mt-1">${g.items.map(i => `<li class="pl-3">• ${i}</li>`).join('')}</ul>
                  </div>
                `).join('')}
              </div>
            </div>

            <div class="rounded-xl p-5 border" style="background: rgba(239,68,68,0.05); border-color: #ef4444;">
              <div class="flex gap-3 items-start">
                <i data-lucide="alert-triangle" style="color:#ef4444; width:20px; height:20px; flex-shrink:0; margin-top:2px;"></i>
                <div class="text-sm opacity-90">
                  <strong>⚠️ Golden Rule:</strong> In trauma — if there is <strong>blood at the meatus, perineal hematoma, or high-riding prostate</strong>, do NOT attempt urethral catheterization. Perform a <strong>retrograde urethrogram (RUG)</strong> first. If urethral injury is confirmed → <strong>suprapubic catheterization</strong>.
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="rounded-xl p-6 border" style="background: var(--surface-color); border-color: rgba(255,255,255,0.06);">
          <h2 class="font-heading text-xl mb-3" style="color: var(--primary-action);">❌ NOT Valid Indications (Common Errors)</h2>
          <div class="grid md:grid-cols-3 gap-3 text-sm">
            ${['Nursing convenience / staff request', 'Incontinence management alone (use alternatives)', 'Obtaining urine culture (use in-out if needed)', 'Immobility alone without other criteria', 'Patient request without medical justification', 'Chronic Foley without periodic reassessment'].map(i => `
              <div class="rounded-lg p-3 border flex items-start gap-2" style="border-color: rgba(255,255,255,0.06); background: rgba(255,255,255,0.02);">
                <i data-lucide="x" style="color:#ef4444; width:16px; height:16px; flex-shrink:0; margin-top:1px;"></i>
                <span class="opacity-80">${i}</span>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    `
  },

  equipment: {
    title: "Equipment & Preparation",
    render: () => `
      <div class="fade-in space-y-6">
        <div class="rounded-xl p-6 border" style="background: var(--surface-color); border-color: rgba(255,255,255,0.06);">
          <h2 class="font-heading text-2xl mb-4" style="color: var(--primary-action);">Catheterization Trolley — Sterile Setup</h2>
          <div class="grid md:grid-cols-2 gap-6">
            <div>
              <h3 class="font-semibold text-sm mb-2 uppercase tracking-wide opacity-60">Essential Equipment</h3>
              <div class="space-y-2">
                ${[
                  { item: 'Foley catheter (appropriate size)', note: 'Check expiry & balloon integrity' },
                  { item: 'Sterile catheterization pack', note: 'Drapes, gauze, kidney tray, forceps' },
                  { item: 'Sterile gloves (2 pairs)', note: 'One for cleaning, one for insertion' },
                  { item: 'Antiseptic solution', note: 'Povidone-iodine 10% or chlorhexidine 0.05%' },
                  { item: 'Sterile lubricant / Lignocaine 2% gel', note: '10–15 mL for males, 5 mL for females' },
                  { item: 'Sterile water for injection 10 mL', note: 'For balloon inflation (NOT saline — crystallizes)' },
                  { item: '10 mL syringe', note: 'Pre-filled with sterile water' },
                  { item: 'Urine collection bag', note: 'Closed drainage system' },
                  { item: 'Adhesive tape / catheter strap', note: 'For securing catheter' },
                ].map(e => `
                  <div class="flex gap-3 text-sm">
                    <i data-lucide="check" style="color: var(--primary-action); width:16px; height:16px; flex-shrink:0; margin-top:2px;"></i>
                    <div><strong>${e.item}</strong><br><span class="opacity-60">${e.note}</span></div>
                  </div>
                `).join('')}
              </div>
            </div>
            <div>
              <h3 class="font-semibold text-sm mb-2 uppercase tracking-wide opacity-60">Pre-Procedure Checklist</h3>
              <div id="checklist" class="space-y-2">
                ${[
                  'Verify indication & physician order',
                  'Check for contraindications (blood at meatus?)',
                  'Review allergies (latex, lidocaine, iodine)',
                  'Explain procedure, obtain verbal consent',
                  'Ensure adequate lighting & privacy',
                  'Position patient (supine, frog-leg for female)',
                  'Perform hand hygiene (WHO 5 moments)',
                  'Open sterile pack using aseptic technique',
                  'Test balloon integrity with 10 mL sterile water',
                  'Arrange equipment on sterile field'
                ].map((item, i) => `
                  <label class="flex gap-3 text-sm cursor-pointer items-start group" onclick="toggleCheck(this)">
                    <span class="w-5 h-5 rounded border-2 flex items-center justify-center flex-shrink-0 mt-0.5 transition-colors" style="border-color: var(--secondary-action);" data-check="false">
                    </span>
                    <span class="group-hover:opacity-100 opacity-80 transition-opacity">${item}</span>
                  </label>
                `).join('')}
              </div>
              <button onclick="resetChecklist()" class="mt-4 text-xs px-3 py-1.5 rounded-lg transition-colors" style="background: var(--secondary-action); color: var(--text-color); opacity:0.7;">Reset Checklist</button>
            </div>
          </div>
        </div>

        <div class="rounded-xl p-5 border" style="background: rgba(56,189,248,0.05); border-color: var(--primary-action);">
          <div class="flex gap-3 items-start">
            <i data-lucide="lightbulb" style="color: var(--primary-action); width:20px; height:20px; flex-shrink:0; margin-top:2px;"></i>
            <div class="text-sm opacity-90">
              <strong>Why sterile water, not normal saline?</strong> Normal saline can cause salt crystal deposition within the balloon channel over time, making deflation difficult or impossible. Always use <strong>sterile water for injection</strong> for balloon inflation.
            </div>
          </div>
        </div>
      </div>
    `
  },

  procedure: {
    title: "Step-by-Step Procedure",
    render: () => {
      const maleSteps = [
        { step: 1, title: 'Position & Prepare', detail: 'Patient supine. Perform hand hygiene. Open sterile pack. Don sterile gloves. Drape the patient with fenestrated sterile drape exposing penis only.' },
        { step: 2, title: 'Clean the Meatus', detail: 'With non-dominant hand, retract foreskin (if uncircumcised) and hold penis at 90° to abdomen. Using dominant hand with forceps, clean glans with antiseptic — meatus outward in circular motions. Repeat ×3 with fresh swabs.' },
        { step: 3, title: 'Instill Anaesthetic Gel', detail: 'Instill 10–15 mL of 2% lignocaine gel into urethra using a pre-filled syringe or gel tube. Gently compress meatus for 3–5 minutes to allow anaesthesia to take effect. This step is ESSENTIAL in males.' },
        { step: 4, title: 'Insert the Catheter', detail: 'Hold penis at 60–90° (straightens prostatic urethra). With dominant sterile hand, advance catheter gently and steadily. At ~15–17 cm, lower penis to ~45° to negotiate the bulbo-membranous junction. Continue advancing until urine flows + an additional 5 cm (ensures balloon is fully in bladder).' },
        { step: 5, title: 'Inflate Balloon', detail: 'Inject 10 mL sterile water into the balloon port. If patient reports pain → STOP → deflate → advance further → retry. Never inflate against resistance. Gently retract catheter until resistance is felt (balloon at bladder neck).' },
        { step: 6, title: 'Secure & Connect', detail: 'Connect catheter to closed drainage bag. Secure catheter to anterior thigh (♂) with tape or strap, allowing slack to prevent traction. Replace foreskin (if retracted) to prevent paraphimosis. Hang bag below bladder level. Document: catheter size, balloon volume, residual urine volume, patient tolerance.' }
      ];
      const femaleSteps = [
        { step: 1, title: 'Position & Prepare', detail: 'Patient supine with knees flexed and abducted (frog-leg position). Ensure good lighting. Perform hand hygiene, open pack, don sterile gloves. Apply sterile drapes.' },
        { step: 2, title: 'Identify & Clean', detail: 'With non-dominant hand, separate labia minora to expose urethral meatus (between clitoris above and vaginal introitus below). Clean with antiseptic — one downward stroke per swab, anterior to posterior. Use fresh swab each stroke. Repeat ×3. Keep non-dominant hand in place throughout.' },
        { step: 3, title: 'Lubricate & Insert', detail: 'Apply sterile lubricant (5 mL lignocaine gel optional but recommended) to catheter tip. Insert catheter into urethral meatus 5–7 cm until urine flows, then advance 2–3 cm more. If catheter enters vagina: leave it in place as landmark, use new catheter in the orifice above it.' },
        { step: 4, title: 'Inflate & Secure', detail: 'Inflate balloon with 10 mL sterile water. Gently retract until resistance felt. Connect to closed drainage. Secure to medial thigh. Document procedure as per male steps.' }
      ];

      return `
        <div class="fade-in space-y-6">
          <div class="flex gap-2 mb-2">
            <button id="btnMale" onclick="showGender('male')" class="px-4 py-2 rounded-lg text-sm font-semibold transition-all" style="background: var(--primary-action); color: var(--bg-color);">♂ Male Technique</button>
            <button id="btnFemale" onclick="showGender('female')" class="px-4 py-2 rounded-lg text-sm font-semibold transition-all" style="background: var(--surface-color); color: var(--text-color); border: 1px solid rgba(255,255,255,0.1);">♀ Female Technique</button>
          </div>

          <div id="maleSteps" class="space-y-4">
            ${maleSteps.map(s => `
              <div class="step-card rounded-xl p-5 border flex gap-4" style="background: var(--surface-color); border-color: rgba(255,255,255,0.06);">
                <div class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-lg flex-shrink-0" style="background: var(--primary-action); color: var(--bg-color);">${s.step}</div>
                <div>
                  <h3 class="font-semibold text-lg mb-1">${s.title}</h3>
                  <p class="text-sm opacity-80 leading-relaxed">${s.detail}</p>
                </div>
              </div>
            `).join('')}
          </div>

          <div id="femaleSteps" class="space-y-4 hidden">
            ${femaleSteps.map(s => `

// ── STATE ──
let currentTab = 'overview';
let quizScore = 0;
let answeredQs = new Set();

// ── TAB SWITCHING ──
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('#tabBar button').forEach(b => {
    b.className = b.dataset.tab === tab
      ? 'tab-active px-4 py-3 text-sm whitespace-nowrap transition-all'
      : 'tab-inactive px-4 py-3 text-sm whitespace-nowrap transition-all';
  });
  document.getElementById('content').innerHTML = TABS[tab].render();
  quizScore = 0; answeredQs = new Set();
  lucide.createIcons();
}

// ── PROCEDURE GENDER TOGGLE ──
function showGender(g) {
  document.getElementById('maleSteps').classList.toggle('hidden', g !== 'male');
  document.getElementById('femaleSteps').classList.toggle('hidden', g !== 'female');
  const m = document.getElementById('btnMale');
  const f = document.getElementById('btnFemale');
  if (g === 'male') {
    m.style.background = 'var(--primary-action)'; m.style.color = 'var(--bg-color)'; m.style.border = 'none';
    f.style.background = 'var(--surface-color)'; f.style.color = 'var(--text-color)'; f.style.border = '1px solid rgba(255,255,255,0.1)';
  } else {
    f.style.background = 'var(--primary-action)'; f.style.color = 'var(--bg-color)'; f.style.border = 'none';
    m.style.background = 'var(--surface-color)'; m.style.color = 'var(--text-color)'; m.style.border = '1px solid rgba(255,255,255,0.1)';
  }
}

// ── CHECKLIST ──
function toggleCheck(label) {
  const box = label.querySelector('[data-check]');
  const checked = box.dataset.check === 'true';
  box.dataset.check = checked ? 'false' : 'true';
  box.style.background = checked ? 'transparent' : 'var(--primary-action)';
  box.style.borderColor = checked ? 'var(--secondary-action)' : 'var(--primary-action)';
  box.innerHTML = checked ? '' : '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--bg-color)" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>';
}
function resetChecklist() {
  document.querySelectorAll('[data-check]').forEach(b => {
    b.dataset.check = 'false'; b.style.background = 'transparent'; b.style.borderColor = 'var(--secondary-action)'; b.innerHTML = '';
  });
}

// ── QUIZ ──
function checkAnswer(qi, selected, correct) {
  if (answeredQs.has(qi)) return;
  answeredQs.add(qi);
  const opts = document.querySelectorAll(`#q${qi} .quiz-option`);
  opts.forEach((o, i) => {
    o.style.cursor = 'default';
    if (i === correct) o.classList.add('quiz-correct');
    else if (i === selected && selected !== correct) o.classList.add('quiz-wrong');
  });
  if (selected === correct) quizScore++;
  document.getElementById('score').textContent = quizScore;
  const fb = document.getElementById(`fb${qi}`);
  fb.classList.remove('hidden');
  fb.style.color = selected === correct ? '#22c55e' : '#ef4444';
  fb.textContent = selected === correct ? '✓ Correct!' : '✗ Incorrect — the correct answer is highlighted in green.';
}
function resetQuiz() { switchTab('quiz'); }

// ── ELEMENTS SDK ──
const defaultConfig = {
  main_title: "Foley's Catheterization",
  subtitle: "Complete Clinical Guide — MBBS / MD Level",
  background_color: "#0f1729",
  surface_color: "#1a2540",
  text_color: "#e2e8f0",
  primary_action: "#38bdf8",
  secondary_action: "#64748b",
  font_family: "Playfair Display",
  font_size: 16
};

function applyConfig(config) {
  const r = document.documentElement.style;
  r.setProperty('--bg-color', config.background_color || defaultConfig.background_color);
  r.setProperty('--surface-color', config.surface_color || defaultConfig.surface_color);
  r.setProperty('--text-color', config.text_color || defaultConfig.text_color);
  r.setProperty('--primary-action', config.primary_action || defaultConfig.primary_action);
  r.setProperty('--secondary-action', config.secondary_action || defaultConfig.secondary_action);

  document.body.style.color = config.text_color || defaultConfig.text_color;
  document.body.style.background = config.background_color || defaultConfig.background_color;

  const title = document.getElementById('mainTitle');
  const sub = document.getElementById('subtitle');
  if (title) title.textContent = config.main_title || defaultConfig.main_title;
  if (sub) sub.textContent = config.subtitle || defaultConfig.subtitle;

  const font = config.font_family || defaultConfig.font_family;
  document.querySelectorAll('.font-heading').forEach(el => {
    el.style.fontFamily = `${font}, Georgia, serif`;
  });

  const base = config.font_size || defaultConfig.font_size;
  document.body.style.fontSize = `${base}px`;
}

// ── INIT ──
switchTab('overview');
applyConfig(defaultConfig);
</script>
