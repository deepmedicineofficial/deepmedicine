let currentTab = 'positions';
let expandedCards = new Set();

// ===================== RENDER FUNCTIONS =====================
function switchTab(tab) {
  currentTab = tab;
  expandedCards.clear();
  document.querySelectorAll('#main-tabs button').forEach(b => {
    if (b.dataset.tab === tab) {
      b.className = 'tab-active whitespace-nowrap px-4 py-2.5 rounded-xl text-sm font-semibold transition-all';
    } else {
      b.className = 'whitespace-nowrap px-4 py-2.5 rounded-xl text-sm font-semibold text-slate-400 hover:text-white transition-all glass';
    }
  });
  renderContent();
  lucide.createIcons();
}

function toggleCard(id) {
  if (expandedCards.has(id)) expandedCards.delete(id);
  else expandedCards.add(id);
  renderContent();
  lucide.createIcons();
}

function severityBadge(s) {
  const map = { critical:'bg-red-500/20 text-red-400 border border-red-500/30', urgent:'bg-amber-500/20 text-amber-400 border border-amber-500/30', routine:'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' };
  return `<span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded-full ${map[s]}">${s}</span>`;
}

function severityClass(s) {
  return { critical:'severity-critical', urgent:'severity-urgent', routine:'severity-routine' }[s] || '';
}

                <td class="py-2 text-slate-400 text-xs hidden sm:table-cell">${s.note}</td>
              </tr>
              <tr class="sm:hidden border-t border-white/5">
                <td colspan="2" class="py-1 pb-2 text-slate-500 text-xs">${s.note}</td>
              </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
        <div>
          <h4 class="text-orange-400 text-xs font-bold uppercase tracking-wider mb-1">Escalation Pathway</h4>
          <p class="text-slate-300 text-xs sm:text-sm leading-relaxed">${p.escalation}</p>
        </div>
        <div class="rounded-lg p-3 sm:p-4" style="background:linear-gradient(135deg,rgba(245,158,11,0.08),rgba(245,158,11,0.03));border:1px solid rgba(245,158,11,0.15);">
          <div class="flex items-start gap-2">
            <i data-lucide="lightbulb" style="width:16px;height:16px;color:#f59e0b;flex-shrink:0;margin-top:2px;"></i>
            <div>
              <h4 class="text-amber-400 text-xs font-bold uppercase tracking-wider mb-1">Clinical Pearl</h4>
              <p class="text-amber-200/80 text-sm leading-relaxed">${p.pearl}</p>
            </div>
          </div>
        </div>
      </div>
      ` : ''}
    </div>`;
  }).join('');
}

function renderDrugs() {
  return DRUG_PROTOCOLS.map((p,i) => {
    const open = expandedCards.has('drug-'+i);
    return `
    <div class="protocol-card glass rounded-xl ${severityClass(p.severity)} card-glow fade-up" style="animation-delay:${i*0.06}s;">
      <button onclick="toggleCard('drug-${i}')" class="w-full text-left p-4 sm:p-5 flex items-start gap-3">
        <div class="w-10 h-10 rounded-lg flex items-center justify-center flex-shrink-0" style="background:rgba(236,72,153,0.15);">
          <i data-lucide="${p.icon}" style="width:18px;height:18px;color:#f472b6;"></i>
        </div>
        <div class="flex-1 min-w-0">
          <h3 class="text-white font-semibold text-sm sm:text-base">${p.name}</h3>
          <p class="text-slate-400 text-xs">${p.drugs.length} agents</p>
        </div>
        <i data-lucide="${open?'chevron-up':'chevron-down'}" style="width:18px;height:18px;color:#64748b;flex-shrink:0;margin-top:4px;"></i>
      </button>
      ${open ? `
      <div class="px-4 sm:px-5 pb-5 space-y-3">
        <div class="h-px bg-white/5"></div>
        ${p.drugs.map(d => `
        <div class="glass rounded-lg p-3 sm:p-4 space-y-2">
          <div class="flex flex-wrap items-center gap-2">
            <h5 class="text-pink-300 font-bold text-sm">${d.drug}</h5>
            <span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full font-mono">${d.dose}</span>
          </div>
          <p class="text-slate-500 text-xs"><span class="text-slate-400 font-medium">Mixing:</span> ${d.mix}</p>
          <p class="text-slate-300 text-xs sm:text-sm leading-relaxed">${d.action}</p>
          <p class="text-violet-400 text-xs"><span class="font-medium">Monitor:</span> ${d.monitor}</p>
        </div>
        `).join('')}
      </div>
      ` : ''}
    </div>`;
  }).join('');
}

function renderProcedures() {
  return PROCEDURES.map((p,i) => {
    const open = expandedCards.has('proc-'+i);
    return `
    <div class="protocol-card glass rounded-xl ${severityClass(p.severity)} card-glow fade-up" style="animation-delay:${i*0.06}s;">
      <button onclick="toggleCard('proc-${i}')" class="w-full text-left p-4 sm:p-5 flex items-start gap-3">
        <div class="w-10 h-10 rounded-lg flex items-center justify-center flex-shrink-0" style="background:rgba(34,197,94,0.15);">
          <i data-lucide="${p.icon}" style="width:18px;height:18px;color:#4ade80;"></i>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex flex-wrap items-center gap-2 mb-1">
            <h3 class="text-white font-semibold text-sm sm:text-base">${p.name}</h3>
            ${severityBadge(p.severity)}
          </div>
          <p class="text-slate-400 text-xs">${p.steps.length} steps</p>
        </div>
        <i data-lucide="${open?'chevron-up':'chevron-down'}" style="width:18px;height:18px;color:#64748b;flex-shrink:0;margin-top:4px;"></i>
      </button>
      ${open ? `
      <div class="px-4 sm:px-5 pb-5 space-y-3">
        <div class="h-px bg-white/5"></div>
        ${p.steps.map((s,j) => `
          <div class="step-line">
            <div class="step-dot bg-emerald-500/30 text-emerald-400">${j+1}</div>
            <div>
              <h5 class="text-white text-sm font-semibold mb-0.5">${s.label}</h5>
              <p class="text-slate-300 text-xs sm:text-sm leading-relaxed">${s.detail}</p>
            </div>
          </div>
        `).join('')}
        <div class="rounded-lg p-3 sm:p-4 mt-2" style="background:linear-gradient(135deg,rgba(245,158,11,0.08),rgba(245,158,11,0.03));border:1px solid rgba(245,158,11,0.15);">
          <div class="flex items-start gap-2">
            <i data-lucide="lightbulb" style="width:16px;height:16px;color:#f59e0b;flex-shrink:0;margin-top:2px;"></i>
            <div>
              <h4 class="text-amber-400 text-xs font-bold uppercase tracking-wider mb-1">Clinical Pearl</h4>
              <p class="text-amber-200/80 text-sm leading-relaxed">${p.pearl}</p>
            </div>
          </div>
        </div>
      </div>
      ` : ''}
    </div>`;
  }).join('');
}

function renderContent() {
  const area = document.getElementById('content-area');
  const renderers = { positions: renderPositions, emergency: renderEmergency, icu: renderICU, drugs: renderDrugs, procedures: renderProcedures };
  area.innerHTML = `<div class="max-w-6xl mx-auto space-y-3">${renderers[currentTab]()}</div>`;
}

// ===================== ELEMENT SDK =====================
const defaultConfig = {
  doctor_name: 'Dr. Clinical Expert',
  designation: 'MBBS, MD Medicine | Professor of Medicine | ICU Intensivist | Emergency Medicine Specialist',
  institution: 'Teaching Hospital & Medical University',
  background_color: '#0a0e1a',
  surface_color: '#1319278a',
  text_color: '#e2e8f0',
  primary_action: '#0ea5e9',
  secondary_action: '#f59e0b',
  font_family: 'DM Sans',
  font_size: 14
};

function applyConfig(config) {
  const c = { ...defaultConfig, ...config };
  const name = document.getElementById('doc-name');
  const desg = document.getElementById('doc-designation');
  const inst = document.getElementById('doc-institution');
  if (name) name.textContent = c.doctor_name;
  if (desg) desg.textContent = c.designation;
  if (inst) inst.textContent = c.institution;

  // Colors
  const app = document.getElementById('app');
  if (app) app.style.background = `linear-gradient(145deg, ${c.background_color} 0%, ${adjustColor(c.background_color,10)} 40%, ${c.background_color} 100%)`;

  // Font
  const fontStack = `${c.font_family}, 'DM Sans', sans-serif`;
  document.body.style.fontFamily = fontStack;

  // Font size
  const base = c.font_size;
  document.querySelectorAll('p, td, span:not(.step-dot)').forEach(el => {
    if (el.classList.contains('text-xs')) el.style.fontSize = `${base * 0.85}px`;
    else if (el.classList.contains('text-sm')) el.style.fontSize = `${base}px`;
  });
}

function adjustColor(hex, amt) {
  let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  r = Math.min(255, r+amt); g = Math.min(255, g+amt); b = Math.min(255, b+amt);
  return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
}

// Initial render
renderContent();
lucide.createIcons();
</script>
