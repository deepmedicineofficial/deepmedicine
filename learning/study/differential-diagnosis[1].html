const systems = [...new Set(diseases.map(d => d.system))].sort();
const allSymptoms = [...new Set(diseases.flatMap(d => d.symptoms))].sort();

let selectedSymptoms = new Set();
let filteredDiseases = [...diseases];

// ─── DEFAULT CONFIG ───
const defaultConfig = {
  app_title: "Differential Diagnosis Explorer",
  subtitle_text: "Clinical Decision Support Tool",
  background_color: "#0f172a",
  surface_color: "#1e293b",
  text_color: "#f1f5f9",
  primary_action_color: "#22d3ee",
  secondary_action_color: "#64748b",
  font_family: "DM Sans",
  font_size: 14
};

// ─── RENDER FUNCTIONS ───
function getUrgencyStyle(u) {
  if (u === "emergency") return { bg: "rgba(239,68,68,0.15)", border: "#ef4444", text: "#fca5a5", label: "🔴 EMERGENCY" };
  if (u === "urgent") return { bg: "rgba(251,191,36,0.15)", border: "#f59e0b", text: "#fcd34d", label: "🟡 URGENT" };
  return { bg: "rgba(34,197,94,0.15)", border: "#22c55e", text: "#86efac", label: "🟢 ROUTINE" };
}

function renderSystemFilter() {
  const sel = document.getElementById("systemFilter");
  sel.innerHTML = '<option value="all">All Systems</option>' + systems.map(s => `<option value="${s}">${s}</option>`).join('');
}

function renderDiseaseCards() {
  const grid = document.getElementById("diseaseGrid");
  const detail = document.getElementById("diseaseDetail");
  detail.classList.add("hidden");
  grid.classList.remove("hidden");

  if (filteredDiseases.length === 0) {
    grid.innerHTML = `<div class="col-span-full text-center py-12"><p style="color: #64748b;" class="text-lg">No conditions match your criteria</p><p style="color: #475569;" class="text-sm mt-2">Try adjusting your search or filters</p></div>`;
    document.getElementById("resultCount").textContent = "No results found";
    return;
  }

  document.getElementById("resultCount").textContent = `Showing ${filteredDiseases.length} condition${filteredDiseases.length > 1 ? 's' : ''}`;

  grid.innerHTML = filteredDiseases.map(d => {
    const u = getUrgencyStyle(d.urgency);
    const matchedSymptoms = d.symptoms.filter(s => selectedSymptoms.has(s));
    const matchPct = selectedSymptoms.size > 0 ? Math.round((matchedSymptoms.length / selectedSymptoms.size) * 100) : 0;

    return `<div class="card-hover rounded-xl p-5 cursor-pointer fade-in" style="background: ${defaultConfig.surface_color}; border: 1px solid #334155;" onclick="showDetail(${d.id})">
      <div class="flex items-start justify-between mb-3">
        <div class="flex-1">
          <span class="text-xs px-2 py-0.5 rounded-full font-medium" style="background: ${u.bg}; color: ${u.text}; border: 1px solid ${u.border};">${u.label}</span>
          <h3 class="heading-font text-lg font-bold mt-2" style="color: ${defaultConfig.text_color};">${d.name}</h3>
          <span class="text-xs" style="color: ${defaultConfig.secondary_action_color};">${d.system}</span>
        </div>
        ${selectedSymptoms.size > 0 ? `<div class="text-right ml-3"><div class="text-2xl font-bold" style="color: ${defaultConfig.primary_action_color};">${matchPct}%</div><div class="text-xs" style="color: ${defaultConfig.secondary_action_color};">match</div></div>` : ''}
      </div>
      <div class="flex flex-wrap gap-1.5 mt-3">${d.symptoms.slice(0, 4).map(s => {
        const isMatch = selectedSymptoms.has(s);
        return `<span class="text-xs px-2 py-0.5 rounded-full" style="background: ${isMatch ? 'rgba(34,211,238,0.2)' : 'rgba(100,116,139,0.2)'}; color: ${isMatch ? '#22d3ee' : '#94a3b8'};">${s}</span>`;
      }).join('')}${d.symptoms.length > 4 ? `<span class="text-xs px-2 py-0.5 rounded-full" style="color: #64748b;">+${d.symptoms.length - 4} more</span>` : ''}</div>
      <div class="flex items-center justify-between mt-4 pt-3" style="border-top: 1px solid #334155;">
        <span class="text-xs" style="color: ${defaultConfig.secondary_action_color};">${d.differentials.length} differentials</span>
        <span class="text-xs font-medium flex items-center gap-1" style="color: ${defaultConfig.primary_action_color};">View Details <i data-lucide="chevron-right" style="width:14px;height:14px;"></i></span>
      </div>
    </div>`;
  }).join('');
  lucide.createIcons();
}

window.showDetail = function(id) {
  const d = diseases.find(x => x.id === id);
  if (!d) return;
  const grid = document.getElementById("diseaseGrid");
  const detail = document.getElementById("diseaseDetail");
  const u = getUrgencyStyle(d.urgency);

  grid.classList.add("hidden");
  detail.classList.remove("hidden");
  detail.innerHTML = `
    <button onclick="backToList()" class="flex items-center gap-1 text-sm mb-4 hover:underline" style="color: ${defaultConfig.primary_action_color};"><i data-lucide="arrow-left" style="width:16px;height:16px;"></i> Back to all conditions</button>
    <div class="rounded-xl p-5 sm:p-7 fade-in" style="background: ${defaultConfig.surface_color}; border: 1px solid #334155;">
      <div class="flex flex-wrap items-center gap-3 mb-1">
        <span class="text-xs px-2 py-0.5 rounded-full font-medium" style="background: ${u.bg}; color: ${u.text}; border: 1px solid ${u.border};">${u.label}</span>
        <span class="text-xs" style="color: ${defaultConfig.secondary_action_color};">${d.system}</span>
      </div>
      <h2 class="heading-font text-2xl sm:text-3xl font-bold mt-2 mb-6" style="color: ${defaultConfig.text_color};">${d.name}</h2>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
        ${section("Presenting Symptoms", "thermometer", d.symptoms.map(s => `<span class="symptom-chip text-xs px-3 py-1.5 rounded-full cursor-pointer inline-block mb-1" style="background: ${selectedSymptoms.has(s) ? 'rgba(34,211,238,0.2)' : 'rgba(100,116,139,0.15)'}; color: ${selectedSymptoms.has(s) ? '#22d3ee' : '#cbd5e1'};" onclick="toggleSymptom('${s.replace(/'/g, "\\'")}')">${s}</span>`).join(' '))}
        ${section("Key Clinical Findings", "stethoscope", `<p class="text-sm leading-relaxed" style="color: #cbd5e1;">${d.keyFindings}</p>`)}
        ${section("Differential Diagnoses", "git-branch", `<ol class="space-y-1.5">${d.differentials.map((dd, i) => `<li class="flex items-center gap-2 text-sm" style="color: #cbd5e1;"><span class="w-5 h-5 flex items-center justify-center rounded-full text-xs font-bold flex-shrink-0" style="background: rgba(34,211,238,0.15); color: #22d3ee;">${i + 1}</span>${dd}</li>`).join('')}</ol>`)}
        ${section("Investigations", "microscope", `<ul class="space-y-1">${d.investigations.map(inv => `<li class="flex items-start gap-2 text-sm" style="color: #cbd5e1;"><span style="color: #22d3ee; margin-top:4px;">•</span>${inv}</li>`).join('')}</ul>`)}
      </div>

      <div class="mt-5">
        ${section("Management", "pill", `<p class="text-sm leading-relaxed" style="color: #cbd5e1;">${d.management}</p>`)}
      </div>

      <div class="mt-5">
        <div class="rounded-lg p-4" style="background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25);">
          <h4 class="text-sm font-bold flex items-center gap-2 mb-2" style="color: #fca5a5;"><i data-lucide="alert-circle" style="width:16px;height:16px;"></i> Red Flags</h4>
          <div class="flex flex-wrap gap-2">${d.redFlags.map(rf => `<span class="text-xs px-2.5 py-1 rounded-full" style="background: rgba(239,68,68,0.15); color: #fca5a5;">⚠ ${rf}</span>`).join('')}</div>
        </div>
      </div>
    </div>`;
  lucide.createIcons();
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

function section(title, icon, content) {
  return `<div class="rounded-lg p-4" style="background: rgba(15,23,42,0.5); border: 1px solid #334155;">
    <h4 class="text-sm font-bold flex items-center gap-2 mb-3" style="color: ${defaultConfig.primary_action_color};"><i data-lucide="${icon}" style="width:16px;height:16px;"></i>${title}</h4>
    ${content}
  </div>`;
}

window.backToList = function() {
  filterAndRender();
};

window.toggleSymptom = function(symptom) {
  if (selectedSymptoms.has(symptom)) selectedSymptoms.delete(symptom); else selectedSymptoms.add(symptom);
  renderSelectedSymptoms();
  filterAndRender();
};

function renderSelectedSymptoms() {
  const container = document.getElementById("selectedSymptoms");
  const tags = document.getElementById("symptomTags");
  if (selectedSymptoms.size === 0) { container.classList.add("hidden"); return; }
  container.classList.remove("hidden");
  tags.innerHTML = [...selectedSymptoms].map(s => `<button class="symptom-chip text-xs px-3 py-1.5 rounded-full flex items-center gap-1" style="background: rgba(34,211,238,0.2); color: #22d3ee;" onclick="toggleSymptom('${s.replace(/'/g, "\\'")}')">${s} <i data-lucide="x" style="width:12px;height:12px;"></i></button>`).join('');
  lucide.createIcons();
}

function filterAndRender() {
  const search = document.getElementById("searchInput").value.toLowerCase();
  const system = document.getElementById("systemFilter").value;

  filteredDiseases = diseases.filter(d => {
    const matchSystem = system === "all" || d.system === system;
    const matchSearch = !search || d.name.toLowerCase().includes(search) || d.symptoms.some(s => s.toLowerCase().includes(search)) || d.system.toLowerCase().includes(search);
    const matchSymptoms = selectedSymptoms.size === 0 || d.symptoms.some(s => selectedSymptoms.has(s));
    return matchSystem && matchSearch && matchSymptoms;
  });

  if (selectedSymptoms.size > 0) {
    filteredDiseases.sort((a, b) => {
      const aMatch = a.symptoms.filter(s => selectedSymptoms.has(s)).length;
      const bMatch = b.symptoms.filter(s => selectedSymptoms.has(s)).length;
      return bMatch - aMatch;
    });
  }

  renderDiseaseCards();
}

document.getElementById("searchInput").addEventListener("input", filterAndRender);
document.getElementById("systemFilter").addEventListener("change", filterAndRender);
document.getElementById("clearSymptoms").addEventListener("click", () => { selectedSymptoms.clear(); renderSelectedSymptoms(); filterAndRender(); });

// ─── ELEMENT SDK ───
function applyConfig(config) {
  const c = { ...defaultConfig, ...config };
  const title = document.getElementById("appTitle");
  const subtitle = document.getElementById("appSubtitle");
  if (title) title.textContent = c.app_title;
  if (subtitle) subtitle.textContent = c.subtitle_text;
}

renderSystemFilter();
filterAndRender();
lucide.createIcons();
</script>
</body>
</html>
