const defaultConfig = {
  dashboard_title: "Emergency Medicine Dashboard",
  subtitle_text: "Rapid Access Clinical Protocols",

};

const cards = [
  { id:"trauma", title:"Trauma Management", icon:"alert-triangle", color:"#ef4444", bg:"rgba(239,68,68,.12)",
    sections:[
      {heading:"Primary Survey (ABCDE)",steps:["A — Airway with C-spine: Jaw thrust (no neck extension), suction, bag-valve-mask if inadequate spontaneous breathing. Intubate if GCS ≤8 using RSI with rocuronium 1.2 mg/kg. Consider surgical airway (cricothyrotomy) if cannot intubate/ventilate. Maintain C-spine precautions (rigid collar, backboard, log-roll only)","B — Breathing: Bilateral breath sounds, chest rise symmetry, percussion, observe for subcutaneous emphysema. Needle decompression 2nd ICS midclavicular line for tension pneumothorax (clinical diagnosis, no imaging delay). Chest tube 4th-5th ICS midaxillary line if hemopneumothorax. Target SpO₂ >94%, RR 12-20","C — Circulation: Assess cap refill, JVP, pulses. Start 2 large-bore IVs (16G). Type & crossmatch. Permissive hypotension if hemorrhage suspected: target SBP 90 until bleeding controlled (except head injury → maintain SBP >110). Initial 500mL warmed normal saline bolus over 10 min. Call trauma OR if SBP <90 persistent after 1L fluid. Pelvic binder if unstable pelvis (FAST positive/clinical exam)","D — Disability: GCS score (eye + verbal + motor), pupil size/reactivity, lateralizing signs, spinal cord injury level if applicable. Blood glucose >70 mg/dL. Reassess q15 min","E — Exposure: Remove all clothing, full body visual/tactile exam. Log roll for posterior exam (4-person log roll preserving spine alignment). Prevent hypothermia: warm blankets, warm IV fluids (use fluid warmer), avoid cold room exposure"]},
      {heading:"Hemorrhage Control & Transfusion",steps:["Class I (0-15% blood volume loss): Mild tachycardia, normal BP, anxiety. 500mL-1L crystalloid bolus","Class II (15-30%): HR 100-120, BP normal-mild ↓, anxious/restless, cap refill 1-2s. 1-2L crystalloid bolus, type & screen","Class III (30-40%): HR >120, SBP 90-100, pale/diaphoretic, decreased UOP. Activate MTP: 1L crystalloid + type O pRBC + FFP + platelets (1:1:1 ratio). Norepinephrine 0.1-2 mcg/kg/min if SBP <90. Direct surgical control","Class IV (>40%): HR >140, SBP <90, obtunded/unconscious, minimal UOP. Code activation. Massive resuscitation: pRBC first, minimal crystalloid (avoid dilution). Immediate OR for hemorrhage control","Tranexamic Acid (TXA) 1g IV over 10 min within 3 hours of injury (CRASH-2 trial, reduces mortality 15%). Repeat dose at 8h if ongoing bleeding. Contraindicated: DIC, thromboembolic disease","Target parameters: Hb ≥7 (transfuse at ≤5), PLT ≥50k (transfuse <20k), INR <1.5 (FFP if elevated), Fibrinogen ≥1.5g/L (cryoprecipitate if <1.5), Ionized Ca²⁺ >0.9 mmol/L (CaCl 1g IV), Temperature ≥35°C"]},
      {heading:"Imaging & Decision Tree",steps:["FAST (Focused Assessment Sonography Trauma): 4 views in <3 min: pericardium (for tamponade), perisplenic, pelvic, perihepatic. Sensitivity 73-100% for free fluid. Positive FAST + unstable vitals → OR immediately (no CT)","Unstable but FAST negative → consider repeat FAST q15 min or emergency DPL if strong clinical suspicion. Stable + FAST positive → CT abdomen/pelvis with IV contrast to quantify injury, determine operability","CT imaging (only if stable): Head (non-contrast) if any LOC, GCS <15, neuro signs, or vomiting. Cervical spine if mechanism high-risk or neuro deficit. Chest, abdomen, pelvis with IV contrast if blunt mechanism. Repeat FAST if hemodynamic deterioration","Neurosurgery consult if: GCS ≤8, GCS drop ≥2 points, focal neuro deficit, pupil asymmetry, subdural/epidural >5mm on CT, subarachnoid hemorrhage, depressed skull fracture. Mannitol 1g/kg IV or hypertonic saline (3% 250mL bolus) for signs of herniation (loss of pupillary light reflex, posturing)"]},
      {heading:"Damage Control Surgery Protocol",steps:["Lethal triad = hypothermia (<35°C) + acidosis (pH <7.2) + coagulopathy (INR >1.5). Indicates need for damage control","DCS Goals: Stop bleeding, control contamination, prevent further heat loss, restore physiology","Phase 1: Abbreviated laparotomy (20-40 min): peritoneal packing, temporary closure (mesh/VAC), control hemorrhage sources. No reconstruction","Phase 2: ICU resuscitation: active rewarming (warm fluids, forced air, extracorporeal), correct coagulopathy (transfusion, TXA), reverse acidosis (fluid, buffer), allow physiology normalization (6-12h typically)","Phase 3: Planned return to OR (24-72h) for definitive reconstruction after physiologic recovery"]}
    ]},
  { id:"cardiac", title:"Cardiac Arrest", icon:"heart", color:"#f43f5e", bg:"rgba(244,63,94,.12)",
    sections:[
      {heading:"Initial Assessment & CPR",steps:["Verify cardiac arrest: Check responsiveness (tap shoulders, shout), no pulse (carotid 5-10 sec), no/agonal breathing. Do not delay CPR for pulse check","Call for help & AED/Defibrillator immediately. Position patient supine on firm surface (tilt if pregnant >20 weeks)","Start high-quality CPR: Compression rate 100-120/min (push hard, push fast). Compression depth 2-2.4 inches (5-6cm) in adults, 2 inches (5cm) in children. Full recoil after each compression. Minimize interruptions to <10 seconds total per 2-min cycle","Rotate compressor q2 min to prevent fatigue. Fatigue drops compression quality significantly after 2 min","High-flow O₂ once available (non-rebreather 15L). Position for airway visualization"]},
      {heading:"Rhythm Recognition & Defibrillation",steps:["Attach AED/monitor pads. Analyze rhythm q2 min during CPR","Shockable rhythms (VF, pVT): Defibrillate immediately at biphasic 200J (or 360J monophasic). Resume CPR within 10 sec, continue for 2 min, recheck rhythm","Non-shockable (asystole, PEA): Resume CPR immediately for 2 min, then recheck. VF recurrence during CPR → shock immediately","CPR duration: minimum 20 min before termination unless obvious futility (rigor mortis, dependent lividity). Prolonged CPR (>30 min) may be considered if initial VF with delayed interventions","Special situation — Hypothermia: Do NOT defibrillate if core temp <30°C (one shock only). Rewarm actively, continue CPR during rewarming, consider ECMO"]},
      {heading:"ACLS Medications (Every 3-5 Min)",steps:["Epinephrine 1mg (1:10,000) IV/IO push for all rhythms. FIRST DOSE: immediately for asystole/PEA, after 2nd defibrillation for VF/pVT. Repeat q3-5 min during CPR. Higher doses (3-5mg) shown no benefit vs standard dosing","Amiodarone (alternative to Lidocaine for VF/pVT after failed 1st/2nd defibrillation): 300mg IV bolus after 1st shock, 150mg IV after 3rd shock, then 50-100mg/min infusion post-ROSC. CONTRAINDICATED: QTc >500ms, TdP, severe bradycardia, AV block","Atropine: NO longer recommended in ACLS 2020 (removed from algorithm for asystole/PEA)","IV access: 2 large-bore peripheral lines (preferred over central during active CPR). IO access if no IV obtainable within 3 attempts/60 sec","Timing: Give drugs during CPR, not when paused. All IV/IO drugs followed by 20mL saline flush and elevation of limb for 10-20 sec"]},
      {heading:"Advanced Airway & Ventilation",steps:["Initial ventilation: Bag-valve-mask with 100% O₂ (push easy, look for chest rise — overinflation worsens outcomes). Target rate 10-12/min during CPR (one breath every 6 sec)","Definitive airway indications: GCS ≤8, inability to protect airway, prolonged CPR without ROSC. Options: Endotracheal tube (ETT), supraglottic airway (i-gel, LMA) — supraglottic easier to place during CPR","RSI if time permits: Etomidate 0.2-0.3 mg/kg IV or Ketamine 1-2 mg/kg IV + Succinylcholine 1.5 mg/kg IV. Cricoid pressure of unclear benefit","Confirm tube placement: Direct visualization, waveform capnography (target ETCO₂ 10-35 mmHg), misting in tube, equal bilateral breath sounds, no gastric sounds. Chest X-ray after ROSC","NO pause for intubation: Continue CPR, accomplish intubation WITHOUT stopping compressions (delayed intubation vs bag-valve-mask equivalent outcomes)"]},
      {heading:"Reversible Causes (H's & T's)",steps:["HYPOVOLEMIA: IV bolus 1-2L crystalloid, consider vasopressors if ongoing. Rule out hemorrhage (trauma, AAA, GI), sepsis, dehydration","HYPOXIA: Confirm ETT placement, bilateral breath sounds, adequate oxygenation (SpO₂ >94%), rule out aspiration/airway obstruction","HYDROGEN ION (Metabolic Acidosis): Prolonged CPR, hypoventilation, shock states. NaHCO₃ 1 mEq/kg IV only if severe (pH <7.1) or hyperkalemia. Avoid early administration","HYPO/HYPERKALEMIA: Peaked T waves, widened QRS on monitor. Calcium chloride 1g IV (membrane stabilizer), Insulin 10U IV + Dextrose 25g IV, Albuterol 10mg nebulized, SPS 30g PO/PR","HYPOTHERMIA: Core temp <32°C. Extracorporeal rewarming (ECMO) best if available. Do NOT give epinephrine if temp <30°C (space doses q5 min instead). Rewarm actively before pronouncing dead","TENSION PNEUMOTHORAX: Unilateral absent breath sounds, JVD, hypotension. Needle decompression 2nd ICS midclavicular (immediate), then chest tube","CARDIAC TAMPONADE: Beck's triad (muffled hearts, JVD, hypotension). Pericardiocentesis or emergency department thoracotomy (EDT) with needle pericardiotomy","TOXINS: Specific antidotes — Naloxone 0.4-2mg IV (opioid), Lipid emulsion 20% (local anesthetic), Digibind/DigiFab (digitalis), Fomepizole (methanol/ethylene glycol)","THROMBOSIS (Pulmonary Embolism): High clinical suspicion in unexplained cardiac arrest. Consider tPA 50mg bolus or ECMO for refractory VF","THROMBOSIS (Acute MI): STEMI on monitor → activate cath lab if available during CPR. PCI during ongoing CPR possible at specialized centers"]},
      {heading:"Post-ROSC Management",steps:["Optimize perfusion: Target MAP ≥65 mmHg (systolic >90). Norepinephrine 0.1-2 mcg/kg/min first-line vasopressor, titrate to BP goal. Dopamine 5-20 mcg/kg/min if bradycardic or hypotensive. Milrinone caution (may worsen hypotension)","12-lead ECG STAT: If STEMI pattern → activate cath lab immediately (PCI during hypothermia is beneficial). If non-STEMI → coronary angiography per institution protocol","Targeted Temperature Management (TTM): Maintain 32-36°C for 24h if comatose (GCS ≤8). Use cooling devices (ice, cold IVs, cooling blanket), sedation/paralysis during TTM. Prevents secondary brain injury","Manage seizures/myoclonus: Propofol infusion 25-100 mcg/kg/min OR Midazolam 0.1 mg/kg bolus + 0.05-0.1 mg/kg/h infusion. Avoid early anti-seizure drugs (no benefit if prophylactic)","Ventilator settings: AC mode, TV 6-8 mL/kg IBW, RR 12-14, PEEP 5-10, FiO₂ titrate to SpO₂ 92-98% (avoid hyperoxia), PaCO₂ 35-45 mmHg","Neuro prognostication: Cannot prognosticate before 72h post-arrest or while on sedation. Predictors of poor outcome: Absent motor response at 72h, suppressed EEG, absent pupillary light reflex, absent corneal reflex at 3 days, high NSE levels (>33 mcg/L)"]},
      {heading:"Termination of Resuscitation (TOR)",steps:["ROSC achieved → continue above management","No ROSC after 20-30 min of adequate ACLS → Consider termination if: Non-witnessed arrest, no bystander CPR, initial asystole, significant comorbidities, do-not-resuscitate order, obvious death (rigor, decomposition)","Use SHEET score to guide: Shockable rhythm, History of malignancy, EMS interval >25 min, EMS witnessed, Treatment (bystander CPR) — score >1 = futility","Special situations for PROLONGED CPR: Severe hypothermia (may survive after prolonged CPR), drowning in children, drug overdose, ECMO candidates — can attempt >30 min CPR"]}
    ]},
  { id:"shock", title:"Shock Management", icon:"activity", color:"#8b5cf6", bg:"rgba(139,92,246,.12)",
    sections:[
      {heading:"Shock Classification & Pathophysiology",steps:["HYPOVOLEMIC: Loss of intravascular volume. Causes: hemorrhage (40% loss = class III), dehydration, burns. Exam: tachycardia, ↓JVP, cool peripheries, weak pulses, anxiety → confusion → unresponsive. CVP <2","CARDIOGENIC: Pump failure, reduced CO despite adequate volume. Causes: acute MI (40% LV loss), acute regurgitation, RV infarct, acute MR, PE, myocarditis, cardiomyopathy, arrhythmia. Exam: ↑JVP, pulmonary edema (rales, orthopnea), S3 gallop, diminished mentation. CVP >10","DISTRIBUTIVE: Loss of peripheral resistance, maldistribution of flow. Causes: sepsis (most common, 40-70% mortality), anaphylaxis, adrenal crisis, medications (vasodilators). Exam: warm extremities, wide pulse pressure, bounding pulses, normal/↑JVP initially. CVP variable","OBSTRUCTIVE: Mechanical obstruction to blood flow. Causes: PE (60% RV mortality), pericardial tamponade, tension pneumothorax, aortic stenosis, massive MI. Exam: ↑JVP (prominent), hypotension disproportionate to findings. CVP >10"]},
      {heading:"Initial Resuscitation (ALL Types)",steps:["IV access: 2 large-bore (18G preferred), 500mL bolus warm crystalloid (0.9% saline or LR) over 15 min FIRST, reassess. Hold in cardiogenic shock","Continuous monitoring: HR, BP q2-5 min. Capnography if intubated. Urinary catheter (target UOP 0.5-1 mL/kg/h in adults)","Labs STAT: CBC, CMP, coagulation, lactate, troponin, BNP, chest X-ray, ECG, blood cultures if septic. Consider echocardiography (POCUS) or formal echo to assess cardiac function","Lactate clearance: initial lactate correlates with mortality. Goal: reduce by >10% per 2h (trend more important than single value). Serial lactate at 0h, 2h, 6h to guide adequacy of resuscitation","Vasopressor initiation: If SBP remains <90 or MAP <65 despite 500mL bolus, start vasopressor (do not delay for additional fluid in shock)"]},
      {heading:"HYPOVOLEMIC Shock Management",steps:["Volume assessment: Passive leg raise (PLR) test: lift legs 45°, assess if SBP increases ≥4 mmHg = fluid responsive. Do NOT use IVC diameter alone (poor predictor)","Crystalloid bolus: 500-1000 mL rapidly over 10-15 min. Reassess — if still hypotensive, repeat bolus. Total initial target 3-4L over first hour","Blood products if hemorrhagic: Type O negative (or uncrossmatched) if urgent, then type-specific ASAP, then crossmatched. Maintain 1:1:1 ratio (RBC:FFP:Platelets) if massive transfusion. TXA 1g IV within 3h of injury","Vasopressors if refractory: Norepinephrine 0.1-2 mcg/kg/min first line (both alpha & beta, maintains BP + some CO). Phenylephrine if tachycardic (pure alpha). Vasopressin 0.03-0.04 U/min as second agent","Source control: Stop bleeding (pressure, tourniquets, surgery), stop fluid losses (NPO, NG tube if vomiting), address underlying cause (transfusion if severe anemia, antibiotics if septic)"]},
      {heading:"CARDIOGENIC Shock Management",steps:["Small fluid bolus ONLY: 250mL cautiously, reassess — do NOT over-resuscitate (increases pulmonary edema). Monitor JVP, crackles, orthopnea","Inotropes: Dobutamine 2-20 mcg/kg/min (positive inotrope, vasodilator — may cause hypotension) OR Milrinone 0.25-0.75 mcg/kg/min (inodilator, but may worsen hypotension). Epinephrine 2-10 mcg/min if severely hypotensive (but increases myocardial O₂ demand)","Vasopressors: Norepinephrine 0.1-2 mcg/kg/min to maintain MAP >65. Phenylephrine if tachycardia present","Diuretics: Furosemide 20-40mg IV if pulmonary edema (oliguria may require higher doses 100-200mg IV). Goal: reduce preload, improve oxygenation. Do NOT give if hypotensive","Revascularization: Urgent cardiac catheterization if acute MI causing shock (door-to-balloon <90 min). IABP (intra-aortic balloon pump) for mechanical support","Mechanical support: Consider LV assist device (Impella, ECMO) for refractory cardiogenic shock if candidacy for transplant/revascularization present"]},
      {heading:"DISTRIBUTIVE (Septic) Shock Management",steps:["Antibiotics: Broad-spectrum IV within 1 hour of recognition. Blood cultures x2 before antibiotics (do NOT delay antibiotics for cultures). Examples: Ceftriaxone 2g IV + Vancomycin 15-20 mg/kg IV (if MRSA risk) + Metronidazole 500mg IV (anaerobes)","Crystalloid resuscitation: 30 mL/kg bolus in FIRST 3 HOURS (typical 2-3L for 70kg adult). Over 15-30 min. Reassess: if lactate >4 or signs of hypoperfusion persist after bolus, start vasopressor","Vasopressor: Norepinephrine 0.1-2 mcg/kg/min first line (best outcomes). Target MAP ≥65. If inadequate, add Vasopressin 0.03-0.04 U/min OR Epinephrine 0.1-0.5 mcg/kg/min","Central line preferred for vasopressor administration (peripheral OK for short-term if urgent), but do NOT delay starting presser for line placement","Source control: Drain collections (abscess), remove infected lines, debride tissue, surgical intervention per microbiology. Timing critical: within 6-12h for best outcomes","Adjuncts: Stress-dose hydrocortisone 200mg/day divided q6h if refractory shock (CORTICUS trial: may reduce vasopressor duration). Consider low-dose vasopressin as adjunct"]},
      {heading:"OBSTRUCTIVE Shock Management",steps:["PE (Pulmonary Embolism): High-risk features (SBP <90, RV dysfunction on echo, elevated troponin) warrant thrombolysis (tPA 50mg IV bolus, then 50mg/2h infusion for 2h). Consider ECMO for massive PE if refractory hypotension","Tension Pneumothorax: Clinical diagnosis (not radiologic). Signs: hypotension, JVD, tracheal deviation, unilateral absent breath sounds, hypoxia. Needle decompression 2nd ICS MCL → immediate chest tube 4-5 ICS midaxillary","Cardiac Tamponade: Beck's triad (hypotension, elevated JVP, muffled heart sounds). Echocardiography shows pericardial effusion with RA diastolic collapse (RA collapse >1/3 systole = hemodynamic significance). Pericardiocentesis 18G needle subxiphoid approach","Aortic Stenosis: Do NOT give fluids (may precipitate cardiogenic shock). Dobutamine or Milrinone + vasopressor for inotropic support. Defer diuretics. Urgent cardiothoracic evaluation for aortic valve replacement"]},
      {heading:"Monitoring Targets & Endpoints",steps:["Hemodynamic targets: SBP ≥90, MAP ≥65, HR <100-110 (if possible), Cardiac Index ≥2.2 if available","Perfusion markers: Lactate clearance >10% per 2h (goal eventually <2). ScvO₂ ≥70% (normal oxygen extraction). Base deficit improvement","Urine output: >0.5 mL/kg/h (adequate perfusion). If low despite adequate BP, consider: ARF, rhabdomyolysis, hepatosplanchnic hypoperfusion","Point-of-care ultrasound: IVC diameter/collapsibility (IVC <50% collapse = fluid responsive), cardiac contractility (fractional area change), bilateral B-lines (pulmonary edema assessment), lung sliding (pneumothorax rule out)","Serial lactate (0h, 2h, 6h) more predictive than single measurement. Persistent elevation despite therapy = worse prognosis"]}
    ]},
  { id:"airway", title:"Airway & Intubation", icon:"wind", color:"#06b6d4", bg:"rgba(6,182,212,.12)",
    sections:[
      {heading:"Pre-Intubation Assessment (LEMON)",steps:["Look externally: facial trauma, large tongue, neck mass, short neck, micrognathia, receding chin = difficult airway signs","Evaluate 3-3-2 rule: Inter-incisor distance ≥3 fingers (≥4cm = easy), Hyoid-mandibular distance ≥3 fingers (≥6cm = easy), Thyromental distance ≥2 fingers (≥6.5cm = easy). If ANY <threshold = difficult","Mallampati score: Grade 1-2 = easy, Grade 3-4 = difficult. Assess with mouth open, tongue protruded, sitting upright","Obstruction: stridor, voice changes, visible obstruction (epiglottitis, abscess, tumor)","Neck mobility: Flex/extend neck fully. Limited mobility (ankylosing spondylitis, trauma, obesity) = difficult. C-spine immobilization worsens intubation difficulty"]},
      {heading:"Rapid Sequence Intubation (RSI)",steps:["Preparation — 'SOAP-ME': Suction available, Oxygen source confirmed, Airway equipment checked (multiple sizes), Positioning ready (sniffing position), Monitoring established (pulse ox, ETCO₂, BP, ECG), ETT & backup equipment ready","Pre-oxygenation (3 minutes minimum): High-flow O₂ via non-rebreather mask or BVM. Apneic oxygenation via nasal cannula 15L after mask removal extends apnea tolerance to 8-10 min (vs 3-4 min without)","Induction agents (choose by hemodynamic status): Ketamine 1-2 mg/kg IV (preferred in trauma, ideal for hemodynamically unstable — maintains BP via sympathomimetic) OR Propofol 1.5 mg/kg IV if normotensive/hypertensive (caution: causes hypotension)","Paralytic choice: Succinylcholine 1.5 mg/kg IV (onset 45s, duration 5-10 min, advantages: rapid, used for emergent intubation; disadvantages: hyperkalemia, myalgia) OR Rocuronium 1.2 mg/kg IV (onset 60-90s, duration 30-40 min, reversible with Sugammadex 16 mg/kg if needed)","Cricoid pressure: Apply firm pressure on cricoid cartilage after loss of consciousness to occlude esophagus (controversial, may impair visualization — use selectively). Release if vomiting to prevent esophageal rupture","Intubation attempt: Use video laryngoscopy preferred (improved success). 8.0-8.5 ETT for males, 7.0-7.5 for females. Insert to depth ~22-23cm at teeth, secure immediately with tape/commercial holder"]},
      {heading:"Difficult Airway Algorithm (Failed Intubation)",steps:["Failed first attempt: Reposition (extend neck more if possible), try different blade angle, insert bougie first, apply external laryngeal manipulation (pressure to move larynx), consider different provider/equipment","Second attempt: Different blade (direct vs video), different tube size, consider supraglottic airway (LMA, i-gel) as bridge. Supraglottic airway placement higher success rate than reattempted intubation","Can INTUBATE, CAN'T ventilate (normal physiology): Reassess position, increase FiO₂, optimize PEEP, call for senior/expert help, consider emergent surgical airway","Can't INTUBATE, CAN ventilate (maintain oxygenation): Continue bag-valve-mask with 2-handed technique + oral/nasal airway + PEEP. Awaken patient (reverse sedation) if time permits. Elective intubation in OR later","Can't INTUBATE, CAN'T ventilate (EMERGENCY): Immediate surgical airway (cricothyrotomy within 1 min). Vertical midline skin incision (3-4cm), palpate cricothyroid membrane (between cricoid ring & thyroid cartilage), horizontal incision through membrane, insert 6.0 cuffed ETT","Cricothyrotomy landmarks: Thyroid notch (Adam's apple), thyroid cartilage, cricoid ring (firm), proceed ½-1 inch below thyroid cartilage. Complications: subglottic stenosis (late), tracheal stenosis, voice changes. Conversion to tracheostomy within 48-72h if prolonged"]},
      {heading:"Intubation Confirmation & Management",steps:["Clinical assessment: Bilateral equal breath sounds (auscultate 5 zones), bilateral chest rise, no gastric sounds, condensation in tube","Waveform capnography (GOLD standard): Square wave = correct placement, absent/flat = mainstem or esophageal intubation. Target ETCO₂ 35-45 mmHg during CPR (>10 acceptable). Capnography may fail if severe shock/PE → confirm clinically","Chest X-ray after ROSC: ETT depth typically 21-23cm at teeth. Rule out right mainstem intubation (tube too deep), left mainstem (tube too shallow)","Note ETT depth at teeth: Write down exact position, mark tube with tape/marker. MOST common error = tube repositioning during sedation/movement","Post-intubation sedation: Propofol 25-100 mcg/kg/min OR Midazolam 0.1 mg/kg bolus + 0.05-0.1 mg/kg/h infusion. Add Fentanyl 25-100 mcg/h for analgesia & reduced ventilator asynchrony"]},
      {heading:"Ventilator Management Post-Intubation",steps:["Ventilator mode: Assist-control (AC) mode preferred. Set rate 14-16, allow patient to trigger additional breaths above set rate to reduce asynchrony","Tidal volume: 6-8 mL/kg predicted body weight (calculate: males 50 + 2.3×height(inches), females 45.5 + 2.3×height(inches)). AVOID >10 mL/kg (causes barotrauma)","PEEP: 5 cmH₂O minimum (improves FRC, recruits collapsed alveoli). Increase to 10 if ARDS/pulmonary edema. Cannot exceed 15 typically without complications","FiO₂: Start 100% on intubation, then wean to target SpO₂ 92-98% within 1-4 hours. Hyperoxia associated with worse outcomes. Target PaO₂ 60-100 mmHg","ABG/VBG at 30 min post-intubation: Confirm adequate ventilation (PaCO₂ 35-45), oxygenation (PaO₂ >60), pH >7.30. Adjust rate/PEEP based on results","Sedation assessment: Daily spontaneous awakening trial (SAT) — reduce sedation 1-2×daily, assess if patient can follow commands, pass? → attempt spontaneous breathing trial (SBT). Wean sedation to minimize duration"]},
      {heading:"Special Airway Scenarios",steps:["Epiglottitis: Drooling, dysphagia, dyspnea, tripoding position (leaning forward). DO NOT agitate (can cause airway obstruction). Lateral neck X-ray shows 'thumb sign'. Intubate awake with topical anesthesia OR have surgical airway ready. Antibiotics: Ceftriaxone 2g IV + Vancomycin 15-20 mg/kg","Peritonsillar/retropharyngeal abscess: Severe sore throat, dysphagia, 'hot potato' voice, uvula deviation. Risk of airway obstruction with swallowing/intubation. Flexible fiberoptic intubation preferred, or awake intubation with topical. Drain abscess urgently","Epiglottic abscess: Fever, difficulty breathing/swallowing. Secure airway first (may be more emergent than epiglottitis). Drainage + antibiotics (cephalosporin + vancomycin)","Laryngeal stenosis: History of intubation, stridor, progressive dyspnea. Use smallest ETT (6.0-7.0), have surgical airway prepared. Laser-assisted dilation or rigid bronchoscopy in OR","Foreign body (airway): Small objects may lodge at glottis. Coughing patients: allow coughing, give O₂, prepare to intubate below FB. Apneic patients: blind finger sweep, rigid bronchoscopy removal in OR. Never push object deeper with intubation attempt"]},
      {heading:"Complications & Management",steps:["Aspiration pneumonitis: Acid-induced (Mendelson's): within hours. Symptoms: hypoxia, crackles, CXR infiltrates. Treatment: supportive (O₂, PEEP), antibiotics if suspected bacterial (Ceftriaxone + clindamycin for anaerobes)","Sinusitis: Prolonged intubation >7 days → maxillary sinus colonization. Fever, purulent sinus aspirate on imaging. Treatment: reduce duration of intubation, drainage if severe, IV antibiotics","Ventilator-associated pneumonia (VAP): Fever, purulent sputum, infiltrate on CXR after 48h intubation. Risk factors: prolonged intubation, aspiration, supine position. Treatment: non-directed (empiric broad-spectrum) or directed (culture-based). Subglottic suctioning reduces VAP incidence","Unplanned extubation: Self-extubation risk if inadequate sedation, agitation, delirium. Prevention: secure tube well, sedation protocol, reduce agitation. If occurs: reintubation if still requiring mechanical ventilation","Tube obstruction: Secretions, blood clot, tube kinking. Signs: high ventilator pressures, low tidal volume. Management: suctioning (gentle), repositioning, consider tube change if cannot clear"]}
    ]},
  { id:"acs", title:"Acute Coronary Syndrome", icon:"heart", color:"#ec4899", bg:"rgba(236,72,153,.12)",
    sections:[
      {heading:"Initial Assessment & Risk Stratification",steps:["12-lead ECG within 10 minutes of ED arrival — this is critical (STEMI vs NSTEMI vs UAP vs non-ACS). Repeat q15-30 min if chest pain recurs or dynamic changes","Troponin: High-sensitivity troponin at 0h + 1h (or 3h with conventional troponin) — serial troponin >3× more sensitive than single value. Negative hs-troponin at 0h + 1h essentially rules out acute MI (negative predictive value 99%)","STEMI definition: ≥1mm ST elevation in 2 contiguous leads (≥2mm in V1-V3 for anterior STEMI, ≥1mm in inferior/lateral)","NSTEMI definition: Troponin positive + non-STEMI ECG findings","UAP definition: Troponin negative, ischemic ECG changes (ST depression, T-wave inversion), ongoing symptoms","Risk stratify NSTEMI/UAP: GRACE score (in-hospital mortality predictor), TIMI score, HEART score (predicts 6-week MACE)"]},
      {heading:"STEMI Protocol (Door-to-Balloon <90 min)",steps:["Activate cardiac catheterization lab IMMEDIATELY upon STEMI recognition. Do NOT delay for additional testing","Call for 911/EMS if pre-hospital STEMI recognition — transport to PCI-capable facility directly (bypass non-PCI hospitals if needed)","Dual antiplatelet therapy: Aspirin 300mg chewed (immediate loading), PLUS Ticagrelor 180mg PO OR Clopidogrel 600mg PO (loading doses higher than maintenance)","Anticoagulation: Unfractionated heparin (UFH) 60 U/kg bolus IV (max 4000U) + 12 U/kg/h infusion (target aPTT 50-70 sec). Alternatives: Enoxaparin 0.3 mg/kg IV bolus (if <PCI), Fondaparinux 2.5mg IV","Beta-blocker: Metoprolol 25-50mg PO/IV q6-8h (reduce rate to 50-60) ONLY if normotensive + no signs of CHF, late presentation. Caution: may worsen shock if cardiogenic shock present","ACE inhibitor: Ramipril 5-10mg daily or Enalapril 5-10mg daily (within 24h, improves LV remodeling and survival). Hold if SBP <90","Primary PCI: Most effective reperfusion strategy. Angiography + stenting (drug-eluting stents preferred). Target TIMI 3 flow. Complications: restenosis (rare with DES), stent thrombosis (avoid early DAPT cessation)","Fibrinolysis (if PCI unavailable >120 min): Alteplase (tPA) 15mg bolus + 0.75 mg/kg over 30 min + 0.5 mg/kg over 60 min (max 100mg total). Half-dose if age >75 or weight <67kg. Repeat STEMI criteria at 90 min for rescue PCI if failed fibrinolysis"]},
      {heading:"NSTEMI/UAP Management",steps:["DAPT loading: Aspirin 300mg chewed + Ticagrelor 180mg PO (preferred, superior to Clopidogrel 600mg in PLATO trial, but more bleeding)","Anticoagulation: Enoxaparin 1mg/kg SC q12h (or 0.75 mg/kg if CrCl 30-50) PREFERRED (easier, more predictable) OR UFH (60 U/kg bolus + 12 U/kg/h, requires monitoring)","Risk assessment guides timing of catheterization: High-risk features (ECG changes, troponin elevation, hemodynamic instability, arrhythmia) → invasive strategy within 24h. Low-risk (stable, negative troponin) → elective testing"]},
      {heading:"Post-ACS Medical Therapy",steps:["Maintain DAPT: Continue Aspirin indefinitely (daily 81-325mg). Continue Ticagrelor/Clopidogrel for 12 months (5 years in some stable CAD). Balance bleeding vs thrombotic risk","Beta-blocker: Continue long-term (target HR 50-60 resting) unless contraindicated. Metoprolol ER 190mg daily or Bisoprolol 5-10mg daily","ACE inhibitor/ARB: Continue indefinitely for LV dysfunction (EF ≤40%), hypertension, or diabetes (reduces MACE by ~20%)","Statin: High-intensity (Atorvastatin 80mg or Rosuvastatin 20-40mg). Target LDL <70 mg/dL (or <55 if very high-risk)","Aldosterone antagonist: If LVEF ≤40% + diabetes/HF, add Spironolactone 12.5-50mg daily (RALES trial reduces mortality 30%)"]},
      {heading:"Complications & Management",steps:["Cardiogenic shock: >40% LV involvement. Management: IV fluids cautiously (200-250mL), inotropes (dobutamine 2-20 mcg/kg/min), vasopressors (norepinephrine), mechanical support (IABP, ECMO)","Acute mitral regurgitation: Papillary muscle rupture. Holosystolic murmur, acute pulmonary edema, hemodynamic compromise. Echo shows severe MR. Urgent cardiac surgery for valve repair/replacement","Free wall rupture: Catastrophic (~40% in-hospital mortality). Tamponade physiology, sudden cardiogenic shock. Urgent pericardiocentesis (bridge), immediate surgical repair in OR","Ventricular septal defect (VSD): Post-MI (3-5 days usually). Holosystolic murmur + thrill, step-up in O₂ sat (right heart catheterization). Surgery if hemodynamically significant","Pericarditis (post-MI): Fibrinous pericarditis 2-3 days post-MI. Pleuritic chest pain, pericardial friction rub, ST elevation diffuse pattern. Aspirin/NSAIDs, avoid anticoagulation if possible","Arrhythmias: VF (most common cause of out-of-hospital death) → CPR/defibrillation. PVCs/VT → Amiodarone 300mg IV. Bradycardia/AV block (inferior MI) → pacing if symptomatic"]},
      {heading:"Post-MI Risk Reduction",steps:["Cardiac rehabilitation: Exercise program, education, psychosocial support reduces readmission & mortality 20-30%","Return to work: Usually 6-12 weeks based on occupation, LV function, exercise tolerance","Sexual activity: Safe after passing treadmill/stress test (can perform 6 METs work)","Influenza vaccine: Annual (reduces cardiac events post-MI). Pneumococcal vaccine (reduces cardiac events ~20%)","Risk factor modification: HTN control (SBP <130), diabetes control (HbA1c <7%), smoking cessation, weight loss, diet (Mediterranean recommended)"]}
    ]},
  { id:"stroke", title:"Stroke Emergency", icon:"zap", color:"#f59e0b", bg:"rgba(245,158,11,.12)",
    sections:[
      {heading:"Rapid Assessment (First 60 Minutes Critical)",steps:["Activation: Call 911, alert receiving facility as 'stroke code'. Paramedics: maintain IV access, ECG, glucose check, NPO status, transfer directly to stroke center (not nearest hospital if capabilities limited)","Time of onset: MOST IMPORTANT — defines treatment options. 'Last known well' = last time patient confirmed normal. If unknown → assume worst-case (outside treatment window)","Cincinnati Stroke Scale (brief): Facial droop (asymmetric), arm drift (unable to hold position), speech (slurred/aphasia) — each present = 72% sensitive for acute stroke","NIHSS score (National Institutes of Health Stroke Scale): Quantifies deficit. Score >25 = very severe, score <5 = minor stroke. Guides treatment decisions & prognostication","Stat CT head (non-contrast): Rule out intracranial hemorrhage (contraindication to thrombolysis). <25 min from arrival. If CT shows hemorrhage → neurosurgery consult, avoid anticoagulation","Labs STAT: Glucose (hypoglycemia mimics stroke), CBC, coagulation studies, renal function (for contrast), troponin, ECG"]},
      {heading:"Ischemic Stroke Classification",steps:["Large artery occlusion (LAO): Internal carotid artery, M1 segment middle cerebral artery, basilar artery. High NIHSS, poor prognosis without intervention. Requires thrombectomy","Small vessel lacunar stroke: Small penetrating arteries (lenticulostriate). Minor symptoms, better prognosis. NIHSS <5 usually","Cardioembolic: Atrial fibrillation, endocarditis, recent MI, valvular disease. Emboli lodge at major vessel bifurcations (M1 junction, basilar tip)","Atherosclerotic: Progressive narrowing of carotid/vertebral arteries or intracranial vessels","Cryptogenic: No obvious source identified (~30% of cases). Consider workup for PFO, hypercoagulable state","Posterior circulation (vertebrobasilar): Dizziness, ataxia, cranial nerve deficits, Horner's syndrome, locked-in syndrome. Often delayed diagnosis"]},
      {heading:"IV Thrombolysis (Alteplase) — 0-4.5 Hour Window",steps:["Eligibility: Ischemic stroke, onset <4.5h (evidence-based cutoff), no contraindications to thrombolysis","Dose: Alteplase (tPA) 0.9 mg/kg total dose (max 90mg). 10% as IV bolus over 1 min, remaining 90% as infusion over 60 min","Blood pressure requirement: Must be <185/110 before tPA (if >185/110 → reduce with Labetalol 10-20mg IV, repeat q10min max 4 doses OR Nicardipine 5mg/h, titrate by 2.5mg/h q5-15min to max 15mg/h). Maintain <180/105 for 24h after tPA","Contraindications (absolute): Recent intracranial surgery/trauma, intracranial hemorrhage history, subarachnoid hemorrhage, bleeding disorder, INR >1.7, aPTT >40, platelets <100k, GI/GU hemorrhage within 21 days, myocardial infarction within 3 months, uncontrolled hypertension >185/110 refractory to treatment","Relative contraindications: Minor stroke (NIHSS <4), recent ischemic stroke, mild ICH, seizure at onset, recent invasive surgery, oral anticoagulants (no longer absolute if INR ≤3)","Monitoring during/after: Neuro checks q15min during infusion, q30min for 6h post-infusion, then q1h for 18h. Watch for deterioration (could be hemorrhagic conversion). No anticoagulation or antiplatelet for 24h post-tPA (except aspirin if MI develops)","Hemorrhagic conversion: Occurs in ~6% of tPA-treated, ~1% placebo. Asymptomatic in ~2/3, symptomatic in ~1/3. Management: stop tPA, cryoprecipitate (goal fibrinogen >100), fresh frozen plasma, platelets if <100k, neurosurgery consult for large hematomas"]},
      {heading:"Mechanical Thrombectomy — 0-24 Hour Window",steps:["Indication: Large artery occlusion (ICA, M1, basilar artery) confirmed on CTA/MRA. NIHSS ≥6 (some centers ≥5) indicating moderate-to-severe deficit. ASPECTS ≥6 on CT (ischemic core limited)","Time window: 0-6h (standard), up to 24h with favorable perfusion imaging (DAWN criteria: mismatch >500mL with core <70mL; DEFUSE 3 criteria: mismatch with small core)","Prior tPA?: Do NOT delay thrombectomy for tPA. Give IV tPA if eligible (0-4.5h), proceed directly to interventional suite — tPA may reduce clot burden","Technique: Femoral artery access, stent retriever (most effective, MERCI/Solitaire/Trevo), thrombectomy aspiration catheters (penumbra), or combination. Goal: TICI 2b-3 reperfusion (complete or near-complete restore flow)","Complications: Arterial dissection, perforation, embolization to different territory (thrombectomy complication ~7%), hemorrhage. Symptomatic ICH ~3-5% thrombectomy patients","Outcomes: Thrombectomy in DAWN/DEFUSE 3 showed sustained benefit even out to 24h with favorable imaging. Standard thrombectomy outcomes: 50-60% achieve functional independence at 90 days vs 30% control"]},
      {heading:"Hemorrhagic Stroke Management",steps:["Intracerebral hemorrhage (ICH): Risk factors — HTN, anticoagulation, amyloid, coagulopathy. Prognosis poor if lobar/deep structures. ICH score predicts 30-day mortality","Subarachnoid hemorrhage (SAH): 'Thunderclap' worst headache of life, neck stiffness, photophobia. Aneurysmal (80%) vs non-aneurysmal (20%). CT sensitivity 95%, CTA/DSA confirms aneurysm","Epidural hematoma: 'Lens-shaped' on CT (bounded by dura), often with lucid interval, deterioration later. Urgent surgical evacuation if >30mL or midline shift","Subdural hematoma: Crescentic appearance on CT. Acute (<72h) vs chronic (>20 days). Elderly/anticoagulated prone to subdural even with minor head trauma. Surgery if >1cm thickness, midline shift >5mm, or rapid deterioration"]},
      {heading:"Comprehensive Stroke Center Protocols",steps:["Code Stroke activation: All above workup within 60 min door-to-needle for IV tPA, 90 min door-to-groin for mechanical thrombectomy","Neurology consultation STAT","ICU admission post-thrombolysis/thrombectomy for monitoring","Swallow screening before oral intake (aspiration risk)","Physical/occupational/speech therapy consultations early","Risk factor modification: Smoking cessation, hypertension control (target SBP <130 typically post-acute phase), statin, antiplatelet (aspirin 325mg daily unless contraindicated)","Anticoagulation: Atrial fibrillation → anticoagulation with DOAC or warfarin after acute phase (timing depends on stroke severity & hemorrhage risk). CHADS₂-VASc score guides intensity"]}
    ]},
  { id:"sepsis", title:"Sepsis & Septic Shock", icon:"thermometer", color:"#10b981", bg:"rgba(16,185,129,.12)",
    sections:[
      {heading:"Sepsis-3 Criteria & Recognition",steps:["SIRS criteria (outdated but clinical context): Temperature >38°C or <36°C, HR >90, RR >20 or PaCO₂ <32, WBC >12k or <4k","qSOFA score (quick version for bedside triage): Respiratory rate ≥22, altered mental status, systolic BP ≤100. Score ≥2 suggests sepsis + mortality risk ~3%","SOFA score (Sepsis-related Organ Failure Assessment): Respiratory (PaO₂/FiO₂), coagulation (platelets), liver (bilirubin), cardiovascular (hypotension/vasopressor requirement), CNS (GCS), renal (creatinine/urine output). SOFA ≥2 = sepsis","Sepsis definition (Sepsis-3): Suspected or confirmed infection WITH ≥2 SOFA points (or change from baseline SOFA ≥2)","Septic shock: Sepsis + vasopressors needed to maintain MAP ≥65 PLUS lactate >2 mmol/L despite adequate fluid resuscitation","Common sources: Respiratory (pneumonia, aspiration), urinary (UTI, pyelonephritis, catheter), abdominal (peritonitis, cholecystitis, appendicitis, diverticulitis), skin/soft tissue (cellulitis, necrotizing fasciitis), bloodstream (endocarditis, line infection), meningitis"]},
      {heading:"Immediate Recognition & Triage",steps:["Lactate >2 mmol/L = indicator of tissue hypoperfusion, correlates with mortality. Obtain lactate on all suspected sepsis patients","Blood cultures x2 BEFORE antibiotics (different sites if possible, one preferably peripheral). Do NOT delay antibiotics for cultures — antibiotics given within 1h of recognition significantly improves survival (3.7% mortality increase per hour delay)","Procalcitonin: PCT >0.5 ng/mL suggests bacterial sepsis (vs viral). Often ordered but does NOT change immediate management (treat on clinical suspicion, not PCT result)","Identify source: Imaging STAT if intra-abdominal source suspected (abdominal exam, imaging within 3h). Imaging NOT needed if clear source (UTI, pneumonia)"]},
      {heading:"Sepsis Bundle — 1-Hour Protocol",steps:["MEASUREMENT — Lactate: Send stat, remeasure if initial >2 mmol/L at 2-6h (trending down is good prognostic sign)","BLOOD CULTURES: x2 BEFORE antibiotics (do not wait for other testing)","ANTIBIOTICS: Broad-spectrum IV within 1 hour. Examples: Cefepime 2g IV q8h + Vancomycin 15-20 mg/kg IV q8-12h + Metronidazole 500mg IV q6h (if anaerobes suspected) OR Piperacillin-Tazobactam 4.5g IV q6-8h + Vancomycin","FLUIDS: 30 mL/kg crystalloid (normal saline or LR, NOT dextrose-containing) for hypotension or lactate ≥4. Give over 15-30 min. Reassess after bolus","VASOPRESSORS: If hypotensive (SBP <90 or MAP <65) DURING or AFTER fluid resuscitation, start immediately. Norepinephrine 0.1-2 mcg/kg/min first-line (superior outcomes in SOAP II trial). Dopamine second choice (more arrhythmias). Add Vasopressin 0.03-0.04 U/min OR Epinephrine if inadequate response"]},
      {heading:"Early Management (First 6 Hours)",steps:["Antimicrobials de-escalation: Culture results/sensitivities guide narrowing at 48-72h. Reduce unnecessary broad-spectrum coverage once organism identified & susceptibilities known","Source control: Essential for sepsis resolution. Timing: ASAP for necrotizing infection (fasciotomy within 6h for survival), abscess drainage within 12h, appendectomy within 24h. Delay >6h increases mortality","CVP/Lactate-directed fluid responsiveness: Continue fluids until CVP 8-12 mmHg OR lactate normalizing (demonstrates adequate perfusion achieved). Reassess via passive leg raise (PLR) — increase SBP ≥4 mmHg = fluid responsive","Reassess perfusion after 1L fluids: If persistent hypotension despite fluids → escalate vasopressor (increase dose, add second agent). Most septic shock responsive to fluids + vasopressors","Corticosteroids: Low-dose stress-dose hydrocortisone 200mg IV daily divided q6h IF refractory shock despite vasopressor + adequate fluids (hemodynamic support alone insufficient). Can consider if prolonged hypotension (>1h despite vasopressors)","Glucose control: Target 140-180 mg/dL (tight control <110 increases hypoglycemia mortality). Insulin infusion if needed. Avoid hypoglycemia <70"]},
      {heading:"Severe Sepsis/Shock Complications",steps:["DIC (Disseminated Intravascular Coagulation): Thrombocytopenia, elevated PT/PTT, decreased fibrinogen, elevated D-dimer, schistocytes on blood smear. ISOELEC score ≥5 = overt DIC. Treatment: treat underlying infection, transfuse platelets if <50k or bleeding, FFP/cryoprecipitate if coagulopathic. Anticoagulation NOT recommended unless thrombotic manifestations","ARDS (Acute Respiratory Distress Syndrome): PaO₂/FiO₂ <300 + bilateral opacities on imaging + respiratory cause apparent + not purely cardiac. Management: lung-protective ventilation (TV 6 mL/kg IBW, PEEP ≥5), prone positioning if severe (PaO₂/FiO₂ <100), paralysis if P-V dyssynchrony, avoid high tidal volumes","Acute kidney injury: Creatinine rise, oliguria <0.5 mL/kg/h, elevated BUN/Cr ratio. Pre-renal (hypovolemia) vs intrinsic (ATN from sepsis) vs post-renal. Avoid nephrotoxins (aminoglycosides, contrast when possible). RRT initiation if K⁺ >6.5, severe acidosis, volume overload, or absolute indication (Cr >4)","Multi-organ failure: Often indicates inadequate initial resuscitation or source control failure. Escalate support (ICU, mechanical ventilation, dialysis, ECMO consideration if reversible)"]},
      {heading:"Ongoing Maintenance & Discharge",steps:["Vasopressor weaning: Reduce norepinephrine incrementally (by 2-4 mcg/kg/min q30min) as MAP supported by fluids alone","Antibiotic duration: typically 7-10 days for most infections (shorter for some, longer for complicated/CNS infections)","Repeat lactate trending: Goal clearance to <2 mmol/L signifies adequate perfusion restoration. Persistent elevation despite vasopressors suggests inadequate source control","Daily assessment for de-escalation: Review cultures, sensitivities, clinical status daily to narrow spectrum antibiotic coverage","Discharge planning: Address source of infection resolved, completed antibiotic course, immunizations (pneumococcal, influenza), sepsis education for early recognition if recurrent infection risk"]}
    ]},
  { id:"hyperkalemia", title:"Hyperkalemia Management", icon:"zap", color:"#eab308", bg:"rgba(234,179,8,.12)",
    sections:[
      {heading:"Pathophysiology & Etiologies",steps:["Acute increases in serum K⁺ cause depolarization of cell membranes, leading to cardiac arrhythmias, muscle weakness, paralysis","Pseudohyperkalemia: False elevation due to lab artifact. Causes: hemolysis (blood hemolyzes during collection), tourniquet application too long, difficult draw with muscular person causing rhabdomyolysis-like enzyme release, extreme leukocytosis (WBC >100k). Solution: redraw without tourniquet, use larger needle, gentle technique","ACTUAL CAUSES: Decreased excretion (renal failure most common — CrCl <15), medications (ACE inhibitors, ARBs, NSAIDs, K-sparing diuretics, trimethoprim, heparin), tissue breakdown (rhabdomyolysis, crush injury, tumor lysis, hemolysis), increased intake (rare, but salt substitutes, potassium supplements, blood transfusions)","Risk factors: Diabetes (aldosterone hyporesponsiveness), elderly, NSAIDs, sepsis"]},
      {heading:"ECG Changes (Severity Correlates with K⁺ Level)",steps:["Mild hyperkalemia (5.5-6.0 K⁺): Peaked T waves (tallest, narrowest T waves, symmetric apex) — EARLIEST and MOST SENSITIVE sign. Shortened QT interval. May be only finding","Moderate (6.0-7.0 K⁺): Prolonged PR interval (first-degree AV block pattern). P wave flattens/disappears ('dropped P waves'). Widened QRS (>120ms) — increasing risk of arrhythmias","Severe (>7.0 K⁺): Sine wave pattern (merged QRS-ST-T complexes creating distinctive sine wave appearance) — EMERGENCY FINDING. Atrial fibrillation, atrial standstill, progressive bradycardia, VF, asystole → cardiac arrest imminent","CRITICAL: ECG changes MANDATE immediate treatment regardless of measured K⁺ level (some labs falsely elevated, some patients symptomatic despite <7.0). Conversely, absence of ECG changes suggests laboratory artifact","Comparison: Always compare current ECG with prior ECGs if available to assess for NEW changes"]},
      {heading:"Immediate Treatment — STAT",steps:["FIRST — Cardiac stabilization (Calcium): Protects cardiac membrane, shifts threshold, does NOT lower K⁺. Calcium Gluconate 10% 10-20 mL IV push over 2-3 min (preferred, 3× volume of CaCl₂). Can repeat in 5 min if ECG unchanged. Onset 1-3 min, duration 30-60 min. Precautions: tissue necrosis if extravasation (central line preferred), DO NOT mix with sodium bicarbonate (precipitate)","SECOND — Potassium shift into cells (lower serum K⁺): Multiple agents work via different mechanisms:","(A) Insulin + Dextrose: Regular insulin 10U IV + Dextrose 50% 50mL IV (or D10W 250mL if dextrose 50% unavailable). Onset 15-30 min, duration 4-6h, lowers K⁺ 0.5-1.2 mEq/L. Monitor glucose q1h (hypoglycemia risk). Most effective for diabetics & renal failure patients","(B) Beta-2 agonist: Albuterol 10-20mg nebulized over 10 min (or terbutaline 0.25mg SC). Onset 15-30 min, duration 4-6h, lowers K⁺ 0.5-1 mEq/L. Tachycardia common side effect. Synergistic with insulin (add to insulin, not instead of)","(C) Sodium Bicarbonate: 50-100 mEq (one to two ampules) IV over 5-10 min. Mechanisms: buffer metabolic acidosis (if pH <7.2), alkalinize urine (shifts K⁺ intracellularly). Onset 30-60 min, duration 4-6h. ONLY IF concurrent metabolic acidosis. Do NOT use if alkalemia present. Risk: hypernatremia, fluid overload","Typical combination: Insulin 10U IV + Dextrose 50% + Albuterol nebulized achieves best K⁺ lowering","THIRD — Removal of potassium from body (takes 4-6h+):","(A) Diuretics: Furosemide 40-80mg IV (or higher if renal failure, up to 240-320mg) — only if adequate renal function (GFR >30). Promotes urinary K⁺ excretion. Onset 30-60 min","(B) Cation exchange resin: Sodium polystyrene sulfonate (Kayexalate) 15-30g PO (with sorbitol 20% solution) q4-6h, or 30-50g PR q6h (higher PR dose, better effect in constipation). Onset 4-24h. Avoid in ileus/obstruction. Rare hyperkalemia recurrence if repeated dosing stopped abruptly","(C) Hemodialysis: Most effective removal method. Indicated if: K⁺ >6.5 with renal failure, refractory hyperkalemia (K⁺ doesn't drop despite treatment), severe renal failure (Cr >4), volume overload contraindicating diuretics. Removes 25-50 mEq K⁺ per 4h session"]},
      {heading:"Monitoring During Treatment",steps:["Continuous cardiac monitoring: Essential until K⁺ <5.5 and ECG normalized. Arrhythmias may occur suddenly","Repeat serum K⁺: Obtain 30-60 min after initial treatment, then q1-2h during acute phase. Goal: K⁺ <5.5. Overcorrection to K⁺ <3.5 causes hypokalemia complications","Repeat glucose: q1h for 6h after insulin administration to detect/treat hypoglycemia","Assess urine output: Diuretics require adequate renal perfusion. Prerenal states (dehydration) reduce response — may need IV fluids first"]},
      {heading:"Management of Underlying Cause",steps:["Renal failure: Dialysis timing critical. For acute tubular necrosis (ATN) — assess for reversibility, optimize fluids & perfusion. Chronic kidney disease — long-term dietary K⁺ restriction, diuretics, medication review","Medication adjustment: STOP ACE inhibitors, ARBs, NSAIDs, K-sparing diuretics, heparin if possible. If necessary for cardiac/HTN control, restart after K⁺ normalized with careful monitoring","Rhabdomyolysis: Aggressive IV fluids (0.5-1 mL/kg/h urine output goal), treat hyperkalemia acutely, consider dialysis, monitor CK levels. Urine myoglobin screening (dipstick detects myoglobin as 'blood')","Tumor lysis syndrome: Allopurinol or Febuxostat (xanthine oxidase inhibitors) prevent uric acid formation. Rasburicase (urate oxidase) breaks down existing uric acid. IV hydration, monitor K⁺ closely. Risk >24-48h after chemo initiation","Acidosis treatment: Sodium bicarbonate/mechanical ventilation to raise pH (shifts K⁺ in)"]},
      {heading:"Refractory Hyperkalemia & Complications",steps:["Persistent elevation despite treatment: Suggests ongoing source (continued intake, severe rhabdomyolysis, malignancy), inadequate removal (intermittent dialysis insufficient), or pseudohyperkalemia","Cardiac arrhythmias during treatment: Peaked T waves → widened QRS → sine wave → VF. Repeat calcium chloride/gluconate, escalate potassium removal, prepare for emergency pacing/defibrillation if needed","Hypokalemia iatrogenic: Occurs if aggressive treatment. Causes muscle weakness, arrhythmias. Recheck K⁺ q2h, use careful tapering of treatments once K⁺ <5.5"]}
    ]},
  { id:"poisoning", title:"Poisoning & Overdose", icon:"flask-conical", color:"#a855f7", bg:"rgba(168,85,247,.12)",
    sections:[
      {heading:"Initial Assessment & Stabilization",steps:["ABCs: Airway (intubate if GCS ≤8 or loss of protective reflexes), Breathing (high-flow O₂), Circulation (IV access, cardiac monitor, fluids if hypotensive)","Toxidrome identification (cluster of clinical signs): Sympathomimetic (HTN, tachycardia, mydriasis, agitation) = stimulants, anticholinergics; Anticholinergic (hyperthermia, mydriasis, urinary retention, hallucinations, 'hot as a hare, dry as a bone, mad as a hatter') = atropine, antihistamines, TCAs; Cholinergic (bradycardia, bronchoconstriction, miosis, muscle fasciculations) = organophosphates, nerve agents; Opioid (altered mental status, bradycardia, miosis, respiratory depression) = opioids; Sedative-Hypnotic (CNS depression, respiratory depression, hypotonia) = benzodiazepines, barbiturates; Serotonin syndrome (altered mental status, hyperreflexia, clonus, hyperthermia) = SSRIs, MAOIs, tramadol; Anticholinergic toxidrome vs anticholinergic overdose distinction important","EMPIRIC ANTIDOTES (if unknown overdose): Naloxone 0.4-2mg IV (opioid antagonist, safe with no contraindications), Dextrose 50% 50mL IV if hypoglycemic or altered (hypoglycemia mimics altered mental status), Thiamine 100mg IV (Wernicke's encephalopathy prevention before giving glucose in malnourished)"]},
      {heading:"Diagnostic Approach",steps:["12-lead ECG: Assess QRS duration (>120ms = sodium channel blockade → NaHCO₃ indicated in TCAs, antipsychotics, cocaine), QTc interval (>500ms = torsades de pointes risk → avoid QT-prolonging drugs, correct electrolytes, consider magnesium, isoproterenol)","Chest X-ray: Aspiration risk, pulmonary edema (opioids, stimulants), pneumothorax (inhalational drugs)","Labs: Comprehensive metabolic panel (electrolytes, glucose, renal function), liver function, coagulation studies, troponin, venous/arterial blood gas, toxicology screen (limited in many EDs — doesn't change management acutely)","Acetaminophen & salicylate levels: Obtained regardless of history (acetaminophen toxic at 150 mcg/mL at 4h, 30 mcg/mL at 24h; salicylate >60 mg/dL = severe). Used for Rumack-Matthew nomogram (acetaminophen) & severity assessment (salicylate)"]},
      {heading:"Specific Antidotes & Treatments",steps:["ACETAMINOPHEN overdose: N-Acetylcysteine (NAC) is specific antidote, prevents hepatotoxicity if given early. Protocol: 150mg/kg IV over 1h, then 50mg/kg over 4h, then 100mg/kg over 16h (total 300mg/kg, 72h max for acute massive overdose). Can use oral protocol if vomiting controlled (1st dose 140mg/kg, then 70mg/kg q4h x17 doses). Effective up to 24h post-ingestion but best if <8h","BENZODIAZEPINE overdose: Flumazenil 0.2mg IV over 30-60s, can repeat q1min (max 3mg total) if inadequate reversal. CAUTION: Only use if: certain benzodiazepine ingestion (else seizure risk in polydrug), no seizure history, no TCAs co-ingested (lower seizure threshold). Avoid in chronic benzodiazepine users (withdrawal seizures). Shorter duration than benzos (30-45min), so redosing may be needed","OPIOID overdose: Naloxone (Narcan) 0.4-2mg IV (or 2-4mg IM if no IV). Onset 1-2 min IV, duration 30-90 min (shorter than many opioids, so redosing needed). Risk: acute withdrawal (agitation, sweating, vomiting, tachycardia)","BETA-BLOCKER overdose: Refractory hypotension/bradycardia. Glucagon 3-5mg IV bolus, then infusion 3-5mg/h (bypasses beta-receptors, increases cAMP). Combines with high-dose insulin regimen (insulin 1U/kg bolus + 0.5-1 U/kg/h infusion) + dextrose/calcium to maintain glucose & Ca²⁺. Lipophilic beta-blockers (propranolol, carvedilol) respond better","CALCIUM CHANNEL BLOCKER overdose: Similar to beta-blocker. High-dose insulin (1U/kg bolus, then 1-10 U/kg/h) + dextrose (infuse to keep glucose 200-250). Calcium chloride 1g IV q10-20min (max 10g). Vasopressors: epinephrine 0.1-1 mcg/kg/min. IV lipid emulsion 20% 1.5 mL/kg bolus if refractory","TRICYCLIC ANTIDEPRESSANT (TCA) overdose: QRS widening >120ms → Sodium bicarbonate 1-2 mEq/kg IV bolus, maintain pH 7.5-7.55 (alkalinization increases protein binding, reduces free drug). Repeat as needed, target QRS <100ms. Seizures → benzodiazepines. Arrhythmias → magnesium sulfate 1-2g IV. Avoid class 1A/1C antiarrhythmics (quinidine, procainamide — add to QRS prolongation)","ORGANOPHOSPHATE poisoning (pesticides, nerve agents): Excessive cholinergic activity. Atropine 2-5mg IV, double dose q5min until signs of atropinization (dry secretions, mydriasis, elevated HR). Then infusion 0.5-1mg/h. Pralidoxime (2-PAM) 1-2g IV over 30 min (reactivates acetylcholinesterase if given early, <24h ideally). Seizures → benzodiazepines. Mechanical ventilation for respiratory paralysis"]},
      {heading:"Enhanced Elimination Techniques",steps:["ACTIVATED CHARCOAL: 1g/kg (max 50g) PO/NG within 1-2h of ingestion (most effective <4h). Binds most organic toxins. Contraindications: caustic ingestion (corrosives), altered mental status without airway secured, ileus/obstruction. Does NOT work: metals, cyanide, alcohols, hydrocarbons. Repeat dosing q4-6h only for specific drugs (phenytoin, theophylline, phenobarbital)","WHOLE BOWEL IRRIGATION (WBI): GoLYTELY/NuLYTELY 2L/h PO/NG until clear rectal effluent. Indicated for: sustained-release medications, body packers (drug-filled condoms in GI tract), iron supplements, lithium (doesn't absorb to charcoal). Duration 4-24h depending on substance","URINARY ALKALINIZATION: Sodium bicarbonate 150mEq (three 50mEq ampules) in 1L D5W at 250mL/h (target urine pH 7.5-8.5). Indicated for: salicylates (0.5 log increase in clearance per pH unit), phenobarbital, methotrexate. Complications: hypokalemia (supplement K⁺), hypernatremia, volume overload. Monitor electrolytes, urine pH","HEMODIALYSIS: Most effective for water-soluble toxins, small molecule weight. Indicated: methanol, ethylene glycol, lithium, salicylates, theophylline, phenobarbital, isoniazid, valproic acid, carbamazepine. Reduces half-life significantly. Combined with other therapies (fomepizole for methanol/ethylene glycol)","EXTRACORPOREAL MEMBRANE OXYGENATION (ECMO): Considered for refractory cases (massive overdose, cardiovascular collapse despite optimal support). Used with lipophilic agents, inotrope-refractory shock"]},
      {heading:"Specific Toxin Management",steps:["METHANOL/ETHYLENE GLYCOL: Highly toxic metabolites (formic acid, oxalic acid). Present with metabolic acidosis (anion gap), visual changes (methanol), oxalate crystals in urine (ethylene glycol). Fomepizole (antizyme) 15mg/kg IV loading, then 10mg/kg IV q12h (inhibits alcohol dehydrogenase, prevents toxic metabolite formation). Hemodialysis removes parent compound & metabolites. Supportive: thiamine 100mg + pyridoxine 50mg (cofactors for metabolism)","CYANIDE: Rapid onset respiratory depression, altered mental status, cardiovascular collapse. Cyanide antidote kit: sodium thiosulfate 12.5g IV + sodium nitrite 300mg IV (produces methemoglobin binding cyanide). Risk: methemoglobinemia. Hydroxocobalamin (newer, preferred) 5g IV binds cyanide directly, forms cyanocobalamin (renally cleared)","STRYCHNINE: Causes severe muscle rigidity, opisthotonus (severe arching), seizures triggered by sensory stimuli. Benzodiazepines high doses, neuromuscular paralysis if severe, supportive care. Rhabdomyolysis common → aggressive fluid resuscitation","CARBON MONOXIDE (CO): Cherry-red appearance (late, unreliable sign). Symptoms: headache, dizziness, loss of consciousness, myocardial infarction possible. Carboxyhemoglobin (COHb) level indicates severity. Treatment: 100% O₂ (hyperbaric if COHb >20% or altered mental status)"]},
      {heading:"Special Considerations & Disposition",steps:["Psychiatric evaluation: All self-harm ingestions require psych consult before discharge. Suicidal intent assessment, safety planning, medication reconciliation for overdose risk","Toxin-specific monitoring: Serial levels for acetaminophen, salicylates, lithium, theophylline (repeat dosing affects elimination). Some toxins require multiple lab checks","ICU admission criteria: Altered mental status, unstable vitals requiring vasopressors, respiratory depression needing intubation, arrhythmias, renal/hepatic failure, seizures, severe acid-base disturbances","Prognosis: Early recognition + antidote administration + supportive care dramatically improve outcomes. Most toxins have good prognosis if managed early within 4-12h of ingestion"]}
    ]},
  { id:"anaphylaxis", title:"Anaphylaxis", icon:"alert-triangle", color:"#f97316", bg:"rgba(249,115,22,.12)",
    sections:[
      {heading:"Recognition & Diagnostic Criteria",steps:["Anaphylaxis is acute-onset (seconds to minutes, typically <20 minutes) systemic reaction with hypotension and/or airway compromise requiring immediate epinephrine","Clinical criteria (anaphylaxis diagnosis if ≥1): (1) Acute onset involving skin/mucosa (flushing, urticaria, angioedema) PLUS respiratory compromise (bronchospasm, stridor, dyspnea, hypoxia) and/or cardiovascular collapse (syncope, hypotension, shock); (2) ≥2 of: skin/mucosal involvement, respiratory compromise, cardiovascular symptoms, GI symptoms (cramping, vomiting, diarrhea) after likely allergen exposure; (3) Hypotension (SBP <90 or >30% drop from baseline) after allergen exposure","Biphasic reaction: Up to 20% of cases experience recurrence 1-72h after initial reaction (median 8-10h). Causes: persistent allergen absorption, degranulation continuing, incomplete initial treatment. MANDATORY observation minimum 6-8h, some recommend up to 24h for severe cases","Common triggers: Foods (nuts 40%, shellfish 25%, peanuts), medications (antibiotics especially beta-lactams 30%, NSAIDs, ACE inhibitors), insect stings (Hymenoptera — bees, wasps, hornets), latex (gloves, catheters), contrast media, biologics (monoclonal antibodies)","Risk factors for severe anaphylaxis: Asthma, mastocytosis, idiopathic anaphylaxis, prior severe reaction, age (biphasic reactions more common in adults), delayed treatment"]},
      {heading:"Immediate Stabilization & Epinephrine Administration",steps:["EPINEPHRINE INTRAMUSCULARLY (anterolateral thigh) — THIS IS FIRST-LINE, NO EXCEPTIONS: Dose: 0.01 mg/kg (standard), or 0.3mg for adults 50-70kg, 0.5mg for >70kg. Inject IM into vastus lateralis (outer quadriceps — preferred site for immediate absorption & avoid vessel injury). Onset 10-15 min IM (faster than SC, more reliable than IV in anaphylaxis). Duration 15-20 min (short-acting), so may need repeat dosing q5-15 min","POSITION: Recumbent (supine) with legs elevated 30° (increases venous return, improves cardiac output). Sitting ONLY if severe respiratory distress/vomiting risk. NEVER allow patient to ambulate (risk of sudden cardiovascular collapse). Avoid Trendelenburg (increases respiratory effort)","HIGH-FLOW OXYGEN: 15L/min via non-rebreather mask, target SpO₂ >94%. If intubation needed for airway compromise, use video laryngoscopy (facial/airway edema common). Have airway equipment immediately available","IV ACCESS x2 LARGE BORE: Establish simultaneously. Initial IV fluid bolus: 1-2L (or 20 mL/kg in children) warmed normal saline rapidly over 10-15 min. Reassess after bolus; if hypotensive, repeat bolus q15-30 min","REPEAT EPINEPHRINE: If symptoms persist or worsen after 5-15 min: repeat IM dose q5-15 min as needed. Typical 60% respond to first dose, 30-35% need second dose, ~5-10% need >2 doses. Some require continuous infusion if refractory","Epinephrine IV ONLY if: IV epinephrine 0.01-0.2 mg (1:100,000 dilution) over 5-10 min or continuous infusion 1-4 mcg/min (titrate to BP/symptoms) if already has IV access, recurrent episodes despite IM, or profound shock requiring immediate restoration of pressure. Risk: severe hypertension, arrhythmias, myocardial infarction with IV route"]},
      {heading:"Adjunctive Therapy (Not First-Line, But Important)",steps:["H1-RECEPTOR ANTAGONIST: Antihistamine (diphenhydramine 50mg IV/IM OR cetirizine 10mg PO). Onset 30-60 min. Does NOT replace epinephrine, but prevents ongoing mast cell degranulation. Prevents recurrence risk if given early","H2-RECEPTOR ANTAGONIST: Ranitidine (Zantac) 50mg IV OR Famotidine (Pepcid) 20mg IV. Additive to H1-blockers (blocks additional mediator effects). Usually given with H1-blocker","CORTICOSTEROIDS: Methylprednisolone 125mg IV OR Dexamethasone 10-20mg IV. Onset 4-6h (delayed benefit). No proven role in acute anaphylaxis BUT reduces biphasic reactions if given early. Standard practice: give corticosteroid with H1/H2-blockers","BRONCHODILATORS: Albuterol 2.5-5mg nebulized q20min if bronchospasm/wheezing present (alongside epinephrine, not instead). Ipratropium if severe bronchospasm refractory to albuterol","VASOPRESSORS (refractory shock): Norepinephrine 0.1-2 mcg/kg/min IV or Epinephrine infusion 0.1-1.5 mcg/kg/min if hypotensive despite IM epinephrine x2 + fluids. Goal MAP >65"]},
      {heading:"Special Scenarios",steps:["ANAPHYLAXIS WHILE ON BETA-BLOCKERS: Epinephrine still first-line (no contraindication in anaphylaxis). Beta-blockers may blunt response, requiring HIGHER epinephrine doses or addition of glucagon (3-5mg IV bolus, then infusion) + high-dose insulin for refractory hypotension. Document beta-blocker use in chart","PREGNANCY-RELATED ANAPHYLAXIS: Use epinephrine (no contraindication, fetal benefit outweighs risk). IV fluids cautiously (avoid overload in 3rd trimester). Magnesium sulfate if pre-eclampsia present","IDIOPATHIC ANAPHYLAXIS: No obvious allergen identified (5% of cases). Requires more aggressive investigation (skin testing deferred 4-6 weeks after reaction, allergy referral, serum tryptase level if available — elevation confirms mast cell activation)","CONTRAST-INDUCED ANAPHYLAXIS: May occur even with prior negative exposure (delayed sensitization). Pretreatment for high-risk patients: corticosteroids 12h + 1h pre-contrast (prednisone 50mg PO x3), diphenhydramine 50mg pre-contrast. If anaphylaxis occurs with contrast study: epinephrine IM immediately (still first-line despite IV access from contrast), hold contrast, supportive care"]},
      {heading:"Post-Anaphylaxis Management & Discharge",steps:["SERUM TRYPTASE: Draw within 15 min of onset (peak 1-3h). Elevated level (>11-12 ng/mL) confirms mast cell degranulation, validates anaphylaxis diagnosis. Can redraw at 24h if initial delayed","SKIN PRICK TESTING: Allergy testing deferred 4-6 weeks (decreased sensitivity immediately post-reaction). Identify specific allergen trigger for future avoidance","ALLERGY REFERRAL: All anaphylaxis patients should have allergist follow-up for testing, identification of trigger, counseling on avoidance, medication adjustment if needed","EPINEPHRINE AUTO-INJECTOR PRESCRIPTION: Provide prescription for 2 auto-injectors (e.g., EpiPen 0.3-0.5mg IM), written instructions on use (anterolateral thigh, can administer through clothing), training demonstration","ACTION PLAN: Written plan including trigger avoidance, signs/symptoms of anaphylaxis, when/how to use epinephrine auto-injector, when to call 911, emergency contacts","MEDICATIONS TO AVOID: Prevent beta-blockers if possible (blunt epinephrine response). ACE inhibitors may increase severity in some — consider switch if recurrent anaphylaxis","OBSERVATION PERIOD: Minimum 4-6h (many discharge after 6h if stable, uneventful), 12-24h for severe initial reaction or biphasic risk factors. Symptom recurrence warrants re-dosing epinephrine, repeat observation","DISPOSITION: Discharge if stable 6-8h post-anaphylaxis onset, tolerating PO fluids/food, discharged with epinephrine auto-injector, clear discharge instructions. ICU admission if: refractory hypotension, recurrent/biphasic reaction, airway intubation needed, underlying cardiovascular disease"]}
    ]}
];

function renderDashboard(){
  const grid=document.getElementById('cardGrid');
  grid.innerHTML='';
  cards.forEach((c,i)=>{
    const el=document.createElement('div');
    el.className='proto-card float-in';
    el.style.cssText=`background:${c.bg};animation-delay:${i*60}ms;border-color:${c.color}22`;
    el.onclick=()=>showDetail(c.id);
    el.setAttribute('role','button');
    el.setAttribute('tabindex','0');
    el.setAttribute('aria-label',c.title);
    el.onkeydown=e=>{if(e.key==='Enter')showDetail(c.id)};
    el.innerHTML=`
      <div class="flex items-start justify-between mb-4 relative" style="z-index:2">
        <div class="icon-ring" style="background:${c.color}20">
          <i data-lucide="${c.icon}" style="width:28px;height:28px;color:${c.color}"></i>
        </div>
        <div class="pulse-dot" style="background:${c.color}"></div>
      </div>
      <h3 style="color:#f1f5f9;font-size:1.1rem;font-weight:700;margin-bottom:.4rem;position:relative;z-index:2">${c.title}</h3>
      <p style="color:#64748b;font-size:.8rem;position:relative;z-index:2">${c.sections.length} protocol sections</p>
      <div style="display:flex;align-items:center;gap:.35rem;margin-top:.75rem;color:${c.color};font-size:.78rem;font-weight:600;position:relative;z-index:2">
        View Protocol <i data-lucide="chevron-right" style="width:14px;height:14px"></i>
      </div>
    `;
    grid.appendChild(el);
  });
  lucide.createIcons();
}

function showDetail(id){
  const c=cards.find(x=>x.id===id);
  if(!c)return;
  document.getElementById('dashboard').classList.add('hidden');
  const dv=document.getElementById('detailView');
  const dc=document.getElementById('detailContent');
  dc.innerHTML=`
    <div class="slide-in">
      <div class="flex items-center gap-4 mb-6">
        <div class="icon-ring" style="background:${c.bg};width:64px;height:64px;border-radius:16px">
          <i data-lucide="${c.icon}" style="width:32px;height:32px;color:${c.color}"></i>
        </div>
        <div>
          <h1 style="font-family:'Playfair Display',serif;color:#f1f5f9;font-size:1.75rem;font-weight:700">${c.title}</h1>
          <div class="flex gap-2 mt-1">
            <span class="tag" style="background:${c.color}20;color:${c.color}">Emergency Protocol</span>
            <span class="tag" style="background:rgba(255,255,255,.06);color:#94a3b8">${c.sections.length} Sections</span>
          </div>
        </div>
      </div>
    </div>
    ${c.sections.map((s,si)=>`
      <div class="protocol-section slide-in" style="animation-delay:${(si+1)*100}ms">
        <h2 style="color:${c.color};font-size:1rem;font-weight:700;margin-bottom:.75rem;display:flex;align-items:center;gap:.5rem">
          <span style="background:${c.color};color:#fff;width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:.7rem">${si+1}</span>
          ${s.heading}
        </h2>
        ${s.steps.map((st,sti)=>`
          <div class="step-item">
            <div class="step-num" style="background:${c.color}15;color:${c.color}">${sti+1}</div>
            <p style="color:#cbd5e1;font-size:.85rem;line-height:1.5">${st}</p>
          </div>
        `).join('')}
      </div>
    `).join('')}
    <div style="margin-top:1.5rem;padding:1rem;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.15);border-radius:10px;display:flex;gap:.75rem;align-items:flex-start" class="slide-in" style="animation-delay:500ms">
      <i data-lucide="alert-circle" style="width:20px;height:20px;color:#ef4444;flex-shrink:0;margin-top:2px"></i>
      <p style="color:#fca5a5;font-size:.8rem;line-height:1.5"><strong>Disclaimer:</strong> These protocols are for quick reference by licensed medical professionals. Always follow your institution's specific guidelines and use clinical judgment. This is not a substitute for proper medical training.</p>
    </div>
  `;
  dv.classList.add('active');
  dv.scrollTop=0;
  lucide.createIcons();
}

function showDashboard(){
  document.getElementById('detailView').classList.remove('active');
  document.getElementById('dashboard').classList.remove('hidden');
}

// Element SDK
const config={...defaultConfig};
renderDashboard();
</script>
