// App State
let currentView = "home";
let selectedSystem = null;
let selectedCase = null;
let activeTab = "presentation";
let revealedSections = {};

function getConfig() {
  return window.elementSdk?.config || defaultConfig;
}

function renderApp() {
  const cfg = getConfig();
  const app = document.getElementById("app");
  
  if (currentView === "home") {
    renderHome(app, cfg);
  } else if (currentView === "system") {
    renderSystem(app, cfg);
  } else if (currentView === "case") {
    renderCase(app, cfg);
  }
  
  setTimeout(() => lucide.createIcons(), 50);
}

                  <p style="color: ${cfg.text_color}77; font-size: ${baseSize * 0.9}px; margin-top: 8px; line-height: 1.6;" class="line-clamp-2">${c.presentation.substring(0, 150)}...</p>
                </div>
                <i data-lucide="chevron-right" style="width: 24px; height: 24px; color: ${cfg.text_color}44; flex-shrink: 0; margin-top: 8px;"></i>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

function renderCase(app, cfg) {
  const sys = systems.find(s => s.id === selectedSystem);
  if (!sys) return;
  const c = sys.cases[selectedCase];
  if (!c) return;
  const baseSize = cfg.font_size || defaultConfig.font_size;
  const fontFam = cfg.font_family || defaultConfig.font_family;
  
  const tabs = [
    { id: "presentation", label: "Presentation", icon: "user" },
    { id: "history", label: "History", icon: "clipboard" },
    { id: "examination", label: "Examination", icon: "stethoscope" },
    { id: "investigations", label: "Investigations", icon: "flask-conical" },
    { id: "diagnosis", label: "Diagnosis", icon: "target" },
    { id: "management", label: "Management", icon: "pill" },
    { id: "discussion", label: "Discussion", icon: "message-circle" }
  ];
  
  const caseKey = `${selectedSystem}-${selectedCase}`;
  const isRevealed = (section) => revealedSections[`${caseKey}-${section}`];
  
  const content = c[activeTab] || "";
  const revealed = isRevealed(activeTab);
  const shouldHide = ["diagnosis", "management", "discussion"].includes(activeTab);
  
  app.innerHTML = `
    <div class="w-full min-h-full" style="background: ${cfg.background_color}; font-family: ${fontFam}, 'Source Sans 3', sans-serif;">
      <nav class="w-full px-6 py-4 flex items-center gap-3 border-b" style="border-color: ${cfg.text_color}10; background: ${cfg.surface_color};">
        <button onclick="openSystem('${sys.id}')" class="flex items-center gap-2 px-3 py-2 rounded-lg hover:opacity-80 transition" style="color: ${cfg.secondary_action}; font-size: ${baseSize * 0.9}px;">
          <i data-lucide="arrow-left" style="width: 18px; height: 18px;"></i> ${sys.name}
        </button>
      </nav>
      
      <div class="max-w-4xl mx-auto px-6 py-8 case-panel">
        <div class="mb-6">
          <div style="color: ${cfg.secondary_action}; font-size: ${baseSize * 0.75}px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px;" class="mb-2">${sys.name} • Case ${selectedCase + 1}</div>
          <h1 class="heading-font" style="font-size: ${baseSize * 1.8}px; color: ${cfg.text_color}; font-weight: 900; line-height: 1.2;">${c.title}</h1>
        </div>
        
        <!-- Tabs -->
        <div class="flex gap-1 overflow-x-auto pb-2 mb-8" style="scrollbar-width: none;">
          ${tabs.map(t => `
            <button class="tab-btn flex items-center gap-2 px-4 py-3 rounded-t-lg whitespace-nowrap transition ${activeTab === t.id ? 'active' : ''}"
                    style="font-size: ${baseSize * 0.85}px; font-weight: ${activeTab === t.id ? '700' : '500'}; 
                           color: ${activeTab === t.id ? cfg.secondary_action : cfg.text_color + '66'};
                           background: ${activeTab === t.id ? cfg.surface_color : 'transparent'};
                           border-color: ${cfg.secondary_action};"
                    onclick="switchTab('${t.id}')">
              <i data-lucide="${t.icon}" style="width: 16px; height: 16px;"></i>
              <span class="hidden sm:inline">${t.label}</span>
            </button>
          `).join('')}
        </div>
        
        <!-- Content -->
        <div class="rounded-2xl p-8 border fade-in" style="background: ${cfg.surface_color}; border-color: ${cfg.text_color}10;">
          <h2 class="heading-font flex items-center gap-3 mb-6" style="font-size: ${baseSize * 1.5}px; color: ${cfg.text_color}; font-weight: 700;">
            <i data-lucide="${tabs.find(t => t.id === activeTab)?.icon || 'file-text'}" style="width: 24px; height: 24px; color: ${cfg.secondary_action};"></i>
            ${tabs.find(t => t.id === activeTab)?.label || ''}
          </h2>
          
          ${shouldHide && !revealed ? `
            <div class="text-center py-12">
              <div class="w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6" style="background: ${cfg.primary_action}15;">
                <i data-lucide="eye-off" style="width: 32px; height: 32px; color: ${cfg.primary_action};"></i>
              </div>
              <p style="color: ${cfg.text_color}77; font-size: ${baseSize}px; margin-bottom: 20px;">Think about your answer first before revealing</p>
              <button onclick="revealSection('${activeTab}')" class="reveal-btn px-8 py-3 rounded-xl font-semibold" 
                      style="background: ${cfg.primary_action}; color: white; font-size: ${baseSize}px;">
                <span class="flex items-center gap-2"><i data-lucide="eye" style="width: 18px; height: 18px;"></i> Reveal ${tabs.find(t => t.id === activeTab)?.label}</span>
              </button>
            </div>
          ` : `
            <div style="color: ${cfg.text_color}cc; font-size: ${baseSize}px; line-height: 1.9;">
              ${formatContent(content, cfg)}
            </div>
          `}
        </div>
        
        <!-- Nav buttons -->
        <div class="flex justify-between mt-8">
          ${getPrevTab(activeTab, tabs) ? `
            <button onclick="switchTab('${getPrevTab(activeTab, tabs)}')" class="flex items-center gap-2 px-5 py-3 rounded-xl transition hover:opacity-80" style="background: ${cfg.surface_color}; color: ${cfg.text_color}; font-size: ${baseSize * 0.9}px; border: 1px solid ${cfg.text_color}15;">
              <i data-lucide="chevron-left" style="width: 18px; height: 18px;"></i> Previous
            </button>
          ` : '<div></div>'}
          ${getNextTab(activeTab, tabs) ? `
            <button onclick="switchTab('${getNextTab(activeTab, tabs)}')" class="flex items-center gap-2 px-5 py-3 rounded-xl transition hover:opacity-80" style="background: ${cfg.primary_action}; color: white; font-size: ${baseSize * 0.9}px;">
              Next <i data-lucide="chevron-right" style="width: 18px; height: 18px;"></i>
            </button>
          ` : ''}
        </div>
      </div>
    </div>
  `;
}

function formatContent(text, cfg) {
  // Split on sentence-ending periods followed by space or key labels
  let formatted = text
    .replace(/(\d+\))/g, '<br><strong style="color: ' + cfg.secondary_action + '">$1</strong>')
    .replace(/(IMMEDIATE|REPERFUSION|ADJUNCTIVE|MONITORING|SECONDARY PREVENTION|RESPIRATORY SUPPORT|ANTIBIOTICS|SUPPORTIVE|ICU CARE|ANALGESIA|INTERVENTION|BP CONTROL|GLYCEMIC CONTROL|EDEMA|LIPIDS|MONITOR|PREPARE|HYPERACUTE|STROKE UNIT|ANTICOAGULATION|REHABILITATION|FLUID RESUSCITATION|INSULIN|POTASSIUM|BICARBONATE|TRANSITION|EDUCATION|INDUCTION|MAINTENANCE|RENAL|APS|ADJUNCTIVE|EMERGENCY|DIC MANAGEMENT|DEFINITIVE|WATCH FOR|ANTI-TB|CORTICOSTEROIDS|RAISED ICP|SEIZURES|ART|TRANSFER|NUTRITION|SPECIFIC|EYES|PAIN|INFECTION):/g, '<br><span style="display: inline-block; margin-top: 12px; padding: 2px 10px; border-radius: 6px; background: ' + cfg.primary_action + '25; color: ' + cfg.secondary_action + '; font-weight: 700; font-size: 0.9em;">$1</span>:')
    .replace(/→/g, ' <span style="color: ' + cfg.secondary_action + '">→</span> ')
    .replace(/(PMH|Medications|Family Hx|Social|General|CVS|Lungs|Abdomen|Periphery|Neuro|MSK|Skin|Chest|Fundoscopy):/g, '<br><strong style="color: ' + cfg.text_color + '">$1:</strong>')
    .replace(/(ECG|Troponin|CBC|CRP|ABG|CSF|MRI|CT|NCCT|Chest X-ray|Echo|Urinalysis|Serum|Renal USG|ANA|Complement|Peripheral Smear|Bone Marrow|Cytogenetics|Molecular|FISH|Biopsy|HLA)([^<])/g, '<strong>$1</strong>$2');
  
  return formatted;
}

function getPrevTab(current, tabs) {
  const idx = tabs.findIndex(t => t.id === current);
  return idx > 0 ? tabs[idx - 1].id : null;
}

function getNextTab(current, tabs) {
  const idx = tabs.findIndex(t => t.id === current);
  return idx < tabs.length - 1 ? tabs[idx + 1].id : null;
}

// Navigation functions
window.openSystem = function(id) {
  selectedSystem = id;
  currentView = "system";
  renderApp();
  document.getElementById("app").scrollTop = 0;
};

window.openCase = function(sysId, caseIdx) {
  selectedSystem = sysId;
  selectedCase = caseIdx;
  activeTab = "presentation";
  currentView = "case";
  renderApp();
  document.getElementById("app").scrollTop = 0;
};

window.goHome = function() {
  currentView = "home";
  selectedSystem = null;
  selectedCase = null;
  renderApp();
  document.getElementById("app").scrollTop = 0;
};

window.switchTab = function(tab) {
  activeTab = tab;
  renderApp();
};

window.revealSection = function(section) {
  const caseKey = `${selectedSystem}-${selectedCase}`;
  revealedSections[`${caseKey}-${section}`] = true;
  renderApp();
};

renderApp();
</script>
</body>
</html>
